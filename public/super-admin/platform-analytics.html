<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Platform Analytics — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-width:0}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}
.stat-trend{font-size:10px;font-weight:700;margin-top:2px;display:inline-flex;align-items:center;gap:3px}
.stat-trend.up{color:var(--green)}.stat-trend.down{color:var(--red)}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0;flex-wrap:wrap;gap:8px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11.5px;color:var(--text-faint);padding:4px 18px 0}
.panel-body{padding:16px 18px 18px}

.period-tabs{display:flex;gap:4px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:3px}
.period-tabs button{padding:7px 14px;border:none;background:none;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--text-faint);cursor:pointer;font-family:inherit;transition:.13s}
.period-tabs button.active{background:var(--accent);color:#fff}

/* bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar{border-radius:5px 5px 0 0;width:100%;min-height:4px;transition:.3s}
.bar-lbl{font-size:9px;font-weight:700;color:var(--text-faint);white-space:nowrap}
.bar-val{font-size:9px;font-weight:800;color:var(--text)}

/* horizontal bars */
.h-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.h-bar-row:last-child{margin-bottom:0}
.h-bar-lbl{font-size:11px;font-weight:700;width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-bar-track{flex:1;height:8px;border-radius:6px;background:var(--table-head);overflow:hidden}
.h-bar-fill{height:100%;border-radius:6px;transition:.4s}
.h-bar-val{font-size:10.5px;font-weight:700;color:var(--text-faint);width:50px;text-align:right;flex-shrink:0}

/* donut placeholder */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex-shrink:0}
.donut-center{position:absolute;inset:25px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:18px;font-weight:800;line-height:1}
.donut-center span{font-size:9px;color:var(--text-faint);font-weight:700}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1}
.legend-item{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* table */
.mini-tbl{width:100%;border-collapse:collapse}
.mini-tbl th{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.mini-tbl td{font-size:12px;padding:10px;border-bottom:1px solid var(--border);font-weight:600}
.mini-tbl tr:last-child td{border-bottom:none}
.mini-tbl .num{text-align:right;font-weight:700}

.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.status-dot.green{background:var(--green)}.status-dot.amber{background:var(--amber)}.status-dot.red{background:var(--red)}.status-dot.blue{background:var(--blue)}

/* KPI row */
.kpi-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.kpi-item{flex:1;min-width:120px}
.kpi-val{font-size:22px;font-weight:800}
.kpi-lbl{font-size:10px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi-bar{height:4px;border-radius:3px;background:var(--table-head);margin-top:6px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:3px}

@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.donut-wrap{flex-direction:column}}
@media (max-width:640px){.panel{padding:14px}.page-head h1{font-size:17px}}
</style>
</head>
<body>
<div id="analyticsRoot">
  <div class="grid-4" id="topStats"></div>

  <div class="panel">
    <div class="panel-head">
      <h2><i class="fas fa-chart-line" style="color:var(--accent)"></i> Revenue Breakdown</h2>
      <div class="period-tabs" id="revenuePeriod">
        <button data-p="monthly" class="active">Monthly</button>
        <button data-p="quarterly">Quarterly</button>
        <button data-p="bySource">By Source</button>
      </div>
    </div>
    <div class="panel-body" id="revenueDetail"></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-users" style="color:var(--blue)"></i> User Acquisition</h2></div>
      <div class="panel-body" id="userAcquisition"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-chart-pie" style="color:var(--purple)"></i> User Roles</h2></div>
      <div class="panel-body">
        <div class="donut-wrap" id="roleDonut"></div>
      </div>
    </div>
  </div>

  <div class="grid-3">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-book-open" style="color:var(--gold)"></i> Content Overview</h2></div>
      <div class="panel-body" id="contentOverview"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-layer-group" style="color:var(--green)"></i> Top Genres</h2></div>
      <div class="panel-body" id="topGenres"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-fire" style="color:var(--amber)"></i> Engagement</h2></div>
      <div class="panel-body" id="engagementStats"></div>
    </div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-sack-dollar" style="color:var(--green)"></i> Financial Summary</h2></div>
      <div class="panel-body" id="financialSummary"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-bullhorn" style="color:var(--accent)"></i> Marketing Performance</h2></div>
      <div class="panel-body" id="marketingPerf"></div>
    </div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-shield-halved" style="color:var(--red)"></i> Moderation</h2></div>
      <div class="panel-body" id="moderationStats"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-trophy" style="color:var(--gold)"></i> Top Writers</h2></div>
      <div class="panel-body" id="topWriters"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2><i class="fas fa-book-open" style="color:var(--accent)"></i> Top Readers</h2></div>
    <div class="panel-body" id="topReaders"></div>
  </div>
</div>

<script src="shared/super-admin-sidebar.js"></script>
<script src="platform-analytics-service.js"></script>
</body>
</html>
