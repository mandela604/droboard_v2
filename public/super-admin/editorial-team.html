<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Editorial Team — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3);border-radius:6px}

.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-faint);margin-top:4px}
.btn{font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0;flex-wrap:wrap;gap:8px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11.5px;color:var(--text-faint);padding:4px 18px 0}
.count-chip{font-size:11px;font-weight:700;color:var(--text-muted);background:var(--table-head);padding:5px 11px;border-radius:20px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--border);margin-top:14px}
.search-box{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:200px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:12.5px}
.select{font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;cursor:pointer}

/* editor list */
.list-cols{display:grid;grid-template-columns:minmax(0,2.2fr) 120px 90px 90px 100px 100px 90px 70px;gap:10px;align-items:center;padding:10px 18px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);background:var(--table-head);border-bottom:1px solid var(--border)}
.list-cols span.num{text-align:right}

.editor-row{display:grid;grid-template-columns:minmax(0,2.2fr) 120px 90px 90px 100px 100px 90px 70px;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--border);transition:.12s;cursor:pointer}
.editor-row:hover{background:var(--hover)}
.editor-row:last-child{border-bottom:none}
.editor-main{display:flex;align-items:center;gap:11px;min-width:0}
.e-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0}
.e-info{min-width:0}
.e-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-name i.lead{color:var(--gold);font-size:11px}
.e-meta{font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.role-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;line-height:1.3}

.status-chip{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
.status-chip.active{background:var(--green-bg);color:var(--green)}
.status-chip.leave{background:var(--amber-bg);color:var(--amber)}
.status-chip.suspended{background:var(--red-bg);color:var(--red)}
.status-chip i{font-size:6px}

.num-cell{font-size:12px;font-weight:700;text-align:right;color:var(--text)}
.num-cell.faint{color:var(--text-muted);font-weight:600}
.col-hide{}
.row-actions{display:flex;justify-content:flex-end;gap:4px}
.row-menu{position:relative}
.row-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.row-menu-btn:hover{background:var(--table-head);color:var(--gold)}
.dropdown{position:absolute;right:0;top:30px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:8;overflow:hidden;min-width:160px;display:none}
.dropdown.open{display:block}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.dropdown-item:hover{background:var(--input-bg)}
.dropdown-item i{width:14px;color:var(--text-faint);flex-shrink:0}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.icon-btn:hover{background:var(--table-head);color:var(--gold)}

.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap;gap:10px}
.list-footer-info{font-size:11.5px;color:var(--text-faint)}
.pager{display:flex;align-items:center;gap:5px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pager button.active{background:var(--accent);border-color:transparent;color:#fff}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-gap{color:var(--text-faint);font-size:11px;padding:0 2px}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint)}
.empty-state i{font-size:26px;margin-bottom:10px;display:block;opacity:.5}

@media (max-width:900px){
  .list-cols, .editor-row{grid-template-columns:minmax(0,1fr) 120px 90px 70px}
  .list-cols span:nth-child(3),.list-cols span:nth-child(4),.list-cols span:nth-child(5),
  .list-cols span:nth-child(7),
  .editor-row .col-hide{display:none}
}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr 1fr}
  .panel{padding:14px}
  .page-head h1{font-size:17px}
  .list-cols{display:none}
  .editor-row{grid-template-columns:1fr 70px;gap:8px}
  .editor-row .col-hide{display:none}
}

/* editor detail modal */
.ed-modal-bg{position:fixed;inset:0;background:rgba(10,6,25,.55);z-index:1000;display:none;opacity:0;transition:opacity .2s}
.ed-modal-bg.open{display:block;opacity:1}
.ed-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:1010;background:var(--card);border-radius:18px;width:100%;max-width:440px;box-shadow:0 24px 70px rgba(0,0,0,.3);opacity:0;transition:.2s;max-height:85vh;overflow-y:auto}
.ed-modal-bg.open .ed-modal{transform:translate(-50%,-50%) scale(1);opacity:1}
.ed-modal-head{display:flex;align-items:center;gap:14px;padding:22px 22px 0}
.ed-modal-head img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.ed-modal-head .ed-m-info{flex:1}
.ed-modal-head .ed-m-name{font-size:16px;font-weight:800}
.ed-modal-head .ed-m-role{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.ed-modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex-shrink:0}
.ed-modal-close:hover{background:var(--red-bg);color:var(--red)}
.ed-modal-body{padding:18px 22px 22px}
.ed-modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.ed-modal-stat{background:var(--hover);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.ed-modal-stat b{display:block;font-size:18px;font-weight:800}
.ed-modal-stat span{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.ed-modal-section{font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
.ed-modal-detail{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.ed-modal-detail:last-child{border-bottom:none}
.ed-modal-detail .lbl{color:var(--text-muted);font-weight:600}
.ed-modal-detail .val{font-weight:700}
.ed-modal-actions{display:flex;gap:8px;margin-top:18px}
.ed-modal-actions button{flex:1;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--input-border);display:flex;align-items:center;justify-content:center;gap:6px;transition:.13s}
.ed-modal-actions .ed-btn-profile{background:var(--accent);border-color:transparent;color:#fff}
.ed-modal-actions .ed-btn-profile:hover{filter:brightness(1.05);color:#fff}
.ed-modal-actions .ed-btn-reset{background:var(--input-bg);color:var(--text)}
.ed-modal-actions .ed-btn-reset:hover{border-color:var(--gold);color:var(--gold)}

/* password reset modal */
.pw-modal-bg{position:fixed;inset:0;background:rgba(10,6,25,.55);z-index:1100;display:none;opacity:0;transition:opacity .2s}
.pw-modal-bg.open{display:block;opacity:1}
.pw-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:1110;background:var(--card);border-radius:16px;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(0,0,0,.3);opacity:0;transition:.2s}
.pw-modal-bg.open .pw-modal{transform:translate(-50%,-50%) scale(1);opacity:1}
.pw-modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.pw-modal-head h3{font-size:15px;font-weight:800}
.pw-modal-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px}
.pw-field label{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px}
.pw-field input{width:100%;border:1px solid var(--input-border);background:var(--input-bg);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--text)}
.pw-field input:focus{border-color:var(--accent);outline:none}
.pw-field small{display:block;margin-top:5px;font-size:10.5px;color:var(--text-faint)}
.pw-err{font-size:11.5px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:8px 10px;display:none}
.pw-err.show{display:block}
.pw-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.pw-actions button{padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--input-border)}
.pw-actions .pw-cancel{background:var(--input-bg);color:var(--text-muted)}
.pw-actions .pw-confirm{background:var(--green);border-color:transparent;color:#fff}
.pw-actions .pw-confirm:disabled{opacity:.6;cursor:not-allowed}
.pw-success{text-align:center;padding:20px;display:none}
.pw-success.show{display:block}
.pw-success i{font-size:36px;color:var(--green);margin-bottom:10px}
.pw-success p{font-size:13px;font-weight:700;color:var(--text)}
.pw-success small{font-size:11.5px;color:var(--text-faint);margin-top:4px;display:block}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(10,6,25,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);transform:scale(.92);transition:transform .25s;overflow:hidden}
.modal-overlay.open .modal{transform:scale(1)}
.modal-hdr{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid var(--border)}
.modal-av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.modal-hdr-info h3{font-size:16px;font-weight:800}
.modal-hdr-info p{font-size:12px;color:var(--text-muted);margin-top:2px}
.modal-close{width:30px;height:30px;border-radius:8px;background:var(--input-bg);border:1px solid var(--input-border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);cursor:pointer;margin-left:auto;flex-shrink:0}
.modal-close:hover{color:var(--red);border-color:var(--red)}
.modal-body{padding:20px}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.modal-stat{background:var(--table-head);border-radius:10px;padding:12px;text-align:center}
.modal-stat b{display:block;font-size:18px;font-weight:800}
.modal-stat span{font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.modal-detail{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.modal-detail:last-child{border-bottom:none}
.modal-detail .lbl{color:var(--text-muted);font-weight:600}
.modal-detail .val{font-weight:700}
.modal-actions{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
.modal-actions .btn{flex:1;justify-content:center}
.modal-actions .btn.danger{border-color:var(--red);color:var(--red)}
.modal-actions .btn.danger:hover{background:var(--red-bg)}

/* ── Reset Password Modal ── */
.pw-modal-body{padding:20px}
.pw-field{margin-bottom:14px}
.pw-field label{display:block;font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.pw-field input{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:10px 13px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.pw-field input:focus{border-color:var(--gold)}
.pw-field .pw-hint{font-size:10.5px;color:var(--text-faint);margin-top:4px}
.pw-actions{display:flex;gap:10px;margin-top:16px}
.pw-actions .btn{flex:1;justify-content:center}
.pw-success{text-align:center;padding:16px;color:var(--green);font-size:13px;font-weight:700}
.pw-success i{font-size:28px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div id="editorialRoot">
  <div class="grid-4" id="statCards"></div>

  <div class="layout">
    <div>
      <div class="panel">
        <div class="panel-head"><h2><i class="fas fa-user-tie" style="color:var(--gold)"></i> Editors</h2></div>
        <div class="toolbar">
          <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by name, role, or ID…"/></div>
          <select class="select" id="statusFilter">
            <option value="">All Statuses</option>
            <option value="active">Active</option>
            <option value="leave">On Leave</option>
            <option value="suspended">Suspended</option>
          </select>
          <select class="select" id="sortFilter">
            <option value="authors">Sort: Most Authors</option>
            <option value="contracts">Sort: Most Contracts</option>
            <option value="reports">Sort: Most Reports Handled</option>
            <option value="role">Sort: Role</option>
            <option value="recent">Sort: Newest</option>
            <option value="name">Sort: Name A\u2013Z</option>
          </select>
        </div>
        <div class="list-cols">
          <span>Editor</span>
          <span>Role</span>
          <span class="num">Authors</span>
          <span class="num">Contracts</span>
          <span class="num">Reports</span>
          <span>Status</span>
          <span>Joined</span>
          <span></span>
        </div>
        <div id="editorList"></div>
        <div class="list-footer">
          <div class="list-footer-info" id="footerInfo"></div>
          <div class="pager" id="pager"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Editor detail modal -->
<div class="ed-modal-bg" id="edModalBg">
  <div class="ed-modal">
    <div class="ed-modal-head">
      <img id="edModalAvatar" src="" alt=""/>
      <div class="ed-m-info">
        <div class="ed-m-name" id="edModalName"></div>
        <div class="ed-m-role" id="edModalRole"></div>
      </div>
      <button class="ed-modal-close" id="edModalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="ed-modal-body">
      <div class="ed-modal-stats" id="edModalStats"></div>
      <div class="ed-modal-section">Details</div>
      <div id="edModalDetails"></div>
      <div class="ed-modal-actions">
        <button class="ed-btn-profile" id="edModalProfile"><i class="fas fa-user"></i> View Profile</button>
        <button class="ed-btn-reset" id="edModalReset"><i class="fas fa-key"></i> Reset Password</button>
      </div>
    </div>
  </div>
</div>

<!-- Password reset modal -->
<div class="pw-modal-bg" id="pwModalBg">
  <div class="pw-modal">
    <div class="pw-modal-head">
      <h3><i class="fas fa-key" style="color:var(--gold)"></i> Reset Password</h3>
      <button class="ed-modal-close" id="pwModalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="pw-modal-body" id="pwModalForm">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">Set a new password for <strong id="pwEditorName"></strong></div>
      <div class="pw-field">
        <label>New Password</label>
        <input type="password" id="pwNew" placeholder="Enter new password"/>
        <small>Minimum 8 characters</small>
      </div>
      <div class="pw-field">
        <label>Confirm Password</label>
        <input type="password" id="pwConfirm" placeholder="Confirm new password"/>
      </div>
      <div class="pw-err" id="pwErr"></div>
      <div class="pw-actions">
        <button class="pw-cancel" id="pwCancel">Cancel</button>
        <button class="pw-confirm" id="pwConfirmBtn">Reset Password</button>
      </div>
    </div>
    <div class="pw-success" id="pwSuccess">
      <i class="fas fa-circle-check"></i>
      <p>Password reset successful</p>
      <small id="pwSuccessMsg"></small>
    </div>
  </div>
</div>

<script src="shared/super-admin-sidebar.js"></script>
<script>
'use strict';
const shell = SuperAdminSidebar.attach('#editorialRoot', {
  activeItem: 'editorial-team',
  title: 'Editorial Team',
  subtitle: 'All editors across roles on Droboard',
  user: { name: 'Tobi Adenuga', role: 'Super Admin', avatar: 'https://i.pravatar.cc/100?img=68' },
  notifCount: 9,
  searchPlaceholder: 'Search everything…',
});

const ICO_MAP = { red:'var(--red)', amber:'var(--amber)', blue:'var(--blue)', purple:'var(--purple)', green:'var(--green)', gold:'var(--gold)' };
const BG_MAP  = { red:'var(--red-bg)', amber:'var(--amber-bg)', blue:'var(--blue-bg)', purple:'var(--purple-bg)', green:'var(--green-bg)', gold:'var(--gold-bg)' };
const ROLE_CLS = { 'Senior Editor':'green', 'Chief Editor':'red', Marketing:'amber', Finance:'purple', 'Senior Editor + Chief Editor':'red' };
const ROLE_ICO = { 'Senior Editor':'fa-user-tie', 'Chief Editor':'fa-crown', Marketing:'fa-bullhorn', Finance:'fa-sack-dollar' };
const ALL_ROLES = ['Senior Editor','Chief Editor','Marketing','Finance'];

const FIRST = ['Chioma','Femi','Ada','Wren','Rita','Sam','Ngozi','Ola','Diego','Priya','Kelo','Tari','Ife','Marcus','Zara','Aminah','Chidi','Bola','Emeka','Sade'];
const LAST = ['Reddy','Okoro','Lin','Okonkwo','Chen','Okafor','Fields','Adeyemi','Marsh','Nandan','Writes','Benson','Solarin','Webb','Cole','Blackwood','Okafor','Ibrahim','Nnamdi','Bakare'];
const STATUSES = ['active','active','active','active','active','leave','suspended'];

function generateEditors(n){
  const out = [];
  var seeded = [

const ALL_EDITORS = generateEditors(54);
let filtered = ALL_EDITORS.slice();
let page = 1;
const pageSize = 12;

function fmtDays(d){
  if(d<30) return d+'d ago';
  if(d<365) return Math.floor(d/30)+'mo ago';
  return Math.floor(d/365)+'y ago';
}

function renderStatCards(){
  const total = ALL_EDITORS.length;
  const active = ALL_EDITORS.filter(e=>e.status==='active').length;
  const avgAuthors = Math.round(ALL_EDITORS.reduce((s,e)=>s+e.authors,0)/total);
  const roleCounts = {};
  ALL_EDITORS.forEach(function(e){ roleCounts[e.role]=(roleCounts[e.role]||0)+1; });
  const stats = [
    { n: total, l:'Total Editors', ico:'fa-user-tie', cls:'gold' },
    { n: active, l:'Active Editors', ico:'fa-circle-check', cls:'green' },
    { n: roleCounts['Senior Editor']||0, l:'Senior Editors', ico:'fa-user-tie', cls:'blue' },
    { n: roleCounts['Chief Editor']||0, l:'Chief Editors', ico:'fa-crown', cls:'red' },
  ];
  document.getElementById('statCards').innerHTML = stats.map(s=>
    '<div class="stat-card"><div class="stat-ico" style="background:'+BG_MAP[s.cls]+';color:'+ICO_MAP[s.cls]+'"><i class="fas '+s.ico+'"></i></div><div><div class="stat-num">'+s.n+'</div><div class="stat-lbl">'+s.l+'</div></div></div>'
  ).join('');
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const sort = document.getElementById('sortFilter').value;

  filtered = ALL_EDITORS.filter(function(e){
    if(q && !(e.name.toLowerCase().includes(q) || e.id.includes(q) || e.role.toLowerCase().includes(q))) return false;
    if(status && e.status !== status) return false;
    return true;
  });

  if(sort==='authors') filtered.sort(function(a,b){return b.authors-a.authors;});
  else if(sort==='contracts') filtered.sort(function(a,b){return b.contracts-a.contracts;});
  else if(sort==='reports') filtered.sort(function(a,b){return b.reports-a.reports;});
  else if(sort==='recent') filtered.sort(function(a,b){return a.joinedDaysAgo-b.joinedDaysAgo;});
  else if(sort==='name') filtered.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(sort==='role') filtered.sort(function(a,b){return a.role.localeCompare(b.role) || b.authors-a.authors;});

  page = 1;
  renderList();
}

function renderList(){
  const start = (page-1)*pageSize;
  const pageItems = filtered.slice(start, start+pageSize);
  const listEl = document.getElementById('editorList');

  if(pageItems.length === 0){
    listEl.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>No editors match your filters.</div>';
  } else {
    listEl.innerHTML = pageItems.map(function(e){
      var rcls = ROLE_CLS[e.role]||'blue';
      var extra = (e.platformRoles||[]).length;
      var roleLabel = e.role + (extra>0 ? ' +'+extra : '');
      var roleBadge = '<span class="role-pill" style="background:'+BG_MAP[rcls]+';color:'+ICO_MAP[rcls]+'"><i class="fas '+(ROLE_ICO[e.role]||'fa-shield')+'"></i> '+roleLabel+'</span>';
      return '<div class="editor-row" data-edid="'+e.id+'" style="cursor:pointer">'
        + '<div class="editor-main"><img class="e-avatar" src="'+e.avatar+'" alt=""/><div class="e-info"><div class="e-name">'+e.name+(e.lead?' <i class="fas fa-star lead" title="Team Lead"></i>':'')+'</div><div class="e-meta">'+e.id+'</div></div></div>'
        + '<div class="col-hide">'+roleBadge+'</div>'
        + '<div class="col-hide num-cell faint">'+e.authors+'</div>'
        + '<div class="col-hide num-cell">'+e.contracts+'</div>'
        + '<div class="num-cell">'+e.reports+'</div>'
        + '<div><span class="status-chip '+e.status+'"><i class="fas fa-circle"></i>'+(e.status==='leave'?'On Leave':e.status)+'</span></div>'
        + '<div class="col-hide" style="font-size:11px;color:var(--text-faint)">'+fmtDays(e.joinedDaysAgo)+'</div>'
        + '<div class="row-actions"><a class="icon-btn" href="../Pages/profile.html?id='+e.id+'" title="View profile"><i class="fas fa-eye"></i></a><div class="row-menu"><button class="row-menu-btn" data-action="toggle-menu" data-id="'+e.id+'" title="More"><i class="fas fa-ellipsis-vertical"></i></button><div class="dropdown" id="menu-'+e.id+'"><a class="dropdown-item" href="../Pages/profile.html?id='+e.id+'"><i class="fas fa-eye"></i> View Profile</a></div></div></div>'
        + '</div>';
    }).join('');

    listEl.querySelectorAll('.editor-row').forEach(function(row){
      row.addEventListener('click', function(ev){
        if(ev.target.closest('.row-actions')) return;
        openEdModal(row.dataset.edid);
      });
    });
  }
  renderFooter();
}

function renderFooter(){
  const total = filtered.length;
  const start = total === 0 ? 0 : (page-1)*pageSize+1;
  const end = Math.min(page*pageSize, total);
  document.getElementById('footerInfo').textContent = 'Showing '+start+'\u2013'+end+' of '+total+' editors';

  const totalPages = Math.max(1, Math.ceil(total/pageSize));
  var html = '<button '+(page===1?'disabled':'')+' data-p="prev"><i class="fas fa-chevron-left"></i></button>';
  const pagesToShow = new Set([1, totalPages, page, page-1, page+1]);
  let last = 0;
  for(let p=1;p<=totalPages;p++){
    if(!pagesToShow.has(p)) continue;
    if(p - last > 1) html += '<span class="pager-gap">\u2026</span>';
    html += '<button data-p="'+p+'" class="'+(p===page?'active':'')+'">'+p+'</button>';
    last = p;
  }
  html += '<button '+(page===totalPages?'disabled':'')+' data-p="next"><i class="fas fa-chevron-right"></i></button>';
  document.getElementById('pager').innerHTML = html;

  document.querySelectorAll('#pager button').forEach(function(btn){
    btn.addEventListener('click', function(){
      const p = btn.dataset.p;
      const totalPages2 = Math.max(1, Math.ceil(filtered.length/pageSize));
      if(p==='prev') page = Math.max(1, page-1);
      else if(p==='next') page = Math.min(totalPages2, page+1);
      else page = parseInt(p,10);
      renderList();
      document.querySelector('.panel').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('sortFilter').addEventListener('change', applyFilters);

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){closeEdModal();closePwModal();}
});

document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action="toggle-menu"]');
  if(btn){
    e.stopPropagation();
    var id = btn.dataset.id;
    document.querySelectorAll('.dropdown.open').forEach(function(d){ if(d.id!=='menu-'+id) d.classList.remove('open'); });
    document.getElementById('menu-'+id).classList.toggle('open');
    return;
  }
  document.querySelectorAll('.dropdown.open').forEach(function(d){ d.classList.remove('open'); });
});

function init(){
  renderStatCards();
  document.getElementById('sortFilter').value = 'authors';
  applyFilters();
}

/* editor detail modal */
let selectedEditor = null;

  var ed = ALL_EDITORS.find(function(e){return e.id===id;});

  selectedEditor = ed;
  document.getElementById('edModalAvatar').src = ed.avatar;
  document.getElementById('edModalName').textContent = ed.name + (ed.lead ? ' ★' : '');
  document.getElementById('edModalRole').textContent = ed.role;

  /* Stats based on role */
  var statsHtml = '';
  if(ed.role === 'Chief Editor'){
    statsHtml = '<div class="ed-modal-stat"><b>'+ed.authors+'</b><span>Editors Managed</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.contracts+'</b><span>Contracts Oversight</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.reports+'</b><span>Reports Reviewed</span></div>';

    statsHtml = '<div class="ed-modal-stat"><b>'+ed.authors+'</b><span>Assigned Authors</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.contracts+'</b><span>Contracts</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.reports+'</b><span>Reports</span></div>';
  } else if(ed.role === 'Marketing'){
    statsHtml = '<div class="ed-modal-stat"><b>'+ed.authors+'</b><span>Campaigns</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.contracts+'</b><span>Content Pieces</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.reports+'</b><span>Reports</span></div>';
  } else if(ed.role === 'Finance'){
    statsHtml = '<div class="ed-modal-stat"><b>'+ed.authors+'</b><span>Transactions</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.contracts+'</b><span>Payouts Processed</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.reports+'</b><span>Reports</span></div>';
  } else {
    statsHtml = '<div class="ed-modal-stat"><b>'+ed.authors+'</b><span>Authors</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.contracts+'</b><span>Contracts</span></div>'
      +'<div class="ed-modal-stat"><b>'+ed.reports+'</b><span>Reports</span></div>';
  }
  document.getElementById('edModalStats').innerHTML = statsHtml;

  var joined = new Date(Date.now() - ed.joinedDaysAgo*86400000);
  var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var joinedStr = monthNames[joined.getMonth()]+' '+joined.getDate()+', '+joined.getFullYear();
  document.getElementById('edModalDetails').innerHTML =
    '<div class="ed-modal-detail"><span class="lbl">Editor ID</span><span class="val">'+ed.id+'</span></div>'
    +'<div class="ed-modal-detail"><span class="lbl">Status</span><span class="val"><span class="status-chip '+ed.status+'"><i class="fas fa-circle"></i>'+(ed.status==='leave'?'On Leave':ed.status)+'</span></span></div>'
    +'<div class="ed-modal-detail"><span class="lbl">Role</span><span class="val">'+ed.role+'</span></div>'
    +(ed.platformRoles&&ed.platformRoles.length?'<div class="ed-modal-detail"><span class="lbl">Platform Roles</span><span class="val">'+ed.platformRoles.join(', ')+'</span></div>':'')
    +'<div class="ed-modal-detail"><span class="lbl">Joined</span><span class="val">'+joinedStr+'</span></div>'
    +'<div class="ed-modal-detail"><span class="lbl">Email</span><span class="val">'+ed.name.toLowerCase().replace(/ /g,'.')+'@droboard.io</span></div>';
  document.getElementById('edModalBg').classList.add('open');
}
function closeEdModal(){document.getElementById('edModalBg').classList.remove('open');selectedEditor=null;}

document.getElementById('edModalClose').addEventListener('click',closeEdModal);
document.getElementById('edModalBg').addEventListener('click',function(e){if(e.target.id==='edModalBg')closeEdModal();});
document.getElementById('edModalProfile').addEventListener('click',function(){
  if(selectedEditor) window.location.href='../Pages/profile.html?id='+selectedEditor.id;
});
document.getElementById('edModalReset').addEventListener('click',function(){
  closeEdModal();
  document.getElementById('pwEditorName').textContent = selectedEditor ? selectedEditor.name : '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwConfirm').value = '';
  document.getElementById('pwErr').classList.remove('show');
  document.getElementById('pwModalForm').style.display = '';
  document.getElementById('pwSuccess').classList.remove('show');
  document.getElementById('pwModalBg').classList.add('open');
});

/* password reset modal */
function closePwModal(){document.getElementById('pwModalBg').classList.remove('open');}
document.getElementById('pwModalClose').addEventListener('click',closePwModal);
document.getElementById('pwCancel').addEventListener('click',closePwModal);
document.getElementById('pwModalBg').addEventListener('click',function(e){if(e.target.id==='pwModalBg')closePwModal();});
document.getElementById('pwConfirmBtn').addEventListener('click',function(){
  var pw = document.getElementById('pwNew').value;
  var pw2 = document.getElementById('pwConfirm').value;
  var err = document.getElementById('pwErr');
  if(pw.length < 8){err.textContent='Password must be at least 8 characters.';err.classList.add('show');return;}
  if(pw !== pw2){err.textContent='Passwords do not match.';err.classList.add('show');return;}
  err.classList.remove('show');
  var btn = document.getElementById('pwConfirmBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting…';
  setTimeout(function(){
    btn.disabled = false; btn.innerHTML = 'Reset Password';
    document.getElementById('pwModalForm').style.display = 'none';
    document.getElementById('pwSuccessMsg').textContent = 'New password has been set for '+(selectedEditor?selectedEditor.name:'the editor')+'. They can now log in with the new password.';
    document.getElementById('pwSuccess').classList.add('show');
  },1200);
});
