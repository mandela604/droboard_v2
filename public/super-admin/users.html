<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Users — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{overflow-x:hidden;max-width:100%;height:100%;min-height:100vh}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
img{max-width:100%}
#dashRoot{min-height:100vh}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-width:0}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:16px}
.count-chip{font-size:11px;font-weight:700;color:var(--text-muted);background:var(--table-head);padding:5px 11px;border-radius:20px;white-space:nowrap}

.mini-btn{font-size:10.5px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.mini-btn.danger:hover{background:var(--red);color:#fff}
.mini-btn.warn{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.mini-btn.warn:hover{background:var(--amber);color:#fff}
.mini-btn.green{background:var(--green-bg);border-color:transparent;color:var(--green)}
.mini-btn.green:hover{background:var(--green);color:#fff}
.mini-btn.ghost{background:transparent}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tb-search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;min-width:0}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;color:var(--text);width:100%;min-width:0}
.tb-search i{color:var(--text-faint);font-size:12px;flex-shrink:0}
.tb-select{font-size:12px;font-weight:600;font-family:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;cursor:pointer;outline:none;max-width:100%}

.tbl-head{display:grid;grid-template-columns:26px 2.2fr 110px 100px 90px 80px 100px 36px;gap:8px;padding:0 14px 10px;align-items:center}
.tbl-head span{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint)}
.tbl-body{display:flex;flex-direction:column;gap:10px}

.usr-row{display:grid;grid-template-columns:26px 2.2fr 110px 100px 90px 80px 100px 36px;gap:8px;align-items:center;
  background:var(--table-head,#eef0f3);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;transition:.15s}
.usr-row:hover{border-color:var(--accent)}
.usr-row.is-suspended{opacity:.82}
.usr-row.is-banned{opacity:.65}

.user-cell{display:flex;align-items:center;gap:10px;min-width:0}
.usr-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--card)}
.user-cell-text{min-width:0}
.usr-name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr-handle{font-size:10.5px;color:var(--text-faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr-verified{color:var(--blue);font-size:11px}
.u-mobile-meta{display:none;gap:6px;margin-top:4px;flex-wrap:wrap}

.role-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.usr-status{font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;display:inline-block}
.usr-status.active{background:var(--green-bg);color:var(--green)}
.usr-status.suspended{background:var(--amber-bg);color:var(--amber)}
.usr-status.banned{background:var(--red-bg);color:var(--red)}
.col-num{font-size:12.5px;font-weight:700}
.col-joined{font-size:11px;color:var(--text-muted);font-weight:600}
.prole-strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.prole-tag{font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;line-height:1.3}

.row-actions{position:relative;justify-self:end}
.kebab-btn{width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:var(--text-faint);cursor:pointer;font-size:12px}
.kebab-btn:hover{background:var(--card);color:var(--text)}
.inline-menu{position:absolute;right:0;top:30px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:8;overflow:hidden;min-width:160px;display:none}
.inline-menu.open{display:block}
.inline-menu button{width:100%;text-align:left;padding:9px 12px;border:none;background:none;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px;font-family:inherit}
.inline-menu button:hover{background:var(--input-bg)}
.inline-menu button.danger{color:var(--red)}
.inline-menu button i{width:14px;color:var(--text-faint);flex-shrink:0}
.inline-menu button.danger i{color:var(--red)}

.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.pg-info{font-size:11px;color:var(--text-faint);font-weight:600}
.pg-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:6px}
.pg-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:transparent;color:#fff}
.pg-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.pg-ellipsis{font-size:11px;color:var(--text-faint);padding:0 2px}

.empty-msg{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:12.5px}

/* Accordion */
.expand-ico{font-size:11px;color:var(--text-faint);transition:.15s;cursor:pointer;width:20px;text-align:center}
.usr-row.is-open .expand-ico{transform:rotate(90deg);color:var(--accent)}
.usr-row.is-open{border-color:var(--accent);border-radius:12px 12px 0 0}

.usr-detail{display:none;background:linear-gradient(180deg,var(--table-head) 0%,var(--card) 90px);border:1.5px solid var(--accent);border-top:none;border-radius:0 0 14px 14px;padding:0;margin-top:-10px;overflow:hidden}
.usr-detail.show{display:block}
.detail-inner{padding:16px 18px 18px}
.detail-standing{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:9px 13px;border-radius:10px;font-size:11.5px;font-weight:700}
.detail-standing i{font-size:12px}
.detail-standing.green{background:var(--green-bg);color:var(--green)}
.detail-standing.amber{background:var(--amber-bg);color:var(--amber)}
.detail-standing.red{background:var(--red-bg);color:var(--red)}
.detail-section{margin-bottom:16px}
.detail-section:last-of-type{margin-bottom:0}
.ds-label{font-size:9.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ds-label i{color:var(--accent);font-size:10px}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.detail-grid.three{grid-template-columns:repeat(3,1fr)}
.detail-item{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 11px;min-width:0}
.detail-item span{font-size:9px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px}
.detail-item b{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.detail-item.accent{border-color:rgba(255,0,80,.25);background:var(--accent-soft,rgba(255,0,80,.06))}
.detail-item.accent b{color:var(--accent)}
.detail-item.fire b{color:var(--amber)}
.genre-chip-row{display:flex;gap:7px;flex-wrap:wrap}
.genre-chip{font-size:10.5px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--text-muted);padding:5px 10px 5px 11px;border-radius:20px;display:flex;align-items:center;gap:6px}
.genre-chip b{color:var(--accent);font-weight:800}
.genre-chip .rank{font-size:9px;font-weight:800;color:var(--text-faint)}
.tip-banner{display:flex;align-items:center;justify-content:space-between;background:var(--amber-bg);border:1px solid rgba(217,119,6,.22);border-radius:10px;padding:10px 13px}
.tip-banner .tb-left{display:flex;align-items:center;gap:9px}
.tip-banner .tb-ico{width:30px;height:30px;border-radius:8px;background:rgba(217,119,6,.15);color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tip-banner .tb-label{font-size:9.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.03em}
.tip-banner .tb-val{font-size:14.5px;font-weight:800;color:var(--text);margin-top:1px}
.detail-notes{font-size:11.5px;color:var(--text-muted);line-height:1.6;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.detail-foot{display:flex;gap:8px;flex-wrap:wrap}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,20,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.4)}
.modal-box.small{max-width:400px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0;z-index:2}
.modal-head h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--input-bg);color:var(--text-muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:var(--red-bg);color:var(--red)}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px;border-top:1px solid var(--border);flex-wrap:wrap}

.form-row{margin-bottom:16px}
.form-row.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-label{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:6px;display:block}
.form-input,.form-select,.form-textarea{width:100%;font-family:inherit;font-size:12.5px;color:var(--text);
  background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:10px 12px;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.field-error{color:var(--red);font-size:10.5px;margin-top:5px;display:none}
.form-input.invalid,.form-select.invalid{border-color:var(--red)}

/* Assign Role overlay */
.role-overlay{position:fixed;right:0;top:0;width:380px;max-width:90vw;height:100vh;background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:210;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.role-overlay.open{transform:translateX(0)}
.role-overlay-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.role-overlay-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.role-overlay-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--input-bg);color:var(--text-muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.role-overlay-close:hover{background:var(--red-bg);color:var(--red)}
.role-overlay-body{flex:1;overflow-y:auto;padding:16px 20px}
.role-overlay-user{display:flex;align-items:center;gap:12px;padding:14px;background:var(--input-bg);border-radius:12px;margin-bottom:16px}
.role-overlay-user img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.role-overlay-user b{font-size:13px;font-weight:800;display:block}
.role-overlay-user span{font-size:11px;color:var(--text-faint)}

.role-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.role-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.12s}
.role-item:hover{border-color:var(--accent)}
.role-item.assigned{border-color:var(--green);background:var(--green-bg)}
.role-item-left{display:flex;align-items:center;gap:10px}
.role-item-left i{font-size:14px;color:var(--text-faint)}
.role-item.assigned .role-item-left i{color:var(--green)}
.role-item-name{font-size:12.5px;font-weight:700}
.role-item-desc{font-size:10px;color:var(--text-faint)}
.role-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.role-item.assigned .role-check{background:var(--green);border-color:var(--green)}

.role-overlay-foot{padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0}

@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#toastHost{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast-item{background:var(--sidebar-bg,#1a1730);color:#fff;font-size:12.5px;font-weight:600;padding:12px 16px;border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;min-width:0;animation:toast-in .2s ease}
.toast-item i{color:var(--accent);flex-shrink:0}

@media (max-width:900px){
  .tbl-head,.usr-row{grid-template-columns:26px 2.2fr 110px 100px 90px 80px 36px}
  .col-joined{display:none}
}
@media (max-width:640px){
  .tbl-head{display:none}
  .tbl-head,.usr-row{grid-template-columns:22px 1fr 60px 60px 32px}
  .col-role,.col-status{display:none}
  .u-mobile-meta{display:flex}
  .usr-av{width:30px;height:30px}
  .usr-row{padding:10px}
  .grid-4{grid-template-columns:1fr 1fr}
  .panel{padding:14px}
  .toolbar{flex-direction:column;align-items:stretch}
  .tb-select{width:100%}
  .detail-grid,.detail-grid.three{grid-template-columns:1fr 1fr}
}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="dashRoot">
  <div class="grid-4" id="statCards"></div>

  <div class="panel">
    <div class="panel-head">
      <h2><i class="fas fa-users" style="color:var(--accent)"></i> Users</h2>
      <span class="count-chip" id="resultCount">—</span>
    </div>
    <div class="panel-sub">Every reader and writer on Droboard. Tap a row to expand it, or use the menu for full profile, edit, and account actions.</div>

    <div class="toolbar">
      <div class="tb-search"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name, username, or email…"/></div>
      <select class="tb-select" id="roleFilter">
        <option value="all">All roles</option>
        <option value="Reader">Readers</option>
        <option value="Writer">Writers</option>
      </select>
      <select class="tb-select" id="statusFilter">
        <option value="all">All statuses</option>
        <option value="active">Active</option>
        <option value="suspended">Suspended</option>
        <option value="banned">Banned</option>
      </select>
      <select class="tb-select" id="sortSelect">
        <option value="newest">Sort: Newest</option>
        <option value="active">Sort: Recently active</option>
        <option value="name">Sort: Name (A–Z)</option>
        <option value="followers-desc">Sort: Most followers</option>
        <option value="reports-desc">Sort: Most reported</option>
      </select>
    </div>

    <div class="tbl-head">
      <span></span><span>User</span><span>Role</span><span>Status</span><span>Followers</span><span>Stories</span><span>Joined</span><span></span>
    </div>
    <div class="tbl-body" id="usrList"></div>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Assign Role slide-over -->
<div class="role-overlay" id="roleOverlay">
  <div class="role-overlay-head">
    <h3><i class="fas fa-user-shield" style="color:var(--accent)"></i> Assign Roles</h3>
    <button class="role-overlay-close" id="roleOverlayClose"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="role-overlay-body">
    <div class="role-overlay-user" id="roleUser"></div>
    <div class="ds-label" style="font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px"><i class="fas fa-shield" style="color:var(--accent);font-size:10px"></i> Platform Roles</div>
    <div class="role-list" id="roleList"></div>
  </div>
  <div class="role-overlay-foot">
    <button class="mini-btn primary" style="width:100%" id="roleSaveBtn"><i class="fas fa-check"></i> Save Roles</button>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box small">
    <div class="modal-head">
      <h3><i class="fas fa-triangle-exclamation" style="color:var(--red)"></i> Remove User</h3>
      <button class="modal-close" data-close="confirmModal"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:20px;margin:4px auto 16px"><i class="fas fa-user-slash"></i></div>
      <div style="text-align:center;font-size:13px;color:var(--text-muted);line-height:1.6">Permanently remove <b id="confirmName"></b>'s account? This can't be undone.</div>
    </div>
    <div class="modal-foot">
      <button class="mini-btn ghost" data-close="confirmModal">Cancel</button>
      <button class="mini-btn danger" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Remove</button>
    </div>
  </div>
</div>

<div id="toastHost"></div>

<script src="shared/super-admin-sidebar.js"></script>
<script src="users-service.js"></script>
</body>
</html>
