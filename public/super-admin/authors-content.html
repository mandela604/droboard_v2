<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Authors & Content — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3);border-radius:6px}

#authorsRoot{display:flex;flex-direction:column}
.au-page{display:flex;flex-direction:column;gap:14px;padding:16px 20px 32px}

.dept-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dept-head .dept-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.dept-head h2{font-size:13.5px;font-weight:800}
.dept-head span.tag{font-size:9.5px;font-weight:700;color:var(--text-faint);background:var(--table-head);padding:3px 9px;border-radius:20px;margin-left:2px}
.dept-head .updated{margin-left:auto;font-size:10px;color:var(--text-faint);font-weight:600;display:flex;align-items:center;gap:5px}
.au-sub{font-size:11.5px;color:var(--text-faint);margin-top:-6px}

.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.kpi-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0}
.kpi-num{font-size:16px;font-weight:800;line-height:1.1;white-space:nowrap}
.kpi-lbl{font-size:9.5px;color:var(--text-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.count-chip{font-size:11px;font-weight:700;color:var(--text-muted);background:var(--table-head);padding:5px 11px;border-radius:20px}

.btn{font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--border);margin-top:14px}
.search-box{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:200px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:12.5px}
.select{font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;cursor:pointer}

.list-cols{display:grid;grid-template-columns:minmax(0,2.2fr) 90px 100px 110px 110px 100px 90px 70px;gap:10px;align-items:center;padding:10px 18px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);background:var(--table-head);border-bottom:1px solid var(--border)}
.list-cols span.num{text-align:right}

.author-row{display:grid;grid-template-columns:minmax(0,2.2fr) 90px 100px 110px 110px 100px 90px 70px;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);transition:.12s}
.author-row:hover{background:var(--hover)}
.author-row:last-child{border-bottom:none}
.author-main{display:flex;align-items:center;gap:11px;min-width:0}
.a-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}
.a-info{min-width:0}
.a-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-name i.verified{color:var(--blue);font-size:11px}
.a-meta{font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.genre-pill{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}

.status-chip{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
.status-chip.active{background:var(--green-bg);color:var(--green)}
.status-chip.pending{background:var(--amber-bg);color:var(--amber)}
.status-chip.suspended{background:var(--red-bg);color:var(--red)}
.status-chip i{font-size:6px}

.num-cell{font-size:12px;font-weight:700;text-align:right;color:var(--text)}
.num-cell.faint{color:var(--text-muted);font-weight:600}
.col-hide{}
.row-actions{display:flex;justify-content:flex-end;gap:4px;position:relative}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.icon-btn:hover{background:var(--table-head);color:var(--gold)}

.row-menu{position:relative}
.row-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.row-menu-btn:hover{background:var(--table-head);color:var(--gold)}
.dropdown{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:50;min-width:160px;padding:6px 0}
.dropdown.open{display:block}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap;transition:.1s}
.dropdown-item:hover{background:var(--hover);color:var(--accent)}
.dropdown-item i{width:14px;text-align:center;font-size:11px}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap;gap:10px}
.list-footer-info{font-size:11.5px;color:var(--text-faint)}
.pager{display:flex;align-items:center;gap:5px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pager button.active{background:var(--accent);border-color:transparent;color:#fff}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-gap{color:var(--text-faint);font-size:11px;padding:0 2px}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint)}
.empty-state i{font-size:26px;margin-bottom:10px;display:block;opacity:.5}

.genre-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 18px}
.genre-card{background:var(--input-bg);border:1px solid var(--border);border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.genre-card-top{display:flex;align-items:center;justify-content:space-between}
.genre-card-name{font-size:12px;font-weight:700}
.genre-card-count{font-size:15px;font-weight:800}
.genre-bar-track{height:7px;border-radius:5px;background:var(--table-head);overflow:hidden}
.genre-bar-fill{height:100%;border-radius:5px}

@media (max-width:1150px){.genre-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .list-cols,.author-row{grid-template-columns:minmax(0,1fr) 90px 70px}
  .list-cols span:nth-child(3),.list-cols span:nth-child(4),.list-cols span:nth-child(5),.list-cols span:nth-child(6),
  .author-row .col-hide{display:none}
}
@media (max-width:640px){
  .kpi-strip{grid-template-columns:1fr 1fr}
  .genre-grid{grid-template-columns:1fr}
  .panel{padding:14px}
  .list-cols{display:none}
  .author-row{grid-template-columns:1fr 70px;gap:8px}
  .author-row .col-hide{display:none}
}
</style>
</head>
<body>
<div id="authorsRoot">
  <div class="au-page">

    <div class="dept-head">
      <div class="dept-ico" style="background:var(--gold-bg);color:var(--gold)"><i class="fas fa-book"></i></div>
      <h2>Authors &amp; Content</h2>
    </div>

    <div class="kpi-strip" id="statCards"></div>

    <div class="panel">
      <div class="panel-head">
        <h2><i class="fas fa-users" style="color:var(--gold)"></i> Author Roster</h2>
        <button class="btn primary" id="exportBtn"><i class="fas fa-download"></i> Export CSV</button>
      </div>
      <div class="toolbar">
        <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by author name or ID…"/></div>
        <select class="select" id="statusFilter">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="suspended">Suspended</option>
        </select>
        <select class="select" id="sortFilter">
          <option value="reads">Sort: Most Reads</option>
          <option value="revenue">Sort: Highest Revenue</option>
          <option value="books">Sort: Most Books</option>
          <option value="recent">Sort: Newest</option>
          <option value="name">Sort: Name A–Z</option>
        </select>
      </div>
      <div class="list-cols">
        <span>Author</span>
        <span class="num">Books</span>
        <span class="num">Reads</span>
        <span class="num">Revenue</span>
        <span>Genre</span>
        <span>Status</span>
        <span>Joined</span>
        <span></span>
      </div>
      <div id="authorList"></div>
      <div class="list-footer">
        <div class="list-footer-info" id="footerInfo"></div>
        <div class="pager" id="pager"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head" style="padding-bottom:14px">
        <h2><i class="fas fa-chart-simple" style="color:var(--purple)"></i> Content by Genre</h2>
        <span class="count-chip" id="genreTotalChip">—</span>
      </div>
      <div class="genre-grid" id="genreBreakdown"></div>
    </div>

  </div>
</div>

<div id="toastEl" style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:10px 18px;border-radius:28px;font-size:12.5px;font-weight:700;z-index:900;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap;max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.25)"></div>

<script src="shared/super-admin-sidebar.js"></script>
<script src="authors-content-service.js"></script>
</body>
</html>
