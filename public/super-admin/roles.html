<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Roles & Permissions — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3);border-radius:6px}

.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-faint);margin-top:4px}
.btn{font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.roles-layout{display:grid;grid-template-columns:1fr 1.35fr;gap:18px;align-items:start}
@media (max-width:1100px){.roles-layout{grid-template-columns:1fr}}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr 1fr}
  .panel{padding:14px}
  .page-head h1{font-size:17px}
  .perm-cat{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .perm-table{min-width:500px}
}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11.5px;color:var(--text-faint);margin-top:-10px;margin-bottom:14px}

.role-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.14s}
.role-card:hover{border-color:var(--gold)}
.role-card.active{border-color:var(--gold);background:var(--gold-bg)}
.role-card-top{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.role-card-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.role-card-name{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.role-card-desc{font-size:11px;color:var(--text-faint);margin-top:2px;line-height:1.4}
.role-card-meta{display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--text-muted);font-weight:700}
.role-card-meta i{margin-right:4px;opacity:.7}
.system-chip{font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--table-head);color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em}

/* permission matrix */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.detail-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.detail-name{font-size:16px;font-weight:800}
.detail-desc{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.detail-actions{display:flex;gap:8px;margin-left:auto}

.perm-cat{margin-top:18px}
.perm-cat-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:9px;display:flex;align-items:center;gap:7px}
.perm-table{width:100%;border-collapse:collapse}
.perm-table tr{border-bottom:1px solid var(--border)}
.perm-table tr:last-child{border-bottom:none}
.perm-table td{padding:9px 4px;font-size:12px}
.perm-name{font-weight:600;color:var(--text)}
.perm-name small{display:block;font-size:10px;color:var(--text-faint);font-weight:500;margin-top:1px}
.perm-toggle{width:36px;height:20px;border-radius:20px;background:var(--table-head);position:relative;cursor:pointer;transition:.15s;display:inline-block;border:1px solid var(--border)}
.perm-toggle.on{background:var(--green)}
.perm-toggle::after{content:'';position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.perm-toggle.on::after{left:17px}
.perm-toggle.locked{opacity:.45;cursor:not-allowed}
.perm-cell{text-align:right;width:60px}

.members-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
.members-row:last-child{border-bottom:none}
.m-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.m-body{flex:1;min-width:0}
.m-name{font-size:12px;font-weight:700}
.m-email{font-size:10.5px;color:var(--text-faint)}
.mini-btn{font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.mini-btn:hover{border-color:var(--gold);color:var(--gold)}
.mini-btn.danger:hover{background:var(--red);color:#fff;border-color:transparent}

/* modal (create/edit role) */
.modal-overlay{position:fixed;inset:0;background:rgba(10,8,20,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:40px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:620px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);max-height:90vh;display:flex;flex-direction:column}
.modal-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:15px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--table-head);cursor:pointer;color:var(--text-faint);font-size:13px}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:16px}
.field label{font-size:11.5px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;font-size:13px}
.field textarea{resize:vertical;min-height:60px}
.wizard-steps{display:flex;gap:6px;margin-bottom:20px}
.wizard-steps span{flex:1;height:4px;border-radius:4px;background:var(--table-head)}
.wizard-steps span.active{background:var(--gold)}

.skeleton{padding:28px;text-align:center;color:var(--text-faint);font-size:12.5px}
</style>
</head>
<body>
<div id="rolesRoot">
  <div class="page-head">
    <div>
      <h1>Roles &amp; Permissions</h1>
      <p>Control what every team can see and do across Droboard.</p>
    </div>
    <button class="btn primary" id="newRoleBtn"><i class="fas fa-plus"></i> New Role</button>
  </div>

  <div class="grid-4" id="statCards"></div>

  <div class="roles-layout">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-user-shield" style="color:var(--gold)"></i> All Roles</h2></div>
      <div class="panel-sub">Select a role to view or edit its permissions.</div>
      <div id="rolesList"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
    </div>

    <div>
      <div class="panel" id="detailPanel">
        <div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
      </div>
      <div class="panel" id="membersPanel"></div>
    </div>
  </div>
</div>

<!-- Create / Edit Role Modal -->
<div class="modal-overlay" id="roleModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Create New Role</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="wizard-steps"><span class="active" id="step1dot"></span><span id="step2dot"></span></div>

      <div id="wizStep1">
        <div class="field"><label>Role Name</label><input type="text" id="roleNameInput" placeholder="e.g. Regional Editor"/></div>
        <div class="field"><label>Description</label><textarea id="roleDescInput" placeholder="What does this role do?"></textarea></div>
        <div class="field"><label>Icon Color</label>
          <div style="display:flex;gap:8px" id="colorPicker"></div>
        </div>
      </div>

      <div id="wizStep2" style="display:none">
        <div id="modalPermCats"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="wizBack" style="display:none">Back</button>
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="wizNext">Next <i class="fas fa-arrow-right"></i></button>
    </div>
  </div>
</div>

<script src="shared/super-admin-sidebar.js"></script>
<script src="roles-service.js"></script>
</body>
</html>
