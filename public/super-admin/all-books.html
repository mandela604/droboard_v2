<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>All Books — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3);border-radius:6px}

.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-faint);margin-top:4px}
.btn{font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-inner-pad{padding:16px 18px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--border)}
.search-box{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:200px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:12.5px}
.select{font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;cursor:pointer}
.seg{display:flex;border:1px solid var(--input-border);border-radius:10px;overflow:hidden}
.seg button{padding:9px 12px;border:none;background:var(--input-bg);color:var(--text-faint);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.seg button.active{background:var(--accent);color:#fff}

/* list header row */
.list-cols{display:grid;grid-template-columns:minmax(0,3fr) 110px 90px 90px 90px 100px 110px 70px;gap:10px;align-items:center;padding:10px 18px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);background:var(--table-head);border-bottom:1px solid var(--border)}
.list-cols span.num{text-align:right}

/* list rows */
.book-row{display:grid;grid-template-columns:minmax(0,3fr) 110px 90px 90px 90px 100px 110px 70px;gap:10px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--border);transition:.12s}
.book-row:hover{background:var(--hover)}
.book-row:last-child{border-bottom:none}

.book-main{display:flex;align-items:center;gap:11px;min-width:0}
.book-thumb{width:32px;height:44px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--table-head)}
.book-info{min-width:0}
.book-title{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-meta{font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.book-meta a{color:var(--text-muted);font-weight:600}
.book-meta a:hover{color:var(--gold)}

.genre-chip{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}

.status-chip{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
.status-chip.published{background:var(--green-bg);color:var(--green)}
.status-chip.draft{background:var(--table-head);color:var(--text-faint)}
.status-chip.flagged{background:var(--red-bg);color:var(--red)}
.status-chip.paused{background:var(--amber-bg);color:var(--amber)}
.status-chip i{font-size:6px}

.num-cell{font-size:12px;font-weight:700;text-align:right;color:var(--text)}
.num-cell.faint{color:var(--text-muted);font-weight:600}
.num-sub{font-size:9.5px;color:var(--text-faint);text-align:right;font-weight:600}

.row-actions{display:flex;justify-content:flex-end;gap:4px}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.icon-btn:hover{background:var(--table-head);color:var(--gold)}

.row-menu{position:relative}
.row-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.row-menu-btn:hover{background:var(--table-head);color:var(--gold)}
.dropdown{position:absolute;right:0;top:30px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:8;overflow:hidden;min-width:160px;display:none}
.dropdown.open{display:block}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.dropdown-item:hover{background:var(--input-bg)}
.dropdown-item i{width:14px;color:var(--text-faint);flex-shrink:0}
.dropdown-item.danger{color:var(--red)}
.dropdown-item.danger i{color:var(--red)}

.dense .book-row{padding-top:6px;padding-bottom:6px}
.dense .book-thumb{width:26px;height:36px}
.dense .book-title{font-size:12px}

/* pagination */
.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap;gap:10px}
.list-footer-info{font-size:11.5px;color:var(--text-faint)}
.pager{display:flex;align-items:center;gap:5px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pager button.active{background:var(--accent);border-color:transparent;color:#fff}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-gap{color:var(--text-faint);font-size:11px;padding:0 2px}

.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint)}
.empty-state i{font-size:26px;margin-bottom:10px;display:block;opacity:.5}

@media (max-width:900px){
  .list-cols, .book-row{grid-template-columns:minmax(0,1fr) 90px 70px}
  .list-cols span:nth-child(4),.list-cols span:nth-child(5),.list-cols span:nth-child(6),
  .book-row .col-hide{display:none}
}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr 1fr}
  .panel{padding:14px}
  .page-head h1{font-size:17px}
}
</style>
</head>
<body>
<div id="booksRoot">
  <div class="grid-4" id="statCards"></div>

  <div class="panel">
    <div class="toolbar">
      <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by title, author, or ID…"/></div>
      <select class="select" id="genreFilter"><option value="">All Genres</option></select>
      <select class="select" id="statusFilter">
        <option value="">All Statuses</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
        <option value="paused">Paused</option>
        <option value="flagged">Flagged</option>
      </select>
      <select class="select" id="sortFilter">
        <option value="reads">Sort: Most Reads</option>
        <option value="recent">Sort: Recently Updated</option>
        <option value="title">Sort: Title A–Z</option>
        <option value="revenue">Sort: Highest Revenue</option>
      </select>
      <div class="seg" id="densitySeg">
        <button data-density="normal" class="active"><i class="fas fa-bars"></i></button>
        <button data-density="dense"><i class="fas fa-list"></i></button>
      </div>
    </div>

    <div class="list-cols">
      <span>Book</span>
      <span>Genre</span>
      <span>Status</span>
      <span class="num">Reads</span>
      <span class="num">Rating</span>
      <span class="num">Revenue</span>
      <span>Updated</span>
      <span></span>
    </div>

    <div id="bookList"></div>

    <div class="list-footer">
      <div class="list-footer-info" id="footerInfo"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<script src="shared/super-admin-sidebar.js"></script>
<script src="all-books-service.js"></script>
</body>
</html>
