<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>All Posts — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3);border-radius:6px}

.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-faint);margin-top:4px}
.btn{font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:var(--gold);color:var(--gold)}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--border)}
.search-box{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:200px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:12.5px}
.select{font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;cursor:pointer}

.list-cols{display:grid;grid-template-columns:26px 1fr 110px 80px 80px 100px 80px;gap:8px;align-items:center;padding:0 14px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);background:var(--table-head);border-bottom:1px solid var(--border)}
.list-cols span.num{text-align:right}

.post-row{display:grid;grid-template-columns:26px 1fr 110px 80px 80px 100px 80px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);transition:.12s;cursor:pointer;border-radius:0}
.post-row:hover{background:var(--hover)}
.post-row:last-child{border-bottom:none}
.post-row.is-open{background:var(--hover);border-bottom-color:transparent}

.post-main{display:flex;align-items:center;gap:11px;min-width:0;overflow:hidden}
.post-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0}
.post-info{min-width:0;overflow:hidden}
.post-title-link{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4;color:var(--text);text-decoration:none;cursor:pointer}
.post-title-link:hover{color:var(--accent)}
.post-meta{font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.post-meta a{color:var(--text-muted);font-weight:600}
.post-meta a:hover{color:var(--gold)}

.expand-ico{font-size:10px;color:var(--text-faint);margin-right:6px;flex-shrink:0;transition:transform .2s}
.post-row.is-open .expand-ico{transform:rotate(90deg)}

.type-chip{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.type-chip i{font-size:8px}

.status-chip{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px}
.status-chip.published{background:var(--green-bg);color:var(--green)}
.status-chip.flagged{background:var(--red-bg);color:var(--red)}
.status-chip.removed{background:var(--table-head);color:var(--text-faint)}
.status-chip.under-review{background:var(--amber-bg);color:var(--amber)}
.status-chip i{font-size:6px}

.num-cell{font-size:12px;font-weight:700;text-align:right;color:var(--text)}
.num-cell.faint{color:var(--text-muted);font-weight:600}

.row-actions{display:flex;justify-content:flex-end;gap:4px}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer}
.icon-btn:hover{background:var(--table-head);color:var(--gold)}

/* Accordion detail */
.post-detail{display:none;background:linear-gradient(180deg,var(--table-head) 0%,var(--card) 90px);border:1.5px solid var(--accent);border-top:none;border-radius:0 0 14px 14px;padding:0;margin-top:-10px;overflow:hidden}
.post-detail.show{display:block}
.detail-inner{padding:16px 18px 18px}
.detail-section{margin-bottom:16px}
.detail-section:last-of-type{margin-bottom:0}
.ds-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ds-label i{font-size:11px}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.detail-grid.three{grid-template-columns:repeat(3,1fr)}
.detail-item{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 11px;min-width:0}
.detail-item span{font-size:9px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px}
.detail-item b{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.detail-item.accent{border-color:rgba(255,0,80,.25);background:rgba(255,0,80,.06)}
.detail-item.accent b{color:var(--accent)}
.detail-item.green b{color:var(--green)}
.detail-item.purple b{color:var(--purple)}
.detail-item.gold b{color:var(--gold)}
.detail-item.blue b{color:var(--blue)}

.detail-preview{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px}
.detail-preview-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px}
.detail-preview-text{font-size:13px;font-weight:600;line-height:1.6;color:var(--text)}
.detail-preview-quote{font-size:14px;font-weight:700;font-style:italic;line-height:1.6;color:var(--text);border-left:3px solid var(--gold);padding-left:12px;margin:4px 0}
.detail-preview-caption{font-size:11px;color:var(--text-faint);margin-top:6px}
.detail-preview-ref{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.detail-preview-ref img{width:40px;height:56px;border-radius:6px;object-fit:cover}
.detail-preview-ref-info{font-size:11px;font-weight:600;color:var(--text)}
.detail-preview-ref-info span{display:block;font-size:10px;color:var(--text-faint);margin-top:2px}

.detail-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mini-btn{font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{filter:brightness(1.1)}

.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap;gap:10px}
.list-footer-info{font-size:11.5px;color:var(--text-faint)}
.pager{display:flex;align-items:center;gap:5px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pager button.active{background:var(--accent);border-color:transparent;color:#fff}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-gap{color:var(--text-faint);font-size:11px;padding:0 2px}

.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint)}
.empty-state i{font-size:26px;margin-bottom:10px;display:block;opacity:.5}

@media (max-width:1100px){
  .list-cols,.post-row{grid-template-columns:26px 1fr 110px 80px 100px}
  .list-cols span:nth-child(3),.list-cols span:nth-child(7),
  .post-row .col-type,.post-row .col-date{display:none}
  .detail-grid,.detail-grid.three{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .list-cols,.post-row{grid-template-columns:26px minmax(0,1fr) 100px 70px}
  .list-cols span:nth-child(3),.list-cols span:nth-child(4),.list-cols span:nth-child(7),
  .post-row .col-type,.post-row .col-date{display:none}
}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr 1fr}
  .panel{padding:14px}
  .page-head h1{font-size:17px}
}
</style>
</head>

var filtered=POSTS.slice();
var page=1;
var pageSize=25;
var openRowId=null;

function fmtNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n);}
function fmtHours(h){if(h===0)return'Just now';if(h<24)return h+'h ago';if(h<24*30)return Math.floor(h/24)+'d ago';return Math.floor(h/(24*30))+'mo ago';}
function authorName(p){return p.author?p.author.name:'Unknown';}
function authorId(p){return p.author?p.author.id:'';}

function getPreviewText(p){
  if(p.text)return p.text;
  if(p.quote)return'\u201c'+p.quote.substring(0,100)+(p.quote.length>100?'...':'')+'\u201d';
  if(p.note)return p.note;
  if(p.amaData)return p.amaData.title;
  if(p.chapterRef)return p.chapterRef.title+' \u2014 '+p.chapterRef.ch;
  if(p.poll)return p.poll.question;
  if(p.debateData)return p.debateData.question;
  if(p.reviewText)return p.reviewText.substring(0,100)+'...';
  if(p.storyRef)return p.storyRef.title;
  return '';
}

function getPostUrl(p){
  return '../Pages/post-reader.html?post='+p.id;
}

function renderStatCards(){
  var total=POSTS.length;
  var published=POSTS.filter(function(p){return p.status==='published';}).length;
  var flagged=POSTS.filter(function(p){return p.status==='flagged';}).length;
  var underReview=POSTS.filter(function(p){return p.status==='under-review';}).length;
  document.getElementById('totalCountLbl').textContent=fmtNum(total);
  var stats=[
    {n:fmtNum(total),l:'Total Posts',ico:'fa-rss',cls:'gold'},
    {n:fmtNum(published),l:'Published',ico:'fa-circle-check',cls:'green'},
    {n:flagged,l:'Flagged',ico:'fa-flag',cls:'red'},
    {n:underReview,l:'Under Review',ico:'fa-clock',cls:'amber'}
  ];
  document.getElementById('statCards').innerHTML=stats.map(function(s){
    return '<div class="stat-card"><div class="stat-ico" style="background:'+BG[s.cls]+';color:'+ICO[s.cls]+'"><i class="fas '+s.ico+'"></i></div><div><div class="stat-num">'+s.n+'</div><div class="stat-lbl">'+s.l+'</div></div></div>';
  }).join('');
}

function applyFilters(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var type=document.getElementById('typeFilter').value;
  var status=document.getElementById('statusFilter').value;
  var sort=document.getElementById('sortFilter').value;

  filtered=POSTS.filter(function(p){
    var txt=(p.text||p.quote||p.note||'').toLowerCase();
    var name=authorName(p).toLowerCase();
    if(q&&txt.indexOf(q)===-1&&name.indexOf(q)===-1&&p.id.indexOf(q)===-1)return false;
    if(type&&p.type!==type)return false;
    if(status&&p.status!==status)return false;
    return true;
  });

  if(sort==='recent')filtered.sort(function(a,b){return a.hoursAgo-b.hoursAgo;});
  else if(sort==='views')filtered.sort(function(a,b){return b.views-a.views;});
  else if(sort==='likes')filtered.sort(function(a,b){return b.likes-a.likes;});
  else if(sort==='comments')filtered.sort(function(a,b){return b.comments-a.comments;});

  page=1;
  openRowId=null;
  renderList();
}

function renderList(){
  var start=(page-1)*pageSize;
  var pageItems=filtered.slice(start,start+pageSize);
  var listEl=document.getElementById('postList');

  if(pageItems.length===0){
    listEl.innerHTML='<div class="empty-state"><i class="fas fa-inbox"></i>No posts match your filters.</div>';
  }else{
    listEl.innerHTML=pageItems.map(function(p){
      var tc=TYPE_CONFIG[p.type]||TYPE_CONFIG['post'];
      var color=ICO[tc.color]||'var(--text-faint)';
      var bg=BG[tc.color]||'var(--table-head)';
      var isOpen=openRowId===p.id;
      var preview=getPreviewText(p);
      var statusClass=p.status==='under-review'?'under-review':p.status;
      return '<div>'+
        '<div class="post-row'+(isOpen?' is-open':'')+'" data-id="'+p.id+'">'+
          '<i class="fas fa-chevron-right expand-ico"></i>'+
          '<div class="post-main">'+
            '<img class="post-avatar" src="'+p.author.avatar+'" alt=""/>'+
            '<div class="post-info">'+
              '<a class="post-title-link" href="'+getPostUrl(p)+'" onclick="event.stopPropagation()">'+preview+'</a>'+
              '<div class="post-meta">by <a href="../Pages/profile.html?id='+authorId(p)+'">'+authorName(p)+'</a> \u00b7 '+p.id+'</div>'+
            '</div>'+
          '</div>'+
          '<div class="col-type"><span class="type-chip" style="background:'+bg+';color:'+color+'"><i class="fas '+tc.icon+'"></i> '+tc.label+'</span></div>'+
          '<div class="col-hide num-cell">'+fmtNum(p.views)+'</div>'+
          '<div class="num-cell faint">'+fmtNum(p.comments)+'</div>'+
          '<div><span class="status-chip '+statusClass+'"><i class="fas fa-circle"></i> '+p.status.replace('-',' ')+'</span></div>'+
          '<div class="col-date" style="font-size:11px;color:var(--text-faint)">'+fmtHours(p.hoursAgo)+'</div>'+
        '</div>'+
        '<div class="post-detail'+(isOpen?' show':'')+'" id="detail-'+p.id+'"></div>'+
      '</div>';
    }).join('');
  }
  if(openRowId&&pageItems.some(function(p){return p.id===openRowId;}))renderDetailPanel(openRowId);
  renderFooter();
}

function renderDetailPanel(id){
  var p=POSTS.find(function(x){return x.id===id;});
  if(!p)return;
  var panel=document.getElementById('detail-'+id);
  if(!panel)return;

  var tc=TYPE_CONFIG[p.type]||TYPE_CONFIG['post'];
  var color=ICO[tc.color]||'var(--text-faint)';

  var html='<div class="detail-inner">';
  html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-chart-simple"></i> Post Stats</div><div class="detail-grid">';
  html+='<div class="detail-item accent"><span>Likes</span><b>'+fmtNum(p.likes)+'</b></div>';
  html+='<div class="detail-item"><span>Comments</span><b>'+fmtNum(p.comments)+'</b></div>';
  html+='<div class="detail-item green"><span>Views</span><b>'+fmtNum(p.views)+'</b></div>';
  html+='<div class="detail-item"><span>Type</span><b>'+tc.label+'</b></div>';
  html+='</div></div>';

  if(p.type==='poll'&&p.poll){
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-chart-bar"></i> Poll Results</div><div class="detail-preview">';
    html+='<div class="detail-preview-text">'+p.poll.question+'</div>';
    p.poll.opts.forEach(function(o){
      var pct=Math.round((o.v/p.poll.total)*100);
      html+='<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:3px"><span>'+o.label+'</span><span>'+o.v+' votes ('+pct+'%)</span></div>';
      html+='<div style="height:6px;border-radius:4px;background:var(--border);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:4px"></div></div></div>';
    });
    html+='<div style="font-size:10px;color:var(--text-faint);margin-top:8px">'+fmtNum(p.poll.total)+' total votes</div>';
    html+='</div></div>';
  }

  if(p.type==='debate'&&p.debateData){
    var total=p.debateData.forV+p.debateData.agV;
    var forPct=total?Math.round((p.debateData.forV/total)*100):50;
    var agPct=100-forPct;
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-scale-balanced"></i> Debate Results</div><div class="detail-preview">';
    html+='<div class="detail-preview-text">'+p.debateData.question+'</div>';
    html+='<div style="display:flex;gap:12px;margin-top:10px">';
    html+='<div style="flex:1;text-align:center;padding:10px;background:var(--green-bg);border-radius:8px"><div style="font-size:18px;font-weight:800;color:var(--green)">'+forPct+'%</div><div style="font-size:10px;color:var(--text-faint);font-weight:700;margin-top:2px">'+p.debateData.forText+'</div><div style="font-size:10px;color:var(--text-faint)">'+fmtNum(p.debateData.forV)+' votes</div></div>';
    html+='<div style="flex:1;text-align:center;padding:10px;background:var(--red-bg);border-radius:8px"><div style="font-size:18px;font-weight:800;color:var(--red)">'+agPct+'%</div><div style="font-size:10px;color:var(--text-faint);font-weight:700;margin-top:2px">'+p.debateData.againstText+'</div><div style="font-size:10px;color:var(--text-faint)">'+fmtNum(p.debateData.agV)+' votes</div></div>';
    html+='</div></div></div>';
  }

  if(p.type==='review'){
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-star"></i> Review</div><div class="detail-preview">';
    html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">';
    for(var s=1;s<=5;s++)html+='<i class="fas fa-star" style="font-size:14px;color:'+(s<=p.score?'var(--gold)':'var(--border)')+'"></i>';
    html+='<span style="font-size:12px;font-weight:700;margin-left:4px">'+p.score+'/5</span></div>';
    html+='<div class="detail-preview-text">'+p.reviewText+'</div>';
    html+='</div></div>';
  }

  if(p.type==='ama'&&p.amaData){
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-microphone"></i> AMA Session</div><div class="detail-preview">';
    html+='<div class="detail-preview-text">'+p.amaData.title+'</div>';
    html+='<div style="font-size:11px;color:var(--text-faint);margin-top:4px">'+p.amaData.meta+'</div>';
    html+='<div style="font-size:12px;font-weight:700;margin-top:6px;color:var(--accent)"><i class="fas fa-eye"></i> '+fmtNum(p.amaData.viewers)+' viewers</div>';
    html+='</div></div>';
  }

  if(p.chapterRef){
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-book-open"></i> Chapter Reference</div>';
    html+='<div class="detail-preview-ref"><img src="'+p.chapterRef.cover+'" alt=""/><div class="detail-preview-ref-info">'+p.chapterRef.title+'<span>'+p.chapterRef.ch+' \u00b7 '+p.chapterRef.cat+'</span></div></div></div>';
  }

  if(p.storyRef){
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-book"></i> Story Reference</div>';
    html+='<div class="detail-preview-ref"><img src="'+p.storyRef.cover+'" alt=""/><div class="detail-preview-ref-info">'+p.storyRef.title+'<span>by '+p.storyRef.author+(p.storyRef.cat?' \u00b7 '+p.storyRef.cat:'')+'</span></div></div></div>';
  }

  if(p.quote){
    html+='<div class="detail-section"><div class="ds-label"><i class="fas fa-quote-left"></i> Quote</div><div class="detail-preview">';
    html+='<div class="detail-preview-quote">'+p.quote+'</div>';
    if(p.caption)html+='<div class="detail-preview-caption">'+p.caption+'</div>';
    html+='</div></div>';
  }

  html+='<div class="detail-foot">';
  html+='<a class="mini-btn primary" href="'+getPostUrl(p)+'" target="_blank"><i class="fas fa-arrow-up-right-from-square"></i> View Post</a>';
  html+='<a class="mini-btn" href="../Pages/profile.html?id='+authorId(p)+'"><i class="fas fa-user"></i> View Author</a>';
  html+='</div></div>';

  panel.innerHTML=html;
}

function renderFooter(){
  var total=filtered.length;
  var start=total===0?0:(page-1)*pageSize+1;
  var end=Math.min(page*pageSize,total);
  document.getElementById('footerInfo').textContent='Showing '+start+'\u2013'+end+' of '+fmtNum(total)+' posts';

  var totalPages=Math.max(1,Math.ceil(total/pageSize));
  var html='<button '+(page===1?'disabled':'')+' data-p="prev"><i class="fas fa-chevron-left"></i></button>';
  var pagesToShow=new Set([1,totalPages,page,page-1,page+1]);
  var last=0;
  for(var p=1;p<=totalPages;p++){
    if(!pagesToShow.has(p))continue;
    if(p-last>1)html+='<span class="pager-gap">\u2026</span>';
    html+='<button data-p="'+p+'" class="'+(p===page?'active':'')+'">'+p+'</button>';
    last=p;
  }
  html+='<button '+(page===totalPages?'disabled':'')+' data-p="next"><i class="fas fa-chevron-right"></i></button>';
  document.getElementById('pager').innerHTML=html;

  document.querySelectorAll('#pager button').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pp=btn.dataset.p;
      var totalPages2=Math.max(1,Math.ceil(filtered.length/pageSize));
      if(pp==='prev')page=Math.max(1,page-1);
      else if(pp==='next')page=Math.min(totalPages2,page+1);
      else page=parseInt(pp,10);
      renderList();
      document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
}

document.addEventListener('click',function(e){
  var postRow=e.target.closest('.post-row');
  if(postRow&&!e.target.closest('a')){
    var id=postRow.dataset.id;
    openRowId=openRowId===id?null:id;
    renderList();
  }
});

document.getElementById('searchInput').addEventListener('input',applyFilters);
document.getElementById('typeFilter').addEventListener('change',applyFilters);
document.getElementById('statusFilter').addEventListener('change',applyFilters);
document.getElementById('sortFilter').addEventListener('change',applyFilters);
document.getElementById('reviewFlaggedBtn').addEventListener('click',function(){
  document.getElementById('statusFilter').value='flagged';
  applyFilters();
});

renderStatCards();
applyFilters();
</script>
