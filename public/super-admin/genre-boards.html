<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Genre Boards — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3);border-radius:6px}

.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-head h1{font-size:20px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-faint);margin-top:4px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--border)}
.search-box{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:200px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:12.5px}
.select{font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-family:inherit;cursor:pointer}

.list-cols{display:grid;grid-template-columns:minmax(0,2.2fr) 120px 85px 75px 80px 85px 85px 36px;gap:10px;align-items:center;padding:10px 18px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);background:var(--table-head);border-bottom:1px solid var(--border)}
.list-cols span.num{text-align:right}

.board-item{border-bottom:1px solid var(--border)}
.board-item:last-child{border-bottom:none}

.board-row{display:grid;grid-template-columns:minmax(0,2.2fr) 120px 85px 75px 80px 85px 85px 36px;gap:10px;align-items:center;padding:10px 18px;cursor:pointer;transition:.12s;user-select:none}
.board-row:hover{background:var(--hover)}
.board-item.open .board-row{background:var(--hover)}

.board-main{display:flex;align-items:center;gap:11px;min-width:0}
.board-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.board-name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-sub{font-size:10px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;display:flex;align-items:center;gap:6px}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.active{background:var(--green)}
.status-dot.growing{background:var(--blue)}
.status-dot.quiet{background:var(--amber)}

.mod-stack{display:flex;align-items:center}
.mod-av{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--card);margin-left:-7px;flex-shrink:0;background:var(--table-head)}
.mod-av:first-child{margin-left:0}
.mod-more{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);margin-left:-7px;background:var(--table-head);color:var(--text-muted);font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mod-none{font-size:10px;color:var(--text-faint);font-weight:600}

.num-cell{font-size:12px;font-weight:700;text-align:right;color:var(--text)}
.num-cell.faint{color:var(--text-muted);font-weight:600}
.num-sub{font-size:9px;color:var(--text-faint);text-align:right;font-weight:600;margin-top:1px}

.growth-chip{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.growth-chip.up{background:var(--green-bg);color:var(--green)}
.growth-chip.down{background:var(--red-bg);color:var(--red)}

.chev{color:var(--text-faint);font-size:11px;transition:transform .18s;text-align:center}
.board-item.open .chev{transform:rotate(180deg);color:var(--gold)}

.icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--table-head);color:var(--gold)}

/* accordion detail */
.board-detail{display:none;background:var(--table-head);border-top:1px solid var(--border);padding:14px 18px 16px}
.board-item.open .board-detail{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.dtile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.dtile-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:4px}
.dtile-val{font-size:15px;font-weight:800;line-height:1.1}
.dtile-sub{font-size:9.5px;color:var(--text-faint);font-weight:600;margin-top:2px}
.dtile-val.warn{color:var(--amber)}
.dtile-val.bad{color:var(--red)}

.detail-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mod-team{font-size:11px;color:var(--text-muted);line-height:1.6;max-width:60%}
.mod-team b{color:var(--text);font-weight:700}
.detail-actions{display:flex;gap:8px;align-items:center}
.detail-link{font-size:11.5px;font-weight:700;color:var(--gold);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card)}
.detail-link:hover{border-color:var(--gold)}
.detail-flag{font-size:11.5px;font-weight:700;color:var(--text-muted);padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit}
.detail-flag:hover{color:var(--red);border-color:var(--red)}

.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap;gap:10px}
.list-footer-info{font-size:11.5px;color:var(--text-faint)}
.pager{display:flex;align-items:center;gap:5px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.pager button.active{background:var(--accent);border-color:transparent;color:#fff}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-gap{color:var(--text-faint);font-size:11px;padding:0 2px}

.empty-state{padding:50px 20px;text-align:center;color:var(--text-faint)}
.empty-state i{font-size:26px;margin-bottom:10px;display:block;opacity:.5}

@media (max-width:1100px){
  .list-cols, .board-row{grid-template-columns:minmax(0,2fr) 90px 80px 70px 70px 70px 36px}
  .list-cols span.col-hide,.board-row .col-hide{display:none}
  .detail-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr 1fr}
  .page-head h1{font-size:17px}
  .detail-grid{grid-template-columns:1fr 1fr}
  .mod-team{max-width:100%}
}
</style>
</head>
<body>
<div id="boardsRoot">
  <div class="grid-4" id="statCards"></div>

  <div class="panel">
    <div class="toolbar">
      <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search board or moderator…"/></div>
      <select class="select" id="statusFilter">
        <option value="">All Boards</option>
        <option value="active">Active</option>
        <option value="growing">Growing</option>
        <option value="quiet">Quiet</option>
      </select>
      <select class="select" id="sortFilter">
        <option value="members">Sort: Most Members</option>
        <option value="posts">Sort: Most Posts (week)</option>
        <option value="replies">Sort: Best Discussion</option>
        <option value="returning">Sort: Best Retention</option>
        <option value="daily">Sort: Daily Visits</option>
        <option value="growth">Sort: Fastest Growing</option>
        <option value="reports">Sort: Most Reports</option>
        <option value="name">Sort: Name A–Z</option>
      </select>
    </div>

    <div class="list-cols">
      <span>Board</span>
      <span>Admins / Mods</span>
      <span class="num">Members</span>
      <span class="num">Daily</span>
      <span class="num col-hide">Weekly</span>
      <span class="num">Posts/Wk</span>
      <span class="num">Growth</span>
      <span></span>
    </div>

    <div id="boardList"></div>

    <div class="list-footer">
      <div class="list-footer-info" id="footerInfo"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<script src="shared/super-admin-sidebar.js"></script>
<script src="genre-boards-service.js"></script>
</body>
</html>
