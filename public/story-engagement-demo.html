<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story-wide Engagement Demo - Droboard</title>
  <style>
    :root { --bg: #0a0a0a; --card: #161616; --accent: #ff0050; --text: #e0e0e0; --muted: #888; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
    .card { background: var(--card); border-radius: 8px; padding: 20px; margin: 20px 0; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #222; border: none; color: var(--text); cursor: pointer; border-radius: 6px; }
    .tab.active { background: var(--accent); }
    .form-group { margin: 15px 0; }
    label { display: block; margin-bottom: 5px; color: var(--muted); }
    input, textarea, select { width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: var(--text); border-radius: 6px; box-sizing: border-box; }
    button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { opacity: 0.9; }
    .options-list { margin: 10px 0; }
    .option-row { display: flex; gap: 10px; margin: 5px 0; }
    .option-row input { flex: 1; }
    .option-row button { padding: 10px 15px; margin: 5px 0 0 0; }
    .engagement-item { border-top: 1px solid #333; padding: 15px 0; margin: 15px 0; }
    .engagement-item:last-child { border-bottom: 1px solid #333; }
    .badge { background: #333; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin-right: 10px; }
    .delete-btn { background: #cc2222; padding: 8px 16px; font-size: 12px; }
    .stats { display: flex; gap: 20px; margin-top: 10px; }
    .stat { text-align: center; }
    .stat-val { font-size: 24px; font-weight: bold; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--muted); }
    .success { color: #00c853; }
    .error { color: #ff3d00; }
    .response-area { background: #111; padding: 15px; border-radius: 6px; margin-top: 15px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Story-wide Engagement Manager</h1>
    
    <div class="tabs">
      <button class="tab active" onclick="showTab('create')">Create New</button>
      <button class="tab" onclick="showTab('list')">Manage Existing</button>
    </div>

    <!-- CREATE TAB -->
    <div id="create-tab" class="card">
      <h2>Create Book-wide Engagement</h2>
      
      <div class="form-group">
        <label>Book ID</label>
        <input type="text" id="bookId" placeholder="Enter book ID (e.g., from your books list)">
      </div>

      <div class="form-group">
        <label>Type</label>
        <select id="engType">
          <option value="poll">Poll</option>
          <option value="prediction">Prediction</option>
          <option value="debate">Debate</option>
        </select>
      </div>

      <!-- POLL/PREDICTION FIELDS -->
      <div id="question-group">
        <div class="form-group">
          <label>Question</label>
          <textarea id="question" rows="3" placeholder="Ask readers something..."></textarea>
        </div>
        
        <div class="form-group">
          <label>Options (min 2, max 4)</label>
          <div id="options-container">
            <div class="option-row">
              <input type="text" class="opt-text" placeholder="Option text">
            </div>
            <div class="option-row">
              <input type="text" class="opt-text" placeholder="Option text">
            </div>
          </div>
          <button onclick="addOption()">+ Add Option</button>
          <small style="color: var(--muted); margin-left: 10px;">Max 4 options allowed</small>
        </div>
      </div>

      <!-- DEBATE FIELDS -->
      <div id="debate-group" class="hidden">
        <div class="form-group">
          <label>Motion</label>
          <textarea id="motion" rows="3" placeholder="State the debate motion..."></textarea>
        </div>
        
        <div class="form-group">
          <label>"For" Side Label</label>
          <input type="text" id="forText" placeholder="Default: For" maxlength="60">
        </div>
        
        <div class="form-group">
          <label>"Against" Side Label</label>
          <input type="text" id="againstText" placeholder="Default: Against" maxlength="60">
        </div>
      </div>

      <div class="form-group">
        <label>Expires (optional)</label>
        <input type="datetime-local" id="expiresAt">
        <small style="color: var(--muted);">Leave empty for never expires</small>
      </div>

      <button onclick="createEngagement()">➕ Create Engagement</button>
      
      <div id="create-response" class="response-area hidden"></div>
    </div>

    <!-- LIST TAB -->
    <div id="list-tab" class="card hidden">
      <h2>Manage Engagements</h2>
      
      <div class="form-group">
        <label>Book ID</label>
        <input type="text" id="listBookId" placeholder="Enter book ID to load engagements">
        <button onclick="loadEngagements()" style="margin-top: 10px;">🔄 Load</button>
      </div>

      <div id="engagements-list">
        <p style="color: var(--muted);">Enter a book ID and click Load to see existing engagements.</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    let authToken = '';

    // Simple auth prompt (replace with actual login in production)
    async function getAuth() {
      if (!authToken) {
        const token = prompt('Enter JWT token (authorization header):');
        if (!token) return null;
        authToken = token;
      }
      return `Bearer ${authToken}`;
    }

    async function showTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      
      event.target.classList.add('active');
      document.getElementById(`${tabName}-tab`).classList.remove('hidden');
      
      if (tabName === 'list') {
        loadEngagements();
      }
    }

    function addOption() {
      const container = document.getElementById('options-container');
      if (container.children.length >= 4) {
        alert('Maximum 4 options allowed');
        return;
      }
      const div = document.createElement('div');
      div.className = 'option-row';
      div.innerHTML = '<input type="text" class="opt-text" placeholder="Option text"><button class="delete-btn" onclick="this.parentElement.remove()">×</button>';
      container.appendChild(div);
    }

    async function createEngagement() {
      const response = document.getElementById('create-response');
      response.classList.remove('hidden');
      response.innerHTML = 'Creating...';

      try {
        const bookId = document.getElementById('bookId').value.trim();
        const type = document.getElementById('engType').value;
        const expiresAt = document.getElementById('expiresAt').value || null;

        if (!bookId) {
          response.innerHTML = '<span class="error">❌ Book ID required</span>';
          return;
        }

        const payload = { kind: type, expiresAt: expiresAt ? new Date(expiresAt).toISOString() : null };

        if (type === 'poll' || type === 'prediction') {
          const questions = document.querySelectorAll('#options-container .opt-text');
          if (questions.length < 2) {
            response.innerHTML = '<span class="error">❌ Minimum 2 options required</span>';
            return;
          }
          
          payload.question = document.getElementById('question').value.trim();
          payload.opts = Array.from(questions).map(q => ({ t: q.value.trim(), v: 0 })).filter(o => o.t);
          
          if (payload.opts.length < 2) {
            response.innerHTML = '<span class="error">❌ Minimum 2 non-empty options required</span>';
            return;
          }
        } else if (type === 'debate') {
          payload.motion = document.getElementById('motion').value.trim();
          payload.forText = document.getElementById('forText').value.trim() || 'For';
          payload.againstText = document.getElementById('againstText').value.trim() || 'Against';
          
          if (!payload.motion) {
            response.innerHTML = '<span class="error">❌ Motion required</span>';
            return;
          }
        }

        const auth = await getAuth();
        if (!auth) return;

        const res = await fetch(`${API_BASE}/author/books/${bookId}/engagement`, {
          method: 'POST',
          headers: {
            'Authorization': auth,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        if (res.ok) {
          response.innerHTML = `<span class="success">✅ Created successfully!</span>\n\n${JSON.stringify(data, null, 2)}`;
        } else {
          response.innerHTML = `<span class="error">❌ Error: ${data.error}</span>`;
        }

      } catch (err) {
        response.innerHTML = `<span class="error">❌ Network error: ${err.message}</span>`;
      }
    }

    async function loadEngagements() {
      const listDiv = document.getElementById('engagements-list');
      const bookId = document.getElementById('listBookId').value.trim();
      
      if (!bookId) {
        listDiv.innerHTML = '<p style="color: var(--muted);">Please enter a book ID.</p>';
        return;
      }

      listDiv.innerHTML = '<p>Loading...</p>';

      try {
        const auth = await getAuth();
        if (!auth) {
          listDiv.innerHTML = '<p style="color: var(--muted);">No authorization.</p>';
          return;
        }

        const res = await fetch(`${API_BASE}/author/books/${bookId}/engagement`, {
          headers: { 'Authorization': auth }
        });

        const data = await res.json();
        
        if (!res.ok) {
          listDiv.innerHTML = `<p style="color: var(--muted);">Error: ${data.error}</p>`;
          return;
        }

        if (!data.polls && !data.predictions && !data.debates) {
          listDiv.innerHTML = '<p style="color: var(--muted);">No engagements found for this book.</p>';
          return;
        }

        let html = '';
        
        // Polls
        if (data.polls && data.polls.length) {
          html += '<h3>📊 Polls</h3>';
          data.polls.forEach(p => {
            html += `<div class="engagement-item">
              <span class="badge">Poll</span>
              <strong>${p.q}</strong>
              <div class="stats">`;
            p.opts.forEach(o => {
              html += `<div class="stat"><div class="stat-val">${o.v}</div><div class="stat-label">${o.t}</div></div>`;
            });
            html += `</div>
              <button class="delete-btn" onclick="deleteEngagement('poll', '${p.id}')">Delete</button>
            </div>`;
          });
        }

        // Predictions
        if (data.predictions && data.predictions.length) {
          html += '<h3>🔮 Predictions</h3>';
          data.predictions.forEach(p => {
            html += `<div class="engagement-item">
              <span class="badge">Prediction</span>
              <strong>${p.q}</strong>
              <div class="stats">`;
            p.opts.forEach(o => {
              html += `<div class="stat"><div class="stat-val">${o.v}</div><div class="stat-label">${o.t}</div></div>`;
            });
            html += `</div>
              <button class="delete-btn" onclick="deleteEngagement('prediction', '${p.id}')">Delete</button>
            </div>`;
          });
        }

        // Debates
        if (data.debates && data.debates.length) {
          html += '<h3>⚖️ Debates</h3>';
          data.debates.forEach(d => {
            html += `<div class="engagement-item">
              <span class="badge">Debate</span>
              <strong>${d.motion}</strong>
              <div class="stats">
                <div class="stat"><div class="stat-val">${d.forV || 0}</div><div class="stat-label">${d.forText || 'For'}</div></div>
                <div class="stat"><div class="stat-val">${d.agV || 0}</div><div class="stat-label">${d.againstText || 'Against'}</div></div>
              </div>
              <button class="delete-btn" onclick="deleteEngagement('debate', '${d.id}')">Delete</button>
            </div>`;
          });
        }

        listDiv.innerHTML = html;

      } catch (err) {
        listDiv.innerHTML = `<p style="color: var(--muted);">Error: ${err.message}</p>`;
      }
    }

    async function deleteEngagement(kind, itemId) {
      if (!confirm(`Delete this ${kind}?`)) return;
      
      const bookId = document.getElementById('listBookId').value.trim();
      const auth = await getAuth();
      
      await fetch(`${API_BASE}/author/books/${bookId}/engagement/${kind}/${itemId}`, {
        method: 'DELETE',
        headers: { 'Authorization': auth }
      });
      
      loadEngagements();
    }

    // Toggle debate fields
    document.getElementById('engType').addEventListener('change', function() {
      const type = this.value;
      if (type === 'debate') {
        document.getElementById('question-group').classList.add('hidden');
        document.getElementById('debate-group').classList.remove('hidden');
      } else {
        document.getElementById('question-group').classList.remove('hidden');
        document.getElementById('debate-group').classList.add('hidden');
      }
    });

    // Pre-fill book ID for testing (set your default book ID here)
    document.getElementById('bookId').value = '';
    document.getElementById('listBookId').value = '';
  </script>
</body>
</html>
