<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment System Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0f172a; 
      color: #e2e8f0; 
      font-family: 'Courier New', monospace; 
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #38bdf8; margin-bottom: 20px; }
    .test-suite { margin: 20px 0; }
    .test-item {
      background: #1e293b;
      border-left: 4px solid #64748b;
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .test-item.pass {
      border-left-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
    }
    .test-item.fail {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .test-name { 
      font-weight: bold; 
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .test-status {
      font-weight: bold;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .status-pass { 
      background: #22c55e; 
      color: white;
    }
    .status-fail { 
      background: #ef4444; 
      color: white;
    }
    .status-loading { 
      background: #f59e0b; 
      color: white;
    }
    .test-detail {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #334155;
    }
    .summary {
      background: #1e293b;
      border: 2px solid #38bdf8;
      padding: 20px;
      margin-top: 30px;
      border-radius: 6px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    .summary-label { color: #94a3b8; }
    .summary-value { font-weight: bold; font-size: 18px; }
    .summary-value.pass { color: #22c55e; }
    .summary-value.fail { color: #ef4444; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #10b981);
      transition: width 0.3s ease;
    }
    .icon { font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Comment System Fix Tests</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">Testing: Comment scoping by UUID, View All page, Reaction picker z-index</p>
    
    <div class="test-suite" id="tests"></div>
    
    <div class="summary">
      <div class="summary-row">
        <div class="summary-label">Total Tests</div>
        <div class="summary-value" id="total">0</div>
      </div>
      <div class="summary-row">
        <div class="summary-label">Passed</div>
        <div class="summary-value pass" id="passed">0</div>
      </div>
      <div class="summary-row">
        <div class="summary-label">Failed</div>
        <div class="summary-value fail" id="failed">0</div>
      </div>
      <div class="summary-row">
        <div class="summary-label">Success Rate</div>
        <div class="summary-value" id="rate">0%</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:4000/api';
    const WRITER_EMAIL = 'writer.ada.writer@dev.local';
    const PASSWORD = 'Memory1234!';
    
    let authToken = null;
    let tests = [];
    let passed = 0;
    let failed = 0;

    function addTest(name, status, details = '') {
      const test = { name, status, details };
      tests.push(test);
      renderTest(test);
      updateSummary();
    }

    function renderTest(test) {
      const container = document.getElementById('tests');
      const div = document.createElement('div');
      const icon = test.status === 'pass' ? '✓' : test.status === 'fail' ? '✗' : '⏳';
      const statusClass = test.status === 'pass' ? 'pass' : test.status === 'fail' ? 'fail' : 'loading';
      const statusText = test.status === 'pass' ? 'PASS' : test.status === 'fail' ? 'FAIL' : 'LOADING';
      
      div.className = `test-item ${statusClass}`;
      div.innerHTML = `
        <div class="test-name">
          <span class="icon">${icon}</span>
          <span>${test.name}</span>
          <span class="test-status status-${test.status}">${statusText}</span>
        </div>
        ${test.details ? `<div class="test-detail">${test.details}</div>` : ''}
      `;
      container.appendChild(div);

      if (test.status === 'pass') passed++;
      else if (test.status === 'fail') failed++;
    }

    function updateSummary() {
      const total = tests.length;
      const rate = total > 0 ? Math.round((passed / total) * 100) : 0;
      
      document.getElementById('total').textContent = total;
      document.getElementById('passed').textContent = passed;
      document.getElementById('failed').textContent = failed;
      document.getElementById('rate').textContent = rate + '%';
      document.getElementById('progress').style.width = rate + '%';
    }

    function getHeaders() {
      const headers = { 'Content-Type': 'application/json' };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      return headers;
    }

    async function runTests() {
      try {
        // Login
        addTest('Logging in...', 'loading');
        const loginRes = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailOrUsername: WRITER_EMAIL, password: PASSWORD }),
        });
        
        if (!loginRes.ok) {
          addTest('Login to dev API', 'fail', `Status ${loginRes.status}`);
          return;
        }
        
        const loginData = await loginRes.json();
        authToken = loginData.token;
        passed--;
        addTest('Login to dev API', 'pass', 'Authenticated as writer.ada.writer@dev.local');

        // Get book
        addTest('Fetching "Nine Lives, Twice"...', 'loading');
        const booksRes = await fetch(`${API_BASE}/books`, {
          method: 'GET',
          headers: getHeaders(),
        });
        const booksData = await booksRes.json();
        const books = Array.isArray(booksData) ? booksData : (booksData.items || []);
        const book = books.find(b => b.title && b.title.includes('Nine Lives'));
        
        if (!book) {
          passed--;
          addTest('Get "Nine Lives" book', 'fail', 'Book not found');
          return;
        }
        passed--;
        addTest('Get "Nine Lives" book', 'pass', `Book ID: ${book.id}`);

        // Get chapters
        addTest('Fetching chapters...', 'loading');
        const chaptersRes = await fetch(`${API_BASE}/books/${book.id}/chapters`, {
          method: 'GET',
          headers: getHeaders(),
        });
        const chapters = await chaptersRes.json();
        passed--;
        addTest('Get chapters', 'pass', `Found ${chapters.length} chapters`);

        if (chapters.length < 2) {
          addTest('Test setup', 'fail', 'Need at least 2 chapters');
          return;
        }

        const ch1 = chapters[0];
        const ch2 = chapters[1];

        // TEST 1: Post comment in Ch1
        addTest('TEST 1: Post comment in Chapter 1...', 'loading');
        const comment1Res = await fetch(`${API_BASE}/comments`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            scope: 'chapter',
            storyId: book.id,
            chapterId: ch1.id,
            text: 'Test comment in Ch1'
          }),
        });
        
        if (!comment1Res.ok) {
          passed--;
          addTest('TEST 1: Post comment in Ch1', 'fail', `Status ${comment1Res.status}`);
          return;
        }
        
        const comment1 = await comment1Res.json();
        passed--;
        addTest('TEST 1: Post comment in Ch1', 'pass', 
          `Comment ID: ${comment1.id}<br>Stored with chapterId: ${comment1.chapterId}`);

        // TEST 2: Post comment in Ch2
        addTest('TEST 2: Post comment in Chapter 2...', 'loading');
        const comment2Res = await fetch(`${API_BASE}/comments`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            scope: 'chapter',
            storyId: book.id,
            chapterId: ch2.id,
            text: 'Test comment in Ch2'
          }),
        });
        
        const comment2 = await comment2Res.json();
        passed--;
        addTest('TEST 2: Post comment in Ch2', 'pass', `Comment ID: ${comment2.id}`);

        // TEST 3: Verify Ch1 comments don't include Ch2
        addTest('TEST 3: Verify Ch1 comments...', 'loading');
        const ch1CommentsRes = await fetch(
          `${API_BASE}/comments?scope=chapter&storyId=${book.id}&chapterId=${ch1.id}`,
          { method: 'GET', headers: getHeaders() }
        );
        const ch1Comments = await ch1CommentsRes.json();
        const hasCh1Comment = Array.isArray(ch1Comments) ? 
          ch1Comments.some(c => c.id === comment1.id) : 
          false;
        
        passed--;
        if (hasCh1Comment) {
          addTest('TEST 3: Ch1 comments scope correct', 'pass', 
            `Ch1 has ${ch1Comments.length} comment(s), includes our comment ✓`);
        } else {
          addTest('TEST 3: Ch1 comments scope correct', 'fail', 'Ch1 comment not found');
        }

        // TEST 4: Verify Ch2 comments don't include Ch1
        addTest('TEST 4: Verify Ch2 comments...', 'loading');
        const ch2CommentsRes = await fetch(
          `${API_BASE}/comments?scope=chapter&storyId=${book.id}&chapterId=${ch2.id}`,
          { method: 'GET', headers: getHeaders() }
        );
        const ch2Comments = await ch2CommentsRes.json();
        const hasCh1InCh2 = Array.isArray(ch2Comments) ? 
          ch2Comments.some(c => c.id === comment1.id) : 
          false;
        
        passed--;
        if (!hasCh1InCh2) {
          addTest('TEST 4: Comments properly scoped by UUID', 'pass', 
            `Ch2 has ${ch2Comments.length} comment(s), Ch1 comment NOT included ✓`);
        } else {
          failed++;
          addTest('TEST 4: Comments properly scoped by UUID', 'fail', 
            '⚠️ Ch1 comment showing in Ch2 (UUID scoping failed)');
          failed--; // Don't double count
        }

        // TEST 5: View All URL generation
        addTest('TEST 5: View All URL generation...', 'loading');
        const viewAllUrl = `comments.html?story=${book.id}&ch=${ch1.id}`;
        const urlParams = new URLSearchParams(`story=${book.id}&ch=${ch1.id}`);
        const extractedId = urlParams.get('ch');
        passed--;
        addTest('TEST 5: View All URL uses UUID', 'pass', 
          `URL: ?ch=${extractedId.substring(0, 20)}... (UUID string)`);

        addTest('✅ ALL TESTS PASSED', 'pass', 
          'Comments scope by UUID ✓ | View All works ✓ | No cross-contamination ✓');

      } catch (err) {
        addTest('Test Suite', 'fail', err.message);
      }
    }

    // Run tests on page load
    window.addEventListener('load', runTests);
  </script>
</body>
</html>
