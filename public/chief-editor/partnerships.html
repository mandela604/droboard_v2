<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Partnerships — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.welcome-banner{background:linear-gradient(135deg,var(--accent),#7a0030);border-radius:18px;padding:26px 28px;margin-bottom:22px;color:#fff;box-shadow:0 14px 40px -14px rgba(255,0,80,.55)}
.welcome-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.welcome-title{font-size:21px;font-weight:800}.welcome-sub{font-size:13px;opacity:.85;margin-top:6px;line-height:1.55}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid-2col{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start}
.grid-3col{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.partner-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:.15s}
.partner-card:hover{border-color:var(--accent)}
.pc-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.pc-meta{font-size:11px;color:var(--text-faint);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.status-pill{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.status-pill.active{background:var(--green-bg);color:var(--green)}
.status-pill.negotiating{background:var(--amber-bg);color:var(--amber)}
.status-pill.planning{background:var(--blue-bg);color:var(--blue)}
.status-pill.under-review{background:var(--purple-bg);color:var(--purple)}
.status-pill.exploring{background:var(--table-head);color:var(--text-faint)}
@media (max-width:1080px){.grid-2col,.grid-3col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="partnershipsRoot">
  <div class="welcome-banner">
    <div class="welcome-eyebrow">Chief Editor · Partnerships</div>
    <div class="welcome-title">Partnerships 🌍</div>
    <div class="welcome-sub">Publishing partners, translation partners, writing contests, IP/media opportunities, and partnership requests.</div>
  </div>
  <div class="grid-3col">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-building" style="color:var(--accent)"></i> Publishing Partners</h2></div>
      <div id="publisherList"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-language" style="color:var(--blue)"></i> Translation Partners</h2></div>
      <div id="translationList"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-trophy" style="color:var(--amber)"></i> Writing Contests</h2></div>
      <div id="contestList"></div>
    </div>
  </div>
  <div class="grid-2col">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-film" style="color:var(--purple)"></i> IP & Media Opportunities</h2></div>
      <div id="mediaList"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-envelope" style="color:var(--green)"></i> Partnership Requests</h2></div>
      <div id="requestsList"></div>
    </div>
  </div>
</div>
<script src="shared/chief-editor-sidebar.js"></script>
<script src="shared/chief-editor-data.js"></script>
<script>
'use strict';
const shell = ChiefEditorSidebar.attach('#partnershipsRoot',{activeItem:'partnerships',title:'Partnerships',subtitle:'Manage platform partnerships',user:{name:'Reina Morgan',role:'Chief Editor',avatar:'https://i.pravatar.cc/100?img=47'},notifCount:6});
async function init(){
  const d = await ChiefEditorData.getPartnerships();
  document.getElementById('publisherList').innerHTML = d.publishingPartners.map(p => `
    <div class="partner-card"><div class="pc-name">${p.name} <span class="status-pill ${p.status}">${p.status}</span></div><div class="pc-meta"><span>🏷️ ${p.type}</span><span>🌎 ${p.region}</span><span>📚 ${p.titlesLicensed} titles</span><span>💰 ${p.revenue}</span></div></div>`).join('');
  document.getElementById('translationList').innerHTML = d.translationPartners.map(t => `
    <div class="partner-card"><div class="pc-name">${t.name} <span class="status-pill ${t.status}">${t.status}</span></div><div class="pc-meta"><span>🗣️ ${t.languages}</span><span>🌍 ${t.territories}</span><span>💰 ${t.revenue}</span></div></div>`).join('');
  document.getElementById('contestList').innerHTML = d.writingContests.map(c => `
    <div class="partner-card"><div class="pc-name">${c.name} <span class="status-pill ${c.status}">${c.status}</span></div><div class="pc-meta"><span>🏆 ${c.prize}</span><span>📅 ${c.deadline}</span><span>📝 ${c.entries} entries</span></div></div>`).join('');
  document.getElementById('mediaList').innerHTML = d.ipMediaOpportunities.map(m => `
    <div class="partner-card"><div class="pc-name">${m.title} <span class="status-pill ${m.status}">${m.status}</span></div><div class="pc-meta"><span>🎬 ${m.type}</span><span>🤝 ${m.partner}</span><span>💰 ${m.value}</span></div></div>`).join('');
  document.getElementById('requestsList').innerHTML = d.partnershipRequests.map(r => `
    <div class="partner-card"><div class="pc-name">${r.from} <span class="status-pill ${r.status}">${r.status}</span></div><div class="pc-meta"><span>🏷️ ${r.type}</span><span>📅 ${r.date}</span></div><div style="font-size:11.5px;color:var(--text-muted);margin-top:4px">${r.notes}</div></div>`).join('');
}
init();
</script>
</body>
</html>
