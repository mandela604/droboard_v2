<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Senior Editors — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:16px}
.count-chip{font-size:11px;font-weight:700;color:var(--text-muted);background:var(--table-head);padding:5px 11px;border-radius:20px}
.mini-btn{font-size:10.5px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.mini-btn.danger:hover{background:var(--red);color:#fff}
.mini-btn.ghost{background:transparent}
.mini-btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tb-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;color:var(--text);width:100%}
.tb-search i{color:var(--text-faint);font-size:12px}
.tb-select{font-size:12px;font-weight:600;font-family:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;cursor:pointer;outline:none}
.ed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ed-card{border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:.15s}
.ed-card:hover{border-color:var(--accent);box-shadow:0 8px 22px -12px rgba(255,0,80,.35)}
.ed-top{display:flex;align-items:center;gap:12px}
.ed-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}
.ed-name-wrap{flex:1;min-width:0}
.ed-name{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ed-email{font-size:10.5px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ed-status{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.ed-status.on-track{background:var(--blue-bg);color:var(--blue)}
.ed-status.behind{background:var(--red-bg);color:var(--red)}
.ed-status.ahead{background:var(--green-bg);color:var(--green)}
.ed-status.pending{background:var(--amber-bg);color:var(--amber)}
.report-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.ed-dots-wrap{position:relative}
.ed-dots-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ed-dots-btn:hover{border-color:var(--accent);color:var(--accent)}
.ed-dots-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:170px;z-index:50;display:none;overflow:hidden}
.ed-dots-menu.open{display:block}
.ed-dots-item{width:100%;padding:9px 14px;border:none;background:none;font-size:12px;font-weight:600;font-family:inherit;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;transition:.12s}
.ed-dots-item:hover{background:rgba(255,0,80,.06);color:var(--accent)}
.ed-dots-item i{font-size:12px;width:16px;text-align:center}
.ed-dots-badge{margin-left:auto;font-size:10px;font-weight:800;background:var(--accent);color:#fff;padding:1px 7px;border-radius:20px}
.ed-meta-row{display:flex;gap:16px;flex-wrap:wrap;flex:1}
.ed-meta-item span{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:block;margin-bottom:2px}
.ed-meta-item b{font-size:12.5px;font-weight:700;color:var(--text)}
.ed-quota-label{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--text-muted);font-weight:700;margin-bottom:5px}
.ed-quota-track{height:6px;background:var(--table-head);border-radius:4px;overflow:hidden}
.ed-quota-fill{height:100%;border-radius:4px}
.ed-quota-fill.on-track{background:var(--blue)}
.ed-quota-fill.behind{background:var(--red)}
.ed-quota-fill.ahead{background:var(--green)}
.ed-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.ed-actions .mini-btn{flex:1;justify-content:center}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.pg-info{font-size:11px;color:var(--text-faint);font-weight:600}
.pg-controls{display:flex;align-items:center;gap:6px}
.pg-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:transparent;color:#fff}
.pg-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.pg-ellipsis{font-size:11px;color:var(--text-faint);padding:0 2px}
.empty-msg{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:12.5px;grid-column:1/-1}
.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px;grid-column:1/-1}
.pay-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pay-badge.fixed{background:var(--blue-bg);color:var(--blue)}
.pay-badge.revenue-share{background:var(--green-bg);color:var(--green)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,20,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px;border-top:1px solid var(--border)}
.quota-editor-info{display:flex;align-items:center;gap:12px;padding:12px;background:var(--input-bg);border-radius:10px;border:1px solid var(--input-border)}
.quota-editor-info img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.quota-editor-info .qei-name{font-size:13px;font-weight:700}
.quota-editor-info .qei-email{font-size:10.5px;color:var(--text-faint);margin-top:1px}
.form-row{margin-bottom:14px}
.form-row.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-label{font-size:11.5px;font-weight:700;color:var(--text);margin-bottom:6px;display:block}
.form-input,.form-select,.form-textarea{width:100%;font-family:inherit;font-size:12.5px;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:10px 12px;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:50px;line-height:1.5}
@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){.ed-grid{grid-template-columns:1fr}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.pagination{justify-content:center}}
</style>
</head>
<body>
<div id="dashRoot">
  <div class="grid-4" id="statCards"></div>
  <div class="panel">
    <div class="panel-head">
      <h2><i class="fas fa-users" style="color:var(--accent)"></i> All Senior Editors</h2>
      <span class="count-chip" id="resultCount"></span>
    </div>
    <div class="panel-sub">Editors sourcing and managing authors on your behalf. Quota is measured in author invites per month.</div>
    <div class="toolbar">
      <div class="tb-search"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name or email..."/></div>
      <select class="tb-select" id="statusFilter">
        <option value="all">All statuses</option>
        <option value="on-track">On track</option>
        <option value="behind">Behind</option>
        <option value="ahead">Ahead</option>
        <option value="pending">Pending</option>
      </select>
      <select class="tb-select" id="sortSelect">
        <option value="name">Sort: Name (A-Z)</option>
        <option value="authors-desc">Sort: Most authors</option>
        <option value="quota-asc">Sort: Furthest behind</option>
        <option value="pay-desc">Sort: Highest pay</option>
      </select>
      <button class="mini-btn primary" id="inviteBtn"><i class="fas fa-user-plus"></i> Invite Senior Editor</button>
    </div>
    <div class="ed-grid" id="edGrid"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading senior editors...</div></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Quota Modal -->
<div class="modal-overlay" id="quotaModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fas fa-bullseye" style="color:var(--accent)"></i> Manage Quota</h3>
      <button class="modal-close" id="quotaModalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="quota-editor-info" id="quotaEditorInfo"></div>
      <div class="form-row" style="margin-top:16px">
        <label class="form-label">Monthly invite target</label>
        <input class="form-input" id="quotaTarget" type="number" min="1" max="500"/>
      </div>
      <div class="form-row two-col">
        <div><label class="form-label">Invited so far</label><input class="form-input" id="quotaInvited" type="number" min="0" disabled style="opacity:.6"/></div>
        <div><label class="form-label">Remaining</label><input class="form-input" id="quotaRemaining" type="number" disabled style="opacity:.6"/></div>
      </div>
      <div class="form-row two-col">
        <div><label class="form-label">Deadline</label><input class="form-input" id="quotaDeadline" type="date"/></div>
        <div><label class="form-label">Payment type</label><select class="form-select" id="quotaPayType"><option value="fixed">Fixed Monthly Pay</option><option value="revenue-share">Revenue Share</option></select></div>
      </div>
      <div class="form-row" id="quotaFixedRow">
        <label class="form-label">Monthly pay amount</label><input class="form-input" id="quotaPay" type="text"/>
      </div>
      <div class="form-row" id="quotaRevenueRow" style="display:none">
        <label class="form-label">Revenue share percentage</label><input class="form-input" id="quotaRevenueShare" type="text" placeholder="e.g. 10%"/>
      </div>
      <div class="form-row">
        <label class="form-label">Status override</label>
        <select class="form-select" id="quotaStatus">
          <option value="on-track">On Track</option>
          <option value="behind">Behind</option>
          <option value="ahead">Ahead</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Note (optional)</label>
        <textarea class="form-textarea" id="quotaNote" rows="2" placeholder="Add a note for this editor..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="mini-btn ghost" id="quotaCancelBtn">Cancel</button>
      <button class="mini-btn primary" id="quotaSaveBtn"><i class="fas fa-check"></i> Save Changes</button>
    </div>
  </div>
</div>

<!-- Invite Modal -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3><i class="fas fa-user-plus" style="color:var(--accent)"></i> Invite Senior Editor</h3>
      <button class="modal-close" id="inviteModalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">Full name</label>
        <input class="form-input" id="invName" placeholder="e.g. Chioma Reddy"/>
        <div style="display:none;color:var(--red);font-size:10.5px;margin-top:5px" id="invNameErr">Name is required.</div>
      </div>
      <div class="form-row">
        <label class="form-label">Email address</label>
        <input class="form-input" id="invEmail" type="email" placeholder="e.g. chioma@example.com"/>
        <div style="display:none;color:var(--red);font-size:10.5px;margin-top:5px" id="invEmailErr">Enter a valid email.</div>
      </div>
      <div class="form-row two-col">
        <div><label class="form-label">Default quota target</label><input class="form-input" id="invTarget" type="number" min="1" max="500" value="50"/></div>
        <div><label class="form-label">Payment type</label><select class="form-select" id="invPayType"><option value="fixed">Fixed Monthly Pay</option><option value="revenue-share">Revenue Share</option></select></div>
      </div>
      <div class="form-row" id="invFixedRow">
        <label class="form-label">Monthly pay amount</label>
        <input class="form-input" id="invPay" type="text" placeholder="e.g. $3,200"/>
      </div>
      <div class="form-row" id="invRevenueRow" style="display:none">
        <label class="form-label">Revenue share percentage</label>
        <input class="form-input" id="invRevenueShare" type="text" placeholder="e.g. 10%"/>
      </div>
      <div class="form-row"><label class="form-label">Deadline</label><input class="form-input" id="invDeadline" type="date"/></div>
      <div class="form-row"><label class="form-label">Note (optional)</label><textarea class="form-textarea" id="invNote" rows="2" placeholder="A short welcome message..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="mini-btn ghost" id="inviteCancelBtn">Cancel</button>
      <button class="mini-btn primary" id="inviteSendBtn"><i class="fas fa-paper-plane"></i> Send Invite</button>
    </div>
  </div>
</div>

<script src="shared/chief-editor-sidebar.js"></script>
<script src="shared/chief-editor-data.js"></script>
<script src="shared/assign-authors-sheet.js"></script>
<script src="services/senior-editors-service.js"></script>
<script>SeniorEditorsService.init();</script>
</body>
</html>
