<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Senior Editors — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:16px}
.count-chip{font-size:11px;font-weight:700;color:var(--text-muted);background:var(--table-head);padding:5px 11px;border-radius:20px}

.mini-btn{font-size:10.5px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.mini-btn.danger:hover{background:var(--red);color:#fff}
.mini-btn.ghost{background:transparent}
.mini-btn:disabled{opacity:.4;cursor:default;pointer-events:none}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tb-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;color:var(--text);width:100%}
.tb-search i{color:var(--text-faint);font-size:12px}
.tb-select{font-size:12px;font-weight:600;font-family:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;cursor:pointer;outline:none}

.ed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ed-card{border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:.15s}
.ed-card:hover{border-color:var(--accent);box-shadow:0 8px 22px -12px rgba(255,0,80,.35)}
.ed-top{display:flex;align-items:center;gap:12px}
.ed-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}
.ed-name-wrap{flex:1;min-width:0}
.ed-name{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ed-email{font-size:10.5px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ed-status{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.ed-status.on-track{background:var(--blue-bg);color:var(--blue)}
.ed-status.behind{background:var(--red-bg);color:var(--red)}
.ed-status.ahead{background:var(--green-bg);color:var(--green)}
.report-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}

.ed-dots-wrap{position:relative}
.ed-dots-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ed-dots-btn:hover{border-color:var(--accent);color:var(--accent)}
.ed-dots-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:170px;z-index:50;display:none;overflow:hidden}
.ed-dots-menu.open{display:block}
.ed-dots-item{width:100%;padding:9px 14px;border:none;background:none;font-size:12px;font-weight:600;font-family:inherit;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;transition:.12s}
.ed-dots-item:hover{background:rgba(255,0,80,.06);color:var(--accent)}
.ed-dots-item i{font-size:12px;width:16px;text-align:center}
.ed-dots-badge{margin-left:auto;font-size:10px;font-weight:800;background:var(--accent);color:#fff;padding:1px 7px;border-radius:20px}

.ed-meta-row{display:flex;gap:16px;flex-wrap:wrap}
.ed-meta-item span{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:block;margin-bottom:2px}
.ed-meta-item b{font-size:12.5px;font-weight:700;color:var(--text)}

.ed-quota-label{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--text-muted);font-weight:700;margin-bottom:5px}
.ed-quota-track{height:6px;background:var(--table-head);border-radius:4px;overflow:hidden}
.ed-quota-fill{height:100%;border-radius:4px}
.ed-quota-fill.on-track{background:var(--blue)}
.ed-quota-fill.behind{background:var(--red)}
.ed-quota-fill.ahead{background:var(--green)}

.ed-actions{display:flex;gap:8px;margin-top:2px}
.ed-actions .mini-btn{flex:1;justify-content:center}

.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.pg-info{font-size:11px;color:var(--text-faint);font-weight:600}
.pg-controls{display:flex;align-items:center;gap:6px}
.pg-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);border-color:transparent;color:#fff}
.pg-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.pg-ellipsis{font-size:11px;color:var(--text-faint);padding:0 2px}

.empty-msg{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:12.5px;grid-column:1/-1}
.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px;grid-column:1/-1}

@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){.ed-grid{grid-template-columns:1fr}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.pagination{justify-content:center}}
</style>
</head>
<body>
<div id="dashRoot">
  <div class="grid-4" id="statCards"></div>
  <div class="panel">
    <div class="panel-head">
      <h2><i class="fas fa-users" style="color:var(--accent)"></i> All Senior Editors</h2>
      <span class="count-chip" id="resultCount">—</span>
    </div>
    <div class="panel-sub">Editors sourcing and managing authors on your behalf. Quota is measured in author invites per month.</div>
    <div class="toolbar">
      <div class="tb-search"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search by name or email…"/></div>
      <select class="tb-select" id="statusFilter">
        <option value="all">All statuses</option>
        <option value="on-track">On track</option>
        <option value="behind">Behind</option>
        <option value="ahead">Ahead</option>
      </select>
      <select class="tb-select" id="sortSelect">
        <option value="name">Sort: Name (A–Z)</option>
        <option value="authors-desc">Sort: Most authors</option>
        <option value="quota-asc">Sort: Furthest behind</option>
        <option value="pay-desc">Sort: Highest pay</option>
      </select>
      <button class="mini-btn primary" id="inviteBtn"><i class="fas fa-user-plus"></i> Invite Senior Editor</button>
    </div>
    <div class="ed-grid" id="edGrid"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading senior editors…</div></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script src="shared/chief-editor-sidebar.js"></script>
<script src="shared/chief-editor-data.js"></script>
<script src="shared/assign-authors-sheet.js"></script>
<script>
'use strict';
ChiefEditorSidebar.attach('#dashRoot',{
  activeItem:'senior-editors', title:'Senior Editors', subtitle:'Manage editors, monitor quotas, and review performance',
  user:{name:'Adaeze Bello',role:'Chief Editor',avatar:'https://i.pravatar.cc/100?img=9'}, notifCount:6,
  searchPlaceholder:'Search anything…',
});

var ICO_MAP={red:'var(--red)',amber:'var(--amber)',blue:'var(--blue)',purple:'var(--purple)',green:'var(--green)',accent:'var(--accent)'};
var BG_MAP={red:'var(--red-bg)',amber:'var(--amber-bg)',blue:'var(--blue-bg)',purple:'var(--purple-bg)',green:'var(--green-bg)',accent:'rgba(255,0,80,.1)'};
var PAGE_SIZE=6,ALL=[],filtered=[],currentPage=1,authorPool=[],assignments={};

function init(){
  ChiefEditorData.getSeniorEditors().then(function(d){ALL=d;return ChiefEditorData.getAuthorPool()}).then(function(d){authorPool=d;return ChiefEditorData.getAssignments()}).then(function(d){assignments=d;renderStatCards();applyFilters();bindToolbar()}).catch(function(e){console.error(e);document.getElementById('edGrid').innerHTML='<div class="empty-msg">Failed to load.</div>'});
}

function renderStatCards(){
  var behind=ALL.filter(function(e){return e.status==='behind'}).length;
  var totalAuthors=ALL.reduce(function(s,e){return s+e.authorsManaged},0);
  var stats=[
    {n:ALL.length,l:'Senior Editors',ico:'fa-people-group',cls:'accent'},
    {n:ALL.length-behind,l:'On Track or Ahead',ico:'fa-circle-check',cls:'blue'},
    {n:behind,l:'Behind Quota',ico:'fa-triangle-exclamation',cls:'red'},
    {n:totalAuthors,l:'Authors Managed',ico:'fa-user-tie',cls:'purple'}
  ];
  document.getElementById('statCards').innerHTML=stats.map(function(s){return '<div class="stat-card"><div class="stat-ico" style="background:'+BG_MAP[s.cls]+';color:'+ICO_MAP[s.cls]+'"><i class="fas '+s.ico+'"></i></div><div><div class="stat-num">'+s.n+'</div><div class="stat-lbl">'+s.l+'</div></div></div>'}).join('');
}

function applyFilters(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var sv=document.getElementById('statusFilter').value;
  var so=document.getElementById('sortSelect').value;
  filtered=ALL.filter(function(e){return(!q||e.name.toLowerCase().indexOf(q)!==-1||e.email.toLowerCase().indexOf(q)!==-1)&&(sv==='all'||e.status===sv)});
  filtered.sort(function(a,b){if(so==='name')return a.name.localeCompare(b.name);if(so==='authors-desc')return b.authorsManaged-a.authorsManaged;if(so==='quota-asc')return(a.invited/a.target)-(b.invited/b.target);if(so==='pay-desc')return parseFloat(b.monthlyPay.replace(/[^0-9.]/g,''))-parseFloat(a.monthlyPay.replace(/[^0-9.]/g,''));return 0});
  currentPage=1;renderGrid();
}

function renderGrid(){
  document.getElementById('resultCount').textContent=filtered.length;
  var box=document.getElementById('edGrid');
  if(!filtered.length){box.innerHTML='<div class="empty-msg"><i class="fas fa-user-slash" style="font-size:20px;margin-bottom:8px;display:block"></i>No senior editors match your filters.</div>';document.getElementById('pagination').innerHTML='';return}
  var tp=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(currentPage>tp)currentPage=tp;
  var start=(currentPage-1)*PAGE_SIZE;
  var items=filtered.slice(start,start+PAGE_SIZE);
  box.innerHTML=items.map(function(e){
    var pct=Math.min(100,Math.round(e.invited/e.target*100));
    var sl=e.status==='behind'?'Behind':e.status==='ahead'?'Ahead':'On track';
    var ac=(assignments[e.id]||[]).length;
    return '<div class="ed-card" data-id="'+e.id+'"><div class="ed-top"><img class="ed-avatar" src="'+e.avatar+'" alt="'+e.name+'"/><div class="ed-name-wrap"><div class="ed-name">'+e.name+(e.openReports>0?' <span class="report-dot" title="'+e.openReports+' open report(s)"></span>':'')+'</div><div class="ed-email">'+e.email+'</div></div><div class="ed-top-right"><span class="ed-status '+e.status+'">'+sl+'</span><div class="ed-dots-wrap"><button class="ed-dots-btn" data-eid="'+e.id+'" title="More actions"><i class="fas fa-ellipsis-vertical"></i></button><div class="ed-dots-menu" data-menu="'+e.id+'"><button class="ed-dots-item" data-eaction="assign" data-eid="'+e.id+'"><i class="fas fa-user-plus"></i> Assign Authors'+(ac?'<span class="ed-dots-badge">'+ac+'</span>':'')+'</button></div></div></div></div><div class="ed-meta-row"><div class="ed-meta-item"><span>Authors</span><b>'+e.authorsManaged+'</b></div><div class="ed-meta-item"><span>Assigned</span><b>'+ac+'</b></div><div class="ed-meta-item"><span>Joined</span><b>'+e.joined+'</b></div><div class="ed-meta-item"><span>Monthly Pay</span><b>'+e.monthlyPay+'</b></div><div class="ed-meta-item"><span>YTD Paid</span><b>'+e.ytdPaid+'</b></div></div><div><div class="ed-quota-label"><span>Invite quota \u2014 '+e.invited+'/'+e.target+'</span><span>Due '+e.deadline+'</span></div><div class="ed-quota-track"><div class="ed-quota-fill '+e.status+'" style="width:'+pct+'%"></div></div></div><div class="ed-actions"><button class="mini-btn ghost" data-action="view" data-id="'+e.id+'"><i class="fas fa-eye"></i> View Profile</button><button class="mini-btn" data-action="message" data-id="'+e.id+'"><i class="fas fa-comment-dots"></i> Message</button>'+(e.status==='behind'?'<button class="mini-btn danger" data-action="quota" data-id="'+e.id+'"><i class="fas fa-triangle-exclamation"></i> Take Action</button>':'<button class="mini-btn" data-action="quota" data-id="'+e.id+'"><i class="fas fa-bullseye"></i> Manage Quota</button>')+'</div></div>'
  }).join('');
  renderPagination(tp);bindGridEvents();
}

function renderPagination(tp){
  var box=document.getElementById('pagination');
  if(tp<=1){box.innerHTML='<div class="pg-info">Showing all '+filtered.length+' editor'+(filtered.length===1?'':'s')+'</div>';return}
  var start=(currentPage-1)*PAGE_SIZE+1,end=Math.min(filtered.length,currentPage*PAGE_SIZE),pb='';
  for(var p=1;p<=tp;p++)pb+='<button class="pg-btn'+(p===currentPage?' active':'')+'" data-page="'+p+'">'+p+'</button>';
  box.innerHTML='<div class="pg-info">Showing '+start+'\u2013'+end+' of '+filtered.length+' editors</div><div class="pg-controls"><button class="pg-btn" id="pgPrev" '+(currentPage===1?'disabled':'')+'><i class="fas fa-chevron-left"></i></button>'+pb+'<button class="pg-btn" id="pgNext" '+(currentPage===tp?'disabled':'')+'><i class="fas fa-chevron-right"></i></button></div>';
  document.getElementById('pgPrev').addEventListener('click',function(){currentPage--;renderGrid()});
  document.getElementById('pgNext').addEventListener('click',function(){currentPage++;renderGrid()});
  box.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){currentPage=parseInt(b.dataset.page,10);renderGrid()})});
}

function bindToolbar(){
  var sd;document.getElementById('searchInput').addEventListener('input',function(){clearTimeout(sd);sd=setTimeout(applyFilters,180)});
  document.getElementById('statusFilter').addEventListener('change',applyFilters);
  document.getElementById('sortSelect').addEventListener('change',applyFilters);
  document.getElementById('inviteBtn').addEventListener('click',function(){if(typeof window.toast==='function')window.toast('Opening invite form\u2026')});
}

function bindGridEvents(){
  var toast=typeof window.toast==='function'?window.toast:function(m){console.log(m)};
  document.querySelectorAll('.ed-dots-btn').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var id=btn.dataset.eid;document.querySelectorAll('.ed-dots-menu.open').forEach(function(m){if(m.dataset.menu!==id)m.classList.remove('open')});document.querySelector('.ed-dots-menu[data-menu="'+id+'"]').classList.toggle('open')})});
  document.addEventListener('click',function(e){if(!e.target.closest('.ed-dots-wrap'))document.querySelectorAll('.ed-dots-menu.open').forEach(function(m){m.classList.remove('open')})});
  document.querySelectorAll('[data-eaction="assign"]').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var eid=btn.dataset.eid,ed=ALL.find(function(x){return x.id===eid});if(!ed)return;document.querySelectorAll('.ed-dots-menu.open').forEach(function(m){m.classList.remove('open')});AssignAuthorsSheet.open({editorId:eid,editorName:ed.name,editorAvatar:ed.avatar,authorPool:authorPool,assignedIds:assignments[eid]||[],onSave:function(id,ids){assignments[id]=id;renderGrid();toast('Authors updated for '+ed.name)}})})});
  document.querySelectorAll('[data-action]').forEach(function(el){el.addEventListener('click',function(){var ed=ALL.find(function(x){return x.id===el.dataset.id});if(!ed)return;if(el.dataset.action==='view')toast('Opening '+ed.name+'\'s profile\u2026');else if(el.dataset.action==='message')toast('Opening message thread with '+ed.name+'\u2026');else if(el.dataset.action==='quota')toast('Opening quota options for '+ed.name+'\u2026')})});
}

init();
</script>
</body>
</html>
