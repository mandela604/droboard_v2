<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Author Contracts — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.welcome-banner{background:linear-gradient(135deg,var(--accent),#7a0030);border-radius:18px;padding:26px 28px;margin-bottom:22px;color:#fff;box-shadow:0 14px 40px -14px rgba(255,0,80,.55)}
.welcome-eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.welcome-title{font-size:21px;font-weight:800}.welcome-sub{font-size:13px;opacity:.85;margin-top:6px;line-height:1.55}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid-2col{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--hover)}
.status-pill{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.status-pill.active{background:var(--green-bg);color:var(--green)}
.status-pill.expiring{background:var(--amber-bg);color:var(--amber)}
.status-pill.pending{background:var(--blue-bg);color:var(--blue)}
.status-pill.awaiting-signature{background:var(--amber-bg);color:var(--amber)}
.status-pill.under-review{background:var(--purple-bg);color:var(--purple)}
.status-pill.draft{background:var(--table-head);color:var(--text-faint)}
.contract-card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.contract-card:hover{border-color:var(--accent)}
.cc-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.cc-meta{font-size:11px;color:var(--text-faint);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:1080px){.grid-2col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="contractsRoot">
  <div class="welcome-banner">
    <div class="welcome-eyebrow">Chief Editor · Author Contracts</div>
    <div class="welcome-title">Author Contracts 🤝</div>
    <div class="welcome-sub">Contract templates, active contracts, pending offers, and exclusivity settings.</div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2><i class="fas fa-file-contract" style="color:var(--accent)"></i> Contract Templates</h2></div>
    <table id="templatesTable"><thead><tr><th>Template</th><th>Type</th><th>Royalty</th><th>Ch. Price</th><th>Term</th><th>Used</th><th>Status</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="grid-2col">
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-file-signature" style="color:var(--green)"></i> Active Contracts</h2></div>
      <div id="activeContracts"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2><i class="fas fa-clock" style="color:var(--amber)"></i> Pending Offers</h2></div>
      <div id="pendingOffers"></div>
    </div>
  </div>
</div>
<script src="shared/chief-editor-sidebar.js"></script>
<script src="shared/chief-editor-data.js"></script>
<script src="services/author-contracts-service.js"></script>
<script>AuthorContractsService.init();</script>
</body>
</html>
