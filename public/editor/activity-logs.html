<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Activity Logs — Platform Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}.btn-add:hover{background:var(--accent-2)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}.stat-ico.green{background:var(--green-bg);color:var(--green)}.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}.stat-ico.purple{background:#ece9fb;color:#5b4bcf}html[data-theme="dark"] .stat-ico.blue{background:rgba(37,99,235,.18)}html[data-theme="dark"] .stat-ico.green{background:rgba(22,163,74,.18)}html[data-theme="dark"] .stat-ico.amber{background:rgba(217,119,6,.18)}html[data-theme="dark"] .stat-ico.purple{background:rgba(124,92,252,.18)}.stat-num{font-size:24px;font-weight:800;line-height:1}.stat-lbl{font-size:12.5px;color:var(--text-muted);font-weight:600}.stat-delta{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:20px}.stat-delta.down{color:var(--red);background:var(--red-bg)}
.filters-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tc-search{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:220px}.tc-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}.tc-search input::placeholder{color:var(--text-faint)}.tc-search i{color:var(--text-faint);font-size:12px}.fselect{position:relative}.fselect select{appearance:none;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 30px 9px 14px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}.fselect i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-faint);pointer-events:none}
.date-range{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-faint);white-space:nowrap;cursor:pointer}.btn-filters{display:flex;align-items:center;gap:7px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;font-family:inherit}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;background:var(--table-head);padding:12px 20px;white-space:nowrap}tbody td{padding:14px 20px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}tbody tr:hover{background:var(--hover)}.act-user{display:flex;align-items:center;gap:8px}.act-user img{width:24px;height:24px;border-radius:50%;object-fit:cover}.act-user span{font-weight:700}.act-action{font-weight:600}.act-type{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}.act-type.create{background:var(--green-bg);color:var(--green)}.act-type.update{background:var(--blue-bg);color:var(--blue)}.act-type.delete{background:var(--red-bg);color:var(--red)}.act-type.login{background:var(--amber-bg);color:var(--amber)}
html[data-theme="dark"] .act-type.create{background:rgba(22,163,74,.18)}html[data-theme="dark"] .act-type.update{background:rgba(37,99,235,.18)}html[data-theme="dark"] .act-type.delete{background:rgba(224,56,77,.18)}html[data-theme="dark"] .act-type.login{background:rgba(217,119,6,.18)}
.time-cell{font-size:12px;color:var(--text-muted)}.detail-cell{font-size:12px;color:var(--text-muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagination-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;gap:10px;border-top:1px solid var(--border)}.page-info{font-size:12px;color:var(--text-muted)}.page-info b{color:var(--text);font-weight:700}.page-btns{display:flex;align-items:center;gap:6px}.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.empty-row td{text-align:center;padding:46px 20px;color:var(--text-muted)}.empty-row i{font-size:26px;display:block;margin-bottom:10px}
@media (max-width:680px){.filters-row{flex-direction:column;align-items:stretch}.fselect select{width:100%}.page-hdr-row{flex-direction:column;align-items:stretch}.table-wrap{overflow:visible}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{border:1px solid var(--border);border-radius:12px;margin:0 14px 14px;padding:6px 4px}tbody td{border-top:none;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}tbody td[data-label]::before{content:attr(data-label);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);flex-shrink:0}.actions-cell{justify-content:flex-end;width:100%}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr-row"><div></div><button class="btn-add" onclick="toast('Exporting activity logs…')"><i class="fas fa-download"></i> Export Logs</button></div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-top"><div class="stat-ico blue"><i class="fas fa-list-check"></i></div><span class="stat-delta">+18% from last month</span></div><div class="stat-num">12,847</div><div class="stat-lbl">Total Activities</div></div>
<div class="stat-card"><div class="stat-top"><div class="stat-ico green"><i class="fas fa-circle-plus"></i></div><span class="stat-delta">+12% from last month</span></div><div class="stat-num">4,230</div><div class="stat-lbl">Creations</div></div>
<div class="stat-card"><div class="stat-top"><div class="stat-ico amber"><i class="fas fa-pen"></i></div><span class="stat-delta">+24% from last month</span></div><div class="stat-num">6,891</div><div class="stat-lbl">Updates</div></div>
<div class="stat-card"><div class="stat-top"><div class="stat-ico purple"><i class="fas fa-user"></i></div><span class="stat-delta">+342 active</span></div><div class="stat-num">1,726</div><div class="stat-lbl">Active Users</div></div>
</div>
<div class="filters-row">
<div class="tc-search"><i class="fas fa-magnifying-glass"></i><input id="tableSearch" placeholder="Search by user, action, or detail..."/></div>
<div class="fselect"><select id="actionFilter"><option value="">All Actions</option><option value="create">Create</option><option value="update">Update</option><option value="delete">Delete</option><option value="login">Login</option></select><i class="fas fa-chevron-down"></i></div>
<div class="date-range" onclick="toast('Date picker')">Date Range <i class="fas fa-calendar"></i></div>
<button class="btn-filters" onclick="toast('Filters')"><i class="fas fa-sliders"></i> Filters</button>
</div>
<div class="table-card">
<div class="table-wrap"><table><thead><tr><th>User</th><th>Action</th><th>Type</th><th>Details</th><th>IP Address</th><th>Timestamp</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="pagination-row"><div class="page-info" id="pageInfo">Showing <b>1</b> to <b>8</b> of <b>12,847</b> activities</div><div class="page-btns" id="pageBtns"></div></div></div>
</div>
<script src="shared/api.js"></script>
<script src="shared/story-modal.js"></script>
<script src="shared/dashboard-shell.js"></script>
<script src="activity-logs-enhanced.js"></script>
<script src="remaining-pages-enhanced.js"></script>
<script>
DroboardShell.attach('#dashboardRoot',{activeFile:'activity-logs.html',title:'Activity Logs',subtitle:'Track and monitor all platform activities and user actions',user:{name:'Reina Morgan',role:'General Editor',avatar:'https://i.pravatar.cc/100?img=47'},notifCount:8,searchPlaceholder:'Search by user, action, or detail...',mobileSearchTarget:'#tableSearch',onSearch:(v)=>{document.getElementById('tableSearch').value=v;refresh()}});
const LOGS=[
{user:'Reina Morgan',av:'https://i.pravatar.cc/100?img=47',action:'Approved contract CNTR-2026-00125',type:'update',detail:'Signed Exclusive Publishing Agreement for "Bound by the Ruthless Alpha"',ip:'192.168.1.42',time:'Jun 17, 2026 10:24 AM'},
{user:'System',av:'https://i.pravatar.cc/100?img=3',action:'Processed payout batch',type:'create',detail:'Monthly payout of $12,840 disbursed to 24 authors',ip:'—',time:'Jun 17, 2026 09:00 AM'},
{user:'Daniel Carter',av:'https://i.pravatar.cc/100?img=12',action:'Updated book status: Published',type:'update',detail:'"He Deleted Our Photos" status changed to Published',ip:'10.0.0.15',time:'Jun 16, 2026 04:15 PM'},
{user:'Sophia Bennett',av:'https://i.pravatar.cc/100?img=29',action:'Verified author: Sofia Lindqvist',type:'create',detail:'Author verification approved - Sofia Lindqvist',ip:'10.0.0.22',time:'Jun 16, 2026 02:30 PM'},
{user:'Reina Morgan',av:'https://i.pravatar.cc/100?img=47',action:'Created announcement',type:'create',detail:'New announcement: "Introducing Book Analytics"',ip:'192.168.1.42',time:'Jun 16, 2026 11:20 AM'},
{user:'Ethan Walker',av:'https://i.pravatar.cc/100?img=53',action:'Flagged content as inappropriate',type:'update',detail:'Flagged Chapter 12 in "The Ruthless CEO"',ip:'10.0.0.8',time:'Jun 15, 2026 09:45 AM'},
{user:'System',av:'https://i.pravatar.cc/100?img=3',action:'Automated backup completed',type:'create',detail:'Daily system backup completed successfully (2.4 GB)',ip:'—',time:'Jun 15, 2026 03:00 AM'},
{user:'Marcus Webb',av:'https://i.pravatar.cc/100?img=33',action:'Rejected author verification',type:'delete',detail:'Verification rejected for Tobias Bergman - insufficient documents',ip:'10.0.0.5',time:'Jun 14, 2026 01:10 PM'},
];
function refresh(){const q=document.getElementById('tableSearch').value.toLowerCase();const a=document.getElementById('actionFilter').value;let l=LOGS;if(a)l=l.filter(r=>r.type===a);if(q)l=l.filter(r=>r.user.toLowerCase().includes(q)||r.action.toLowerCase().includes(q)||r.detail.toLowerCase().includes(q));renderTable(l);document.getElementById('pageInfo').innerHTML=`Showing <b>${l.length?1:0}</b> to <b>${Math.min(8,l.length)}</b> of <b>12,847</b> activities`}
function renderTable(l){const b=document.getElementById('tableBody');if(!l.length){b.innerHTML=`<tr class="empty-row"><td colspan="6"><i class="fas fa-list-check"></i>No activities match.</td></tr>`;return}
b.innerHTML=l.slice(0,8).map(r=>`<tr><td data-label="User"><div class="act-user"><img src="${r.av}"/><span>${r.user}</span></div></td><td data-label="Action" class="act-action">${r.action}</td><td data-label="Type"><span class="act-type ${r.type}">${r.type.charAt(0).toUpperCase()+r.type.slice(1)}</span></td><td data-label="Details" class="detail-cell">${r.detail}</td><td data-label="IP Address" style="font-family:monospace;font-size:12px;color:var(--text-faint)">${r.ip}</td><td data-label="Timestamp" class="time-cell">${r.time}</td></tr>`).join('')}
document.getElementById('tableSearch').addEventListener('input',refresh);document.getElementById('actionFilter').addEventListener('change',refresh);
function renderPagination(){const w=document.getElementById('pageBtns');const p=[1,2,3,4,5,'...',1606];w.innerHTML=`<button class="pg-btn" disabled><i class="fas fa-chevron-left"></i></button>`+p.map(p=>p==='...'?`<span style="color:var(--text-faint);font-size:12px;padding:0 2px">…</span>`:`<button class="pg-btn${p===1?' active':''}" data-p="${p}">${p}</button>`).join('')+`<button class="pg-btn"><i class="fas fa-chevron-right"></i></button>`;w.querySelectorAll('[data-p]').forEach(b=>{b.addEventListener('click',()=>{w.querySelectorAll('.pg-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')})})}
renderPagination();refresh();
</script></body></html>
