<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Transaction History — Platform Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}.btn-add:hover{background:var(--accent-2)}
.filters-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tc-search{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:220px}.tc-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}.tc-search input::placeholder{color:var(--text-faint)}.tc-search i{color:var(--text-faint);font-size:12px}.fselect{position:relative}.fselect select{appearance:none;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 30px 9px 14px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}.fselect i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-faint);pointer-events:none}.date-range{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-faint);white-space:nowrap;cursor:pointer}.btn-filters{display:flex;align-items:center;gap:7px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;font-family:inherit}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;background:var(--table-head);padding:12px 20px;white-space:nowrap}tbody td{padding:14px 20px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}tbody tr:hover{background:var(--hover)}.amount{font-weight:800}.amount.credit{color:var(--green)}.amount.debit{color:var(--red)}.type-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}.type-pill.revenue{background:var(--green-bg);color:var(--green)}.type-pill.payout{background:var(--amber-bg);color:var(--amber)}.type-pill.refund{background:var(--red-bg);color:var(--red)}.type-pill.fee{background:var(--blue-bg);color:var(--blue)}.type-pill.adjustment{background:#ece9fb;color:#5b4bcf}
html[data-theme="dark"] .type-pill.revenue{background:rgba(22,163,74,.18)}html[data-theme="dark"] .type-pill.payout{background:rgba(217,119,6,.18)}html[data-theme="dark"] .type-pill.refund{background:rgba(224,56,77,.18)}html[data-theme="dark"] .type-pill.fee{background:rgba(37,99,235,.18)}html[data-theme="dark"] .type-pill.adjustment{background:rgba(124,92,252,.18)}
.pagination-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;gap:10px;border-top:1px solid var(--border)}.page-info{font-size:12px;color:var(--text-muted)}.page-info b{color:var(--text);font-weight:700}.page-btns{display:flex;align-items:center;gap:6px}.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.act-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;cursor:pointer}.act-btn:hover{color:var(--accent);border-color:var(--accent)}.actions-cell{display:flex;align-items:center;gap:6px}
.empty-row td{text-align:center;padding:46px 20px;color:var(--text-muted)}.empty-row i{font-size:26px;display:block;margin-bottom:10px}
@media (max-width:680px){.filters-row{flex-direction:column;align-items:stretch}.fselect select{width:100%}.page-hdr-row{flex-direction:column;align-items:stretch}.table-wrap{overflow:visible}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{border:1px solid var(--border);border-radius:12px;margin:0 14px 14px;padding:6px 4px}tbody td{border-top:none;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}tbody td[data-label]::before{content:attr(data-label);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);flex-shrink:0}.actions-cell{justify-content:flex-end;width:100%}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr-row"><div></div><button class="btn-add" onclick="toast('Exporting transaction log…')"><i class="fas fa-download"></i> Export CSV</button></div>
<div class="filters-row">
<div class="tc-search"><i class="fas fa-magnifying-glass"></i><input id="tableSearch" placeholder="Search by ID, description, or user..."/></div>
<div class="fselect"><select id="typeSelect"><option value="">All Types</option><option value="revenue">Revenue</option><option value="payout">Payout</option><option value="refund">Refund</option><option value="fee">Fee</option><option value="adjustment">Adjustment</option></select><i class="fas fa-chevron-down"></i></div>
<div class="date-range" onclick="toast('Date picker')">Start <i class="fas fa-arrow-right" style="font-size:9px"></i> End <i class="fas fa-calendar"></i></div>
<button class="btn-filters" onclick="toast('Filters')"><i class="fas fa-sliders"></i> Filters</button>
</div>
<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Transaction ID</th><th>Description</th><th>Type</th><th>Amount</th><th>User</th><th>Date</th><th>Actions</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="pagination-row"><div class="page-info" id="pageInfo">Showing <b>1</b> to <b>8</b> of <b>2,450</b> transactions</div><div class="page-btns" id="pageBtns"></div></div></div>
</div>
<script src="shared/dashboard-shell.js"></script>
<script src="services/transaction-history-service.js"></script><script>TransactionHistoryService.init();</script></body></html>
