<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Book Management — Droboard Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page{padding:24px 28px 60px;max-width:1500px}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-height:120px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-ico{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px}.stat-ico.purple{background:#efe7fd;color:var(--accent)}.stat-ico.green{background:var(--green-bg);color:var(--green)}.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}.stat-ico.red{background:var(--red-bg);color:var(--red)}.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}html[data-theme="dark"] .stat-ico.purple{background:rgba(124,58,237,.18)}html[data-theme="dark"] .stat-ico.green{background:rgba(22,163,74,.18)}html[data-theme="dark"] .stat-ico.amber{background:rgba(217,119,6,.18)}html[data-theme="dark"] .stat-ico.red{background:rgba(220,38,38,.18)}html[data-theme="dark"] .stat-ico.blue{background:rgba(37,99,235,.18)}.stat-num{font-size:28px;font-weight:800;line-height:1}.stat-lbl{font-size:13px;color:var(--text-muted);font-weight:600}
.filters-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filt-search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px}.filt-search input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}.filt-search input::placeholder{color:var(--text-faint)}.filt-search i{color:var(--text-faint);font-size:13px}.filt-select{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text);position:relative}.filt-select select{appearance:none;border:none;background:none;outline:none;color:var(--text);font-size:12.5px;font-weight:600;font-family:inherit;padding-right:14px;cursor:pointer}.filt-select i{color:var(--text-faint);font-size:10px;position:absolute;right:11px;pointer-events:none}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.35);white-space:nowrap;cursor:pointer;font-family:inherit}.btn-add:hover{background:var(--accent-2)}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:16px;overflow:hidden}.tabs-row{display:flex;align-items:center;gap:26px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}.tabs-row::-webkit-scrollbar{display:none}.tab-item{display:flex;align-items:center;gap:7px;padding-bottom:14px;font-size:13px;font-weight:700;color:var(--text-muted);white-space:nowrap;border-bottom:2.5px solid transparent;flex-shrink:0;cursor:pointer;transition:.15s}.tab-item:hover{color:var(--text)}.tab-item.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-count{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--text-muted)}.tab-item.active .tab-count{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:860px}thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;background:var(--table-head);padding:13px 20px;white-space:nowrap}tbody td{padding:14px 20px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}tbody tr{transition:.1s}tbody tr:hover{background:var(--hover)}.book-cell{display:flex;align-items:center;gap:12px}.book-cover{width:42px;height:56px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.18);background:#1a1a2e}.book-cover img{width:100%;height:100%;object-fit:cover}.book-title{font-weight:700;font-size:13px;line-height:1.3}.book-id{font-size:11px;color:var(--text-faint);margin-top:2px}.author-cell{display:flex;align-items:center;gap:9px}.author-cell img{width:30px;height:30px;border-radius:50%;object-fit:cover}.author-name{font-weight:600;font-size:12.5px}.cat-main{font-weight:600;font-size:12.5px}.cat-sub{font-size:11px;color:var(--text-muted);margin-top:1px}.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}.status-pill .dot{width:6px;height:6px;border-radius:50%}.status-pill.published{background:var(--green-bg);color:var(--green)}.status-pill.published .dot{background:var(--green)}.status-pill.draft{background:var(--blue-bg);color:var(--blue)}.status-pill.draft .dot{background:var(--blue)}.status-pill.review{background:var(--amber-bg);color:var(--amber)}.status-pill.review .dot{background:var(--amber)}.status-pill.flagged{background:var(--red-bg);color:var(--red)}.status-pill.flagged .dot{background:var(--red)}html[data-theme="dark"] .status-pill.published{background:rgba(22,163,74,.16)}html[data-theme="dark"] .status-pill.draft{background:rgba(37,99,235,.16)}html[data-theme="dark"] .status-pill.review{background:rgba(217,119,6,.16)}html[data-theme="dark"] .status-pill.flagged{background:rgba(220,38,38,.16)}.views-cell{font-weight:700;color:var(--green)}.muted-cell{color:var(--text-faint)}.actions-cell{display:flex;gap:6px}.act-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:.15s}.act-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}.empty-row td{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:13px}.empty-row i{display:block;font-size:28px;margin-bottom:8px;color:var(--text-faint)}
.pagination-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex-wrap:wrap;gap:10px}.page-info{font-size:12px;color:var(--text-muted)}.page-info b{color:var(--text);font-weight:700}.page-btns{display:flex;align-items:center;gap:6px}.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-family:inherit}.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}.pg-btn:disabled{opacity:.4;cursor:default}.pg-dots{color:var(--text-faint);font-size:12px;padding:0 2px}
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.filters-card{flex-direction:column;align-items:stretch}.filt-select,.btn-add{width:100%;justify-content:center}.filt-select select{flex:1}.table-wrap{overflow:visible}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{border:1px solid var(--border);border-radius:12px;margin:0 14px 14px;padding:6px 4px}tbody tr:hover{background:var(--card)}tbody td{border-top:none;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px}tbody td[data-label]::before{content:attr(data-label);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);flex-shrink:0}.book-cell,.author-cell{flex:1;justify-content:flex-start}td[data-label="Book Details"]{align-items:flex-start}td[data-label="Book Details"]::before{display:none}.actions-cell{justify-content:flex-end;width:100%}}@media(max-width:420px){.stats-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="dashboardRoot">
<div class="page">

  <div class="stats-grid" id="statsGrid"></div>

  <div class="filters-card">
    <div class="filt-search"><i class="fas fa-magnifying-glass"></i><input id="tableSearch" placeholder="Search by book title, author, or ID..."/></div>
    <div class="filt-select"><select id="fCategory"><option>All Categories</option></select><i class="fas fa-chevron-down"></i></div>
    <div class="filt-select"><select id="fGenre"><option>All Genres</option></select><i class="fas fa-chevron-down"></i></div>
    <div class="filt-select"><select id="fStatus"><option>All Status</option><option>Published</option><option>Draft</option><option>Under Review</option><option>Flagged</option></select><i class="fas fa-chevron-down"></i></div>
    <button class="btn-add" id="addBookBtn"><i class="fas fa-plus"></i> Add New Book</button>
  </div>

  <div class="table-card">
    <div class="tabs-row" id="tabsRow">
      <div class="tab-item active" data-tab="all">All Books <span class="tab-count" id="countAll">0</span></div>
      <div class="tab-item" data-tab="Published">Published <span class="tab-count">0</span></div>
      <div class="tab-item" data-tab="Draft">Draft <span class="tab-count">0</span></div>
      <div class="tab-item" data-tab="Under Review">Under Review <span class="tab-count">0</span></div>
      <div class="tab-item" data-tab="Flagged">Flagged <span class="tab-count">0</span></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Book Details</th><th>Author</th><th>Category / Genre</th><th>Status</th><th>Views</th><th>Added On</th><th>Actions</th></tr></thead><tbody id="tableBody"></tbody></table></div>
    <div class="pagination-row"><div class="page-info" id="pageInfo">Loading...</div><div class="page-btns" id="pageBtns"></div></div>
  </div>

</div>
</div>

<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9999"></div>
<style>#toast.show{opacity:1}</style>

<script src="../data/editor-demo-data.js"></script>
<script src="shared/dashboard-shell.js"></script>
<script src="book-management-service.js"></script>
<script>
DroboardShell.attach('#dashboardRoot',{
  activeFile:'book-management.html',
  title:'Book Management',
  subtitle:'Manage and organize all books on your platform',
  user:{name:'Reina Morgan',role:'General Editor',avatar:'https://i.pravatar.cc/100?img=47'},
  notifCount:8,
  searchPlaceholder:'Search by book title, author, or ID...',
  mobileSearchTarget:'#tableSearch',
  onSearch:function(v){document.getElementById('tableSearch').value=v;BookManagement.refresh();}
});

/* Populate category/genre filters from demo data */
(function(){
  var D=window.EditorDemo||{};
  var cats={};var genres={};
  (D.BOOKS||[]).forEach(function(b){
    if(b.cat)cats[b.cat]=1;
    if(b.genre)genres[b.genre]=1;
  });
  var catSel=document.getElementById('fCategory');
  Object.keys(cats).sort().forEach(function(c){var o=document.createElement('option');o.textContent=c;o.value=c;catSel.appendChild(o);});
  var genSel=document.getElementById('fGenre');
  Object.keys(genres).sort().forEach(function(g){var o=document.createElement('option');o.textContent=g;o.value=g;genSel.appendChild(o);});
})();
</script>
</body>
</html>
