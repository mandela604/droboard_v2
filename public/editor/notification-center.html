<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Notification Center — Platform Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}.btn-add:hover{background:var(--accent-2)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}.stat-ico.pink{background:#ffe1eb;color:var(--accent)}.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}.stat-ico.green{background:var(--green-bg);color:var(--green)}.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}html[data-theme="dark"] .stat-ico.pink{background:rgba(255,0,80,.16)}html[data-theme="dark"] .stat-ico.amber{background:rgba(217,119,6,.18)}html[data-theme="dark"] .stat-ico.green{background:rgba(22,163,74,.18)}html[data-theme="dark"] .stat-ico.blue{background:rgba(37,99,235,.18)}.stat-num{font-size:24px;font-weight:800;line-height:1}.stat-lbl{font-size:12.5px;color:var(--text-muted);font-weight:600}.stat-delta{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:20px}
.filters-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tc-search{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;flex:1;min-width:220px}.tc-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}.tc-search input::placeholder{color:var(--text-faint)}.tc-search i{color:var(--text-faint);font-size:12px}.fselect{position:relative}.fselect select{appearance:none;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 30px 9px 14px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}.fselect i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-faint);pointer-events:none}
.notif-list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.notif-item{display:flex;align-items:flex-start;gap:13px;padding:15px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}.notif-item:last-child{border-bottom:none}.notif-item:hover{background:var(--hover)}.notif-item.unread{background:var(--accent-soft)}.notif-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}.notif-ico.pink{background:#ffe1eb;color:var(--accent)}.notif-ico.blue{background:var(--blue-bg);color:var(--blue)}.notif-ico.amber{background:var(--amber-bg);color:var(--amber)}.notif-ico.green{background:var(--green-bg);color:var(--green)}.notif-ico.red{background:var(--red-bg);color:var(--red)}.notif-body{flex:1;min-width:0}.notif-title{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:2px}.notif-desc{font-size:11.5px;color:var(--text-muted);line-height:1.45}.notif-time{font-size:10.5px;color:var(--text-faint);margin-top:4px}.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px}
@media (max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:680px){.filters-row{flex-direction:column;align-items:stretch}.fselect select{width:100%}}@media (max-width:420px){.stats-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr-row"><div></div><button class="btn-add" onclick="toast('Creating new notification…')"><i class="fas fa-plus"></i> New Notification</button></div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-top"><div class="stat-ico pink"><i class="fas fa-bell"></i></div><span class="stat-delta">+24 from yesterday</span></div><div class="stat-num">342</div><div class="stat-lbl">Total Notifications</div></div>
<div class="stat-card"><div class="stat-top"><div class="stat-ico amber"><i class="fas fa-envelope"></i></div><span class="stat-delta">+8 since last hour</span></div><div class="stat-num">27</div><div class="stat-lbl">Unread</div></div>
<div class="stat-card"><div class="stat-top"><div class="stat-ico green"><i class="fas fa-paper-plane"></i></div><span class="stat-delta">+12% from last week</span></div><div class="stat-num">89</div><div class="stat-lbl">Sent This Week</div></div>
<div class="stat-card"><div class="stat-top"><div class="stat-ico blue"><i class="fas fa-flag"></i></div><span class="stat-delta">+5 urgent</span></div><div class="stat-num">6</div><div class="stat-lbl">Urgent Alerts</div></div>
</div>
<div class="filters-row">
<div class="tc-search"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search notifications..."/></div>
<div class="fselect"><select id="typeFilter"><option value="">All Types</option><option>System</option><option>Contract</option><option>Review</option><option>Payment</option><option>Author</option><option>Security</option></select><i class="fas fa-chevron-down"></i></div>
<button class="btn-add" style="background:var(--input-bg);color:var(--text);box-shadow:none" onclick="toast('Marking all as read…')"><i class="fas fa-check-double"></i> Mark All Read</button>
</div>
<div class="notif-list" id="notifList"></div>
</div>
<script src="shared/api.js"></script>
<script src="shared/story-modal.js"></script>
<script src="shared/dashboard-shell.js"></script>
<script src="remaining-pages-enhanced.js"></script>
<script src="services/notification-center-service.js"></script>
<script>NotificationCenterService.init();</script></body></html>
