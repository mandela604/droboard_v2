<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Book Review Center — Droboard Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}.stat-ico.green{background:var(--green-bg);color:var(--green)}.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}.stat-ico.red{background:var(--red-bg);color:var(--red)}.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}html[data-theme="dark"] .stat-ico.green{background:rgba(22,163,74,.18)}html[data-theme="dark"] .stat-ico.amber{background:rgba(217,119,6,.18)}html[data-theme="dark"] .stat-ico.red{background:rgba(220,38,38,.18)}html[data-theme="dark"] .stat-ico.blue{background:rgba(37,99,235,.18)}.stat-delta{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:20px}html[data-theme="dark"] .stat-delta{background:rgba(22,163,74,.18)}.stat-num{font-size:24px;font-weight:800;line-height:1}.stat-lbl{font-size:12.5px;color:var(--text-muted);font-weight:600}
.filters-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filt-search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px}.filt-search input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}.filt-search input::placeholder{color:var(--text-faint)}.filt-search i{color:var(--text-faint);font-size:13px}.filt-select{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text);position:relative}.filt-select select{appearance:none;border:none;background:none;outline:none;color:var(--text);font-size:12.5px;font-weight:600;font-family:inherit;padding-right:14px;cursor:pointer}.filt-select i{color:var(--text-faint);font-size:10px;position:absolute;right:11px;pointer-events:none}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.tabs-row{display:flex;align-items:center;gap:26px;padding:16px 20px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}.tabs-row::-webkit-scrollbar{display:none}.tab-item{display:flex;align-items:center;gap:7px;padding-bottom:14px;font-size:13px;font-weight:700;color:var(--text-muted);white-space:nowrap;border-bottom:2.5px solid transparent;flex-shrink:0;cursor:pointer;transition:.15s}.tab-item:hover{color:var(--text)}.tab-item.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-count{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--text-muted)}.tab-item.active .tab-count{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:860px}thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;background:var(--table-head);padding:13px 20px;white-space:nowrap}tbody td{padding:14px 20px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}tbody tr:hover{background:var(--hover)}.cover{width:42px;height:56px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.18);background:#1a1a2e}.cover img{width:100%;height:100%;object-fit:cover}.title{font-weight:700;font-size:13px;line-height:1.3}.id{font-size:11px;color:var(--text-faint);margin-top:2px}.author-cell{display:flex;align-items:center;gap:9px}.author-cell img{width:30px;height:30px;border-radius:50%;object-fit:cover}.rating-cell{font-weight:700}.cat-main{font-weight:600;font-size:12.5px}.cat-sub{font-size:11px;color:var(--text-muted);margin-top:1px}.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}.status-pill .dot{width:6px;height:6px;border-radius:50%}.status-pill.approved{background:var(--green-bg);color:var(--green)}.status-pill.approved .dot{background:var(--green)}.status-pill.pending{background:var(--amber-bg);color:var(--amber)}.status-pill.pending .dot{background:var(--amber)}.status-pill.reviewing{background:var(--blue-bg);color:var(--blue)}.status-pill.reviewing .dot{background:var(--blue)}.status-pill.rejected{background:var(--red-bg);color:var(--red)}.status-pill.rejected .dot{background:var(--red)}html[data-theme="dark"] .status-pill.approved{background:rgba(22,163,74,.16)}html[data-theme="dark"] .status-pill.pending{background:rgba(217,119,6,.16)}html[data-theme="dark"] .status-pill.reviewing{background:rgba(37,99,235,.16)}html[data-theme="dark"] .status-pill.rejected{background:rgba(220,38,38,.16)}.likes-cell{font-weight:600}.muted-cell{color:var(--text-faint)}.actions-cell{display:flex;align-items:center;gap:6px}.act-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;cursor:pointer;transition:.15s;font-family:inherit}.act-btn:hover{color:var(--accent);border-color:var(--accent)}.act-btn.approve{color:var(--green);border-color:var(--green-bg)}.act-btn.reject{color:var(--red);border-color:var(--red-bg)}.empty-row td{text-align:center;padding:46px 20px;color:var(--text-muted)}.empty-row i{font-size:26px;display:block;margin-bottom:10px;color:var(--text-faint)}
.pagination-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex-wrap:wrap;gap:10px}.page-info{font-size:12px;color:var(--text-muted)}.page-info b{color:var(--text);font-weight:700}.page-btns{display:flex;align-items:center;gap:6px}.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-family:inherit}.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}.pg-btn:disabled{opacity:.4;cursor:default}.pg-dots{color:var(--text-faint);font-size:12px;padding:0 2px}
@media (max-width:1200px){.stats-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:680px){.filters-card{flex-direction:column;align-items:stretch}.filt-select{width:100%}.table-wrap{overflow:visible}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{border:1px solid var(--border);border-radius:12px;margin:0 14px 14px;padding:6px 4px}tbody tr:hover{background:var(--card)}tbody td{border-top:none;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px}tbody td[data-label]::before{content:attr(data-label);font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);flex-shrink:0}.actions-cell{justify-content:flex-end;width:100%}}@media (max-width:420px){.stats-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="dashboardRoot">
<div class="stats-grid" id="statsGrid"></div>
<div class="filters-card">
<div class="filt-search"><i class="fas fa-magnifying-glass"></i><input id="tableSearch" placeholder="Search by title, author, or category..."/></div>
<div class="filt-select"><select id="fCategory"><option>All Categories</option><option>Romance</option><option>Urban</option><option>Fantasy</option></select><i class="fas fa-chevron-down"></i></div>
<div class="filt-select"><select id="fStatus"><option>All Status</option><option>Pending</option><option>In Review</option><option>Approved</option><option>Rejected</option></select><i class="fas fa-chevron-down"></i></div>
<button class="filt-select" style="cursor:pointer" onclick="toast('Date filter opened')"><i class="fas fa-calendar"></i> Date Range</button>
</div>
<div class="table-card">
<div class="tabs-row"><div class="tab-item active" data-tab="all">All Reviews <span class="tab-count" id="countAll">0</span></div><div class="tab-item" data-tab="pending">Pending <span class="tab-count">0</span></div><div class="tab-item" data-tab="reviewing">In Review <span class="tab-count">0</span></div><div class="tab-item" data-tab="approved">Approved <span class="tab-count">0</span></div><div class="tab-item" data-tab="rejected">Rejected <span class="tab-count">0</span></div></div>
<div class="table-wrap"><table><thead><tr><th>Book Details</th><th>Author</th><th>Category</th><th>Rating</th><th>Status</th><th>Likes</th><th>Actions</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="pagination-row"><div class="page-info" id="pageInfo">Loading...</div><div class="page-btns" id="pageBtns"></div></div>
</div></div>
<script src="shared/api.js"></script>
<script src="shared/story-modal.js"></script>
<script src="shared/dashboard-shell.js"></script>
<script src="remaining-pages-enhanced.js"></script>
<script>
DroboardShell.attach('#dashboardRoot',{activeFile:'book-review-center.html',title:'Book Review Center',subtitle:'Review and approve submitted books',user:{name:'Reina Morgan',role:'General Editor',avatar:'https://i.pravatar.cc/100?img=47'},notifCount:8,searchPlaceholder:'Search by title, author, or category...',mobileSearchTarget:'#tableSearch',onSearch:(v)=>{document.getElementById('tableSearch').value=v;refresh()}});
let activeTab='all',currentPage=1;const PER_PAGE=8;let allReviews=[];
function statusPillHtml(s){const c={approved:'approved',pending:'pending',reviewing:'reviewing',rejected:'rejected'}[s]||'pending';return'<span class="status-pill '+c+'"><span class="dot"></span>'+s.charAt(0).toUpperCase()+s.slice(1)+'</span>'}
async function refresh(){try{const q=document.getElementById('tableSearch').value.trim(),cat=document.getElementById('fCategory').value,stat=document.getElementById('fStatus').value;const res=await DroboardAPI.getReviews({tab:activeTab,search:q,category:cat,genre:stat==='All Status'?null:stat,status:stat==='All Status'?null:stat});allReviews=res.items;renderTable();renderStats();renderTabs()}catch(e){toast('Error: '+e.message)}}
function renderTable(){const body=document.getElementById('tableBody'),total=allReviews.length,tp=Math.max(1,Math.ceil(total/PER_PAGE));if(currentPage>tp)currentPage=tp;const start=(currentPage-1)*PER_PAGE,page=allReviews.slice(start,start+PER_PAGE);if(!page.length){body.innerHTML='<tr class="empty-row"><td colspan="7"><i class="fas fa-inbox"></i>No reviews match this filter.</td></tr>'}else{body.innerHTML=page.map(r=>'<tr><td data-label="Book Details"><div style="display:flex;align-items:center;gap:12px"><div class="cover"><img src="'+r.img+'" alt=""/></div><div><div class="title">'+r.title+'</div><div class="id">ID: '+r.id+'</div></div></div></td><td data-label="Author"><div class="author-cell"><img src="'+r.writerAv+'" alt=""/><span style="font-weight:600;font-size:12.5px">'+r.writer+'</span></div></td><td data-label="Category" class="cat-main">'+r.cat+'</td><td data-label="Rating" class="rating-cell">★ '+r.rating+'</td><td data-label="Status">'+statusPillHtml(r.status)+'</td><td data-label="Likes" class="likes-cell">❤️ '+r.likes+'</td><td data-label="Actions"><div class="actions-cell">'+(r.status==='pending'||r.status==='reviewing'?'<button class="act-btn approve" title="Approve" onclick="approveReview(\''+r.id+'\')"><i class="fas fa-check"></i></button><button class="act-btn reject" title="Reject" onclick="rejectReview(\''+r.id+'\')"><i class="fas fa-xmark"></i></button>':'')+'<button class="act-btn" title="View" onclick="viewReview(\''+r.id+'\')"><i class="fas fa-eye"></i></button></div></td></tr>').join('')}
document.getElementById('pageInfo').innerHTML=total?'Showing <b>'+(start+1)+'</b> to <b>'+Math.min(start+PER_PAGE,total)+'</b> of <b>'+total+'</b> reviews':'No reviews found';renderPagination(tp)}
function renderPagination(tp){const w=document.getElementById('pageBtns');if(tp<=1){w.innerHTML='';return}let h='<button class="pg-btn"'+(currentPage<=1?' disabled':'')+' onclick="goPage('+(currentPage-1)+')"><i class="fas fa-chevron-left"></i></button>';const sP=Math.max(1,currentPage-2),eP=Math.min(tp,currentPage+2);if(sP>1)h+='<button class="pg-btn" onclick="goPage(1)">1</button>'+(sP>2?'<span class="pg-dots">…</span>':'');for(let i=sP;i<=eP;i++)h+='<button class="pg-btn'+(i===currentPage?' active':'')+'" onclick="goPage('+i+')">'+i+'</button>';if(eP<tp)h+=(eP<tp-1?'<span class="pg-dots">…</span>':'')+'<button class="pg-btn" onclick="goPage('+tp+')">'+tp+'</button>';h+='<button class="pg-btn"'+(currentPage>=tp?' disabled':'')+' onclick="goPage('+(currentPage+1)+')"><i class="fas fa-chevron-right"></i></button>';w.innerHTML=h}
function goPage(p){currentPage=p;renderTable()}
function renderStats(){const b=DroboardAPI._reviews,t=b.length,p=b.filter(x=>x.status==='pending'||x.status==='reviewing').length,a=b.filter(x=>x.status==='approved').length,r=b.filter(x=>x.status==='rejected').length;document.getElementById('statsGrid').innerHTML='<div class="stat-card"><div class="stat-top"><div class="stat-ico green"><i class="fas fa-clipboard-check"></i></div><span class="stat-delta">+12%</span></div><div class="stat-num">'+a+'</div><div class="stat-lbl">Approved</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico amber"><i class="fas fa-clock"></i></div><span class="stat-delta">+5 new</span></div><div class="stat-num">'+p+'</div><div class="stat-lbl">Pending Review</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico red"><i class="fas fa-xmark-circle"></i></div><span class="stat-delta">-3%</span></div><div class="stat-num">'+r+'</div><div class="stat-lbl">Rejected</div></div><div class="stat-card"><div class="stat-top"><div class="stat-ico blue"><i class="fas fa-star"></i></div><span class="stat-delta">+18%</span></div><div class="stat-num">'+t+'</div><div class="stat-lbl">Total Reviews</div></div>'}
function renderTabs(){const counts={all:DroboardAPI._reviews.length,pending:DroboardAPI._reviews.filter(r=>r.status==='pending').length,reviewing:DroboardAPI._reviews.filter(r=>r.status==='reviewing').length,approved:DroboardAPI._reviews.filter(r=>r.status==='approved').length,rejected:DroboardAPI._reviews.filter(r=>r.status==='rejected').length};document.getElementById('countAll').textContent=counts.all;document.querySelectorAll('.tab-item').forEach(t=>{const k=t.dataset.tab,c=t.querySelector('.tab-count');if(c&&counts[k]!==undefined)c.textContent=counts[k]})}
document.querySelectorAll('.tab-item').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));tab.classList.add('active');activeTab=tab.dataset.tab;currentPage=1;refresh()})});
['tableSearch','fCategory','fStatus'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener(id==='tableSearch'?'input':'change',()=>{currentPage=1;refresh()})});
async function approveReview(id){await DroboardAPI.approveReview(id);toast('✅ Review approved');refresh()}
async function rejectReview(id){await DroboardAPI.rejectReview(id);toast('❌ Review rejected');refresh()}
function viewReview(id){const r=DroboardAPI._reviews.find(x=>x.id===id);if(!r)return;DroboardModal.show('<h2>'+r.title+'</h2><div class="sub">by '+r.writer+' · ★ '+r.rating+' · ❤️ '+r.likes+'</div><div style="margin:16px 0"><img src="'+r.img+'" style="width:100%;height:140px;border-radius:8px;object-fit:cover;border:1px solid var(--border)"/></div><div class="drm-form-group"><label>Category</label><div style="font-size:13px;font-weight:600">'+r.cat+'</div></div><div class="drm-form-group"><label>Submitted</label><div style="font-size:13px;color:var(--text-muted)">'+new Date(r.submitted).toLocaleString()+'</div></div><div class="drm-form-actions"><button class="drm-btn drm-cancel" onclick="DroboardModal.closeTop()">Close</button></div>')}
refresh();
</script></body></html>
