<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Discover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,12px);
}
[data-theme="dark"] .topbar{background:rgba(0,0,0,.95)}
[data-theme="dark"] .phone{background:#000}
[data-theme="dark"] .search,[data-theme="dark"] .icon-btn,[data-theme="dark"] .topbar .logo,[data-theme="dark"] .to-top-btn{background:#0b0b10;color:var(--text);border-color:var(--border)}
[data-theme="dark"] .icon-btn .dot{border-color:#0b0b10}
[data-theme="dark"] .dot{background:#3a3a44}
[data-theme="dark"] .genre-item{box-shadow:0 1px 4px rgba(0,0,0,.4)}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
body{display:flex;justify-content:center;padding-bottom:calc(var(--nav-h)+var(--safe-b))}
img{display:block;object-fit:cover}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}

.phone{width:100%;max-width:420px;min-height:100vh;background:var(--card);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:clip}

.topbar{background:var(--card);backdrop-filter:blur(12px);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.topbar .logo{width:38px;height:38px;border-radius:50%;background:#FFFFFF;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1px solid var(--border);border-radius:22px;padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.search i{font-size:13px;opacity:.7;flex-shrink:0}
.search span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#FFFFFF;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;position:relative;flex-shrink:0}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;background:var(--pink);border-radius:50%;border:1.5px solid #fff}
.icon-btn.gift{color:var(--pink)}

.tabs-wrap{position:sticky;top:0;z-index:50;margin-bottom:7px;padding:0 16px;background:var(--card)}
.tabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);justify-content:center;justify-content:safe center}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;padding:11px 0;position:relative;cursor:pointer}
.tab.active{color:var(--pink);font-weight:700}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--pink);border-radius:3px}
.tab.grid-icon{color:var(--muted);font-size:14px}

.content{flex:1;padding:0 0 20px;background:var(--bg);display:flex;flex-direction:column;gap:7px}

.hero-wrap{padding:12px 0 0;margin-bottom:0;background:transparent}
.hero-wrap + .hero-dots{margin-top:-8px}
.hero{position:relative;border-radius:0;overflow:hidden;height:220px;background:transparent}
/* Two stacked image layers alternate so the next slide CROSSFADES over the
   current one (with a slow zoom) instead of swapping abruptly. */
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center 20%;
  opacity:0;transform:scale(1.05);z-index:1;will-change:opacity,transform;
  transition:opacity .8s cubic-bezier(.4,0,.2,1),transform 1.4s cubic-bezier(.4,0,.2,1)}
.hero-img.is-on{opacity:1;transform:scale(1);z-index:2}
/* The layer currently animating in must always sit ABOVE the opaque
   backdrop, regardless of DOM order. */
.hero-img.is-front{z-index:3}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,.15) 100%);z-index:4}
.hero-body{position:absolute;left:16px;right:16px;bottom:16px;z-index:5}
/* Text slides up + fades in, staggered per line. */
.hero-wrap.hero-anim .hero-body>*{opacity:0;transform:translateY(14px);
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
.hero-wrap.hero-anim .hero-body.in>*{opacity:1;transform:none}
.hero-wrap.hero-anim .hero-body.in>.hero-badge{transition-delay:.06s}
.hero-wrap.hero-anim .hero-body.in>.hero-title{transition-delay:.13s}
.hero-wrap.hero-anim .hero-body.in>.hero-author{transition-delay:.19s}
.hero-wrap.hero-anim .hero-body.in>.hero-tags{transition-delay:.25s}
/* Respect reduced-motion: fade only, no zoom/slide. */
@media (prefers-reduced-motion:reduce){
  .hero-img{transform:none!important;transition:opacity .3s linear}
  .hero-wrap.hero-anim .hero-body>*{transform:none!important}
}
.hero-badge{display:inline-flex;align-items:center;gap:4px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:8px;letter-spacing:.3px}
.hero-title{font-size:26px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:4px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hero-title em{font-style:italic;color:#ff8fab;font-weight:700}
.hero-author{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.8);margin-bottom:8px}
.hero-author i{color:#3b82f6;font-size:11px;margin-left:3px}
.hero-author-av{width:18px;height:18px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.6);flex-shrink:0}
.hero-tags{display:flex;gap:6px;margin-bottom:12px}
.hero-tag{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(4px)}
.hero-dots{display:flex;justify-content:center;gap:5px;margin:0;padding:10px 0 12px;background:transparent;border-bottom:none}
.dot{width:6px;height:6px;border-radius:50%;background:#d1d1d6;transition:width .4s cubic-bezier(.4,0,.2,1),background .3s ease,border-radius .4s ease}
.dot.on{width:16px;border-radius:3px;background:var(--pink)}

.section{background:var(--card);border-top:none;border-bottom:none;padding:14px 0 16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 10px}
.sec-title{font-size:16px;font-weight:700}
.view-all{font-size:12px;font-weight:600;color:var(--muted)}

.h-row{display:flex;gap:6px;overflow-x:auto;padding:0 8px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:60px}
.h-row > .dc-scard{flex:0 0 calc((100% - 16px) / 4);width:calc((100% - 16px) / 4)}
.h-row::-webkit-scrollbar{display:none}

.coll-row{display:flex;gap:12px;overflow-x:auto;padding:0 8px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:60px}
.coll-row::-webkit-scrollbar{display:none}

.genre-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 8px}
.genre-item{background:var(--card);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid var(--border);cursor:pointer}
.genre-item:active{transform:scale(.96)}
.genre-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.genre-name{font-size:11px;font-weight:600}

.more-section{padding:14px 16px 8px;background:var(--card);border-top:1px solid var(--border)}
#moreList{gap:0}
#moreList .dc-list-item:not(.dc-ad):not(.dc-book-ad){padding:12px 0;border-bottom:1px solid var(--border)}
#moreList .dc-list-item:not(.dc-ad):not(.dc-book-ad):last-child{border-bottom:none}
[data-ad-slot]{overflow:hidden}
.more-title{font-size:16px;font-weight:700;margin-bottom:12px}

.bro-list{display:flex;flex-direction:column;gap:11px;padding:8px 12px}

.more-loader{text-align:center;padding:20px;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.more-loader.hidden{display:none}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#scrollSentinel{height:1px}

.to-top-btn{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:55;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--pink);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.14);opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.to-top-btn.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.to-top-btn:active{transform:scale(.92)}

#pageLoader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s ease,visibility .35s ease}
#pageLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.book-loader{position:relative;width:64px;height:50px}
.book-loader .cover{position:absolute;inset:0;border-radius:4px 8px 8px 4px;background:linear-gradient(135deg,var(--pink),#ff6b8f);box-shadow:0 8px 20px rgba(255,45,85,.25)}
.book-loader .page{position:absolute;top:3px;right:2px;bottom:3px;left:34px;background:#fff;border-radius:2px 6px 6px 2px;transform-origin:left center;animation:pageFlip 1.1s ease-in-out infinite}
.book-loader .page:nth-child(2){animation-delay:.18s;opacity:.85}
.book-loader .page:nth-child(3){animation-delay:.36s;opacity:.65}
@keyframes pageFlip{0%{transform:rotateY(0deg)}50%{transform:rotateY(-140deg)}100%{transform:rotateY(0deg)}}
.loader-text{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}

.no-copy,.dc-scard,.dc-list-item,.hero,.dc-coll-card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.search input,.search-bar input,[data-searchable-input]{-webkit-user-select:text;user-select:text}
@media(min-width:421px){.phone{border-radius:0}}
@media print{body *{display:none !important}}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="../component/img-guard.js"></script>
<script src="../component/app-nav.js"></script>
</head>

  </div>

      <div class="tab active">For You</div>
      <div class="tab" data-browse-trigger data-browse-title="Top Romance" data-browse-filter="romance">Romance</div>

      <div class="tab" data-browse-trigger data-browse-title="Fantasy Stories" data-browse-filter="fantasy">Fantasy</div>
      <div class="tab grid-icon" data-browse-trigger data-browse-title="All Stories"><i class="fas fa-th"></i></div>
    </div>
  </div>

  <div class="content">
    <div class="hero-wrap"><div class="hero"><div class="hero-img is-on" id="heroImg"></div><div class="hero-img" id="heroImg2"></div><div class="hero-scrim"></div><div class="hero-body"><div class="hero-badge"><i class="fas fa-fire" style="font-size:9px"></i> TRENDING</div><div class="hero-title" id="heroTitle"></div><div class="hero-author" id="heroAuthor"></div><div class="hero-tags" id="heroTags"></div></div></div></div>

    <section class="section"><div class="sec-head"><h2 class="sec-title">Continue Reading</h2><button class="view-all" data-browse-trigger data-browse-mode="continueReading" data-browse-title="Continue Reading">View All ›</button></div><div class="h-row" id="continueRow"></div></section>
    <!-- MINI BANNER slot 1 of 3 ── right after Continue Reading (format pinned to minibanner) -->
    <div data-ad-slot="discover:banner-top" data-ad-format="minibanner" style="background:var(--card);padding:2px 16px 4px"></div>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Top Romance</h2><button class="view-all" data-browse-trigger data-browse-title="Top Romance" data-browse-filter="romance" data-browse-sort="popular">View All ›</button></div><div class="h-row" id="romanceRow"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Trending Today</h2><button class="view-all" data-browse-trigger data-browse-title="Trending Today" data-browse-sort="popular">View All ›</button></div><div class="h-row" id="trendingRow"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Collections</h2><button class="view-all" data-browse-trigger data-browse-mode="collections" data-browse-title="All Collections">View All ›</button></div><div class="coll-row" id="collRow"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">New Releases</h2><button class="view-all" data-browse-trigger data-browse-title="New Releases" data-browse-sort="new">View All ›</button></div><div class="h-row" id="newRow"></div></section>
    <!-- MINI BANNER slot 2 of 3 ── after New Releases (format pinned to minibanner) -->
    <div data-ad-slot="discover:inline-banner" data-ad-format="minibanner" style="background:var(--card);padding:2px 16px 4px"></div>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Editor's Picks</h2><button class="view-all" data-browse-trigger data-browse-title="Editor's Picks" data-browse-sort="rating">View All ›</button></div><div class="h-row" id="editorRow"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Popular Genres</h2></div><div class="genre-grid" id="genreGrid"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Recommended For You</h2><button class="view-all" data-browse-trigger data-browse-title="Recommended For You" data-browse-tune data-browse-sort="popular">View All ›</button></div><div class="h-row" id="recRow"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Complete Stories</h2><button class="view-all" data-browse-trigger data-browse-title="Complete Stories" data-browse-filter="completed">View All ›</button></div><div class="h-row" id="completeRow"></div></section>
    <section class="section"><div class="sec-head"><h2 class="sec-title">Recently Updated</h2><button class="view-all" data-browse-trigger data-browse-title="Recently Updated" data-browse-sort="updated">View All ›</button></div><div class="h-row" id="updatedRow"></div></section>
    <!-- MINI BANNER slot 3 of 3 ── above the infinite More Stories list (format pinned to minibanner) -->
    <div data-ad-slot="discover:banner-bottom" data-ad-format="minibanner" style="background:var(--card);padding:2px 16px 4px"></div>
    <section class="more-section"><h2 class="more-title">More Stories</h2><div class="bro-list" id="moreList"></div><div class="more-loader" id="moreLoader"><div class="spinner"></div> Loading more…</div><div id="scrollSentinel"></div></section>
  </div>
</div>

<button class="to-top-btn" id="toTopBtn" aria-label="Scroll to top"><i class="fas fa-arrow-up"></i></button>
