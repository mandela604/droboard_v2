<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Edit Hub · DroBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
  :root{
    --bg:#000000; --card:#08090c; --l1:#0e0f13; --l2:#16171d; --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.13);
    --bd-acc:#ff005044; --tx-high:#fafafa; --tx-body:#d4d4d8; --tx-muted:#a1a1aa; --tx-faint:#71717a;
    --acc:#ff0050; --acc3:#ff6b93; --green:#22c55e; --gold:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--tx-body);font-family:'DM Sans',sans-serif;font-size:13px;padding-bottom:40px}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
  .tb-back{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx-high);cursor:pointer;flex-shrink:0}
  .tb-titles{flex:1;min-width:0}
  .tb-h{font-family:'Playfair Display',serif;font-size:15px;font-weight:800;color:var(--tx-high)}
  .tb-sub{font-size:10.5px;color:var(--tx-faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-stats{background:var(--l2);border:1px solid var(--bd);color:var(--acc3);border-radius:20px;padding:8px 13px;font-size:11.5px;font-weight:800;cursor:pointer;flex-shrink:0}
  .wrap{padding:14px;max-width:560px;margin:0 auto}
  .sec{background:var(--l1);border:1px solid var(--bd);border-radius:16px;padding:15px;margin-bottom:14px}
  .sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sec-t{font-size:13px;font-weight:800;color:var(--tx-high)}
  .sec-sub{font-size:10.5px;color:var(--tx-faint);margin-top:2px;font-weight:600}
  .lbl{font-size:10px;font-weight:800;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 6px;display:block}
  .lbl:first-of-type{margin-top:0}
  .inp{width:100%;background:var(--l2);border:1.5px solid var(--bd);border-radius:11px;padding:11px 13px;color:var(--tx-high);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .16s}
  .inp:focus{border-color:var(--bd-acc)}
  .inp::placeholder{color:var(--tx-faint)}
  textarea.inp{resize:vertical;min-height:76px;line-height:1.55}
  .btn{border:none;border-radius:11px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:800;cursor:pointer}
  .btn.primary{background:var(--acc);color:#fff}
  .btn.ghost{background:var(--l2);border:1.5px solid var(--bd);color:var(--tx-body)}
  .btn.danger{background:rgba(244,63,94,.1);border:1.5px solid rgba(244,63,94,.3);color:#f43f5e}
  .btn.sm{padding:7px 11px;font-size:11px;border-radius:9px}
  .cover-prev{width:100%;height:120px;border-radius:12px;object-fit:cover;border:1px solid var(--bd);margin-top:8px;background:var(--l2)}
  .rule-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .rule-row .inp{flex:1;min-width:0;font-size:12.5px;padding:9px 11px}
  .row-del{width:30px;height:30px;flex-shrink:0;border:none;background:transparent;color:var(--tx-faint);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
  .row-del:active{background:rgba(244,63,94,.12);color:#f43f5e}
  .pin-row{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--l2);border:1px solid var(--bd);border-radius:11px;margin-bottom:8px}
  .pin-row-txt{flex:1;min-width:0}
  .pin-row-t{font-size:12.5px;font-weight:700;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pin-row-s{font-size:10px;color:var(--tx-faint);font-weight:600;margin-top:1px}
  .pin-sw{width:40px;height:23px;border-radius:20px;background:var(--l1);border:1px solid var(--bd2);position:relative;cursor:pointer;flex-shrink:0;transition:.18s}
  .pin-sw::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--tx-faint);transition:.18s}
  .pin-sw.on{background:rgba(255,0,80,.25);border-color:var(--acc)}
  .pin-sw.on::after{left:19px;background:var(--acc)}
  .mod-row{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--l2);border:1px solid var(--bd);border-radius:11px;margin-bottom:8px}
  .mod-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--l1)}
  .mod-txt{flex:1;min-width:0}
  .mod-n{font-size:12.5px;font-weight:800;color:var(--tx-high)}
  .mod-r{font-size:10px;color:var(--acc3);font-weight:700}
  .pick-add{background:rgba(255,0,80,.1);border:1.5px solid var(--bd-acc);color:var(--acc3);border-radius:9px;padding:6px 11px;font-size:10.5px;font-weight:800;cursor:pointer;flex-shrink:0}
  .up-zone{border:1.5px dashed var(--bd2);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;color:var(--tx-muted);font-size:12px;font-weight:700;margin-top:8px;transition:.15s}
  .up-zone:active{transform:scale(.99)}
  .up-zone i{display:block;font-size:17px;color:var(--acc3);margin-bottom:5px}
  .empty{font-size:11.5px;color:var(--tx-faint);text-align:center;padding:14px 0}
  .toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(10px);background:#fff;color:#111;font-size:12px;font-weight:700;padding:10px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-back" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
  <div class="tb-titles">
    <div class="tb-h">Edit hub</div>
    <div class="tb-sub" id="tbSub">Loading…</div>
  </div>
  <button class="tb-stats" onclick="goStats()"><i class="fas fa-chart-simple"></i> Stats</button>
</div>

<div class="wrap">

  <div class="sec" id="secDetails">
    <div class="sec-hd"><div><div class="sec-t">Hub details</div><div class="sec-sub">Name, tagline, cover and about text</div></div></div>
    <label class="lbl">Hub name</label>
    <input class="inp" id="dName" placeholder="Hub name"/>
    <label class="lbl">Tagline</label>
    <input class="inp" id="dTagline" placeholder="One-liner under the name"/>
    <label class="lbl">Icon (Font Awesome class)</label>
    <input class="inp" id="dIcon" placeholder="e.g. fa-hat-wizard"/>
    <label class="lbl">Cover image</label>
    <div class="up-zone" onclick="document.getElementById('coverFile').click()"><i class="fas fa-cloud-arrow-up"></i>Tap to upload a cover image</div>
    <input type="file" id="coverFile" accept="image/*" style="display:none" onchange="handleCoverFile(event)"/>
    <img class="cover-prev" id="coverPrev" alt="" style="display:none"/>
    <label class="lbl">About text</label>
    <textarea class="inp" id="dBlurb" placeholder="What is this hub about?"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn primary" style="flex:1" onclick="saveDetails()"><i class="fas fa-check"></i> Save details</button>
    </div>
  </div>

  <div class="sec" id="secRules">
    <div class="sec-hd"><div><div class="sec-t">Hub rules</div><div class="sec-sub">Shown on the pinned rules thread</div></div></div>
    <div id="rulesList"></div>
    <button class="btn ghost sm" onclick="addRule()" style="width:100%;margin-top:4px"><i class="fas fa-plus"></i> Add rule</button>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn primary" style="flex:1" onclick="saveRules()"><i class="fas fa-check"></i> Save rules</button>
    </div>
  </div>

  <div class="sec" id="secMods">
    <div class="sec-hd"><div><div class="sec-t">Moderators</div><div class="sec-sub">Search anyone on Droboard — assign who can moderate this hub</div></div></div>
    <div id="modsList"></div>
    <label class="lbl" style="margin-top:14px">Add moderator</label>
    <input class="inp" id="modSearch" placeholder="Search name or @handle…" oninput="searchMods(this.value)" autocomplete="off"/>
    <div id="addModPicker" style="margin-top:8px"></div>
  </div>

  <div class="sec" id="secDanger">
    <div class="sec-hd"><div><div class="sec-t" style="color:#f43f5e">Danger zone</div><div class="sec-sub">Reset everything you've edited on this hub</div></div></div>
    <button class="btn danger" style="width:100%" onclick="resetHub()"><i class="fas fa-rotate-left"></i> Reset all hub edits</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="../data/genre-demo-seed.js"></script>
<script src="../shared/ui-helpers.js"></script>
<script src="../services/genre-hub-edit-service.js"></script>
<script src="../shared/theme-chrome.js"></script>
</body>
</html>
