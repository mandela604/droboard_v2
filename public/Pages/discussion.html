<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Discussion · DroBoard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
:root{
  --safe-b:env(safe-area-inset-bottom,12px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);
  font-family:var(--font-ui)}
body{display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{display:none}

.phone{
  width:100%;max-width:420px;min-height:100vh;background:var(--l1);
  box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;
  padding-bottom:calc(var(--safe-b) + 16px);
}

.top-bar{
  position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);
}
[data-theme="dark"] .top-bar{background:rgba(0,0,0,.97)}
.top-icon-btn{
  width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx-muted);flex-shrink:0;
}
.top-center{flex:1;min-width:0}
.top-title{font-size:15px;font-weight:800;color:var(--tx-high)}
.top-sub{font-size:10.5px;color:var(--tx-muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.op{
  padding:16px 14px 14px;
  border-bottom:8px solid var(--bg);
}
[data-theme="dark"] .op{
  border-bottom-color:#000;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
}
.op-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.op-av-wrap{position:relative;width:44px;height:44px;flex-shrink:0;cursor:pointer}
.op-av-ring{width:44px;height:44px;border-radius:50%;padding:2.5px}
.op-av-ring.ring-has{background:conic-gradient(#ff0050,#ff4d7a,#ff7a9a,#ff0050)}
.op-av-ring.ring-viewed{background:var(--tx-muted,#a1a1aa)}
.op-av-ring.ring-none{background:transparent}
.op-av-ring-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--l2)}
.op-av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.op-meta{flex:1;min-width:0}
.op-name{font-size:14px;font-weight:800;color:var(--tx-high);cursor:pointer}
.op-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(167,139,250,.12);color:var(--purple);margin-left:6px}
.op-badge.author{background:rgba(255,0,80,.08);color:var(--acc)}
.op-time{font-size:11.5px;color:var(--tx-muted);font-weight:600;margin-top:2px}
.op-title{font-size:18px;font-weight:800;color:var(--tx-high);line-height:1.28;letter-spacing:-.02em;margin-bottom:8px}
.op-body{font-size:14px;color:var(--tx-body);line-height:1.6;margin-bottom:12px}
.op-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.op-tag{font-size:10px;font-weight:800;padding:4px 9px;border-radius:12px}
.op-tag.discussion{background:rgba(167,139,250,.12);color:#7c3aed}
.op-tag.recommendation{background:rgba(255,0,80,.08);color:var(--acc)}
.op-tag.theory{background:rgba(56,189,248,.12);color:#0284c7}
.op-tag.question{background:rgba(52,211,153,.12);color:#0d9668}
.op-tag.controversial{background:rgba(251,146,60,.14);color:#c2410c}
.op-tag.hot{background:rgba(255,0,80,.1);color:var(--acc)}
.op-media{width:100%;max-height:260px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--l2)}
.op-media img{width:100%;max-height:260px;object-fit:cover;display:block}
.op-story{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;
  background:var(--l2);border:1px solid var(--bd);margin-bottom:12px;cursor:pointer;
}
.op-story-cover{width:40px;height:54px;border-radius:8px;object-fit:cover}
.op-story-title{font-size:13px;font-weight:700;color:var(--tx-high)}
.op-story-by{font-size:11px;color:var(--tx-muted)}
.op-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bd2)}
[data-theme="dark"] .op-actions{border-top-color:rgba(255,255,255,.08)}
.op-act{
  display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:20px;
  font-size:12px;font-weight:700;color:var(--tx-muted);background:none;border:none;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.op-act:active{background:var(--l2)}
.op-act i{font-size:12px}

.comments-wrap{
  padding:0 14px 20px;
  background:var(--l1);
}
.toast{
  position:fixed;bottom:calc(var(--safe-b) + 24px);left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--l3);border:1px solid var(--bd);color:var(--tx-body);padding:9px 16px;border-radius:24px;
  font-size:12px;font-weight:600;z-index:900;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 20px;text-align:center;color:var(--tx-muted);font-size:13px}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="../component/img-guard.js"></script>
<script src="../component/app-nav.js"></script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button type="button" class="top-icon-btn" id="backBtn" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div class="top-center">
      <div class="top-title">Discussion</div>
      <div class="top-sub" id="hubSub">Genre Hub</div>
    </div>
    <button type="button" class="top-icon-btn" id="shareBtn" aria-label="Share"><i class="fas fa-share-nodes"></i></button>
  </div>

  <div id="opMount"></div>

  <div class="comments-wrap">
    <div id="commentsPlaceholder"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="../data/genre-demo-seed.js"></script>
<script src="../data/central-demo-data.js"></script>
<script src="../data/droboard-page-seed.js"></script>
<script src="../data/comments-data.js"></script>
<script src="../services/feed-data.js"></script>
<script src="../component/reaction-picker.js"></script>
<script src="../component/ad-card.js?v=3"></script>
<script src="../component/share-modal.js"></script>
<script src="../component/report-sheet.js"></script>
<script src="../component/status-viewer.js?v=2"></script>
<script src="../component/comment-section.js?v=5"></script>
<script src="../data/central-demo-data.js"></script>
<script src="../marketing/shared/marketing-data.js"></script>
<script src="../services/ad-service.js"></script>
<script src="../component/ad-slot.js"></script>
<script src="../services/auth-session.js"></script>
<script src="../services/league-service.js"></script>
<script src="../services/discussion-service.js"></script>
<script>DiscussionPage.init();</script>
</body>
</html>
