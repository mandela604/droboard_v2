<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Details · DroBoard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root{
  --acc:#ff0050;--acc2:#ff4d7a;--acc3:#ff7a9a;
  --glow:rgba(255,0,80,.22);--glow-sm:rgba(255,0,80,.12);
  --bg:#d8d8d8;--l1:#ffffff;--l2:#f1f1f1;--l3:#ffffff;
  --bd:rgba(0,0,0,.10);--bd2:rgba(0,0,0,.05);--bd-acc:rgba(255,0,80,.25);
  --tx-high:#161616;--tx-body:#3a3a3a;--tx-muted:#666666;--tx-faint:#8a8a8a;
  --blue:#38bdf8;--green:#34d399;--gold:#fbbf24;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,12px);
}
[data-theme="dark"]{
  --bg:#000000;--l1:#08090c;--l2:#0e0f13;--l3:#13141a;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.04);--bd-acc:rgba(255,0,80,.20);
  --tx-high:#e0e0e0;--tx-body:#c0c0c0;--tx-muted:#71717a;--tx-faint:#3f3f46;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);
  font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

.phone{width:100%;max-width:420px;min-height:100vh;background:var(--l1);position:relative;
  box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden;
  padding-bottom:calc(var(--safe-b) + 20px)}
@media (min-width:421px){.phone{box-shadow:0 0 50px rgba(0,0,0,.14)}}

.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
[data-theme="dark"] .top-bar{background:rgba(0,0,0,.97)}
.tb-back{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx-muted);cursor:pointer;flex-shrink:0}
.tb-title{flex:1;min-width:0;font-size:15px;font-weight:800;color:var(--tx-high);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tb-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx-muted);cursor:pointer;flex-shrink:0}
.tb-btn:active{transform:scale(.92)}

#loadingState{padding:16px 14px}
.sk{background:linear-gradient(90deg,var(--l2) 25%,var(--l3) 37%,var(--l2) 63%);background-size:400% 100%;animation:skShimmer 1.4s ease infinite;border-radius:10px}
@keyframes skShimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
#emptyState{display:none;padding:70px 24px;text-align:center}
.empty-icon{width:64px;height:64px;border-radius:18px;background:rgba(255,0,80,.08);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--acc);font-size:24px}
.empty-title{font-size:18px;font-weight:800;margin-bottom:6px;color:var(--tx-high)}
.empty-sub{font-size:13px;color:var(--tx-muted);line-height:1.5}
#detailsRoot{display:none}

.hero{position:relative;width:100%;padding:28px 16px 18px;overflow:hidden;background:#1a1030}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(26px) brightness(.7);transform:scale(1.15)}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.88) 100%)}
.hero-in{position:relative;z-index:1;display:flex;gap:14px;align-items:flex-end}
.hero-cover{width:110px;height:150px;border-radius:12px;object-fit:cover;flex-shrink:0;box-shadow:0 10px 28px rgba(0,0,0,.5);background:rgba(255,255,255,.08)}
.hero-info{flex:1;min-width:0;color:#fff;padding-bottom:2px}
.status-badge{align-self:flex-start;font-size:8.5px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.status-badge.ongoing{background:rgba(255,0,80,.25);color:#ffd3de;border:1px solid rgba(255,0,80,.4)}
.status-badge.completed{background:rgba(52,211,153,.2);color:#a7f3d0;border:1px solid rgba(52,211,153,.35)}
.status-badge.paused{background:rgba(255,255,255,.14);color:#e4e4e7;border:1px solid rgba(255,255,255,.2)}
.sd-title{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.02em;margin-bottom:5px}
.sd-author{font-size:12.5px;opacity:.85;margin-bottom:5px}
.sd-author a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.sd-genre{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#ffb3c6}

.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--bd);background:var(--l1)}
.stat-cell{text-align:center;padding:12px 4px;border-right:1px solid var(--bd)}
.stat-cell:last-child{border-right:none}
.stat-num{font-size:15px;font-weight:800;color:var(--tx-high);line-height:1.2}
.stat-lbl{font-size:9px;color:var(--tx-muted);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}

.actions{display:flex;gap:9px;padding:14px}
.btn-read{flex:1;background:linear-gradient(135deg,var(--acc),#c2185b);color:#fff;border:none;border-radius:13px;
  padding:13px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 18px var(--glow-sm)}
.btn-read:active{transform:scale(.98)}
.btn-icon{width:46px;border-radius:13px;background:var(--l2);border:1px solid var(--bd);color:var(--tx-body);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-icon:active{transform:scale(.95)}

.sec{padding:4px 14px 16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.sec-title{font-size:14px;font-weight:800;color:var(--tx-high);display:flex;align-items:center;gap:7px}
.sec-title i{color:var(--acc);font-size:12px}
.sec-count{font-size:11px;font-weight:700;color:var(--tx-muted)}

.syn-text{font-size:13.5px;line-height:1.65;color:var(--tx-body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.syn-text.open{display:block}
.syn-more{display:none;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:700;color:var(--acc);cursor:pointer}

.ch-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--bd2);cursor:pointer}
.ch-row:last-child{border-bottom:none}
.ch-row:active{background:var(--l2)}
.ch-num{width:34px;height:34px;border-radius:10px;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--tx-muted);flex-shrink:0}
.ch-info{flex:1;min-width:0}
.ch-title{font-size:13px;font-weight:700;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-meta{font-size:10.5px;color:var(--tx-muted);margin-top:2px}
.ch-go{color:var(--tx-faint);font-size:12px;flex-shrink:0}

.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.det-item{background:var(--l2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.det-k{font-size:9px;font-weight:700;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.det-v{font-size:13px;font-weight:700;color:var(--tx-high)}

.author-card{display:flex;align-items:center;gap:12px;background:var(--l2);border:1px solid var(--bd);
  border-radius:14px;padding:12px;cursor:pointer}
.au-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.au-info{flex:1;min-width:0}
.au-name{font-size:13.5px;font-weight:800;color:var(--tx-high)}
.au-sub{font-size:10.5px;color:var(--tx-muted);margin-top:1px}
.au-go{color:var(--tx-faint);font-size:12px}

.rev-card{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--l1)}
.rev-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rev-av{width:34px;height:34px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--tx-muted);flex-shrink:0}
.rev-name{font-size:12.5px;font-weight:800;color:var(--tx-high)}
.rev-time{font-size:10px;color:var(--tx-muted);margin-top:1px}
.rev-text{font-size:13px;line-height:1.55;color:var(--tx-body);margin-bottom:8px}
.rev-foot{font-size:11px;font-weight:700;color:var(--tx-muted);display:flex;align-items:center;gap:5px}

.more-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.more-card{flex-shrink:0;width:110px;cursor:pointer}
.more-cover{width:110px;height:148px;border-radius:10px;overflow:hidden;background:var(--l2);margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.more-cover img{width:100%;height:100%;object-fit:cover;display:block}
.more-title{font-size:11px;font-weight:700;line-height:1.3;color:var(--tx-high);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.panel-empty{padding:30px 10px;text-align:center;color:var(--tx-muted);font-size:12.5px}
.panel-empty i{font-size:20px;display:block;margin-bottom:8px;opacity:.5}

.toast{position:fixed;bottom:calc(var(--safe-b) + 24px);left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--l3);border:1px solid var(--bd);color:var(--tx-body);padding:9px 16px;border-radius:24px;
  font-size:12px;font-weight:600;z-index:900;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone">

  <div class="top-bar">
    <div class="tb-back" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
    <div class="tb-title" id="tbTitle">Details</div>
    <div class="tb-btn" onclick="BookDetailsPage.toggleTheme()" title="Theme"><i class="fas fa-moon" id="themeIcon"></i></div>
    <div class="tb-btn" onclick="BookDetailsPage.openSave()" title="Save"><i class="far fa-bookmark"></i></div>
    <div class="tb-btn" onclick="BookDetailsPage.openShare()" title="Share"><i class="fas fa-share-alt"></i></div>
  </div>

  <div id="loadingState">
    <div class="sk" style="height:190px;border-radius:0;margin-bottom:14px"></div>
    <div style="padding:0 14px">
      <div class="sk sk-line" style="height:14px;width:60%;margin-bottom:9px"></div>
      <div class="sk sk-line" style="height:12px;width:35%;margin-bottom:9px"></div>
      <div class="sk sk-line" style="height:12px;width:80%"></div>
    </div>
  </div>

  <div id="emptyState">
    <div class="empty-icon"><i class="fas fa-book-open"></i></div>
    <div class="empty-title">Series not found</div>
    <div class="empty-sub">This series doesn't exist or may have been removed.</div>
  </div>

  <div id="detailsRoot">
    <div class="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-scrim"></div>
      <div class="hero-in">
        <img class="hero-cover" id="sdCover" src="" alt=""/>
        <div class="hero-info">
          <span class="status-badge ongoing" id="statusBadge">Ongoing</span>
          <div class="sd-title" id="sdTitle"></div>
          <div class="sd-author" id="sdAuthor"></div>
          <div class="sd-genre" id="sdGenre"></div>
        </div>
      </div>
    </div>

    <div class="stats-strip">
      <div class="stat-cell"><div class="stat-num" id="statReads">0</div><div class="stat-lbl">Reads</div></div>
      <div class="stat-cell"><div class="stat-num" id="statLikes">0</div><div class="stat-lbl">Likes</div></div>
      <div class="stat-cell"><div class="stat-num" id="statRating">—</div><div class="stat-lbl">Rating</div></div>
      <div class="stat-cell"><div class="stat-num" id="statChapters">0</div><div class="stat-lbl">Chapters</div></div>
    </div>

    <div class="actions">
      <button class="btn-read" id="btnRead"><i class="fas fa-book-open"></i> Read Now</button>
      <button class="btn-icon" id="btnLib" title="Save to library"><i class="far fa-bookmark"></i></button>
      <button class="btn-icon" id="btnShare" title="Share"><i class="fas fa-share-alt"></i></button>
    </div>

    <div class="sec">
      <div class="sec-head"><div class="sec-title"><i class="fas fa-align-left"></i> Synopsis</div></div>
      <div class="syn-text" id="synText"></div>
      <div class="syn-more" id="synBtn">Read more <i class="fas fa-chevron-down" style="font-size:10px"></i></div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <div class="sec-title"><i class="fas fa-list-ul"></i> Chapters</div>
        <div class="sec-count" id="chCount"></div>
      </div>
      <div id="chList"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><div class="sec-title"><i class="fas fa-circle-info"></i> Details</div></div>
      <div class="det-grid" id="detGrid"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><div class="sec-title"><i class="fas fa-feather-pointed"></i> Author</div></div>
      <div class="author-card" id="authorCard"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><div class="sec-title"><i class="fas fa-star"></i> Top reviews</div></div>
      <div id="revList"></div>
    </div>

    <div class="sec" id="moreSec">
      <div class="sec-head"><div class="sec-title"><i class="fas fa-layer-group"></i> More like this</div></div>
      <div class="more-row" id="moreRow"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../data/central-demo-data.js"></script>
<script src="../data/profile-demo-seed.js"></script>
<script src="../component/share-modal.js"></script>
<script src="../component/save-modal.js"></script>
<script src="../services/book-details-service.js"></script>
<script>BookDetailsPage.init();</script>
</body>
</html>
