<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Who viewed · Droboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);font-family:var(--font-ui)}
body{display:flex;justify-content:center}
.phone{width:100%;max-width:420px;min-height:100vh;background:var(--l1);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10)}
.top-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 11px) 14px 11px;background:var(--card);border-bottom:1px solid var(--bd)}
.top-icon-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx-muted);cursor:pointer;flex-shrink:0}
.top-title{font-size:15px;font-weight:800;color:var(--tx-high)}
.top-sub{font-size:11px;color:var(--tx-muted);margin-top:1px}
.wrap{padding:16px}
.summary{display:flex;gap:10px;margin-bottom:18px}
.sbox{flex:1;background:var(--l2);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}
.sbox b{display:block;font-size:24px;color:var(--acc,#ff0050);font-weight:900;line-height:1.1}
.sbox span{font-size:11px;color:var(--tx-muted);font-weight:700}
.row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--bd);text-decoration:none;color:inherit}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--l2);flex-shrink:0}
.av-ph{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff0050,#ff7a9a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.who{flex:1;min-width:0}
.who .n{font-size:13.5px;font-weight:800;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .h{font-size:11.5px;color:var(--tx-muted);margin-top:2px}
.at{font-size:11px;color:var(--tx-faint,#999);flex-shrink:0}
.note{font-size:12px;color:var(--tx-muted);line-height:1.5;padding:12px 0}
.empty{text-align:center;color:var(--tx-muted);font-size:13px;padding:40px 16px}
.err{text-align:center;color:#dc2626;font-size:13px;padding:40px 16px}
</style>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <div class="top-icon-btn" onclick="history.length>1?history.back():location.href='feed.html'" aria-label="Back"><i class="fas fa-arrow-left"></i></div>
    <div style="flex:1">
      <div class="top-title">Who viewed</div>
      <div class="top-sub">Your expired status</div>
    </div>
  </div>
  <div class="wrap" id="root"><div class="empty">Loading…</div></div>
</div>
<script>
(function(){
  'use strict';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function ago(d){
    if(!d) return '';
    var s=Math.floor((Date.now()-new Date(d).getTime())/1000);
    if(s<60) return 'just now';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    if(s<604800) return Math.floor(s/86400)+'d ago';
    return new Date(d).toLocaleDateString();
  }
  var id=new URLSearchParams(location.search).get('id')||'';
  if(!id){document.getElementById('root').innerHTML='<div class="err">No status specified.</div>';return;}
  fetch('/api/statuses/'+encodeURIComponent(id)+'/viewers',{credentials:'include'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(v){
      var named=(v.named||[]).map(function(u){
        var av=u.avatar?'<img class="av" src="'+esc(u.avatar)+'" alt=""/>'
          :'<div class="av-ph">'+esc((u.name||u.handle||'?')[0].toUpperCase())+'</div>';
        var href='profile.html?u='+encodeURIComponent(String(u.handle||u.name||'').replace(/^@/,''));
        return '<a class="row" href="'+href+'">'+av+'<div class="who"><div class="n">'+esc(u.name||u.handle||'Reader')+'</div>'
          +(u.handle?'<div class="h">@'+esc(u.handle)+'</div>':'')+'</div><div class="at">'+esc(ago(u.at))+'</div></a>';
      }).join('');
      var guestRow=v.guests?'<div class="row"><div class="av-ph" style="background:var(--l3,#333)"><i class="fas fa-user"></i></div><div class="who"><div class="n"> Guests</div><div class="h">Signed-out viewers</div></div><div class="at">'+esc(v.guests)+'</div></div>':'';
      document.getElementById('root').innerHTML=
        '<div class="summary"><div class="sbox"><b>'+esc(v.views||0)+'</b><span>Total views</span></div>'
        +'<div class="sbox"><b>'+esc(v.guests||0)+'</b><span>Guests</span></div></div>'
        +(named||guestRow ? named+guestRow : '<div class="empty">No one viewed this status yet.</div>');
    })
    .catch(function(e){document.getElementById('root').innerHTML='<div class="err">Could not load viewers ('+esc(e.message)+'). This status may have been removed.</div>';});
})();
</script>
</body>
</html>
