<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<title>Droboard · Series</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --acc:#ff0050;--acc2:#ff4d7a;--acc3:#ff7a9a;
  --glow:rgba(255,0,80,.22);--glow-sm:rgba(255,0,80,.12);
  --bg:#000;--l1:#08090c;--l2:#0e0f13;--l3:#13141a;--l4:#1a1b22;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.04);--bd-acc:rgba(255,0,80,.20);
  --tx-high:#e8e8e8;--tx-body:#c8c8c8;--tx-muted:#71717a;--tx-faint:#3f3f46;
  --blue:#38bdf8;--green:#34d399;--gold:#fbbf24;--purple:#a78bfa;--orange:#fb923c;
  --safe-b:env(safe-area-inset-bottom,0px);--nav-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{padding-bottom:calc(var(--safe-b) + var(--nav-h) + 12px)}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.2)}

/* ─── TOP BAR ─── */
.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(0,0,0,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.tb-back{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;color:#ccc;cursor:pointer;flex-shrink:0}
.tb-back:active{transform:scale(.9)}
.tb-title{flex:1;min-width:0}
.tb-series-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-series-sub{font-size:9px;color:var(--tx-muted);margin-top:1px}
.tb-actions{display:flex;gap:7px}
.tb-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:14px;color:#ccc;cursor:pointer;transition:.15s}
.tb-btn:active{transform:scale(.9)}
.tb-btn.active{background:rgba(255,0,80,.12);border-color:var(--bd-acc);color:var(--acc)}

/* ─── HERO ─── */
.series-hero{position:relative;width:100%;height:280px;overflow:hidden;flex-shrink:0}
.hero-cover{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:brightness(.45)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(0deg,#000 0%,rgba(0,0,0,.7) 45%,rgba(0,0,0,.2) 100%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:18px 16px 20px}
.hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.hbadge{font-size:8px;font-weight:800;padding:3px 9px;border-radius:8px;letter-spacing:.05em;text-transform:uppercase}
.hb-cat{background:var(--acc);color:#fff}
.hb-ongoing{background:rgba(255,0,80,.12);border:1px solid var(--bd-acc);color:var(--acc3)}
.hb-complete{background:rgba(255,255,255,.07);border:1px solid var(--bd);color:#666}
.hb-contest{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.25);color:var(--gold)}
.hero-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;line-height:1.2;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.9);margin-bottom:8px}
.hero-writer-row{display:flex;align-items:center;gap:8px}
.hw-av{width:28px;height:28px;border-radius:50%;border:2px solid var(--acc);object-fit:cover}
.hw-name{font-size:12px;font-weight:700;color:#ccc;flex:1}
.hw-follow{background:var(--acc);color:#fff;border:none;padding:5px 13px;border-radius:20px;font-size:10px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif}
.hw-follow.ing{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);color:#ccc}

/* ─── QUICK STATS ─── */
.quick-stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--l1);border-bottom:1px solid var(--bd)}
.qs-item{text-align:center;padding:11px 4px;border-right:1px solid var(--bd)}
.qs-item:last-child{border-right:none}
.qs-num{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;line-height:1;color:var(--tx-high)}
.qs-num.r{color:var(--acc)}
.qs-num.b{color:var(--blue)}
.qs-num.g{color:var(--green)}
.qs-num.gold{color:var(--gold)}
.qs-label{font-size:7.5px;color:var(--tx-muted);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ─── CONTINUE BANNER ─── */
.continue-banner{margin:14px 14px 0;background:linear-gradient(135deg,rgba(255,0,80,.08),rgba(255,0,80,.03));border:1px solid var(--bd-acc);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.continue-banner:active{transform:scale(.99)}
.cb-icon{width:40px;height:40px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cb-body{flex:1;min-width:0}
.cb-label{font-size:9px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.cb-ch{font-size:12px;font-weight:700;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-meta{font-size:9px;color:var(--tx-muted);margin-top:1px}
.cb-arrow{font-size:14px;color:var(--acc);flex-shrink:0}
.cb-progress{margin:8px 0 0;height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.cb-progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px}

/* ─── SECTION TABS ─── */
.section-tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd);background:rgba(0,0,0,.97);backdrop-filter:blur(12px);position:sticky;top:58px;z-index:100;margin-top:14px}
.section-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:10px 13px;font-size:11px;font-weight:700;color:var(--tx-faint);cursor:pointer;border-bottom:2.5px solid transparent;transition:.2s;white-space:nowrap}
.stab.active{color:var(--tx-high);border-bottom-color:var(--acc)}

/* ─── PANELS ─── */
.tab-panel{display:none;padding:14px}
.tab-panel.active{display:block}

/* ─── SYNOPSIS ─── */
.synopsis-card{background:var(--l1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.synopsis-text{font-size:13px;color:var(--tx-body);line-height:1.65}
.synopsis-text.truncated{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.synopsis-toggle{font-size:11px;font-weight:700;color:var(--acc3);cursor:pointer;margin-top:7px;display:inline-block}

.info-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd2)}
.info-row:last-child{border-bottom:none}
.info-icon{width:30px;height:30px;border-radius:8px;background:rgba(255,0,80,.06);border:1px solid var(--bd-acc);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.info-label{font-size:9px;color:var(--tx-muted);font-weight:600}
.info-val{font-size:12px;color:var(--tx-high);font-weight:600;margin-top:2px;line-height:1.4}

/* Tags */
.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.genre-pill{font-size:9px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(255,0,80,.07);border:1px solid var(--bd-acc);color:var(--acc3)}

/* ─── SEASON ACCORDION ─── */
.season-block{margin-bottom:10px;background:var(--l1);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.season-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;transition:.15s}
.season-hdr:active{background:rgba(255,255,255,.02)}
.season-num{font-family:'Playfair Display',serif;font-size:15px;font-weight:900;color:var(--tx-high)}
.season-meta{flex:1}
.season-title{font-size:12px;font-weight:700;color:var(--tx-high)}
.season-sub{font-size:9px;color:var(--tx-muted);margin-top:1px;display:flex;gap:8px;align-items:center}
.season-badge{font-size:7px;font-weight:800;padding:2px 6px;border-radius:6px}
.sb-new{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.sb-done{background:rgba(255,255,255,.05);color:#555;border:1px solid var(--bd)}
.season-arrow{font-size:11px;color:var(--tx-faint);transition:transform .25s}
.season-arrow.open{transform:rotate(180deg)}
.season-body{display:none;border-top:1px solid var(--bd2)}
.season-body.open{display:block}

/* Chapter row */
.ch-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;transition:.15s}
.ch-row:last-child{border-bottom:none}
.ch-row:active{background:rgba(255,255,255,.02)}
.ch-row.current-ch{background:rgba(255,0,80,.04)}
.ch-num-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;background:var(--l3);border:1.5px solid var(--bd);color:var(--tx-muted)}
.ch-num-badge.done{background:rgba(22,163,74,.08);color:#4ade80;border-color:rgba(22,163,74,.2)}
.ch-num-badge.current{background:rgba(255,0,80,.12);color:var(--acc);border-color:var(--bd-acc)}
.ch-num-badge.locked{color:#333}
.ch-info{flex:1;min-width:0}
.ch-title{font-size:12px;font-weight:700;color:var(--tx-high);line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-meta{font-size:9px;color:var(--tx-muted);display:flex;align-items:center;gap:8px}
.ch-badge{font-size:7px;font-weight:800;padding:1.5px 6px;border-radius:6px}
.crb-new{background:rgba(255,0,80,.08);color:var(--acc3);border:1px solid var(--bd-acc)}
.crb-free{background:rgba(52,211,153,.08);color:var(--green);border:1px solid rgba(52,211,153,.18)}
.ch-right{flex-shrink:0;display:flex;align-items:center;gap:7px}
.ch-read-btn{background:var(--acc);color:#fff;border:none;padding:5px 12px;border-radius:10px;font-size:9px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.ch-done-ico{color:#4ade80;font-size:12px}
.ch-lock-ico{color:#333;font-size:12px}
.ch-current-tag{font-size:7px;font-weight:800;color:var(--acc);background:rgba(255,0,80,.1);padding:2px 6px;border-radius:6px;border:1px solid var(--bd-acc)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0 4px}
.pg-btn{width:32px;height:32px;border-radius:8px;background:var(--l2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;color:var(--tx-muted);transition:.15s}
.pg-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.pg-btn:active{transform:scale(.92)}
.pg-btn.disabled{opacity:.3;pointer-events:none}
.pg-ellipsis{font-size:11px;color:var(--tx-faint)}

/* ─── TEAMS ─── */
.teams-section{margin-bottom:14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-title{font-size:11px;font-weight:800;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.1em}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.team-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--l1);cursor:pointer;transition:.18s;user-select:none}
.team-btn:active{transform:scale(.98)}
.team-icon{font-size:18px;flex-shrink:0}
.team-info{flex:1;min-width:0}
.team-name{font-size:10px;font-weight:800;color:var(--tx-high)}
.team-count{font-size:9px;color:var(--tx-muted);margin-top:1px}
.team-check{font-size:13px;color:var(--tx-faint)}
.team-btn[data-team="a"]{border-color:rgba(255,0,80,.3);background:rgba(255,0,80,.04)}
.team-btn[data-team="a"].selected{background:rgba(255,0,80,.14);border-color:#ff0050;box-shadow:0 2px 12px rgba(255,0,80,.2)}
.team-btn[data-team="a"].selected .team-name{color:#ff0050}
.team-btn[data-team="a"].selected .team-check{color:#ff0050}
.team-btn[data-team="b"]{border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.04)}
.team-btn[data-team="b"].selected{background:rgba(56,189,248,.16);border-color:#38bdf8;box-shadow:0 2px 12px rgba(56,189,248,.2)}
.team-btn[data-team="b"].selected .team-name{color:#38bdf8}
.team-btn[data-team="b"].selected .team-check{color:#38bdf8}
.team-btn[data-team="c"]{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.04)}
.team-btn[data-team="c"].selected{background:rgba(52,211,153,.16);border-color:#34d399;box-shadow:0 2px 12px rgba(52,211,153,.2)}
.team-btn[data-team="c"].selected .team-name{color:#34d399}
.team-btn[data-team="c"].selected .team-check{color:#34d399}
.team-btn[data-team="d"]{border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.04)}
.team-btn[data-team="d"].selected{background:rgba(167,139,250,.16);border-color:#a78bfa;box-shadow:0 2px 12px rgba(167,139,250,.2)}
.team-btn[data-team="d"].selected .team-name{color:#a78bfa}
.team-btn[data-team="d"].selected .team-check{color:#a78bfa}

.team-bars{height:5px;border-radius:5px;background:var(--bd);overflow:hidden;display:flex;margin-bottom:6px}
.team-bar-seg{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.team-bar-seg[data-team="a"]{background:#ff0050}
.team-bar-seg[data-team="b"]{background:#38bdf8}
.team-bar-seg[data-team="c"]{background:#34d399}
.team-bar-seg[data-team="d"]{background:#a78bfa}
.team-bar-labels{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.tbl-item{font-size:8px;font-weight:800;display:flex;align-items:center;gap:3px}
.tbl-dot{width:7px;height:7px;border-radius:50%}

/* ─── POLLS ─── */
.poll-card{background:var(--l1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.poll-hdr{padding:12px 14px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:7px}
.poll-icon{font-size:14px}
.poll-title{font-size:12px;font-weight:700;color:var(--tx-high);flex:1}
.poll-season-tag{font-size:8px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(255,0,80,.08);border:1px solid var(--bd-acc);color:var(--acc3)}
.poll-opts{padding:10px 14px}
.poll-opt{position:relative;border-radius:10px;padding:10px 12px;cursor:pointer;overflow:hidden;border:1.5px solid var(--bd);margin-bottom:7px;transition:border-color .2s;user-select:none}
.poll-opt:last-child{margin-bottom:0}
.poll-opt.voted{border-color:var(--acc)}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,0,80,.09);z-index:0;transition:width .6s cubic-bezier(.4,0,.2,1)}
.poll-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.poll-opt-txt{font-size:12px;font-weight:600;color:var(--tx-body)}
.poll-pct{font-size:11px;font-weight:800;color:var(--acc)}
.poll-footer{padding:8px 14px;border-top:1px solid var(--bd2);display:flex;align-items:center;justify-content:space-between}
.poll-total{font-size:9px;color:var(--tx-faint)}
.poll-share{font-size:9px;font-weight:700;color:var(--acc3);cursor:pointer}

/* ─── PREDICTIONS ─── */
.pred-card{background:var(--l1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.pred-hdr{padding:12px 14px;border-bottom:1px solid var(--bd2)}
.pred-label{font-size:9px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.pred-question{font-size:13px;font-weight:700;color:var(--tx-high);line-height:1.4}
.pred-opts{padding:10px 14px}
.pred-opt{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--bd);background:rgba(255,255,255,.02);margin-bottom:7px;cursor:pointer;transition:.2s;user-select:none}
.pred-opt:last-child{margin-bottom:0}
.pred-opt:active{transform:scale(.99)}
.pred-opt.picked{border-color:var(--purple);background:rgba(167,139,250,.1)}
.pred-opt-em{font-size:18px;flex-shrink:0}
.pred-opt-body{flex:1}
.pred-opt-txt{font-size:12px;font-weight:600;color:var(--tx-body)}
.pred-opt-sub{font-size:9px;color:var(--tx-muted);margin-top:1px}
.pred-opt-pct{font-size:11px;font-weight:800;color:var(--purple)}
.pred-footer{padding:8px 14px;border-top:1px solid var(--bd2);font-size:9px;color:var(--tx-faint);display:flex;align-items:center;gap:5px}

/* ─── DEBATES ─── */
.debate-card{background:var(--l1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.debate-hdr{padding:12px 14px;border-bottom:1px solid var(--bd2)}
.debate-live-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,0,80,.1);border:1px solid var(--bd-acc);border-radius:8px;padding:3px 8px;font-size:8px;font-weight:800;color:var(--acc);margin-bottom:6px}
.dlive-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.debate-motion{font-size:13px;font-weight:700;color:var(--tx-high);line-height:1.4;font-style:italic}
.debate-motion::before{content:'"';color:var(--acc);font-family:'Playfair Display',serif;font-size:18px;line-height:0;vertical-align:-.3em;margin-right:2px}
.debate-motion::after{content:'"';color:var(--acc);font-family:'Playfair Display',serif;font-size:18px;line-height:0;vertical-align:-.3em;margin-left:2px}
.debate-sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.deb-side{border-radius:11px;padding:12px;cursor:pointer;border:1.5px solid var(--bd);background:rgba(255,255,255,.02);text-align:center;transition:.2s;user-select:none}
.deb-side:active{transform:scale(.97)}
.deb-side.for.chosen{border-color:#10b981;background:rgba(16,185,129,.08)}
.deb-side.against.chosen{border-color:#ef4444;background:rgba(239,68,68,.08)}
.deb-em{font-size:22px;margin-bottom:4px}
.deb-lbl{font-size:11px;font-weight:800;margin-bottom:6px}
.deb-side.for .deb-lbl{color:#10b981}
.deb-side.against .deb-lbl{color:#ef4444}
.deb-bar-wrap{height:3px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:4px}
.deb-bar{height:100%;border-radius:3px;transition:width .6s ease}
.deb-side.for .deb-bar{background:#10b981}
.deb-side.against .deb-bar{background:#ef4444}
.deb-pct{font-size:12px;font-weight:800;color:var(--tx-muted)}
.deb-cnt{font-size:9px;color:var(--tx-faint);margin-top:2px}
.debate-stats-row{padding:0 14px 8px;display:flex;align-items:center;gap:5px;font-size:9px;color:var(--tx-faint)}
.debate-comments{padding:0 14px}
.deb-cm-label{font-size:9px;font-weight:800;color:var(--tx-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.deb-cm-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd2)}
.deb-cm-item:last-child{border-bottom:none}
.deb-cm-av{width:26px;height:26px;border-radius:50%;background:rgba(255,0,80,.15);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.deb-cm-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.deb-cm-body{flex:1}
.deb-cm-name{font-size:11px;font-weight:700;color:var(--tx-high);display:flex;align-items:center;gap:5px}
.deb-side-tag{font-size:7px;font-weight:800;padding:1.5px 6px;border-radius:6px}
.dst-for{background:rgba(16,185,129,.1);color:#10b981}
.dst-against{background:rgba(239,68,68,.1);color:#ef4444}
.deb-cm-txt{font-size:12px;color:var(--tx-muted);line-height:1.4;margin-top:2px}
.deb-cm-meta{font-size:9px;color:var(--tx-faint);margin-top:4px;display:flex;align-items:center;gap:8px}
.deb-cm-like{cursor:pointer;user-select:none;padding:2px 4px;border-radius:5px;display:flex;align-items:center;gap:2px}
.deb-cm-like.liked{color:var(--acc)}
.debate-input-row{padding:10px 14px 14px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--bd2)}
.deb-inp{flex:1;background:rgba(255,255,255,.04);border:1.5px solid var(--bd);border-radius:20px;padding:7px 13px;color:var(--tx-high);font-family:'DM Sans',sans-serif;font-size:12px;outline:none}
.deb-inp:focus{border-color:var(--bd-acc)}
.deb-post-btn{background:var(--acc);border:none;color:#fff;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:calc(var(--safe-b) + var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--l3);border:1px solid var(--bd);color:var(--tx-body);padding:8px 18px;border-radius:28px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── EMPTY / LOADING ─── */
.empty-state{text-align:center;padding:40px 20px;color:var(--tx-faint)}
.empty-state i{font-size:32px;margin-bottom:10px;display:block}
.empty-state p{font-size:12px}

/* ─── AD STRIP ─── */
.ad-strip{margin:0 0 14px;background:var(--l1);border:1px solid var(--bd);border-radius:13px;padding:10px 12px;display:flex;align-items:center;gap:9px;position:relative}
.ad-strip::after{content:'AD';position:absolute;top:6px;right:8px;font-size:7px;font-weight:800;color:#333;letter-spacing:.08em}
.ad-strip-logo{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:rgba(255,0,80,.15);display:flex;align-items:center;justify-content:center;font-size:14px}
.ad-strip-body{flex:1;min-width:0}
.ad-strip-brand{font-size:8px;font-weight:800;color:var(--blue);margin-bottom:1px}
.ad-strip-h{font-size:11px;font-weight:700;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-strip-sub{font-size:9px;color:var(--tx-faint)}
.ad-strip-cta{background:var(--acc);color:#fff;border:none;padding:5px 11px;border-radius:9px;font-size:9px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}

/* utility */
.sdiv{height:1px;background:var(--bd);margin:14px 0}

/* ─── PHONE SHELL (book-details merge) ─── */
.phone{width:100%;max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;box-shadow:0 0 50px rgba(0,0,0,.55);display:flex;flex-direction:column}


/* ─── REVIEWS + MORE-LIKE-THIS (book-details merge) ─── */
.more-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.more-row::-webkit-scrollbar{display:none}
.more-card{flex-shrink:0;width:104px;cursor:pointer}
.more-card:active{transform:scale(.96)}
.more-cover{width:104px;height:140px;border-radius:10px;overflow:hidden;background:var(--l2);margin-bottom:6px}
.more-cover img{width:100%;height:100%;object-fit:cover;display:block}
.more-title{font-size:10.5px;font-weight:700;line-height:1.3;color:var(--tx-high);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rev-card{background:var(--l1);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.rev-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rev-av{width:34px;height:34px;border-radius:50%;background:rgba(255,0,80,.15);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden}
.rev-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rev-name{font-size:12.5px;font-weight:800;color:var(--tx-high)}
.rev-meta{font-size:9px;color:var(--tx-faint);margin-top:1px}
.rev-text{font-size:12.5px;line-height:1.55;color:var(--tx-body);margin-bottom:8px}
.rev-foot{font-size:10.5px;font-weight:700;color:var(--tx-muted);display:flex;align-items:center;gap:5px}
.hw-name{cursor:pointer}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="phone">

<!-- TOP BAR -->
<div class="top-bar" id="topBar">
  <div class="tb-back" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
  <div class="tb-title">
    <div class="tb-series-name" id="tbSeriesName">Loading…</div>
    <div class="tb-series-sub" id="tbSeriesSub"></div>
  </div>
  <div class="tb-actions">
    <div class="tb-btn" id="saveBtn" onclick="SeriesReaderPage.toggleSave()"><i class="far fa-bookmark"></i></div>
    <div class="tb-btn" onclick="SeriesReaderPage.openShare()"><i class="fas fa-share-alt"></i></div>
  </div>
</div>

<!-- HERO -->
<div class="series-hero">
  <div class="hero-cover" id="heroCover"></div>
  <div class="hero-grad"></div>
  <div class="hero-content">
    <div class="hero-badges" id="heroBadges"></div>
    <div class="hero-title" id="heroTitle"></div>
    <div class="hero-writer-row">
      <img class="hw-av" id="hwAv" src="" alt=""/>
      <span class="hw-name" id="hwName"></span>
      <button class="hw-follow" id="hwFollow" onclick="SeriesReaderPage.toggleFollow()">+ Follow</button>
    </div>
  </div>
</div>

<!-- QUICK STATS -->
<div class="quick-stats" id="quickStats"></div>

<!-- CONTINUE BANNER -->
<div class="continue-banner" id="continueBanner" onclick="SeriesReaderPage.toast('Resuming from where you left off...')">
  <div class="cb-icon">📖</div>
  <div class="cb-body">
    <div class="cb-label">Continue Reading</div>
    <div class="cb-ch" id="cbChName"></div>
    <div class="cb-meta" id="cbChMeta"></div>
    <div class="cb-progress"><div class="cb-progress-fill" id="cbProgress"></div></div>
  </div>
  <div class="cb-arrow"><i class="fas fa-chevron-right"></i></div>
</div>

<!-- SECTION TABS -->
<div class="section-tabs" id="sectionTabs">
    <div class="stab active" data-tab="chapters" onclick="SeriesReaderPage.switchTab('chapters')">📖 Chapters</div>
    <div class="stab" data-tab="overview" onclick="SeriesReaderPage.switchTab('overview')">ℹ️ Overview</div>
    <div class="stab" data-tab="teams" onclick="SeriesReaderPage.switchTab('teams')" id="teamsTab" style="display:none">⚔️ Teams</div>
    <div class="stab" data-tab="polls" onclick="SeriesReaderPage.switchTab('polls')">📊 Polls & Predictions</div>
    <div class="stab" data-tab="debates" onclick="SeriesReaderPage.switchTab('debates')">💬 Debates</div>
</div>

<!-- ═══ CHAPTERS PANEL ═══ -->
<div class="tab-panel active" id="panel-chapters">
  <div id="chaptersContent"></div>
</div>

<!-- ═══ OVERVIEW PANEL ═══ -->
<div class="tab-panel" id="panel-overview">
  <div class="synopsis-card">
    <div class="synopsis-text truncated" id="synopsisText"></div>
    <span class="synopsis-toggle" id="synToggle" onclick="SeriesReaderPage.toggleSynopsis()">Read more ›</span>
  </div>

  <div style="background:var(--l1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px" id="infoRows"></div>

  <!-- Ad -->
  <div class="ad-strip">
    <div class="ad-strip-logo">💰</div>
    <div class="ad-strip-body">
      <div class="ad-strip-brand">PiggyVest</div>
      <div class="ad-strip-h">Save money. Build your future.</div>
      <div class="ad-strip-sub">4M+ Nigerians saving smarter</div>
    </div>
    <button class="ad-strip-cta">Start</button>
  </div>

  <!-- Series stats deep dive -->
  <div style="background:var(--l1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px">
    <div class="sh" style="margin-bottom:10px"><div class="sh-title">Series Stats</div></div>
    <div id="statsDeep"></div>
  </div>

  <div class="sh" style="margin:4px 0 10px"><div class="sh-title">Top reviews</div></div>
  <div id="reviewsContent"></div>

  <div class="sh" style="margin:14px 0 10px"><div class="sh-title">More like this</div></div>
  <div class="more-row" id="moreRow"></div>
</div>

<!-- ═══ TEAMS PANEL ═══ -->
<div class="tab-panel" id="panel-teams">
  <div class="teams-section" id="teamsSection"></div>
</div>

<!-- ═══ POLLS & PREDICTIONS PANEL ═══ -->
<div class="tab-panel" id="panel-polls">
  <div id="pollsContent"></div>
</div>

<!-- ═══ DEBATES PANEL ═══ -->
<div class="tab-panel" id="panel-debates">
  <div id="debatesContent"></div>
</div>

</div><!-- /.phone -->

<div class="toast" id="toast"></div>

<script src="../data/profile-demo-seed.js"></script>
<script src="../component/share-modal.js"></script>
<script src="../component/save-modal.js"></script>
<script src="../data/central-demo-data.js"></script>
<script src="../services/ad-service.js"></script>
<script src="../services/series-reader-service.js"></script>
<script>SeriesReaderPage.init();</script>

</body>
</html>
