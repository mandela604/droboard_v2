<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>FAQ — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--tx-body);display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.phone{width:100%;max-width:520px;min-height:100vh;background:var(--card);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden}
.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:15px;flex-shrink:0;border:1px solid var(--input-border)}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.top-title{flex:1;font-size:15px;font-weight:800;color:var(--text)}
.hero{padding:22px 16px 18px;border-bottom:1px solid var(--border);text-align:center}
.hero .badge{display:inline-block;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(236,72,153,.12);color:#ec4899;margin-bottom:10px;letter-spacing:.03em}
.hero h1{font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.01em}
.hero .meta{font-size:11.5px;color:var(--text-faint)}
.search-wrap{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:60px;z-index:100}
.search-box{position:relative}
.search-box input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:12.5px;font-family:inherit;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:12px}
#pageBody{padding:14px 16px 20px;flex:1;display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s}
.faq-item[open]{border-color:var(--accent);box-shadow:0 4px 14px -8px rgba(255,0,80,.35)}
.faq-item summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;user-select:none}
.faq-item summary::-webkit-details-marker{display:none}
.faq-q-num{width:22px;height:22px;border-radius:50%;background:rgba(255,0,80,.12);color:var(--accent);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.faq-q-text{flex:1;font-size:13px;font-weight:700;color:var(--text);line-height:1.4}
.faq-caret{color:var(--text-faint);font-size:11px;transition:transform .18s}
.faq-item[open] .faq-caret{transform:rotate(180deg);color:var(--accent)}
.faq-a{padding:0 16px 14px 50px;font-size:12.5px;line-height:1.65;color:var(--text-muted)}
.faq-a p{margin-bottom:8px}
.faq-a p:last-child{margin-bottom:0}
.faq-a ul{margin:0 0 8px 18px}
.faq-a li{margin-bottom:4px}
.empty{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:13px}
.no-match{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:12.5px}
.no-match i{color:#ec4899;font-size:20px;margin-bottom:8px;display:block}
.footer{padding:22px 16px;text-align:center;font-size:11px;color:var(--text-faint);border-top:1px solid var(--border);line-height:1.6}
.footer a{color:var(--accent);text-decoration:none;font-weight:700}
@media(max-width:480px){.phone{box-shadow:none}.search-wrap{top:60px}}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light'}document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button class="back-btn" onclick="history.length>1?history.length>1?history.back():location.href='feed.html':location.href='settings.html'"><i class="fas fa-chevron-left"></i></button>
    <div class="top-title">FAQ</div>
  </div>

  <div class="hero">
    <span class="badge">HELP CENTER</span>
    <h1 id="pageTitle">Frequently Asked Questions</h1>
    <div class="meta">Answers to the questions Droboard users ask most.</div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <i class="fas fa-magnifying-glass"></i>
      <input type="text" id="faqSearch" placeholder="Search questions…" autocomplete="off"/>
    </div>
  </div>

  <div id="pageBody"></div>

  <div class="footer">
    <p>Didn't find your answer? <a href="mailto:support@droboard.app">Contact support</a> · We reply within 24 hours.</p>
  </div>
</div>
<script src="../services/page-content-service.js?v=2"></script>
<script>
(function(){
  if(!window.PageContentService) return;
  var body = document.getElementById('pageBody');
  PageContentService.render('faq','pageBody');
  var doc = PageContentService.get('faq');
  if(doc && doc.title){
    document.getElementById('pageTitle').textContent = doc.title;
    document.title = doc.title + ' — Droboard';
    document.querySelector('.top-title').textContent = doc.title;
  }

  var input = document.getElementById('faqSearch');
  input.addEventListener('input', function(){
    var q = input.value.trim().toLowerCase();
    var items = body.querySelectorAll('.faq-item');
    var shown = 0;
    items.forEach(function(item){
      var text = item.textContent.toLowerCase();
      var match = !q || text.indexOf(q) !== -1;
      item.style.display = match ? '' : 'none';
      if(match){ shown++; if(q){ item.open = true; } }
    });
    var empty = body.querySelector('.no-match');
    if(shown === 0){
      if(!empty){
        var div = document.createElement('div');
        div.className = 'no-match';
        div.innerHTML = '<i class="fas fa-face-frown"></i>No questions match "'+input.value.replace(/</g,'&lt;')+'". Try a different keyword.';
        body.appendChild(div);
      } else {
        empty.innerHTML = '<i class="fas fa-face-frown"></i>No questions match "'+input.value.replace(/</g,'&lt;')+'". Try a different keyword.';
      }
    } else if(empty){ body.removeChild(empty); }
  });
})();
</script>
</body>
</html>
