<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Comments · DroBoard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
:root{
  --safe-b:env(safe-area-inset-bottom,12px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx-body);
  font-family:var(--font-ui)}
body{display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{display:none}

.phone{
  width:100%;max-width:420px;height:100dvh;background:var(--l1);
  box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow:hidden;
}

.top-bar{
  flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);
}
.top-icon-btn{
  width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx-muted);flex-shrink:0;
}
.top-center{flex:1;min-width:0}
.top-title{font-size:15px;font-weight:800;color:var(--tx-high)}
.top-sub{font-size:10.5px;color:var(--tx-muted);font-weight:600;margin-top:1px}

.story-strip{
  flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--bd2);background:var(--l1);
}
.story-strip-cover{width:34px;height:46px;border-radius:7px;object-fit:cover;flex-shrink:0;background:var(--l2)}
.story-strip-body{flex:1;min-width:0}
.story-strip-title{font-size:13px;font-weight:800;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-strip-by{font-size:11px;color:var(--tx-muted);margin-top:1px}

#commentsMount{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:6px 14px 10px}

.toast{
  position:fixed;bottom:calc(var(--safe-b) + 24px);left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--l1);border:1px solid var(--bd);color:var(--tx-body);padding:9px 16px;border-radius:24px;
  font-size:12px;font-weight:600;z-index:900;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="../component/img-guard.js"></script>
<script src="../component/app-nav.js"></script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button type="button" class="top-icon-btn" id="backBtn" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div class="top-center">
      <div class="top-title">Comments</div>
      <div class="top-sub" id="pageSub"></div>
    </div>
  </div>

  <div id="commentsMount"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../data/central-demo-data.js"></script>
<script src="../data/comments-data.js"></script>
<script src="../component/reaction-picker.js"></script>
<script src="../component/share-modal.js"></script>
<script src="../component/report-sheet.js"></script>
<script src="../component/ad-card.js?v=3"></script>
<script src="../marketing/shared/marketing-data.js"></script>
<script src="../services/ad-service.js"></script>
<script src="../services/ad-revenue-service.js"></script>
<script src="../services/auth-session.js"></script>
<script src="../services/league-service.js"></script>
<script src="../component/status-viewer.js?v=2"></script>
<script src="../component/comment-section.js?v=5"></script>
<script src="../services/comments-service.js?v=1"></script>
<script>CommentsPage.init();</script>
<script src="../shared/theme-chrome.js"></script>
</body>
</html>
