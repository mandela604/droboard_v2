<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>DroBoard — Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--pink:#FF2D6A;--ink:#17151B;--gray-400:#9A96A3;--gray-600:#635F6E;--line:#EFEDF2;--divider:#F3F1F5;--white:#fff;--font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-body);background:var(--divider);display:flex;justify-content:center;padding-bottom:80px}
.phone{width:100%;max-width:420px;min-height:100vh;background:var(--white);box-shadow:0 0 50px rgba(0,0,0,.08);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.progress-card{background:linear-gradient(135deg,#FF2D6A,#D6165A);border-radius:16px;padding:16px;color:#fff;margin:16px}
.progress-bar{height:6px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:#fff;border-radius:10px;transition:.3s}
.post-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 16px 12px;cursor:pointer;transition:.15s}
.post-card:active{transform:scale(.98)}
.post-card.read{border-color:var(--pink);background:#FFF0F5}
.post-title{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--ink);margin-bottom:4px}
.post-excerpt{font-size:12px;color:var(--gray-600);line-height:1.5;margin-bottom:8px}
.post-meta{font-size:10px;color:var(--gray-400);font-weight:600;display:flex;align-items:center;gap:8px}
.ad-box{background:var(--divider);border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;font-size:11px;color:var(--gray-400);font-weight:700;margin:0 16px 12px}
.ad-box span{background:var(--pink);color:#fff;padding:2px 6px;border-radius:6px;font-size:9px;margin-right:6px}
</style>
<script src="../services/store-service.js"></script>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="icon-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
    <div style="font-family:var(--font-display);font-weight:800">Blog & Earn</div>
    <div class="icon-btn" onclick="location.href='store.html'"><i class="fas fa-coins"></i></div>
  </div>

  <div style="display:flex;gap:8px;padding:12px 16px">
    <button class="niche-tab active" data-niche="tech" onclick="switchNiche('tech')" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--pink);background:var(--pink);color:#fff;font-weight:800;font-size:12px;cursor:pointer"><i class="fas fa-microchip"></i> Tech</button>
    <button class="niche-tab" data-niche="health" onclick="switchNiche('health')" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);font-weight:800;font-size:12px;cursor:pointer"><i class="fas fa-heart-pulse"></i> Health</button>
  </div>

  <div class="progress-card" id="progressCard"></div>

  <div class="ad-box"><span>Ad</span> Sponsored — Ads here earn for you (ca-pub-YOUR_ID) — 1k impressions = RPM</div>

  <div id="blogList"></div>

  <div class="ad-box"><span>Ad</span> More from our sponsors — thank you for reading</div>
</div>

<script src="../services/blog-service.js"></script>
</body>
</html>
