<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droboard · Your Feed</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../shared/theme.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --shadow: 0 2px 12px rgba(0,0,0,0.04); --radius: 14px;
      --story-size: 62px; --ring-gap: 3px; --max-w: 420px;
    }
    [data-theme="dark"] {
      --shadow: 0 2px 12px rgba(0,0,0,.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-ui); background: var(--bg); color: var(--tx); -webkit-tap-highlight-color: transparent; }
    .safe { height: env(safe-area-inset-top, 0px); }

    /* ── Shell ── */
    .shell { max-width: var(--max-w); margin: 0 auto; padding-bottom: 110px; }

    /* ── Nav ── */
    .top-bar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--card); }
    .top-bar .logo { width: 36px; height: 36px; border-radius: 50%; background: var(--l1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
    .top-actions { display: flex; gap: 8px; }
  .top-bar .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; margin: 0 12px; padding: 8px 14px; background: var(--l1); border: 1px solid var(--bd); border-radius: 22px; font-size: 13px; color: var(--tx-muted); cursor: pointer; white-space: nowrap; }
  .top-bar .search i { font-size: 13px; opacity: .7; flex-shrink: 0; }
  .top-bar .search span { overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--l1); color: var(--tx); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
    .icon-btn.pink { background: var(--acc-light); color: var(--acc); border: 1px solid var(--bd-acc); }
    svg.ic { display: block; flex-shrink: 0; }
    .icon-btn:active { transform: scale(0.95); }
    .notif-dot { position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px; border-radius: 7px; background: #ff3b30; color: white; font-size: 8px; font-weight: 700; display: none; align-items: center; justify-content: center; padding: 0 3px; }

    /* ── Stories ── */
    .stories-wrap { margin-top: 10px; padding: 14px 0 10px 16px; border-bottom: 1px solid var(--border); background: var(--l1); }
    .stories-label { font-size: 12px; font-weight: 600; color: var(--tx-muted); margin-bottom: 10px; }
    .stories-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
    .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .story-add { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 300; color: var(--tx-muted); border: 2px dashed var(--tx-muted); border-radius: 50%; box-sizing: border-box; }
    .story-name { font-size: 10px; font-weight: 500; color: var(--tx-muted); max-width: var(--story-size); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .story-item { position: relative; }
    .story-post-plus { position: absolute; top: 40px; left: calc(50% + 10px); width: 22px; height: 22px; border-radius: 50%; background: var(--acc); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; line-height: 1; z-index: 2; }
    .story-post-plus:active { transform: scale(.9); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .f-tab { flex: 1; text-align: center; padding: 12px 0 10px; font-size: 13px; font-weight: 600; color: var(--tx-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s; }
    .f-tab.active { color: var(--acc); border-bottom-color: var(--acc); }
    .f-tab:active { opacity: 0.7; }

    /* ── Feed ── */
    .feed { min-height: 200px; }
    #feedList { display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
    #feedList > * { background: var(--l1); }
    #feedList > .pcc-post { border-bottom: none; }
    #feedList > #commSecMid { background: transparent; }
    .comment-overlay{position:fixed;inset:0;z-index:1700;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
    .comment-overlay.open{display:flex}
    .comment-sheet{width:100%;max-width:520px;background:var(--l1);border-radius:20px 20px 0 0;max-height:86vh;display:flex;flex-direction:column;animation:cmSlide .28s ease}
    @keyframes cmSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .comment-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
    .comment-hdr h3{font-size:13.5px;font-weight:800;color:var(--tx)}
    .comment-close{width:28px;height:28px;border-radius:50%;background:var(--l2);border:none;color:var(--tx-muted);font-size:12px;cursor:pointer}
    .comment-mount{flex:1;overflow-y:auto;padding:4px 16px 16px;scrollbar-width:none}
    .comment-mount::-webkit-scrollbar{display:none}
    #promoMount { padding: 12px 16px; background: var(--card); margin: 0 12px 12px; border-radius: 16px; overflow: hidden; }

    /* ── Community Sections ── */
    .comm-sec { padding: 0; }
    .comm-sec-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
    .comm-sec-title { font-size: 14px; font-weight: 700; color: var(--tx); display: flex; align-items: center; gap: 8px; }
    .comm-sec-title i { color: var(--acc); font-size: 13px; }
    .comm-sec-link { background: none; border: none; font-size: 12px; font-weight: 600; color: var(--tx-muted); cursor: pointer; }
.comm-row { display: flex; align-items: stretch; gap: 12px; overflow-x: auto; padding: 0 16px 0; -ms-overflow-style: none; scrollbar-width: none; }
.comm-row::-webkit-scrollbar { display: none; }
.comm-slide { flex-shrink: 0; width: 260px; display: flex; }

    /* ── States ── */
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 16px; }
    .loading-state.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--l1); border-top-color: var(--acc); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { display: none; flex-direction: column; align-items: center; text-align: center; padding: 80px 24px; gap: 12px; }
    .empty-state .icon { font-size: 44px; opacity: 0.25; }
    .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--tx); }
    .empty-state p { font-size: 13px; color: var(--tx-muted); line-height: 1.5; }
    .empty-state.hidden { display: none; }

    /* ── Composer overlay ── */
    .composer-ov { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s ease; }
    .composer-ov.open { transform: translateY(0); }
    .composer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .composer-head .cancel { background: none; border: none; font-size: 14px; color: var(--tx-muted); cursor: pointer; }
    .composer-head .title { font-size: 15px; font-weight: 700; }
    .composer-head .post-btn { background: var(--acc); color: #fff; border: none; padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .composer-body { flex: 1; padding: 14px 16px; }
    .composer-body textarea { width: 100%; height: 160px; border: none; outline: none; font-size: 15px; font-family: inherit; resize: none; background: transparent; color: var(--tx); }
    .composer-tools { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .composer-tools .ctype { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--tx-muted); cursor: pointer; }
    .composer-tools .ctype.active { border-color: var(--acc); color: var(--acc); background: var(--acc-light); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 1000; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }

    /* ── Skeleton loader (profile style) ── */
    #loadingState{display:block;padding:16px 14px}
    .sk{background:linear-gradient(90deg,var(--l2) 25%,var(--l4) 37%,var(--l2) 63%);background-size:400% 100%;animation:skShimmer 1.4s ease infinite;border-radius:10px}
    @keyframes skShimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
    .sk-stories{display:flex;gap:10px;margin-bottom:14px}
    .sk-story{width:74px;height:100px;border-radius:12px;flex:none}
    .sk-composer{height:88px;margin-bottom:16px}
    .sk-post{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px}
    .sk-av{width:42px;height:42px;border-radius:50%;flex:none}
    .sk-lines{flex:1}
    .sk-line{height:12px;border-radius:6px;margin-bottom:9px}
    .sk-img{height:150px;border-radius:12px;margin-top:6px}
  </style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="../component/img-guard.js"></script>
<script src="../component/app-nav.js?v=7"></script>
</head>
<body>
  <div class="safe"></div>
  <div class="shell">
    <div class="top-bar">
      <div class="logo"><img src="../assets/droboard-icon.png" alt="Droboard" style="height:28px;width:auto;display:block;border-radius:8px"/></div>
      <div class="search" data-search-trigger><i class="fas fa-search"></i><span>Search stories, genres...</span></div>
      <div class="top-actions">
        <a href="store.html" class="icon-btn pink" id="feedGiftBtn" aria-label="Store" style="text-decoration:none"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></a>
        <button class="icon-btn" onclick="location.href='notifications.html'"><i class="fas fa-bell"></i><span class="notif-dot" id="notifCount">3</span></button>
        <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      </div>
    </div>

    <div class="stories-wrap">
      <div class="stories-label">Stories</div>
      <div class="stories-row" id="storiesRow"></div>
    </div>

    <div class="tabs">
      <div class="f-tab active" data-sort="latest">All</div>
      <div class="f-tab" data-sort="following">Following</div>
      <div class="f-tab" data-sort="debates">Debates</div>
    </div>

    <section class="comm-sec" id="commSec1" style="display:none">
      <div class="comm-sec-head">
        <div class="comm-sec-title"><i class="fas fa-bolt"></i> Trending in hubs</div>
        <button type="button" class="comm-sec-link" onclick="FeedPage.goToHubs()">See all ›</button>
      </div>
      <div class="comm-row" id="commRow1"></div>
    </section>

    <div class="feed">
      <div class="loading-state" id="loadingState">
        <div class="sk-stories"><div class="sk sk-story"></div><div class="sk sk-story"></div><div class="sk sk-story"></div><div class="sk sk-story"></div></div>
        <div class="sk sk-composer"></div>
        <div class="sk-post"><div class="sk sk-av"></div><div class="sk-lines"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:35%"></div><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-img"></div></div></div>
        <div class="sk-post"><div class="sk sk-av"></div><div class="sk-lines"><div class="sk sk-line" style="width:50%"></div><div class="sk sk-line" style="width:30%"></div><div class="sk sk-line"></div><div class="sk sk-line" style="width:85%"></div></div></div>
      </div>
      <div class="empty-state" id="emptyState"><div class="icon">📭</div><h3 id="emptyTitle">Your feed is empty</h3><p id="emptySub">Follow some writers or join communities to see posts here.</p></div>
      <div id="promoMount"><div data-ad-slot="feed:in-feed" data-ad-format="native" style="margin:0 12px 12px"></div></div>
      <div id="feedList"></div>
    </div>

    <section class="comm-sec" id="commSec2" style="display:none">
      <div class="comm-sec-head">
        <div class="comm-sec-title"><i class="fas fa-fire"></i> More from hubs</div>
        <button type="button" class="comm-sec-link" onclick="FeedPage.goToHubs()">See all ›</button>
      </div>
      <div class="comm-row" id="commRow2"></div>
    </section>
  </div>

  <div class="composer-ov" id="postComposerOv">
    <div class="composer-head">
      <button class="cancel" onclick="FeedPage.closePostComposer()">Cancel</button>
      <div class="title">New post</div>
      <button class="post-btn" onclick="FeedPage.submitPost()">Post</button>
    </div>
    <div class="composer-body">
      <textarea id="composerText" placeholder="What's on your mind?"></textarea>
    </div>
    <div class="composer-tools">
      <button class="ctype active" data-ct="text"><i class="fas fa-pen"></i> Text</button>
      <button class="ctype" data-ct="image"><i class="fas fa-image"></i> Image</button>
      <button class="ctype" data-ct="poll"><i class="fas fa-chart-bar"></i> Poll</button>
      <button class="ctype" data-ct="debate"><i class="fas fa-fire"></i> Debate</button>
      <button class="ctype" data-ct="ama"><i class="fas fa-microphone"></i> AMA</button>
      <button class="ctype" data-ct="status"><i class="fas fa-circle-dot"></i> Status</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="comment-overlay" id="commentOverlay" onclick="if(event.target===this)FeedPage.closeComments()">
    <div class="comment-sheet">
      <div class="comment-hdr"><h3><i class="fas fa-comment-dots" style="color:var(--acc);font-size:12px"></i> Comments</h3><button class="comment-close" onclick="FeedPage.closeComments()">✕</button></div>
      <div class="comment-mount" id="commentMount"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="../data/feed-demo-seed.js"></script>
  <script src="../data/genre-demo-seed.js"></script>
  <script src="../services/feed-data.js"></script>
<script src="../component/expiry-chips.js?v=3"></script>
  <script src="../component/post-composer.js?v=5"></script>
<script src="../services/reading-history.js"></script>
  <script src="../component/boards-overlay.js"></script>
  <script src="../component/browse-overlay.js?v=13"></script>
  <script src="../component/status-viewer.js?v=15"></script>
  <script src="../component/status-ring.js?v=4"></script>
  <script src="../shared/status-loader.js"></script>
  <script src="../component/promo-slider.js?v=2"></script>
  <script src="../component/report-sheet.js"></script>
  <script src="../component/dots-menu.js"></script>
  <script src="../component/post-card.js?v=6"></script>
  <script src="../component/debate-args.js?v=7"></script>
  <script src="../component/reaction-picker.js"></script>
  <script src="../data/comments-data.js"></script>
  <script src="../component/comment-section.js?v=11"></script>
  <script src="../component/share-modal.js"></script>
  <script src="../services/saves-bridge.js"></script>
  <script src="../component/save-modal.js"></script>
  <script src="../component/genre-card.js?v=6"></script>
  <script src="../component/ad-card.js?v=6"></script>
  <script src="../component/bottom-nav.js"></script>
  <script src="../component/hamburger-menu.js"></script>
  <script src="../component/search-overlay.js?v=4"></script>
  <script src="../data/central-demo-data.js"></script>
  <script src="../marketing/shared/marketing-data.js"></script>
  <script src="../services/audience-rules.js?v=2"></script>
<script src="../services/audience-service.js?v=3"></script>
  <script src="../services/ad-service.js?v=4"></script>
<script src="../services/ad-revenue-service.js?v=5"></script>
  <script src="../component/ad-slot.js?v=2"></script>
  <script src="../services/people-service.js"></script>
  <script src="../services/status-service.js?v=7"></script>
  <script src="../component/writers-row.js?v=1"></script>
  <script src="../services/search-service.js"></script>
  <script src="../shared/ui-helpers.js"></script>
  <script src="../services/feed-service.js?v=3"></script>
  <script>FeedPage.init();</script>
<script src="../shared/theme-chrome.js"></script>
</body>
</html>
