<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droboard – Your Feed</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --bg: #ffffff; --l1: #f8f9fa; --l2: #ffffff; --l4: #e8e8e8; --tx: #1a1a2e; --tx-muted: #6b7280;
      --tx-high: #161616; --tx-body: #3a3a3a; --tx-faint: #8a8a8a;
      --bd: rgba(0,0,0,.10); --bd2: rgba(0,0,0,.05); --bd-acc: rgba(255,0,80,.25); --purple: #a78bfa;
      --acc: #ff0050; --acc-light: rgba(255,0,80,0.1); --acc-lighter: rgba(255,0,80,0.15);
      --border: #f1f1f1; --shadow: 0 2px 12px rgba(0,0,0,0.04); --radius: 14px;
      --story-size: 62px; --ring-gap: 3px; --max-w: 480px;
    }
    [data-theme="dark"] {
      --bg: #000000; --l1: #08090c; --l2: #0e0f13; --l4: #1a1b22; --tx: #e0e0e0; --tx-muted: #71717a;
      --tx-high: #e0e0e0; --tx-body: #c0c0c0; --tx-faint: #3f3f46;
      --bd: rgba(255,255,255,.07); --bd2: rgba(255,255,255,.04); --bd-acc: rgba(255,0,80,.20); --purple: #a78bfa;
      --acc: #ff0050; --acc-light: rgba(255,0,80,0.14); --acc-lighter: rgba(255,0,80,0.2);
      --border: rgba(255,255,255,.07); --shadow: 0 2px 12px rgba(0,0,0,.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--tx); -webkit-tap-highlight-color: transparent; }
    .safe { height: env(safe-area-inset-top, 0px); }

    /* ── Shell ── */
    .shell { max-width: var(--max-w); margin: 0 auto; padding-bottom: 110px; }

    /* ── Nav ── */
    .top-bar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .top-bar .logo { font-weight: 700; font-size: 18px; color: var(--acc); }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--l1); color: var(--tx); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; }
    .icon-btn:active { transform: scale(0.95); }
    .notif-dot { position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px; border-radius: 7px; background: #ff3b30; color: white; font-size: 8px; font-weight: 700; display: none; align-items: center; justify-content: center; padding: 0 3px; }

    /* ── Stories ── */
    .stories-wrap { padding: 14px 0 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .stories-label { font-size: 12px; font-weight: 600; color: var(--tx-muted); margin-bottom: 10px; }
    .stories-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
    .stories-row::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
    .story-ring { width: var(--story-size); height: var(--story-size); border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #ff0050, #ff4d7a 55%, #ff7a9a); transition: transform 0.2s; }
    .story-ring:active { transform: scale(0.96); }
    .story-ring.own { background: none; }
    .story-ring.ring-live { box-shadow: 0 0 12px rgba(255,0,80,.55); }
    .story-ring.ring-viewed { background: var(--tx-muted); opacity: .75; }
    .story-ring.ring-none { background: var(--border); }
    .story-ring .inner { width: 100%; height: 100%; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--bg); }
    .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .story-add { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 300; color: var(--tx-muted); border: 2px dashed var(--tx-muted); border-radius: 50%; box-sizing: border-box; }
    .story-name { font-size: 10px; font-weight: 500; color: var(--tx-muted); max-width: var(--story-size); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 49px; z-index: 39; }
    .f-tab { flex: 1; text-align: center; padding: 12px 0 10px; font-size: 13px; font-weight: 600; color: var(--tx-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s; }
    .f-tab.active { color: var(--acc); border-bottom-color: var(--acc); }
    .f-tab:active { opacity: 0.7; }

    /* ── Feed ── */
    .feed { min-height: 200px; }
    #feedList { display: flex; flex-direction: column; gap: 2px; background: #d8d8d8; }
    [data-theme="dark"] #feedList { background: #000; }
    #feedList > * { background: var(--l2); }
    #promoMount { padding: 12px 16px; }

    /* ── Community Sections ── */
    .comm-sec { padding: 0 0 4px; }
    .comm-sec-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
    .comm-sec-title { font-size: 14px; font-weight: 700; color: var(--tx); display: flex; align-items: center; gap: 8px; }
    .comm-sec-title i { color: var(--acc); font-size: 13px; }
    .comm-sec-link { background: none; border: none; font-size: 12px; font-weight: 600; color: var(--tx-muted); cursor: pointer; }
    .comm-row { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 14px; -ms-overflow-style: none; scrollbar-width: none; }
    .comm-row::-webkit-scrollbar { display: none; }
    .comm-slide { flex-shrink: 0; width: 260px; }

    /* ── States ── */
    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 16px; }
    .loading-state.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--l1); border-top-color: var(--acc); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { display: none; flex-direction: column; align-items: center; text-align: center; padding: 80px 24px; gap: 12px; }
    .empty-state .icon { font-size: 44px; opacity: 0.25; }
    .empty-state h3 { font-size: 16px; font-weight: 700; color: var(--tx); }
    .empty-state p { font-size: 13px; color: var(--tx-muted); line-height: 1.5; }
    .empty-state.hidden { display: none; }

    /* ── Composer overlay ── */
    .composer-ov { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s ease; }
    .composer-ov.open { transform: translateY(0); }
    .composer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .composer-head .cancel { background: none; border: none; font-size: 14px; color: var(--tx-muted); cursor: pointer; }
    .composer-head .title { font-size: 15px; font-weight: 700; }
    .composer-head .post-btn { background: var(--acc); color: #fff; border: none; padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .composer-body { flex: 1; padding: 14px 16px; }
    .composer-body textarea { width: 100%; height: 160px; border: none; outline: none; font-size: 15px; font-family: inherit; resize: none; background: transparent; color: var(--tx); }
    .composer-tools { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .composer-tools .ctype { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--tx-muted); cursor: pointer; }
    .composer-tools .ctype.active { border-color: var(--acc); color: var(--acc); background: var(--acc-light); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 1000; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="safe"></div>
  <div class="shell">
    <div class="top-bar">
      <div class="logo">Droboard</div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" onclick="FeedPage.toggleTheme()"><i id="themeIcon" class="fas fa-moon"></i></button>
        <button class="icon-btn" onclick="location.href='notifications.html'"><i class="fas fa-bell"></i><span class="notif-dot" id="notifCount">3</span></button>
        <button class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      </div>
    </div>

    <div class="stories-wrap">
      <div class="stories-label">Stories</div>
      <div class="stories-row" id="storiesRow"></div>
    </div>

    <div class="tabs">
      <div class="f-tab active">All</div>
      <div class="f-tab">Following</div>
      <div class="f-tab">Debates</div>
    </div>

    <section class="comm-sec" id="commSec1" style="display:none">
      <div class="comm-sec-head">
        <div class="comm-sec-title"><i class="fas fa-bolt"></i> Trending in hubs</div>
        <button type="button" class="comm-sec-link" onclick="FeedPage.goToHubs()">See all ›</button>
      </div>
      <div class="comm-row" id="commRow1"></div>
    </section>

    <div class="feed">
      <div class="loading-state" id="loadingState"><div class="spinner"></div><div style="font-size:13px;color:var(--tx-muted)">Loading feed…</div></div>
      <div class="empty-state" id="emptyState"><div class="icon">📭</div><h3 id="emptyTitle">Your feed is empty</h3><p id="emptySub">Follow some writers or join communities to see posts here.</p></div>
      <div id="promoMount"></div>
      <div id="feedList"></div>
    </div>

    <section class="comm-sec" id="commSec2" style="display:none">
      <div class="comm-sec-head">
        <div class="comm-sec-title"><i class="fas fa-fire"></i> More from hubs</div>
        <button type="button" class="comm-sec-link" onclick="FeedPage.goToHubs()">See all ›</button>
      </div>
      <div class="comm-row" id="commRow2"></div>
    </section>
  </div>

  <div class="composer-ov" id="postComposerOv">
    <div class="composer-head">
      <button class="cancel" onclick="FeedPage.closePostComposer()">Cancel</button>
      <div class="title">New post</div>
      <button class="post-btn" onclick="FeedPage.submitPost()">Post</button>
    </div>
    <div class="composer-body">
      <textarea id="composerText" placeholder="What's on your mind?"></textarea>
    </div>
    <div class="composer-tools">
      <button class="ctype active" data-ct="text"><i class="fas fa-pen"></i> Text</button>
      <button class="ctype" data-ct="image"><i class="fas fa-image"></i> Image</button>
      <button class="ctype" data-ct="poll"><i class="fas fa-chart-bar"></i> Poll</button>
      <button class="ctype" data-ct="debate"><i class="fas fa-fire"></i> Debate</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <link rel="stylesheet" href="../component/bottom-nav.css">
  <link rel="stylesheet" href="../component/search-overlay.css">
  <link rel="stylesheet" href="../component/hamburger-menu.css">
  <link rel="stylesheet" href="../component/promo-slider.css">
  <link rel="stylesheet" href="../component/genre-card.css">
  <link rel="stylesheet" href="../component/dots-menu.css">
  <link rel="stylesheet" href="../component/post-card.css">
  <link rel="stylesheet" href="../component/reaction-picker.css">
  <link rel="stylesheet" href="../component/share-modal.css">
  <link rel="stylesheet" href="../component/save-modal.css">
  <link rel="stylesheet" href="../component/ad-card.css">
  <link rel="stylesheet" href="../component/status-viewer.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="../data/feed-demo-seed.js"></script>
  <script src="../data/genre-demo-seed.js"></script>
  <script src="../services/feed-data.js"></script>
  <script src="../component/status-viewer.js"></script>
  <script src="../component/promo-slider.js"></script>
  <script src="../component/dots-menu.js"></script>
  <script src="../component/post-card.js"></script>
  <script src="../component/reaction-picker.js"></script>
  <script src="../component/share-modal.js"></script>
  <script src="../component/save-modal.js"></script>
  <script src="../component/genre-card.js"></script>
  <script src="../component/ad-card.js"></script>
  <script src="../component/bottom-nav.js"></script>
  <script src="../component/hamburger-menu.js"></script>
  <script src="../component/search-overlay.js"></script>
  <script src="../data/central-demo-data.js"></script>
  <script src="../marketing/shared/marketing-data.js"></script>
  <script src="../services/ad-service.js"></script>
  <script src="../services/search-service.js"></script>
  <script src="../services/feed-service.js"></script>
  <script>FeedPage.init();</script>
</body>
</html>
