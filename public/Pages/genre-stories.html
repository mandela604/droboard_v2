<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#ffffff"/>
<title>Genre Stories · DroBoard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
:root{
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,12px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx-body);
  font-family:var(--font-ui)}
body{display:flex;justify-content:center;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}
.phone{
  width:100%;max-width:420px;min-height:100vh;background:var(--l1);position:relative;
  box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden;
  padding-bottom:calc(var(--safe-b) + var(--nav-h) + 16px);
}
.top-bar{
  position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:10px;
  padding:11px 12px;background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);
}
.top-icon-btn{
  width:36px;height:36px;border-radius:50%;background:var(--l2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx-muted);flex-shrink:0;
}
.top-icon-btn:active{transform:scale(.92)}
.top-center{flex:1;min-width:0}
.top-title{font-size:15px;font-weight:800;color:var(--tx-high);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:10.5px;color:var(--tx-muted);font-weight:600;margin-top:1px}
.sort-row{
  display:flex;gap:7px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--l1);
  position:sticky;top:57px;z-index:140;
}
.sort-chip{
  flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;
  font-size:11.5px;font-weight:700;background:var(--l2);border:1px solid var(--bd);color:var(--tx-muted);
}
.sort-chip.active{background:rgba(255,0,80,.08);border-color:var(--bd-acc);color:var(--acc)}
.feed{background:var(--bg);min-height:200px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
[data-theme="dark"] .feed{background:#000}
.empty{padding:40px 20px;text-align:center;color:var(--tx-faint);font-size:13px;font-weight:600}
.more-wrap{padding:4px 14px 10px;background:var(--bg)}
[data-theme="dark"] .more-wrap{background:#000}
.more-btn{
  width:100%;padding:12px;border-radius:12px;background:var(--l2);border:1px solid var(--bd);
  font-size:13px;font-weight:800;color:var(--tx-high);
}
.more-btn:active{transform:scale(.98)}
.more-btn:disabled{opacity:.5}
.toast{
  position:fixed;bottom:calc(var(--safe-b) + var(--nav-h) + 14px);left:50%;
  transform:translateX(-50%) translateY(14px);background:var(--l1);border:1px solid var(--bd);
  color:var(--tx-body);padding:9px 16px;border-radius:24px;font-size:12px;font-weight:600;
  z-index:900;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="../component/img-guard.js"></script>
<script src="../component/app-nav.js"></script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button type="button" class="top-icon-btn" onclick="history.back()" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
    <div class="top-center">
      <div class="top-title" id="pageTitle">Genre Stories</div>
      <div class="top-sub" id="pageSub">Top 10 in this genre</div>
    </div>
  </div>
  <div class="sort-row" id="sortRow">
    <button type="button" class="sort-chip active" data-sort="top"><i class="fas fa-arrow-trend-up"></i> Top</button>
    <button type="button" class="sort-chip" data-sort="new"><i class="fas fa-clock"></i> New</button>
    <button type="button" class="sort-chip" data-sort="rising"><i class="fas fa-fire"></i> Rising</button>
  </div>
  <div class="feed" id="feed"></div>
  <div class="more-wrap">
    <button type="button" class="more-btn" id="moreBtn">Load more</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../data/genre-demo-seed.js"></script>
<script src="../data/central-demo-data.js"></script>
<script src="../component/book-card.js?v=1"></script>
<script src="../component/bottom-nav.js"></script>
<script src="../services/genre-stories-service.js?v=1"></script>
<script>GenreStoriesPage.init();</script>
<script src="../shared/theme-chrome.js"></script>
</body>
</html>
