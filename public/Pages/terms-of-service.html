<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Terms of Service — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="../shared/theme.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--tx-body);display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.phone{width:100%;max-width:520px;min-height:100vh;background:var(--card);position:relative;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden}
.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:15px;flex-shrink:0;border:1px solid var(--input-border)}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.top-title{flex:1;font-size:15px;font-weight:800;color:var(--text)}
.hero{padding:22px 16px 18px;border-bottom:1px solid var(--border);text-align:center}
.hero .badge{display:inline-block;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(255,0,80,.1);color:var(--accent);margin-bottom:10px;letter-spacing:.03em}
.hero h1{font-size:22px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.01em}
.hero .meta{font-size:11.5px;color:var(--text-faint)}
#pageBody{padding:0;flex:1}
.page-section{padding:22px 18px;border-bottom:1px solid var(--border)}
.page-section:last-child{border-bottom:none}
.page-section h2{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.page-section p{font-size:13px;line-height:1.7;color:var(--text-muted);margin-bottom:10px}
.page-section ul{margin:0 0 12px 20px}
.page-section li{font-size:13px;line-height:1.7;color:var(--text-muted);margin-bottom:6px}
.footer{padding:22px 18px;text-align:center;font-size:11px;color:var(--text-faint);border-top:1px solid var(--border);line-height:1.6}
.empty{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:13px}
@media(max-width:480px){.phone{box-shadow:none}}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light'}document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button class="back-btn" onclick="history.length>1?history.length>1?history.back():location.href='feed.html':location.href='store.html'"><i class="fas fa-chevron-left"></i></button>
    <div class="top-title">Terms of Service</div>
  </div>

  <div class="hero">
    <span class="badge">LEGAL AGREEMENT</span>
    <h1 id="pageTitle">Terms of Service</h1>
    <div class="meta">Last updated: November 1, 2026 · Droboard Platform</div>
  </div>

  <div id="pageBody"></div>

  <div class="footer">
    <p>By continuing to use Droboard, you acknowledge that you have read, understood, and agree to these Terms of Service.</p>
  </div>
</div>
<script src="../services/page-content-service.js?v=2"></script>
<script>
(function(){
  if(window.PageContentService){
    PageContentService.render('terms-of-service','pageBody');
    var doc = PageContentService.get('terms-of-service');
    if(doc && doc.title){
      document.getElementById('pageTitle').textContent = doc.title;
      document.title = doc.title + ' — Droboard';
      document.querySelector('.top-title').textContent = doc.title;
    }
    var body = document.getElementById('pageBody');
    if(!body.innerHTML.trim()){
      body.innerHTML = '<div class="empty">No Terms content yet. An admin can edit this page from Super Admin → System Pages → Terms of Service → Edit.</div>';
    }
  }
})();
</script>
</body>
</html>
