<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<title>Droboard · Home</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<script src="../data/central-demo-data.js"></script>
<script src="../services/ad-service.js"></script>
<script src="../component/ad-card.js"></script>
<script src="../services/home-data.js"></script>
<script src="../component/search-overlay.js"></script>
<script src="../component/bottom-nav.js"></script>
<script src="../component/status-viewer.js"></script>
<script src="../component/save-library.js"></script>
<style>
:root{
  --acc:#ff0050;--acc2:#ff4d7a;--acc3:#ff7a9a;
  --glow:rgba(255,0,80,.28);--glow-sm:rgba(255,0,80,.14);
  --bg:#000000;--l1:#08090c;--l2:#0e0f13;--l3:#13141a;--l4:#1a1b22;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.04);--bd-acc:rgba(255,0,80,.22);
  --tx-high:#f0f0f2;--tx-body:#c3c1cc;--tx-muted:#7d7a89;--tx-faint:#454350;
  --blue:#38bdf8;--green:#34d399;--gold:#fbbf24;--purple:#a78bfa;
  --nav-h:60px;--top-h:54px;--status-h:74px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx-body);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{overflow-y:auto}
::-webkit-scrollbar{width:0;height:0}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block}
a{color:inherit;text-decoration:none}

.phone{width:100%;max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;box-shadow:0 0 50px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow-x:hidden}

.top-bar{
  position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:300;
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 70%,transparent 100%);
  pointer-events:none;
}
.top-bar>*{pointer-events:auto}
.top-logo{font-family:'Playfair Display',serif;font-size:21px;font-weight:900;color:#fff;letter-spacing:-1px;display:flex;align-items:center;gap:3px}
.top-logo .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:2px;box-shadow:0 0 8px var(--acc)}
.top-icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;position:relative;
}
.top-right{display:flex;gap:8px}
.notif-count{position:absolute;top:-3px;right:-3px;background:var(--acc);color:#fff;font-size:7px;font-weight:800;min-width:14px;height:14px;border-radius:7px;padding:0 3px;display:flex;align-items:center;justify-content:center;border:1.5px solid #000}

.status-strip{
  position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:290;
  padding:calc(var(--safe-t) + 54px) 0 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.2) 75%,transparent 100%);
  pointer-events:none;
}
.status-strip>*{pointer-events:auto}
.status-row{display:flex;gap:12px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.status-row::-webkit-scrollbar{display:none}
.s-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer}
.s-item:active{opacity:.7}
.s-ring{width:44px;height:44px;border-radius:50%;padding:2px;flex-shrink:0;position:relative}
.s-ring.ring-has{background:conic-gradient(var(--blue),#0ea5e9,#bae6fd,var(--blue))}
.s-ring.ring-live{background:conic-gradient(var(--acc) 0%,var(--acc2) 50%,var(--acc) 100%);animation:spin 3s linear infinite}
.s-ring.ring-viewed{background:rgba(255,255,255,.16)}
.s-ring.ring-none{background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.18)}
@keyframes spin{to{transform:rotate(360deg)}}
.s-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
.s-inner img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.s-live-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:5px;color:#fff}
.s-add-icon{font-size:15px;color:rgba(255,255,255,.6)}
.s-name{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.7);max-width:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

.hero{
  position:relative;
  height:calc(100dvh - var(--nav-h) - var(--safe-b));
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
}
.hero::-webkit-scrollbar{display:none}
.hero-slide{
  position:relative;height:calc(100dvh - var(--nav-h) - var(--safe-b));
  width:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;justify-content:flex-end;
  background-size:cover;background-position:center 28%;
  overflow:hidden;
}
.hero-slide.ad-frame{box-shadow:inset 0 0 0 4px var(--gold)}
.hero-scrim{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.1) 30%, rgba(0,0,0,.55) 62%, rgba(4,3,7,.97) 100%);
}
.hero-badges-top{position:absolute;top:calc(var(--safe-t) + var(--status-h) + 62px);left:16px;right:16px;z-index:3;display:flex;justify-content:space-between;align-items:flex-start}
.badge-genre{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.18);color:#fff;
  font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:20px;
}
.badge-ad{background:var(--gold);color:#1a1000;font-size:9.5px;font-weight:900;padding:5px 12px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}

.hero-content{position:relative;z-index:3;padding:0 20px calc(var(--safe-b) + 22px)}
.hero-stats-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.hero-stat{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:rgba(255,255,255,.82)}
.hero-stat i{font-size:11px}
.hero-stat.rating i{color:var(--gold)}
.hero-stat.chapter{color:#fff}
.hero-stat.chapter i{color:var(--blue)}
.hero-title{
  font-family:'Playfair Display',serif;font-weight:800;
  font-size:29px;line-height:1.14;color:#fff;
  text-shadow:0 3px 18px rgba(0,0,0,.55);
  margin-bottom:11px;
}
.hero-author-row{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.hero-av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.35);flex-shrink:0}
.hero-author-name{font-size:13px;font-weight:700;color:#fff}
.hero-author-name i{color:var(--blue);font-size:11px;margin-left:4px}
.hero-synopsis{
  font-size:13px;line-height:1.55;color:rgba(255,255,255,.72);
  margin-bottom:18px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-cta-row{display:flex;gap:10px;align-items:center}
.btn-start{
  flex:1;background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border:none;padding:14px;border-radius:16px;
  font-size:14.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 28px var(--glow);
}
.btn-icon-only{
  width:50px;height:50px;flex-shrink:0;border-radius:16px;
  background:rgba(255,255,255,.1);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;
}
.btn-icon-only.saved{background:rgba(255,0,80,.22);border-color:var(--acc)}
.btn-icon-only.saved i{color:var(--acc3)}

.ad-drobrand-slide{background:linear-gradient(160deg,#2a0a1e 0%,#5c0f3a 45%,var(--acc) 100%);box-shadow:inset 0 0 0 4px var(--gold)}
.ad-drobrand-glow1{position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10);top:-80px;right:-60px}
.ad-drobrand-glow2{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);bottom:120px;left:-40px}
.ad-drobrand-icon{
  width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#fff;margin-bottom:16px;position:relative;z-index:3;
}
.ad-drobrand-logo{position:absolute;top:calc(var(--safe-t) + var(--status-h) + 62px);left:20px;z-index:3;font-family:'Playfair Display',serif;font-size:14px;font-weight:900;color:rgba(255,255,255,.85);letter-spacing:-.5px}

.swipe-indicator{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  z-index:3;display:flex;flex-direction:column;align-items:center;gap:5px;
  max-height:70vh;overflow:hidden;
}
.swipe-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);transition:.25s;flex-shrink:0}
.swipe-dot.on{width:6px;height:16px;border-radius:4px;background:var(--acc)}
.swipe-hint{
  position:absolute;bottom:calc(var(--safe-b) + 130px);left:50%;transform:translateX(-50%);
  z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:rgba(255,255,255,.55);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  animation:swipeFloat 1.8s ease-in-out infinite;
  pointer-events:none;
}
@keyframes swipeFloat{0%,100%{transform:translate(-50%,0);opacity:.55}50%{transform:translate(-50%,-6px);opacity:1}}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="phone">

<div class="top-bar">
  <div class="top-logo">Dro<span class="dot"></span></div>
  <div class="top-right">
    <div class="top-icon-btn" data-search-trigger><i class="fas fa-magnifying-glass"></i></div>
    <a href="notifications.html" class="top-icon-btn" style="text-decoration:none;color:inherit">
      <i class="fas fa-bell"></i>
      <div class="notif-count">3</div>
    </a>
  </div>
</div>

<div class="status-strip">
  <div class="status-row" id="statusRow"></div>
</div>

<div class="hero" id="heroScroll">
  <div class="swipe-indicator" id="swipeDots"></div>
  <div class="swipe-hint"><i class="fas fa-chevron-up" style="font-size:11px"></i>Swipe</div>
  <div id="heroSlides"></div>
</div>

<div class="toast" id="toast"></div>

</div>

<script src="../services/home-page-service.js"></script>
</body>
</html>
