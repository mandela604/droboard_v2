<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<title>Droboard · Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --acc:#ff0050;--acc2:#ff4d7a;--acc-dim:rgba(255,0,80,.12);--acc-border:rgba(255,0,80,.3);--glow:rgba(255,0,80,.22);
  --bg:#000000;--bg2:#0f1013;--bg3:#0a0a0d;--surface:#161616;
  --tx:#f0f0f0;--tx2:#a1a1aa;--muted:#71717a;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.04);
  --font-story:'Lora',serif;--font-ui:'DM Sans',sans-serif;--font-d:'Playfair Display',serif;
  --fs:14px;--lh:1.9;
  --safe-t:env(safe-area-inset-top,10px);--safe-b:env(safe-area-inset-bottom,14px);
  --gold:#d97706;--gold-s:rgba(217,119,6,.12);--green:#22c55e;
}
body.theme-sepia{--bg:#1a1510;--bg2:#201a12;--bg3:#26201a;--surface:#26201a;--bd:rgba(232,213,176,.08);--muted:#806050;--tx:#e8d5b0;--tx2:#a89070;}
body.theme-grey{--bg:#0f1117;--bg2:#151820;--bg3:#1c2028;--surface:#1c2028;--bd:rgba(216,220,232,.07);--tx:#d8dce8;--tx2:#888da0;}
body.theme-white{--bg:#ffffff;--bg2:#f5f5f5;--bg3:#ececec;--surface:#efefef;--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.04);--muted:#999;--tx:#111;--tx2:#555;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font-ui);transition:background .3s,color .3s}
img{display:block;user-select:none}
button{font-family:var(--font-ui);cursor:pointer;border:none;background:none}

/* ══ FLOATING CONTROLS ══ */
.floating-controls{position:fixed;top:0;left:0;right:0;z-index:150;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 8px) 14px 10px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .25s,transform .25s;}
.floating-controls.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.fc-left,.fc-right{display:flex;gap:8px;align-items:center}
.fc-btn{width:36px;height:36px;border-radius:50%;background:rgba(20,20,24,.85);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:14px;color:#eee;cursor:pointer;flex-shrink:0;transition:.15s;}
.fc-btn:active{transform:scale(.9)}
.fc-progress-pill{background:rgba(20,20,24,.85);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:999px;padding:7px 13px;font-size:10px;font-weight:700;color:#ccc;white-space:nowrap;}
.fc-coin-pill{display:flex;align-items:center;gap:6px;background:rgba(217,119,6,.2);border:1px solid rgba(217,119,6,.4);backdrop-filter:blur(10px);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;color:#fbbf24;cursor:pointer;white-space:nowrap;transition:.15s;}
.fc-coin-pill:active{transform:scale(.93)}
.fc-coin-pill i{font-size:12px}

/* thin progress bar */
.read-progress{position:fixed;top:0;left:0;right:0;height:2.5px;background:transparent;z-index:151;}
.read-progress-fill{height:100%;background:var(--acc);width:0%;transition:width .15s linear}

/* ══ SCROLL BODY ══ */
.scroll-body{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.scroll-body::-webkit-scrollbar{display:none}
.reader-col{max-width:640px;margin:0 auto;padding:0 22px}

.loading-state{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:12px;font-family:var(--font-ui);}
.loading-spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--acc);animation:dspin .8s linear infinite}
@keyframes dspin{to{transform:rotate(360deg)}}

.story-top{padding:calc(var(--safe-t) + 70px) 22px 6px;max-width:640px;margin:0 auto;text-align:center}
.story-top-cat{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--acc);text-transform:uppercase;margin-bottom:8px}
.story-top-title{font-family:var(--font-d);font-size:22px;font-weight:900;line-height:1.25;color:var(--tx);margin-bottom:8px}
.story-top-author{font-size:11px;color:var(--muted);font-weight:600}

.chapter-block{padding-top:34px}
.chapter-heading{font-family:var(--font-story);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-bottom:22px;}
.story-text{font-family:var(--font-story);font-size:var(--fs);line-height:var(--lh);color:var(--tx);letter-spacing:.01em;}
.story-text p{margin-bottom:1.5em}
.story-text p:last-child{margin-bottom:0}

/* ══ LOCKED / PAYWALL FADE ══ */
.locked-wrap{position:relative;}
.locked-fade{max-height:280px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom, black 30%, transparent 92%);mask-image:linear-gradient(to bottom, black 30%, transparent 92%);opacity:.5;pointer-events:none;user-select:none;}
.unlock-card{margin:-46px auto 20px;position:relative;z-index:5;max-width:400px;background:var(--bg3,#0a0a0d);border:1.5px solid var(--bd);border-radius:18px;padding:20px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center;}
.unlock-icon{width:46px;height:46px;border-radius:50%;background:var(--acc-dim);border:1.5px solid var(--acc-border);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--acc);margin:0 auto 12px}
.unlock-title{font-family:var(--font-d);font-size:15px;font-weight:800;color:var(--tx);margin-bottom:5px}
.unlock-sub{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.unlock-opts{display:flex;flex-direction:column;gap:8px}
.unlock-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--surface);cursor:pointer;transition:.15s;}
.unlock-opt:active{transform:scale(.98)}
.unlock-opt.reco{border-color:var(--acc-border);background:var(--acc-dim)}
.unlock-opt-lbl{text-align:left}
.unlock-opt-t{font-size:11.5px;font-weight:800;color:var(--tx)}
.unlock-opt-s{font-size:9px;color:var(--muted);margin-top:1px}
.unlock-opt-price{font-size:11.5px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:4px;white-space:nowrap}
.unlock-opt.reco .unlock-opt-price{color:var(--acc)}

/* ══ ENGAGE BAR ══ */
.engage-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0 4px;}
.eb-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--bd);cursor:pointer;transition:.15s;min-width:74px;}
.eb-btn:active{transform:scale(.95)}
.eb-btn.saved{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.25)}
.eb-btn.saved i{color:#60a5fa}
.eb-icon{font-size:16px;color:var(--tx2)}
.eb-lbl{font-size:9px;font-weight:700;color:var(--muted)}

/* ══ COMMENT LINE ══ */
.comment-line-wrap{padding:14px 0 4px;margin:0 -8px}

/* ══ TOP AD SLOT (mirrors discussion disc-ad: one ad above comments) ══ */
.sl-ad{padding:10px 14px 12px;max-width:640px;margin:0 auto;}

/* ══ AD SLOT ══ */
.ad-slot{padding:30px 0 4px}
.ad-slot-lbl{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:9px;text-align:center}

/* ══ CHAPTERS PANEL ══ */
.ch-panel{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.ch-panel.open{transform:translateX(0)}
.ch-panel-hdr{flex-shrink:0;height:52px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--bd);background:rgba(0,0,0,.85);backdrop-filter:blur(16px);}
.ch-panel-title{font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--tx);flex:1}
.ch-panel-close{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2);cursor:pointer;}
.ch-panel-body{flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 14px}
.ch-panel-body::-webkit-scrollbar{display:none}
.ch-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1.5px solid var(--bd);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.18s;margin-bottom:6px;}
.ch-row.current{border-color:var(--acc-border);background:var(--acc-dim)}
.ch-row.locked{opacity:.7}
.ch-row:active{transform:scale(.99)}
.ch-num{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;background:var(--bg3,#0a0a0d);border:1.5px solid var(--bd);color:var(--muted);}
.ch-num.locked{color:var(--muted)}
.ch-row-body{flex:1;min-width:0}
.ch-row-title{font-size:12px;font-weight:700;color:var(--tx);line-height:1.3;margin-bottom:2px}
.ch-row-meta{font-size:9px;color:var(--muted)}

/* ══ SETTINGS PANEL ══ */
.settings-panel{position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--bg3,#0a0a0d);border-radius:22px 22px 0 0;border-top:1px solid var(--bd);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:0 0 calc(20px + var(--safe-b));}
.settings-panel.open{transform:translateY(0)}
.sp-handle{width:36px;height:4px;background:var(--bd);border-radius:4px;margin:12px auto 16px}
.sp-title{font-size:12px;font-weight:800;color:var(--tx2);text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}
.sp-section{padding:0 20px 16px}
.sp-label{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.font-ctrl{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:8px 14px}
.font-ctrl-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3,#0a0a0d);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--tx2);cursor:pointer;flex-shrink:0;font-weight:700;}
.font-ctrl-btn:active{transform:scale(.9)}
.font-size-display{flex:1;text-align:center;font-size:14px;font-weight:800;color:var(--tx)}
.theme-opts{display:flex;gap:6px;flex-wrap:wrap}
.theme-opt{flex:1;min-width:60px;height:52px;border-radius:10px;cursor:pointer;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;transition:.18s;}
.theme-opt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-dim)}
.theme-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.theme-name{font-size:8px;font-weight:700;color:var(--muted)}
.lh-opts{display:flex;gap:6px}
.lh-opt{flex:1;padding:8px 4px;border-radius:9px;cursor:pointer;border:1.5px solid var(--bd);background:var(--surface);text-align:center;transition:.18s;}
.lh-opt.on{border-color:var(--acc);background:var(--acc-dim)}
.lh-opt-label{font-size:8px;font-weight:700;color:var(--muted)}
.lh-opt.on .lh-opt-label{color:var(--acc)}
.ff-opts{display:flex;gap:6px}
.ff-opt{flex:1;padding:10px 6px;border-radius:9px;cursor:pointer;border:1.5px solid var(--bd);background:var(--surface);text-align:center;transition:.18s;}
.ff-opt.on{border-color:var(--acc);background:var(--acc-dim)}
.ff-opt-label{font-size:11px;font-weight:700;color:var(--tx2)}
.ff-opt.on .ff-opt-label{color:var(--acc)}

.overlay-bg{position:fixed;inset:0;z-index:290;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s;}
.overlay-bg.show{opacity:1;pointer-events:auto}

/* ══ EXIT-INTENT AD ══ */
.exit-ov{position:fixed;inset:0;z-index:400;background:#000;display:none;flex-direction:column;}
.exit-ov.show{display:flex}
.exit-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5)}
.exit-grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95) 10%,rgba(0,0,0,.2) 60%)}
.exit-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(var(--safe-b) + 26px);}
.exit-flag{position:absolute;top:calc(var(--safe-t) + 16px);left:0;right:0;display:flex;justify-content:center;z-index:3}
.exit-flag-inner{background:var(--acc);padding:5px 16px;border-radius:24px;font-size:10px;font-weight:800;color:#fff;letter-spacing:.04em}
.exit-headline{font-family:var(--font-d);font-size:23px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:8px;}
.exit-sub{font-size:12.5px;color:#ccc;line-height:1.5;margin-bottom:18px;max-width:320px}
.exit-actions{display:flex;align-items:center;gap:10px}
.exit-cta{background:var(--acc);color:#fff;font-weight:800;font-size:13px;padding:12px 20px;border-radius:14px;cursor:pointer;flex:1;text-align:center;}
.exit-close{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0;transition:.2s;position:relative;}
.exit-close:disabled{opacity:.55;cursor:default}
.exit-close-ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--acc);clip-path:inset(0 0 0 0);transform:rotate(-90deg);transition:clip-path 1s linear;}

.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(26,26,46,.95);color:#fff;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="theme-dark">

<!-- Top progress hairline -->
<div class="read-progress"><div class="read-progress-fill" id="readProgressFill"></div></div>

<!-- Floating controls -->
<div class="floating-controls" id="floatingControls">
  <div class="fc-left">
    <div class="fc-btn" id="fcBack" title="Exit"><i class="fas fa-chevron-left"></i></div>
  </div>
  <div class="fc-progress-pill" id="fcProgressPill">Ch 1</div>
  <div class="fc-right">
    <div class="fc-coin-pill" id="fcCoinPill"><i class="fas fa-coins"></i> <span id="fcCoinBalance">0</span></div>
    <div class="fc-btn" id="fcChapters" title="Chapters"><i class="fas fa-list-ul"></i></div>
    <div class="fc-btn" id="fcSettings" title="Aa"><i class="fas fa-text-height"></i></div>
  </div>
</div>

<!-- SCROLL BODY -->
<div class="scroll-body" id="scrollBody">
  <div class="loading-state" id="loadingState">
    <div class="loading-spin"></div>
    <div>Loading story…</div>
  </div>
  <div class="story-top" id="storyTop" style="display:none"></div>
  <div class="sl-ad" id="slTopAd" style="display:none"></div>
  <div class="reader-col" id="readerCol"></div>
  <div style="height:40vh"></div>
</div>

<!-- CHAPTERS PANEL -->
<div class="ch-panel" id="chPanel">
  <div class="ch-panel-hdr">
    <div class="ch-panel-title">Chapters</div>
    <div class="ch-panel-close" data-act="close-panels">✕</div>
  </div>
  <div class="ch-panel-body" id="chPanelBody"></div>
</div>

<!-- SETTINGS PANEL -->
<div class="settings-panel" id="settingsPanel">
  <div class="sp-handle"></div>
  <div class="sp-title">Reading Settings</div>
  <div class="sp-section">
    <div class="sp-label">Font Size</div>
    <div class="font-ctrl">
      <div class="font-ctrl-btn" data-act="fs-dec">A−</div>
      <div class="font-size-display" id="fontSizeDisplay">14px</div>
      <div class="font-ctrl-btn" data-act="fs-inc">A+</div>
    </div>
  </div>
  <div class="sp-section">
    <div class="sp-label">Line Spacing</div>
    <div class="lh-opts">
      <div class="lh-opt" data-lh="1.6"><div class="lh-opt-label">Compact</div></div>
      <div class="lh-opt on" data-lh="1.9"><div class="lh-opt-label">Normal</div></div>
      <div class="lh-opt" data-lh="2.25"><div class="lh-opt-label">Relaxed</div></div>
    </div>
  </div>
  <div class="sp-section">
    <div class="sp-label">Font Style</div>
    <div class="ff-opts">
      <div class="ff-opt on" data-ff="'Lora',serif"><div class="ff-opt-label" style="font-family:'Lora',serif;">Lora</div></div>
      <div class="ff-opt" data-ff="'DM Sans',sans-serif"><div class="ff-opt-label" style="font-family:'DM Sans',sans-serif;">DM Sans</div></div>
      <div class="ff-opt" data-ff="Georgia,serif"><div class="ff-opt-label" style="font-family:Georgia,serif;">Georgia</div></div>
    </div>
  </div>
  <div class="sp-section">
    <div class="sp-label">Background</div>
    <div class="theme-opts">
      <div class="theme-opt on" data-theme="theme-dark"><div class="theme-dot" style="background:#000;border-color:rgba(255,255,255,.3)"></div><div class="theme-name">Dark</div></div>
      <div class="theme-opt" data-theme="theme-sepia"><div class="theme-dot" style="background:#1a1510;border-color:rgba(232,213,176,.3)"></div><div class="theme-name">Sepia</div></div>
      <div class="theme-opt" data-theme="theme-grey"><div class="theme-dot" style="background:#0f1117;border-color:rgba(216,220,232,.3)"></div><div class="theme-name">Slate</div></div>
      <div class="theme-opt" data-theme="theme-white"><div class="theme-dot" style="background:#fff;border-color:rgba(0,0,0,.2)"></div><div class="theme-name">White</div></div>
    </div>
  </div>
</div>

<div class="overlay-bg" id="overlayBg"></div>

<!-- EXIT-INTENT AD -->
<div class="exit-ov" id="exitOv">
  <div class="exit-bg" id="exitBg"></div>
  <div class="exit-grad"></div>
  <div class="exit-flag"><div class="exit-flag-inner">SPONSORED</div></div>
  <div class="exit-body">
    <div class="exit-headline" id="exitHeadline">Wait — before you go…</div>
    <div class="exit-sub" id="exitSub">Discover more stories like this one, picked for you.</div>
    <div class="exit-actions">
      <div class="exit-cta" id="exitCta">Explore</div>
      <button class="exit-close" id="exitCloseBtn" disabled>
        <span id="exitCountLabel">5</span>
        <div class="exit-close-ring" id="exitRing"></div>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script src="../data/comments-data.js"></script>
<script src="../data/central-demo-data.js"></script>
<script src="../services/ad-service.js"></script>
