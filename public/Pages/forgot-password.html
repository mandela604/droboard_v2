<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Forgot Password — Droboard</title>
<link rel="icon" type="image/png" href="../assets/droboard-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730;display:flex;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;border:1px solid #eceaf5;border-radius:16px;box-shadow:0 8px 32px rgba(20,10,50,.06);width:100%;max-width:420px;padding:24px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo-ico{width:38px;height:38px;border-radius:11px;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;overflow:hidden;flex-shrink:0}
.logo-ico img{width:100%;height:100%;object-fit:cover;display:block}
.logo-txt b{display:block;font-size:13px;font-weight:800;letter-spacing:.04em;line-height:1.1}
.logo-txt span{font-size:11px;color:#71708a;font-weight:600}
h1{font-size:18px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:#9694ac;line-height:1.5;margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;font-weight:700;color:#1a1730;display:block;margin-bottom:6px}
.form-input{width:100%;font-family:inherit;font-size:13px;color:#1a1730;background:#fff;border:1px solid #e4e2f1;border-radius:10px;padding:10px 12px;outline:none;transition:.15s}
.form-input:focus{border-color:#ff0050;box-shadow:0 0 0 3px rgba(255,0,80,.1)}
.btn{width:100%;font-size:13px;font-weight:700;padding:11px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:#ff0050;color:#fff;box-shadow:0 4px 14px rgba(255,0,80,.3)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:#1a1730;border:1px solid #eceaf5}
.link{font-size:11px;color:#ff0050;font-weight:700;text-decoration:none}
.btn:disabled{opacity:.7;cursor:wait}
.btn .fa-spinner{font-size:14px}
.success{display:none;text-align:center;padding:18px}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light'}document.documentElement.setAttribute('data-theme',t)})()</script>
<script src="../component/img-guard.js"></script>
<script src="../component/app-nav.js"></script>
</head>
<body>
<div class="card" id="forgotCard">
  <div class="logo"><div class="logo-ico"><img src="../assets/droboard-icon.png" alt="Droboard"/></div><div class="logo-txt"><b>DROBOARD</b><span>Read · Write · Earn</span></div></div>
  <h1>Forgot password?</h1>
  <div class="sub">Enter the email you signed up with and we'll send you a reset link.</div>

  <div class="form-row"><label class="form-label">Email address</label><input class="form-input" id="emailInput" type="email" placeholder="e.g. adaeze@example.com" autocomplete="email"/></div>
  <button class="btn primary" id="sendBtn"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
  <div style="text-align:center;margin-top:12px;font-size:11px;color:#9694ac">Remembered it? <a href="login.html" class="link">Back to log in</a></div>
</div>

<div class="card success" id="successCard">
  <div class="logo" style="justify-content:center"><div class="logo-ico"><img src="../assets/droboard-icon.png" alt="Droboard"/></div></div>
  <i class="fas fa-envelope-open-text" style="width:56px;height:56px;border-radius:50%;background:#e2f8ea;color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px"></i>
  <h2 style="font-size:16px;font-weight:800">Check your inbox</h2>
  <p style="font-size:12.5px;color:#71708a;margin-top:6px;line-height:1.5" id="successMsg">If an account exists for that email, a reset link is on its way. It expires in 30 minutes.</p>
  <button class="btn ghost" style="margin-top:16px" id="resendBtn">Resend link</button>
  <div style="text-align:center;margin-top:12px;font-size:11px;color:#9694ac"><a href="login.html" class="link">Back to log in</a></div>
</div>

<div id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:10px 18px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:300">Done</div>
<style>#toast.show{opacity:1}</style>

<script src="../services/forgot-password-service.js"></script>
</body>
</html>
