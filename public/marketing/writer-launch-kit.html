<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Campaigns — Droboard Marketing</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div id="root">
<div class="lk-page">
  <div class="lk-stats" id="statsRow"></div>
  <div class="lk-filters">
    <div class="lk-search"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search campaigns..."/></div>
    <div class="lk-filter-pills" id="filterPills"></div>
    <button id="addKitBtn" style="display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0"><i class="fas fa-plus"></i> New Campaign</button>
    <button id="resetBtn" style="display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0"><i class="fas fa-rotate-left"></i></button>
  </div>
  <div class="lk-grid" id="kitGrid"></div>
</div>

<div class="lk-modal-backdrop" id="modalBackdrop">
  <div class="lk-modal">
    <div class="lk-modal-head"><h3 id="modalTitle">Campaign</h3><button onclick="closeModal()" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer"><i class="fas fa-xmark"></i></button></div>
    <div class="lk-modal-tabs"><div class="lk-mtab active" data-tab="overview">Overview</div><div class="lk-mtab" data-tab="assets">Assets</div><div class="lk-mtab" data-tab="promoters">Promoters</div><div class="lk-mtab" data-tab="analytics">Analytics</div></div>
    <div class="lk-modal-body" id="modalBody"></div>
  </div>
</div>

<div class="lk-modal-backdrop" id="editBackdrop">
  <div class="lk-modal" style="max-width:600px">
    <div class="lk-modal-head"><h3 id="editTitle">New Campaign</h3><button onclick="closeEdit()" style="background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer"><i class="fas fa-xmark"></i></button></div>
    <div class="lk-modal-body" id="editBody" style="padding:22px;max-height:75vh;overflow-y:auto">
      <div style="margin-bottom:16px;position:relative">
        <label class="lk-ed-label">Search Story</label>
        <input id="edStorySearch" placeholder="Type story title..." oninput="mkgSearchStory(this.value)" style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none"/>
        <div id="mkgStoryDropdown" style="display:none;position:absolute;z-index:10;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:160px;overflow-y:auto"></div>
      </div>
      <div id="mkgStoryPreview" style="display:none;margin-bottom:16px;padding:10px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;align-items:center;gap:10px">
        <img id="mkgStoryImg" style="width:44px;height:60px;border-radius:6px;object-fit:cover"/>
        <div style="flex:1"><div id="mkgStoryTitle" style="font-size:12px;font-weight:700"></div><div id="mkgStoryGenre" style="font-size:10px;color:var(--text-faint)"></div></div>
        <button onclick="mkgClearStory()" style="background:none;border:none;color:var(--red);font-size:12px;cursor:pointer"><i class="fas fa-xmark"></i></button>
      </div>
      <div style="margin-bottom:16px">
        <label class="lk-ed-label">Campaign Name</label>
        <input id="edCampaignName" placeholder="e.g. The Last Sunrise" style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none"/>
      </div>
      <div style="margin-bottom:16px">
        <label class="lk-ed-label">Writer Name</label>
        <input id="edWriterName" placeholder="e.g. Tobi Adenuga" style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none"/>
      </div>
      <div style="margin-bottom:16px">
        <label class="lk-ed-label">Description</label>
        <textarea id="edDescription" rows="2" placeholder="What is this campaign about?" style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical"></textarea>
      </div>
      <div style="margin-bottom:16px">
        <label class="lk-ed-label">Destination URL</label>
        <input id="edDestination" placeholder="https://..." style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none"/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
        <div><label class="lk-ed-label">CTA Button Text</label><input id="edCta" placeholder="e.g. Read Now" value="Read Now" style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none"/></div>
        <div><label class="lk-ed-label">Launch Date</label><input id="edLaunchDate" type="date" style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none"/></div>
      </div>
      <div style="margin-bottom:16px"><label class="lk-ed-label">WhatsApp Message</label><textarea id="edWhatsapp" rows="2" placeholder="WhatsApp status text..." style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical"></textarea></div>
      <div style="margin-bottom:16px"><label class="lk-ed-label">Facebook Post</label><textarea id="edFacebook" rows="2" placeholder="Facebook post text..." style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical"></textarea></div>
      <div style="margin-bottom:16px"><label class="lk-ed-label">TikTok Script</label><textarea id="edTiktok" rows="2" placeholder="TikTok/Reels script..." style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical"></textarea></div>
      <div style="margin-bottom:16px"><label class="lk-ed-label">Instagram Caption</label><textarea id="edInstagram" rows="2" placeholder="Instagram caption..." style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical"></textarea></div>
      <div style="margin-bottom:16px"><label class="lk-ed-label">Excerpt / Hook</label><textarea id="edExcerpt" rows="3" placeholder="A compelling excerpt or hook..." style="width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none;resize:vertical"></textarea></div>
      <div style="display:flex;gap:8px;margin-top:18px">
        <button onclick="closeEdit()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Cancel</button>
        <button id="edSaveBtn" onclick="saveCampaign()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Save Campaign</button>
      </div>
    </div>
  </div>
</div>
</div>

<style>
*{box-sizing:border-box}
.lk-page{padding:0;margin:0}
.mkg-content{padding:16px 20px 40px!important}
.lk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.lk-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.lk-stat .num{font-size:20px;font-weight:800;margin-bottom:2px}
.lk-stat .lbl{font-size:10.5px;color:var(--text-muted);font-weight:600}
.lk-stat.accent .num{color:var(--accent)} .lk-stat.green .num{color:var(--green)} .lk-stat.blue .num{color:var(--blue)} .lk-stat.purple .num{color:var(--purple)}
.lk-filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lk-search{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:8px 12px;flex:1;min-width:180px}
.lk-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.lk-search i{color:var(--text-faint);font-size:12px}
.lk-filter-pills{display:flex;gap:4px}
.lk-pill{padding:5px 10px;border-radius:20px;font-size:10.5px;font-weight:700;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);cursor:pointer;transition:.15s}
.lk-pill:hover{border-color:var(--accent);color:var(--accent)}
.lk-pill.active{background:var(--accent);border-color:transparent;color:#fff}
.lk-grid{display:flex;flex-direction:column;gap:8px}
.lk-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.15s}
.lk-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(255,0,80,.08)}
.lk-card-cover{width:40px;height:54px;border-radius:6px;object-fit:cover;flex-shrink:0}
.lk-card-info{flex:1;min-width:0}
.lk-card-name{font-size:12.5px;font-weight:700}
.lk-card-book{font-size:10.5px;color:var(--text-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-card-stats{display:flex;gap:12px;flex-shrink:0}
.lk-card-stat{text-align:center}
.lk-card-stat .v{font-size:13px;font-weight:800}
.lk-card-stat .l{font-size:8.5px;color:var(--text-faint);text-transform:uppercase;font-weight:600}
.lk-badge{padding:3px 7px;border-radius:5px;font-size:9px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.lk-badge.active{background:var(--green-bg);color:var(--green)} .lk-badge.scheduled{background:var(--blue-bg);color:var(--blue)} .lk-badge.draft{background:var(--amber-bg);color:var(--amber)}
.lk-card-actions{display:flex;gap:3px;flex-shrink:0}
.lk-card-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;transition:.12s}
.lk-card-btn:hover{border-color:var(--accent);color:var(--accent)}
.lk-card-btn.red:hover{border-color:var(--red);color:var(--red)}
.lk-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(10,6,25,.6);z-index:2000;align-items:center;justify-content:center}
.lk-modal-backdrop.open{display:flex}
.lk-modal{background:var(--card);border-radius:16px;width:calc(100% - 40px);max-width:650px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.lk-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.lk-modal-head h3{font-size:14px;font-weight:800}
.lk-modal-tabs{display:flex;gap:2px;padding:0 20px;background:var(--hover);border-bottom:1px solid var(--border)}
.lk-mtab{padding:9px 14px;font-size:11px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.lk-mtab:hover{color:var(--text)} .lk-mtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.lk-modal-body{padding:20px;overflow-y:auto;flex:1}
.lk-ed-label{display:block;font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.lk-asset-group{margin-bottom:16px}
.lk-asset-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.lk-asset-label span{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase}
.lk-asset-box{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;color:var(--text);line-height:1.5;position:relative}
.lk-asset-box.scroll{max-height:80px;overflow-y:auto}
.lk-copy-btn{padding:3px 8px;border-radius:5px;border:1px solid var(--input-border);background:var(--card);color:var(--text-muted);font-size:9.5px;font-weight:700;cursor:pointer;font-family:inherit}
.lk-copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.lk-tab-panel{display:none} .lk-tab-panel.active{display:block}
.lk-overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.lk-overview-item{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.lk-overview-num{font-size:16px;font-weight:800}
.lk-overview-lbl{font-size:9px;color:var(--text-muted);text-transform:uppercase;font-weight:600}
.lk-promoter{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.lk-promoter:last-child{border:none}
.lk-promoter-name{flex:1;font-weight:700}
.lk-promoter-clicks{color:var(--text-muted);font-size:11px}
.lk-promoter-conv{font-weight:800;color:var(--green)}
</style>

<script src="shared/marketing-sidebar.js"></script>
<script src="shared/launch-kit-data.js?v=3"></script>
<script src="shared/launch-kit-service.js?v=3"></script>
<script>
MarketingSidebar.attach('#root',{activeItem:'launch-kit',title:'Campaigns',subtitle:'Manage promotional campaigns for all writers',user:{name:'Tari Benson',role:'Marketing Lead',avatar:'https://i.pravatar.cc/100?img=45'},notifCount:3});

var allKits=[];var currentFilter='all';var searchQuery='';var editingKitId=null;var mkgSelectedStory=null;

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(msg){var el=document.createElement('div');el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:600;z-index:2000';el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},1500)}
function copyText(text){navigator.clipboard.writeText(text).then(function(){toast('Copied!')}).catch(function(){var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied!')})}

function mkgSearchStory(q){
  if(!q){document.getElementById('mkgStoryDropdown').style.display='none';return}
  var lower=q.toLowerCase();
  var matches=StoryLibrary.filter(function(s){return s.title.toLowerCase().includes(lower)||s.genre.toLowerCase().includes(lower)||s.author.toLowerCase().includes(lower)}).slice(0,5);
  if(!matches.length){document.getElementById('mkgStoryDropdown').style.display='none';return}
  document.getElementById('mkgStoryDropdown').innerHTML=matches.map(function(s){
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer" onmouseover="this.style.background=\'var(--hover)\'" onmouseout="this.style.background=\'\'" onclick="mkgPickStory(\''+s.id+'\')"><img src="'+esc(s.cover)+'" style="width:32px;height:44px;border-radius:4px;object-fit:cover" alt=""/><div><div style="font-size:11.5px;font-weight:700">'+esc(s.title)+'</div><div style="font-size:9.5px;color:var(--text-faint)">'+esc(s.genre)+' | '+esc(s.author)+'</div></div></div>';
  }).join('');
  document.getElementById('mkgStoryDropdown').style.display='block';
}
function mkgPickStory(id){
  var s=StoryLibrary.find(function(x){return x.id===id});if(!s)return;
  mkgSelectedStory=s;
  document.getElementById('edStorySearch').value='';
  document.getElementById('mkgStoryDropdown').style.display='none';
  var prev=document.getElementById('mkgStoryPreview');
  prev.style.display='flex';
  document.getElementById('mkgStoryImg').src=s.cover;
  document.getElementById('mkgStoryTitle').textContent=s.title;
  document.getElementById('mkgStoryGenre').textContent=s.genre+' | '+s.author;
}
function mkgClearStory(){mkgSelectedStory=null;document.getElementById('mkgStoryPreview').style.display='none'}

function renderStats(){
  var totalVisitors=allKits.reduce(function(s,k){return s+(k.analytics.visitors||0)},0);
  var totalClicks=allKits.reduce(function(s,k){return s+(k.analytics.clicks||0)},0);
  var totalConv=allKits.reduce(function(s,k){return s+(k.analytics.conversions||0)},0);
  var active=allKits.filter(function(k){return k.status==='active'}).length;
  document.getElementById('statsRow').innerHTML=''
    +'<div class="lk-stat accent"><div class="num">'+allKits.length+'</div><div class="lbl">Total Campaigns</div></div>'
    +'<div class="lk-stat green"><div class="num">'+active+'</div><div class="lbl">Active</div></div>'
    +'<div class="lk-stat blue"><div class="num">'+totalVisitors.toLocaleString()+'</div><div class="lbl">Visitors</div></div>'
    +'<div class="lk-stat purple"><div class="num">'+totalConv.toLocaleString()+'</div><div class="lbl">Conversions</div></div>';
}

function renderFilters(){
  document.getElementById('filterPills').innerHTML=''
    +'<div class="lk-pill'+(currentFilter==='all'?' active':'')+'" onclick="setFilter(\'all\')">All</div>'
    +'<div class="lk-pill'+(currentFilter==='active'?' active':'')+'" onclick="setFilter(\'active\')">Active</div>'
    +'<div class="lk-pill'+(currentFilter==='scheduled'?' active':'')+'" onclick="setFilter(\'scheduled\')">Scheduled</div>'
    +'<div class="lk-pill'+(currentFilter==='draft'?' active':'')+'" onclick="setFilter(\'draft\')">Draft</div>';
}

function setFilter(f){currentFilter=f;renderFilters();renderGrid()}

function renderGrid(){
  var filtered=allKits.filter(function(k){
    if(currentFilter!=='all'&&k.status!==currentFilter)return false;
    if(searchQuery){var q=searchQuery.toLowerCase();return k.writerName.toLowerCase().includes(q)||k.campaignName.toLowerCase().includes(q)}
    return true;
  });
  var grid=document.getElementById('kitGrid');
  if(!filtered.length){grid.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-faint);font-size:12.5px">No campaigns found.</div>';return}
  grid.innerHTML=filtered.map(function(k){
    return ''
      +'<div class="lk-card" onclick="openCampaign(\''+k.id+'\')">'
      +  '<img class="lk-card-cover" src="'+esc(k.campaignImage)+'" alt=""/>'
      +  '<div class="lk-card-info"><div class="lk-card-name">'+esc(k.campaignName)+'</div><div class="lk-card-book">'+esc(k.writerName)+' | '+esc(k.campaignType)+'</div></div>'
      +  '<div class="lk-card-stats"><div class="lk-card-stat"><div class="v">'+k.analytics.visitors.toLocaleString()+'</div><div class="l">Visitors</div></div><div class="lk-card-stat"><div class="v">'+k.analytics.conversions+'</div><div class="l">Conv.</div></div></div>'
      +  '<div class="lk-badge '+k.status+'">'+k.status+'</div>'
      +  '<div class="lk-card-actions"><button class="lk-card-btn" onclick="event.stopPropagation();copyText(\''+esc(k.campaignLink)+'\')" title="Copy Link"><i class="fas fa-link"></i></button><button class="lk-card-btn" onclick="event.stopPropagation();editCampaign(\''+k.id+'\')" title="Edit"><i class="fas fa-pen"></i></button><button class="lk-card-btn red" onclick="event.stopPropagation();deleteCampaign(\''+k.id+'\')" title="Delete"><i class="fas fa-trash"></i></button></div>'
      +'</div>';
  }).join('');
}

function deleteCampaign(id){if(!confirm('Delete this campaign?'))return;LaunchKitService.remove(id).then(function(){allKits=allKits.filter(function(k){return k.id!==id});renderStats();renderGrid();toast('Campaign deleted')})}

function openCampaign(id){
  var k=allKits.find(function(x){return x.id===id});if(!k)return;
  document.getElementById('modalTitle').textContent=k.campaignName;
  document.getElementById('modalBackdrop').classList.add('open');
  showOverview(k);
  var tabs=document.querySelectorAll('.lk-mtab');
  tabs.forEach(function(t){t.onclick=function(){tabs.forEach(function(x){x.classList.remove('active')});t.classList.add('active');var tab=t.dataset.tab;if(tab==='overview')showOverview(k);else if(tab==='assets')showAssets(k);else if(tab==='promoters')showPromoters(k);else showAnalytics(k)}});
}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
document.getElementById('modalBackdrop').addEventListener('click',function(e){if(e.target===this)closeModal()});

function showOverview(k){
  var a=k.analytics;
  var html='<div class="lk-overview-grid">'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--blue)">'+a.visitors.toLocaleString()+'</div><div class="lk-overview-lbl">Visitors</div></div>'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--accent)">'+a.clicks.toLocaleString()+'</div><div class="lk-overview-lbl">CTA Clicks</div></div>'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--green)">'+a.conversions.toLocaleString()+'</div><div class="lk-overview-lbl">Conversions</div></div>'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--purple)">'+a.conversionRate+'%</div><div class="lk-overview-lbl">Conv. Rate</div></div>'
    +'</div>';
  html+='<div style="margin-bottom:12px"><div style="font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px">Campaign Link</div><div style="display:flex;gap:6px;align-items:center"><div style="flex:1;font-size:11px;font-family:monospace;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(k.campaignLink)+'</div><button class="lk-copy-btn" onclick="copyText(\''+esc(k.campaignLink)+'\')"><i class="fas fa-copy"></i></button></div></div>';
  html+='<div style="font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px">Description</div><div style="font-size:12px;line-height:1.5;margin-bottom:12px">'+esc(k.description)+'</div>';
  html+='<div style="font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px">Sources</div>';
  var maxSrc=Math.max.apply(null,Object.values(k.sources));
  ['whatsapp','facebook','tiktok','instagram','direct'].forEach(function(s){
    var count=k.sources[s]||0;var w=maxSrc>0?Math.round((count/maxSrc)*100):0;
    html+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><div style="width:70px;font-size:11px;font-weight:600;text-transform:capitalize">'+s+'</div><div style="flex:1;height:6px;background:var(--input-bg);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+w+'%;background:var(--accent);border-radius:3px"></div></div><div style="width:40px;text-align:right;font-size:11px;font-weight:700">'+count+'</div></div>';
  });
  document.getElementById('modalBody').innerHTML=html;
}

function showAssets(k){
  var html='';
  [{key:'whatsapp',label:'WhatsApp',icon:'fa-whatsapp'},{key:'facebook',label:'Facebook',icon:'fa-facebook'},{key:'tiktok',label:'TikTok',icon:'fa-tiktok'},{key:'instagram',label:'Instagram',icon:'fa-instagram'}].forEach(function(p){
    var text=k.assets[p.key];if(!text)return;
    html+='<div class="lk-asset-group"><div class="lk-asset-label"><span><i class="fab '+p.icon+'" style="margin-right:4px"></i> '+p.label+'</span><button class="lk-copy-btn" onclick="copyText(\''+esc(text)+'\')"><i class="fas fa-copy"></i></button></div><div class="lk-asset-box">'+esc(text)+'</div></div>';
  });
  html+='<div class="lk-asset-group"><div class="lk-asset-label"><span>Excerpt</span><button class="lk-copy-btn" onclick="copyText(\''+esc(k.assets.excerpt)+'\')"><i class="fas fa-copy"></i></button></div><div class="lk-asset-box scroll">'+esc(k.assets.excerpt)+'</div></div>';
  html+='<div class="lk-asset-group"><div class="lk-asset-label"><span>Caption</span><button class="lk-copy-btn" onclick="copyText(\''+esc(k.assets.caption)+'\')"><i class="fas fa-copy"></i></button></div><div class="lk-asset-box">'+esc(k.assets.caption)+'</div></div>';
  document.getElementById('modalBody').innerHTML=html;
}

function showPromoters(k){
  if(!k.promoters||!k.promoters.length){document.getElementById('modalBody').innerHTML='<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:12px">No promoters yet.</div>';return}
  var html=k.promoters.map(function(p){
    return '<div class="lk-promoter"><div style="width:28px;height:28px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);flex-shrink:0">'+p.name[0]+'</div><div class="lk-promoter-name">'+esc(p.name)+'</div><div class="lk-promoter-clicks">'+p.clicks+' clicks</div><div class="lk-promoter-conv">'+p.conversions+' conv.</div></div>';
  }).join('');
  document.getElementById('modalBody').innerHTML=html;
}

function showAnalytics(k){
  var a=k.analytics;
  var html='<div class="lk-overview-grid">'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--blue)">'+a.visitors.toLocaleString()+'</div><div class="lk-overview-lbl">Visitors</div></div>'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--accent)">'+a.clicks.toLocaleString()+'</div><div class="lk-overview-lbl">CTA Clicks</div></div>'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--green)">'+a.conversions.toLocaleString()+'</div><div class="lk-overview-lbl">Conversions</div></div>'
    +'<div class="lk-overview-item"><div class="lk-overview-num" style="color:var(--purple)">'+a.conversionRate+'%</div><div class="lk-overview-lbl">Conv. Rate</div></div>'
    +'</div>';
  html+='<div style="font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Conversion Funnel</div>';
  var funnel=[
    {label:'Visitors',val:a.visitors,color:'var(--blue)'},
    {label:'CTA Clicks',val:a.clicks,color:'var(--accent)'},
    {label:'Conversions',val:a.conversions,color:'var(--green)'}
  ];
  funnel.forEach(function(f){
    var w=a.visitors>0?Math.round((f.val/a.visitors)*100):0;
    html+='<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px"><span style="font-weight:600">'+f.label+'</span><span style="font-weight:800">'+f.val.toLocaleString()+'</span></div><div style="height:8px;background:var(--input-bg);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+w+'%;background:'+f.color+';border-radius:4px"></div></div></div>';
  });
  document.getElementById('modalBody').innerHTML=html;
}

function openNewCampaign(){editingKitId=null;document.getElementById('editTitle').textContent='New Campaign';document.getElementById('edCampaignName').value='';document.getElementById('edWriterName').value='';document.getElementById('edDescription').value='';document.getElementById('edDestination').value='';document.getElementById('edCta').value='Read Now';document.getElementById('edLaunchDate').value='';document.getElementById('edWhatsapp').value='';document.getElementById('edFacebook').value='';document.getElementById('edTiktok').value='';document.getElementById('edInstagram').value='';document.getElementById('edExcerpt').value='';document.getElementById('editBackdrop').classList.add('open')}

function editCampaign(id){
  var k=allKits.find(function(x){return x.id===id});if(!k)return;
  editingKitId=id;mkgSelectedStory=null;
  document.getElementById('mkgStoryPreview').style.display='none';
  document.getElementById('editTitle').textContent='Edit — '+k.campaignName;
  document.getElementById('edCampaignName').value=k.campaignName;
  document.getElementById('edWriterName').value=k.writerName;
  document.getElementById('edDescription').value=k.description;
  document.getElementById('edDestination').value=k.destination;
  document.getElementById('edCta').value=k.cta;
  document.getElementById('edLaunchDate').value=k.launchDate;
  document.getElementById('edWhatsapp').value=k.assets.whatsapp;
  document.getElementById('edFacebook').value=k.assets.facebook;
  document.getElementById('edTiktok').value=k.assets.tiktok;
  document.getElementById('edInstagram').value=k.assets.instagram||'';
  document.getElementById('edExcerpt').value=k.assets.excerpt;
  document.getElementById('editBackdrop').classList.add('open');
}

function closeEdit(){document.getElementById('editBackdrop').classList.remove('open');mkgClearStory()}
document.getElementById('editBackdrop').addEventListener('click',function(e){if(e.target===this)closeEdit()});

function saveCampaign(){
  var name=document.getElementById('edCampaignName').value.trim();
  var writer=document.getElementById('edWriterName').value.trim();
  if(!name||!writer){alert('Campaign name and writer name are required');return}
  var code=writer.split(' ')[0].toUpperCase()+new Date().getFullYear();
  var slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  var img=mkgSelectedStory?mkgSelectedStory.cover:'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300&h=400&fit=crop';
  var imgWide=mkgSelectedStory?mkgSelectedStory.cover.replace('w=300','w=600').replace('h=400','h=300'):'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=600&h=300&fit=crop';
  var dest=document.getElementById('edDestination').value||(mkgSelectedStory?mkgSelectedStory.link:'');
  var data={
    campaignName:name,
    writerName:writer,
    description:document.getElementById('edDescription').value,
    destination:dest,
    cta:document.getElementById('edCta').value||'Read Now',
    campaignLink:'https://droboard.app/c/'+slug+'?ref='+code,
    campaignImage:img,
    campaignImageWide:imgWide,
    status:document.getElementById('edLaunchDate').value?'scheduled':'draft',
    launchDate:document.getElementById('edLaunchDate').value,
    assets:{
      whatsapp:document.getElementById('edWhatsapp').value,
      facebook:document.getElementById('edFacebook').value,
      tiktok:document.getElementById('edTiktok').value,
      instagram:document.getElementById('edInstagram').value,
      excerpt:document.getElementById('edExcerpt').value,
      caption:''
    }
  };
  if(editingKitId){
    LaunchKitService.update(editingKitId,data).then(function(){
      var idx=allKits.findIndex(function(k){return k.id===editingKitId});if(idx>=0)Object.assign(allKits[idx],data);
      renderStats();renderGrid();closeEdit();mkgClearStory();toast('Campaign updated');
    });
  }else{
    LaunchKitService.create(data).then(function(newKit){
      allKits.push(newKit);renderStats();renderGrid();closeEdit();mkgClearStory();toast('Campaign created');
    });
  }
}

document.getElementById('addKitBtn').addEventListener('click',openNewCampaign);
document.getElementById('resetBtn').addEventListener('click',function(){
  if(!confirm('Reset all campaigns?'))return;localStorage.removeItem('droboard_launch_kits');localStorage.removeItem('droboard_launch_kits_ver');
  LaunchKitService.reset().then(function(kits){allKits=kits;renderStats();renderGrid();toast('Reset to defaults')});
});
document.getElementById('searchInput').addEventListener('input',function(e){searchQuery=e.target.value;renderGrid()});

LaunchKitService.getAll().then(function(kits){allKits=kits;renderStats();renderFilters();renderGrid()});
</script></body></html>
