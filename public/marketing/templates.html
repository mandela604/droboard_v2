<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Flyer Templates — Droboard Marketing</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div id="root">
<div class="tmpl-page">
  <div class="tmpl-stats" id="tmplStats"></div>
  <div class="tmpl-toolbar">
    <div class="tmpl-search"><i class="fas fa-magnifying-glass"></i><input id="tmplQ" placeholder="Search templates…"/></div>
    <select class="tmpl-select" id="tmplSize"><option value="all">All sizes</option><option value="1:1">1:1 Square</option><option value="9:16">9:16 Vertical</option></select>
    <button class="tmpl-btn primary" id="tmplNew"><i class="fas fa-plus"></i> New Template</button>
  </div>
  <div id="tmplList" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<div class="tmpl-modal-bg" id="tmplModalBg">
  <div class="tmpl-modal" role="dialog" aria-modal="true">
    <div class="tmpl-modal-head"><b id="tmplModalTitle">New Template</b><button onclick="closeTmplModal()" style="width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer"><i class="fas fa-xmark"></i></button></div>
    <div class="tmpl-modal-body" style="padding:16px 18px;overflow-y:auto;max-height:72vh">
      <div class="tmpl-field"><label>Name</label><input id="teName" placeholder="e.g. WhatsApp Status — 9:16"/></div>
      <div class="tmpl-field"><label>Description</label><textarea id="teDesc" rows="2" placeholder="Where this flyer is used"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="tmpl-field"><label>Size / Ratio</label><select id="teSize"><option value="1:1">1:1 — Square (1080×1080)</option><option value="9:16">9:16 — Vertical (1080×1920)</option><option value="16:9">16:9 — Landscape</option></select></div>
        <div class="tmpl-field"><label>Accent color</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="teAccent" value="#ff0050" style="width:36px;height:32px;padding:2px;border-radius:6px;cursor:pointer;border:1px solid var(--input-border)"/><span id="teAccentHex" style="font-size:11px;color:var(--text-muted);font-family:monospace">#ff0050</span></div></div>
      </div>
      <div class="tmpl-field"><label>Icon</label><div class="tmpl-icon-grid" id="teIconGrid"></div></div>
      <div class="tmpl-field"><label>Variables used</label><div id="teVars" style="display:flex;flex-wrap:wrap;gap:6px"></div><div style="font-size:10.5px;color:var(--text-faint);margin-top:6px">Tick the fields this template needs. Writer fills them when generating a flyer.</div></div>
      <div class="tmpl-field"><label>Blocks (layout order)</label><input id="teBlocks" placeholder="comma separated e.g. heroCover, title, hook, cta, qr, logo"/></div>
      <div class="tmpl-field" id="teVariantsWrap" style="display:none"><label>Variants (comma separated)</label><input id="teVariants" placeholder="e.g. 3 days to go, 2 days to go, Tomorrow, Out Now"/><div style="font-size:10.5px;color:var(--text-faint);margin-top:4px">Only for countdown-style templates. Leave blank otherwise.</div></div>
    </div>
    <div class="tmpl-modal-foot" style="display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);justify-content:flex-end">
      <button class="tmpl-btn" onclick="closeTmplModal()">Cancel</button><button class="tmpl-btn primary" id="teSave">Save</button>
    </div>
  </div>
</div>
</div>

<style>
*{box-sizing:border-box}
.tmpl-page{padding:0;margin:0;max-width:100%}
/* Phone container on mobile — keeps inner content centered like author/reader phone, while laptop keeps Marketing full-width shell */
@media (max-width: 640px){
  #root .mkg-content{padding:0}
  .tmpl-page{max-width:420px;margin:0 auto;padding:12px 12px 24px;box-shadow:0 0 24px rgba(0,0,0,.06);border-radius:0}
  .tmpl-stats{grid-template-columns:repeat(2,1fr)}
  .tmpl-toolbar{flex-wrap:wrap}
  .tmpl-search{min-width:0}
  .tmpl-card{flex-wrap:wrap}
  .tmpl-card .tmpl-info{min-width:120px}
}
.tmpl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tmpl-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.tmpl-stat .num{font-size:20px;font-weight:800;margin-bottom:2px}
.tmpl-stat .lbl{font-size:10.5px;color:var(--text-muted);font-weight:600}
.tmpl-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tmpl-search{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:8px 12px;flex:1;min-width:180px}
.tmpl-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.tmpl-search i{color:var(--text-faint);font-size:12px}
.tmpl-select{font-size:12px;font-weight:600;font-family:inherit;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:8px 11px;cursor:pointer}
.tmpl-btn{font-size:11px;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.tmpl-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.tmpl-card{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.15s}
.tmpl-card:hover{border-color:var(--accent)}
.tmpl-thumb{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff}
.tmpl-info{flex:1;min-width:0}
.tmpl-name{font-size:12.5px;font-weight:700}
.tmpl-meta{font-size:10px;color:var(--text-faint);margin-top:2px}
.tmpl-desc{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmpl-badges{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.tmpl-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.03em}
.tmpl-badge.size{background:var(--table-head);color:var(--text-muted)}
.tmpl-badge.ratio{background:rgba(255,0,80,.08);color:var(--accent)}
.tmpl-actions{display:flex;gap:5px;flex-shrink:0}
.tmpl-act{width:28px;height:28px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.tmpl-act:hover{border-color:var(--accent);color:var(--accent)}
.tmpl-act.del:hover{border-color:var(--red);color:var(--red)}
.tmpl-modal-bg{position:fixed;inset:0;z-index:1300;background:rgba(10,6,25,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.tmpl-modal-bg.open{display:flex}
.tmpl-modal{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.18);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.tmpl-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.tmpl-field{margin-bottom:12px}
.tmpl-field label{display:block;font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.tmpl-field input:not([type=color]),.tmpl-field textarea,.tmpl-field select{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--text);font-family:inherit;outline:none}
.tmpl-field textarea{resize:vertical;min-height:56px}
.tmpl-icon-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tmpl-icon-opt{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--input-border);background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-muted);cursor:pointer;transition:.12s}
.tmpl-icon-opt:hover{border-color:var(--accent);color:var(--accent)}
.tmpl-icon-opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tmpl-var-chip{font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;border:1.5px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);cursor:pointer}
.tmpl-var-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
</style>

<script src="shared/marketing-sidebar.js"></script>
<script src="../component/share-modal.js"></script>
<script src="../component/flyer-preview.js"></script>
<script src="shared/templates-page-service.js"></script>
<script>TemplatesService.init();</script></body></html>
