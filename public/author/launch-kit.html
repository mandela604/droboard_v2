<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Campaign · Droboard</title>
<link rel="icon" type="image/png" href="../assets/droboard-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;padding:20px}
.phone{width:375px;min-height:700px;background:var(--bg);border-radius:32px;border:8px solid #1a1730;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;display:flex;flex-direction:column}
.phone-notch{height:28px;background:#1a1730;display:flex;align-items:center;justify-content:center}
.phone-notch::after{content:'';width:80px;height:6px;border-radius:3px;background:#333}
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,247,248,.95);backdrop-filter:blur(12px);padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.tb-logo{width:32px;height:32px;border-radius:9px;background:rgba(255,45,85,.08);color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tb-title{font-size:15.5px;font-weight:800;flex:1}
.icon-btn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:#555;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:14px 16px 80px}

:root{--bg:#f7f7f8;--card:#fff;--pink:#ff2d55;--text:#1a1a1a;--muted:#8e8e93;--border:#ebebed;--success:#22c55e;--blue:#3b82f6;--purple:#9333ea}
img{display:block;object-fit:cover}button{font-family:inherit;cursor:pointer;border:none;background:none}a{color:inherit;text-decoration:none}

.campaign-banner{position:relative;border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.campaign-banner img{width:100%;height:180px;object-fit:cover}
.campaign-banner-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.campaign-banner-title{font-size:16px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:2px}
.campaign-banner-desc{font-size:10.5px;color:rgba(255,255,255,.8);line-height:1.4}
.campaign-banner-badge{position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:700;text-transform:uppercase;background:var(--success);color:#fff}

.link-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.link-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.link-row{display:flex;align-items:center;gap:8px}
.link-url{flex:1;font-size:11px;font-family:monospace;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn{padding:7px 12px;border-radius:8px;font-size:10px;font-weight:700;background:var(--pink);color:#fff;flex-shrink:0}

.qr-row{display:flex;gap:12px;align-items:center;margin-top:10px}
.qr-box{width:80px;height:80px;background:#fff;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.qr-info{flex:1}
.qr-info p{font-size:10.5px;color:var(--muted);line-height:1.4;margin-bottom:6px}
.qr-btns{display:flex;gap:6px}

.section{margin-bottom:18px}
.sec-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title i{font-size:12px;color:var(--pink)}

.share-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.share-card-platform{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.share-card-platform i{font-size:16px}
.share-card-platform .name{font-size:12px;font-weight:700;flex:1}
.share-card-platform .copy-btn{padding:4px 10px;border-radius:6px;font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0}
.share-card-body{padding:12px}
.share-card-text{font-size:11.5px;line-height:1.6;color:var(--text)}
.share-card-actions{display:flex;gap:6px;padding:0 12px 12px}
.share-card-actions .btn{flex:1;padding:8px;font-size:10.5px;border-radius:8px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-whatsapp{background:#25d366;color:#fff}
.btn-facebook{background:#1877f2;color:#fff}
.btn-copy{background:var(--pink);color:#fff}
.btn-outline{background:var(--card);border:1px solid var(--border);color:var(--text)}

.promoter-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.promoter-item:last-child{border:none}
.promoter-info{flex:1}
.promoter-name{font-size:12px;font-weight:700}
.promoter-stats{font-size:10px;color:var(--muted)}

/* Create / Edit form */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.form-label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:12.5px;color:var(--text);font-family:inherit;outline:none}
.form-input:focus{border-color:var(--pink)}
textarea.form-input{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.form-btn{width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
.form-btn-primary{background:var(--pink);color:#fff}
.form-btn-outline{background:var(--card);border:1px solid var(--border);color:var(--text)}
.story-search-wrap{position:relative}
.story-dropdown{position:absolute;top:100%;left:0;right:0;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:160px;overflow-y:auto;display:none}
.story-option{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;transition:.1s}
.story-option:hover{background:var(--bg)}
.story-option img{width:32px;height:44px;border-radius:4px;object-fit:cover}
.story-option .title{font-size:11.5px;font-weight:700}
.story-option .genre{font-size:9.5px;color:var(--muted)}
.story-preview{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
.story-preview img{width:44px;height:60px;border-radius:6px;object-fit:cover}
.story-preview .info{flex:1}
.story-preview .info h4{font-size:12px;font-weight:700}
.story-preview .info p{font-size:10px;color:var(--muted)}
.story-preview .remove{background:none;border:none;color:var(--pink);font-size:12px;flex-shrink:0}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state i{font-size:40px;margin-bottom:12px;opacity:.3;font-style:normal}
.empty-state p{font-size:13px;font-weight:600;margin-bottom:4px}
.empty-state small{font-size:11px}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:600;z-index:2000;pointer-events:none;animation:toastIn .3s ease,toastOut .3s ease 1.2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

.tab-bar{display:flex;gap:0;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tab-item{flex:1;padding:10px 8px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
.tab-item:hover{color:var(--text)}
.tab-item.active{background:var(--pink);color:#fff}
</style>
</head>
<body>
<script src="../component/screen-loader.js?v=3" data-auto></script>
<script src="../component/author-avatar.js?v=3"></script>

<div class="phone">
  <div class="phone-notch"></div>
  <div class="topbar">
    <div class="tb-logo"><i class="fas fa-bullseye"></i></div>
    <div class="tb-title">My Campaign</div>
    <button class="icon-btn" id="shareTopBtn"><i class="fas fa-share-nodes"></i></button>
  </div>
  <div class="content" id="pageContent"></div>
</div>

<script src="../component/flyer-preview.js"></script>
<script src="services/api-config.js?v=2"></script>
<script src="services/drawer-service.js?v=3"></script>
<script src="services/launch-kit-service.js?v=2"></script>
<script>
  AuthorLaunchKitService.init();
  document.getElementById('shareTopBtn').addEventListener('click', function () { window.shareCampaign(); });
</script>
<script src="../shared/theme-chrome.js"></script>
</body>
</html>
