<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Edit Chapter · Droboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--acc:#ff0050;--bg:#d8d8d8;--l1:#ffffff;--l2:#eeeeee;--card:#ffffff;--bd:rgba(0,0,0,.12);--tx-high:#161616;--tx-body:#3a3a3a;--tx-muted:#666;--tx-faint:#8a8a8a;--green:#16a34a;--green-bg:#e2f8ea;--amber:#d97706;--red:#e0384d;--purple:#5b4bcf}
[data-theme="dark"]{--bg:#000;--l1:#08090c;--l2:#0e0f13;--card:#0e0f13;--bd:rgba(255,255,255,.07);--tx-high:#e0e0e0;--tx-body:#c0c0c0;--tx-muted:#71717a;--tx-faint:#3f3f46;--green-bg:rgba(22,163,74,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--tx-body);display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer}::-webkit-scrollbar{display:none}
.phone{width:100%;max-width:420px;min-height:100vh;background:var(--l1);position:relative;z-index:1;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden}
@media(min-width:421px){.phone{box-shadow:0 0 50px rgba(0,0,0,.14)}}
.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);flex-shrink:0}
[data-theme="dark"] .top-bar{background:rgba(0,0,0,.97)}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);display:flex;align-items:center;justify-content:center;color:var(--tx-body);font-size:15px;flex-shrink:0;border:none}
.top-title{flex:1;font-size:16px;font-weight:800;color:var(--tx-high)}

.content{flex:1;overflow-y:auto;padding:16px 14px 30px}

/* ── Chapter Info ── */
.chapter-info{display:flex;align-items:center;gap:12px;padding:14px;background:var(--l2);border-radius:14px;margin-bottom:16px}
.chapter-cover{width:40px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0}
.chapter-info-title{font-size:14px;font-weight:700;color:var(--tx-high)}
.chapter-info-meta{font-size:11px;color:var(--tx-muted);margin-top:2px}
.chapter-info-ch{font-size:11px;font-weight:700;color:var(--acc);margin-top:2px}

/* ── Status Banner ── */
.status-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:12px;font-weight:600}
.status-banner.live{background:var(--green-bg);color:var(--green)}
.status-banner.pending{background:rgba(217,119,6,.1);color:var(--amber)}
.status-banner.revision{background:rgba(224,56,77,.08);color:var(--red)}
.status-banner i{font-size:14px}

/* ── Title Input ── */
.form-label{font-size:11px;font-weight:700;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:block}
.form-input{width:100%;background:var(--l2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx-body);font-size:13px;font-family:inherit;outline:none}
.form-input:focus{border-color:var(--acc)}
.form-section{margin-bottom:16px}

/* ── Editor ── */
.editor-wrap{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--l2)}
.editor-toolbar{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.editor-toolbar button{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--tx-muted);font-size:13px;display:flex;align-items:center;justify-content:center}
.editor-toolbar button:active{background:var(--bd)}
.editor-toolbar button.active{background:rgba(255,0,80,.1);color:var(--acc)}
.editor-toolbar .sep{width:1px;background:var(--bd);margin:4px 4px}
.writing-area{min-height:300px;padding:14px;font-size:14px;line-height:1.7;color:var(--tx-body);outline:none;max-height:60vh;overflow-y:auto}
.writing-area:empty::before{content:attr(data-placeholder);color:var(--tx-faint)}
.writing-area p{margin-bottom:12px}
.word-count{padding:8px 14px;font-size:11px;color:var(--tx-faint);border-top:1px solid var(--bd)}

/* ── Actions ── */
.actions{display:flex;gap:10px;padding:16px 0}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-save{background:var(--l2);color:var(--tx-body);border:1px solid var(--bd)}
.btn-submit{background:var(--acc);color:#fff}

/* ── Review Prompt ── */
.review-prompt{display:none;padding:16px;background:var(--l2);border-radius:14px;margin-top:16px;text-align:center}
.review-prompt.show{display:block}
.review-prompt h3{font-size:15px;font-weight:800;color:var(--tx-high);margin-bottom:6px}
.review-prompt p{font-size:12px;color:var(--tx-muted);line-height:1.5;margin-bottom:14px}
.review-prompt .btn{width:100%}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(22,22,27,.92);color:#fff;padding:9px 18px;border-radius:24px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .22s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:201;width:82%;max-width:320px;background:var(--l1);box-shadow:2px 0 24px rgba(0,0,0,.12);transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.drawer-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#8a0030);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.drawer-head-title{font-size:15px;font-weight:800;flex:1;color:var(--tx-high)}
.drawer-close{width:32px;height:32px;border-radius:50%;background:var(--l2);color:var(--tx-muted);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:none}
.drawer-body{flex:1;overflow-y:auto;padding:10px 8px 24px}
.drawer-section{margin-bottom:6px}
.drawer-section-title{font-size:10.5px;font-weight:800;color:var(--tx-faint);text-transform:uppercase;letter-spacing:.04em;padding:14px 12px 6px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--tx-body);text-decoration:none}
.drawer-item i{width:18px;text-align:center;font-size:14px;color:var(--tx-muted);flex-shrink:0}
.drawer-item:active{background:var(--l2)}
.drawer-item.active{background:rgba(255,0,80,.08);color:var(--acc)}
.drawer-item.active i{color:var(--acc)}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button class="back-btn" id="menuBtn" style="font-size:13px"><i class="fas fa-bars"></i></button>
    <button class="back-btn" id="backBtn"><i class="fas fa-chevron-left"></i></button>
    <div class="top-title" id="pageTitle">Edit Chapter</div>

  </div>

  <div class="content">
    <div class="chapter-info" id="chapterInfo"></div>

    <div class="status-banner" id="statusBanner"></div>

    <div class="form-section">
      <label class="form-label">Chapter Title</label>
      <input class="form-input" id="chTitle" placeholder="Chapter title…"/>
    </div>

    <div class="form-section">
      <label class="form-label">Content</label>
      <div class="editor-wrap">
        <div class="editor-toolbar">
          <button onclick="fmt('bold')" title="Bold"><i class="fas fa-bold"></i></button>
          <button onclick="fmt('italic')" title="Italic"><i class="fas fa-italic"></i></button>
          <div class="sep"></div>
          <button onclick="fmt('formatBlock','H2')" title="Heading"><i class="fas fa-heading"></i></button>
          <button onclick="fmt('formatBlock','BLOCKQUOTE')" title="Quote"><i class="fas fa-quote-left"></i></button>
          <button onclick="insertBreak()" title="Scene Break"><i class="fas fa-asterisk"></i></button>
        </div>
        <div class="writing-area" id="editor" contenteditable="true" data-placeholder="Start writing…"></div>
        <div class="word-count" id="wordCount">0 words</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-save" id="saveBtn"><i class="fas fa-floppy-disk"></i> Save Draft</button>
      <button class="btn btn-submit" id="submitReviewBtn"><i class="fas fa-paper-plane"></i> Submit for Review</button>
    </div>

    <div class="review-prompt" id="reviewPrompt">
      <h3>Ready for Review?</h3>
      <p>Your chapter has been saved. Submit it for your editor to review before it goes live.</p>
      <button class="btn btn-submit" id="applyReviewBtn"><i class="fas fa-check"></i> Apply for Review</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-logo"><i class="fas fa-feather-pointed"></i></div>
    <div class="drawer-head-title">Droboard</div>
    <button class="drawer-close" id="drawerClose"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script>
(function(){
'use strict';
var THEME_KEY='droboardTheme';
function getTheme(){try{return localStorage.getItem(THEME_KEY)||'light';}catch(e){return 'light';}}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
setTheme(getTheme());

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2400);}

var params=new URLSearchParams(location.search);
var bookId=params.get('book')||'b1';
var chapterNum=parseInt(params.get('chapter'))||1;

var BOOKS=[
  {id:'b1',title:'The Midnight Protocol',genre:'Romance',cover:'https://picsum.photos/seed/book1/100/140',chapters:[
    {n:1,title:'The Letter',status:'live',content:'<p>Dear Ms. Vale,</p><p>We are pleased to inform you that your manuscript has been selected for our exclusive publishing program. The committee was particularly impressed by the emotional depth of your characters and the unexpected twists in the plot.</p><p>Please review the attached terms and respond within 48 hours.</p><p>Best regards,<br/>The Editorial Team</p>'},
    {n:2,title:'First Meeting',status:'live',content:'<p>The office was exactly as she had imagined — floor-to-ceiling windows overlooking the city, modern art on the walls, and the faint scent of fresh coffee.</p><p>"Ms. Vale? I\'m Marcus Reed, the editor assigned to your project." He extended a hand, his grip firm but warm.</p><p>"Please, call me Luna," she said, settling into the chair across from his desk.</p>'},
    {n:3,title:'The Agreement',status:'pending_review',content:'<p>They spent the next three hours going over every detail of the contract. Luna\'s eyes lingered on the exclusivity clause.</p><p>"Twenty-four months," Marcus said, sliding the paper toward her. "That gives us time to build your brand properly."</p><p>Luna picked up the pen, hesitated, then signed. There was no turning back now.</p>'},
    {n:4,title:'Late Night Call',status:'revision_needed',content:'<p>Her phone buzzed at 11:47 PM. The screen glowed with Marcus\'s name.</p><p>"Luna, I just finished reading Chapter 12. We need to talk about the ending."</p><p>She sat up in bed, suddenly wide awake. "What about it?"</p><p>"It\'s too predictable. Your readers will see it coming from a mile away. Let\'s rewrite it."</p>'},
    {n:5,title:'Confession',status:'live',content:'<p>The rain hammered against the windows as Luna typed the final words of Chapter 15. Tears blurred her vision — not from sadness, but from the raw honesty she had poured into the scene.</p><p>Her phone lit up. A message from Marcus: "Whatever you just wrote — I felt it through the pages."</p>'}
  ]},
  {id:'b2',title:'Echoes of Yesterday',genre:'Drama',cover:'https://picsum.photos/seed/book2/100/140',chapters:[
    {n:1,title:'Return',status:'live',content:'<p>Five years away had not changed the town much. The same cracked sidewalks, the same oak tree outside the library, the same bench where they used to sit.</p><p>But everything else had changed. She was different now. Stronger. Or at least, she hoped so.</p>'},
    {n:2,title:'Old Friends',status:'live',content:'<p>"You\'re back." David stood in the doorway of the café, coffee in hand, looking exactly as she remembered.</p><p>"Just visiting," Elena said quickly.</p><p>"Sure." He smiled that familiar half-smile. "Just visiting."</p>'},
    {n:3,title:'The Truth',status:'live',content:'<p>She hadn\'t planned on telling him. But the words came out anyway, tumbling like stones down a hill.</p><p>"I left because I was scared. Not of you — of what we could have been."</p><p>David was quiet for a long time. Then: "And now?"</p>'}
  ]}
];

var book=BOOKS.find(function(b){return b.id===bookId;});
if(!book)book=BOOKS[0];
var chapter=book.chapters.find(function(c){return c.n===chapterNum;});
if(!chapter)chapter=book.chapters[0];

document.getElementById('pageTitle').textContent='Ch. '+chapter.n+' — '+chapter.title;
document.getElementById('chTitle').value=chapter.title;
document.getElementById('editor').innerHTML=chapter.content||'';
document.getElementById('chapterInfo').innerHTML=
  '<img class="chapter-cover" src="'+book.cover+'" alt=""/>'
  +'<div><div class="chapter-info-title">'+book.title+'</div>'
  +'<div class="chapter-info-meta">'+book.genre+'</div>'
  +'<div class="chapter-info-ch">Chapter '+chapter.n+'</div></div>';

function getStatusBanner(s){
  if(s==='pending_review')return '<i class="fas fa-clock"></i> Pending Review — waiting for editor';
  if(s==='revision_needed')return '<i class="fas fa-exclamation-circle"></i> Revision Needed — editor requested changes';
  return '<i class="fas fa-check-circle"></i> Live — published and visible to readers';
}
var banner=document.getElementById('statusBanner');
banner.className='status-banner '+chapter.status.replace('_','');
banner.innerHTML=getStatusBanner(chapter.status);

function updateWordCount(){
  var text=document.getElementById('editor').innerText||'';
  var words=text.trim()?text.trim().split(/\s+/).length:0;
  document.getElementById('wordCount').textContent=words+' word'+(words!==1?'s':'');
}
updateWordCount();
document.getElementById('editor').addEventListener('input',updateWordCount);

function fmt(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('editor').focus();}
function insertBreak(){document.execCommand('insertHTML','<p style="text-align:center;color:var(--tx-faint)">— — —</p>');}

var savedContent=chapter.content||'';

document.getElementById('saveBtn').addEventListener('click',function(){
  chapter.title=document.getElementById('chTitle').value.trim()||chapter.title;
  chapter.content=document.getElementById('editor').innerHTML;
  savedContent=chapter.content;
  document.getElementById('pageTitle').textContent='Ch. '+chapter.n+' — '+chapter.title;
  toast('Chapter saved!');
  document.getElementById('reviewPrompt').classList.add('show');
});

document.getElementById('submitReviewBtn').addEventListener('click',function(){
  chapter.title=document.getElementById('chTitle').value.trim()||chapter.title;
  chapter.content=document.getElementById('editor').innerHTML;
  savedContent=chapter.content;
  document.getElementById('pageTitle').textContent='Ch. '+chapter.n+' — '+chapter.title;
  toast('Chapter saved!');
  document.getElementById('reviewPrompt').classList.add('show');
});

document.getElementById('applyReviewBtn').addEventListener('click',function(){
  chapter.status='pending_review';
  banner.className='status-banner pending';
  banner.innerHTML=getStatusBanner('pending_review');
  document.getElementById('reviewPrompt').classList.remove('show');
  toast('Chapter submitted for review!');
});

document.getElementById('backBtn').addEventListener('click',function(){
  if(window.history.length>1)window.history.back();else window.location.href='book-workspace.html';
});

var MENU_SECTIONS=[
  {title:'Author Center',items:[{label:'Dashboard',icon:'fa-gauge',href:'author-center.html'}]},
  {title:'Applications',items:[
    {label:'Contracts',icon:'fa-file-signature',href:'apply-contract.html'},
    {label:'Completion',icon:'fa-flag-checkered',href:'apply-completion.html'},
    {label:'Chapter Review',icon:'fa-pen-to-square',href:'request-chapter-review.html'},
    {label:'Series Changes',icon:'fa-book-open',href:'request-series-change.html'},
    {label:'VIP Application',icon:'fa-crown',href:'apply-vip.html'}
  ]},
  {title:'Finance',items:[
    {label:'Earnings',icon:'fa-sack-dollar',href:'earnings.html'},
    {label:'Transactions',icon:'fa-receipt',href:'transaction-history.html'},
    {label:'Payment Details',icon:'fa-credit-card',href:'payment-details.html'}
  ]},
  {title:'Communication',items:[
    {label:'Messages',icon:'fa-comment-dots',href:'../Pages/chat.html'},
    {label:'Notifications',icon:'fa-bell',href:'../Pages/notifications.html'}
  ]},
  {title:'Settings',items:[{label:'Settings',icon:'fa-gear',href:'#'}]}
];
function renderDrawer(){
  document.getElementById('drawerBody').innerHTML=MENU_SECTIONS.map(function(sec){
    return '<div class="drawer-section"><div class="drawer-section-title">'+sec.title+'</div>'+sec.items.map(function(it){
      var active=location.pathname.indexOf(it.href.replace('.html',''))!==-1?' active':'';
      return '<a class="drawer-item'+active+'" href="'+it.href+'"><i class="fas '+it.icon+'"></i>'+it.label+'</a>';
    }).join('')+'</div>';
  }).join('');
}
document.getElementById('menuBtn').addEventListener('click',function(){
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
});
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
document.getElementById('drawerClose').addEventListener('click',closeDrawer);
document.getElementById('drawerOverlay').addEventListener('click',closeDrawer);

})();
</script>
</body>
</html>
