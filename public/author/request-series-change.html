<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Series Changes · Droboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--acc:#ff0050;--bg:#d8d8d8;--l1:#ffffff;--l2:#eeeeee;--card:#ffffff;--bd:rgba(0,0,0,.12);--tx-high:#161616;--tx-body:#3a3a3a;--tx-muted:#666;--tx-faint:#8a8a8a;--green:#16a34a;--green-bg:#e2f8ea;--amber:#d97706;--red:#e0384d}
[data-theme="dark"]{--bg:#000;--l1:#08090c;--l2:#0e0f13;--card:#0e0f13;--bd:rgba(255,255,255,.07);--tx-high:#e0e0e0;--tx-body:#c0c0c0;--tx-muted:#71717a;--tx-faint:#3f3f46;--green-bg:rgba(22,163,74,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--tx-body);display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer}::-webkit-scrollbar{display:none}
.phone{width:100%;max-width:420px;min-height:100vh;background:var(--l1);position:relative;z-index:1;box-shadow:0 0 50px rgba(0,0,0,.10);display:flex;flex-direction:column;overflow-x:hidden}
@media(min-width:421px){.phone{box-shadow:0 0 50px rgba(0,0,0,.14)}}
.top-bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);flex-shrink:0}
[data-theme="dark"] .top-bar{background:rgba(0,0,0,.97)}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--l2);display:flex;align-items:center;justify-content:center;color:var(--tx-body);font-size:15px;flex-shrink:0;border:none}
.top-title{flex:1;font-size:16px;font-weight:800;color:var(--tx-high)}

.content{flex:1;overflow-y:auto;padding:16px 14px 30px}

.page-header{padding:8px 0 20px}
.page-header h1{font-size:22px;font-weight:800;color:var(--tx-high);margin-bottom:4px}
.page-header p{font-size:13px;color:var(--tx-muted)}

.series-list{display:flex;flex-direction:column;gap:10px}
.series-row{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:.2s}
.series-header{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.series-cover{width:44px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--l2)}
.series-info{flex:1;min-width:0}
.series-title{font-size:13px;font-weight:700;color:var(--tx-high);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-meta{font-size:11px;color:var(--tx-muted);margin-top:2px}
.series-desc{font-size:11.5px;color:var(--tx-muted);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.series-chevron{font-size:12px;color:var(--tx-muted);transition:.2s;flex-shrink:0}
.series-row.open .series-chevron{transform:rotate(180deg)}

.series-accordion{max-height:0;overflow:hidden;transition:max-height .3s ease}
.series-row.open .series-accordion{max-height:400px}
.accordion-inner{padding:0 14px 14px;border-top:1px solid var(--bd)}

.change-options{display:flex;flex-direction:column;gap:6px}
.change-opt{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:10px;cursor:pointer;transition:.15s;
  background:var(--l2);font-size:12.5px;font-weight:600;color:var(--tx-body);
  border:2px solid transparent;
}
.change-opt:active{transform:scale(.97)}
.change-opt.selected{border-color:var(--acc);background:rgba(255,0,80,.05)}
.change-opt i{width:18px;text-align:center;font-size:13px;color:var(--tx-muted);flex-shrink:0}
.change-opt.selected i{color:var(--acc)}
.change-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:transparent;transition:.15s;margin-left:auto}
.change-opt.selected .change-check{border-color:var(--acc);background:var(--acc);color:#fff}

.submit-selected{
  display:none;width:100%;padding:12px;border:none;border-radius:12px;
  background:var(--acc);color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;margin-top:10px;align-items:center;justify-content:center;gap:6px;
}
.submit-selected.show{display:flex}
.submit-selected:active{transform:scale(.97)}

.selected-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.selected-tag{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:20px;background:rgba(255,0,80,.08);color:var(--acc);
  font-size:11px;font-weight:600;
}
.selected-tag i{font-size:9px;cursor:pointer}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(22,22,27,.92);color:#fff;padding:9px 18px;border-radius:24px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-panel{width:90%;max-width:400px;max-height:80vh;background:var(--card);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.modal-title{font-size:17px;font-weight:800;color:var(--tx-high)}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--l2);display:flex;align-items:center;justify-content:center;color:var(--tx-muted);font-size:13px;border:none;flex-shrink:0}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-series{display:flex;align-items:center;gap:12px;padding:12px;background:var(--l2);border-radius:12px;margin-bottom:16px}
.modal-series img{width:40px;height:56px;border-radius:8px;object-fit:cover}
.modal-series-title{font-size:14px;font-weight:700;color:var(--tx-high)}
.modal-series-meta{font-size:11px;color:var(--tx-muted);margin-top:2px}
.form-textarea{width:100%;background:var(--l2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx-body);font-size:13px;font-family:inherit;outline:none;min-height:100px;resize:vertical;line-height:1.5}
.form-textarea:focus{border-color:var(--acc)}
.form-textarea::placeholder{color:var(--tx-faint)}
.modal-footer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--bd);flex-shrink:0}
.modal-btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;position:relative;z-index:1;pointer-events:auto}
.modal-btn:active{transform:scale(.97)}
.modal-btn.cancel{background:var(--l2);color:var(--tx-body)}
.modal-btn.send{background:var(--acc);color:#fff}

.reorder-list{display:flex;flex-direction:column;gap:6px}
.reorder-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--l2);border-radius:10px;cursor:grab;transition:.15s}
.reorder-item.dragging{opacity:.4;transform:scale(.97)}
.reorder-handle{color:var(--tx-faint);font-size:14px;cursor:grab}
.reorder-name{flex:1;font-size:12.5px;font-weight:600;color:var(--tx-body)}
.reorder-chapters{font-size:11px;color:var(--tx-muted)}

.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .22s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:201;width:82%;max-width:320px;background:var(--l1);box-shadow:2px 0 24px rgba(0,0,0,.12);transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.drawer-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#8a0030);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.drawer-head-title{font-size:15px;font-weight:800;flex:1;color:var(--tx-high)}
.drawer-close{width:32px;height:32px;border-radius:50%;background:var(--l2);color:var(--tx-muted);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:none}
.drawer-body{flex:1;overflow-y:auto;padding:10px 8px 24px}
.drawer-section{margin-bottom:6px}
.drawer-section-title{font-size:10.5px;font-weight:800;color:var(--tx-faint);text-transform:uppercase;letter-spacing:.04em;padding:14px 12px 6px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--tx-body);text-decoration:none}
.drawer-item i{width:18px;text-align:center;font-size:14px;color:var(--tx-muted);flex-shrink:0}
.drawer-item:active{background:var(--l2)}
.drawer-item.active{background:rgba(255,0,80,.08);color:var(--acc)}
.drawer-item.active i{color:var(--acc)}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <button class="back-btn" id="menuBtn" style="font-size:13px"><i class="fas fa-bars"></i></button>
    <button class="back-btn" id="backBtn"><i class="fas fa-chevron-left"></i></button>
    <div class="top-title">Series Changes</div>

  </div>

  <div class="content" id="formView">
    <div class="page-header">
      <h1>Series Changes</h1>
      <p>Request changes to your series. Tap a series to see options.</p>
    </div>
    <div class="series-list" id="seriesList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="requestModal">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Change Request</div>
      <button class="modal-close" id="modalClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="modal-series" id="modalSeries"></div>
      <div class="selected-tags" id="selectedTags"></div>
      <div id="modalBodyTextarea">
        <textarea class="form-textarea" id="requestDetails" placeholder="Describe the changes you need…"></textarea>
      </div>
      <div id="modalBodyReorder" style="display:none">
        <p style="font-size:12px;color:var(--tx-muted);margin-bottom:10px">Drag to reorder seasons:</p>
        <div class="reorder-list" id="reorderList"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn send" onclick="submitRequest()"><i class="fas fa-paper-plane"></i> Submit</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-logo"><i class="fas fa-feather-pointed"></i></div>
    <div class="drawer-head-title">Droboard</div>
    <button class="drawer-close" id="drawerClose"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script>
(function(){
'use strict';
var THEME_KEY='droboardTheme';
function getTheme(){try{return localStorage.getItem(THEME_KEY)||'light';}catch(e){return 'light';}}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
setTheme(getTheme());

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2400);}

var SERIES=[
  {id:'s1',title:'The Midnight Saga',cover:'https://picsum.photos/seed/s1/100/140',chapters:48,desc:'A sweeping romance spanning two generations of love, betrayal, and redemption.',seasonList:[{id:'s1e1',name:'Season 1 — The Beginning',chapters:24},{id:'s1e2',name:'Season 2 — The Return',chapters:24}]},
  {id:'s2',title:'Echoes Collection',cover:'https://picsum.photos/seed/s2/100/140',chapters:24,desc:'Short stories exploring memory, loss, and the echoes we leave behind.',seasonList:[{id:'s2e1',name:'Season 1 — Memories',chapters:24}]},
  {id:'s3',title:'Crimson Timeline',cover:'https://picsum.photos/seed/s3/100/140',chapters:72,desc:'A thriller series following detective Noir across parallel timelines.',seasonList:[{id:'s3e1',name:'Season 1 — The Case',chapters:24},{id:'s3e2',name:'Season 2 — The Trail',chapters:24},{id:'s3e3',name:'Season 3 — The Truth',chapters:24}]}
];

var CHANGES=[
  {icon:'fa-pen',label:'Change Title'},
  {icon:'fa-image',label:'Change Cover'},
  {icon:'fa-align-left',label:'Change Description'},
  {icon:'fa-layer-group',label:'Reorder Seasons'},
  {icon:'fa-tag',label:'Change Genre Tags'}
];

function renderList(){
  document.getElementById('seriesList').innerHTML=SERIES.map(function(s){
    return '<div class="series-row" data-sid="'+s.id+'">'
      +'<div class="series-header">'
      +'<img class="series-cover" src="'+s.cover+'" alt=""/>'
      +'<div class="series-info"><div class="series-title">'+s.title+'</div>'
      +'<div class="series-meta">'+s.seasonList.length+' seasons · '+s.chapters+' chapters</div>'
      +'<div class="series-desc">'+s.desc+'</div></div>'
      +'<i class="fas fa-chevron-down series-chevron"></i></div>'
      +'<div class="series-accordion"><div class="accordion-inner">'
      +'<div class="change-options">'
      +CHANGES.map(function(c){
        return '<div class="change-opt" data-sid="'+s.id+'" data-change="'+c.label+'">'
          +'<i class="fas '+c.icon+'"></i>'+c.label
          +'<div class="change-check"><i class="fas fa-check"></i></div></div>';
      }).join('')
      +'</div>'
      +'<button class="submit-selected" data-sid="'+s.id+'"><i class="fas fa-paper-plane"></i> Submit Selected (<span class="sel-count">0</span>)</button>'
      +'</div></div></div>';
  }).join('');

  document.querySelectorAll('.series-header').forEach(function(h){
    h.addEventListener('click',function(e){
      if(e.target.closest('.change-opt')||e.target.closest('.submit-selected'))return;
      var row=h.parentElement;
      var wasOpen=row.classList.contains('open');
      document.querySelectorAll('.series-row').forEach(function(r){r.classList.remove('open');});
      if(!wasOpen)row.classList.add('open');
    });
  });

  document.querySelectorAll('.change-opt').forEach(function(opt){
    opt.addEventListener('click',function(e){
      e.stopPropagation();
      opt.classList.toggle('selected');
      var sid=opt.getAttribute('data-sid');
      updateSubmitBtn(sid);
    });
  });

  document.querySelectorAll('.submit-selected').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var sid=btn.getAttribute('data-sid');
      var selected=document.querySelectorAll('.change-opt.selected[data-sid="'+sid+'"]');
      var changes=[];
      selected.forEach(function(s){changes.push(s.getAttribute('data-change'));});
      if(changes.length) openModal(sid,changes);
    });
  });
}

function updateSubmitBtn(sid){
  var count=document.querySelectorAll('.change-opt.selected[data-sid="'+sid+'"]').length;
  var btn=document.querySelector('.submit-selected[data-sid="'+sid+'"]');
  var counter=btn.querySelector('.sel-count');
  counter.textContent=count;
  if(count>0)btn.classList.add('show');
  else btn.classList.remove('show');
}

renderList();

function openModal(sid,changes){
  var series=SERIES.find(function(s){return s.id===sid;});
  if(!series)return;
  var title=changes.length===1?changes[0]:'Change Request';
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalSeries').innerHTML=
    '<img src="'+series.cover+'" alt=""/>'
    +'<div><div class="modal-series-title">'+series.title+'</div>'
    +'<div class="modal-series-meta">'+series.seasonList.length+' seasons · '+series.chapters+' chapters</div></div>';
  document.getElementById('selectedTags').innerHTML=changes.map(function(c){
    return '<span class="selected-tag">'+c+'</span>';
  }).join('');
  document.getElementById('requestDetails').value='';
  document.getElementById('modalBodyTextarea').style.display='';
  document.getElementById('modalBodyReorder').style.display='none';
  document.getElementById('requestModal').classList.add('open');
  document.getElementById('requestModal')._sid=sid;
  document.getElementById('requestModal')._changes=changes;
}

function openReorderModal(sid){
  var series=SERIES.find(function(s){return s.id===sid;});
  if(!series)return;
  document.getElementById('modalTitle').textContent='Reorder Seasons';
  document.getElementById('modalSeries').innerHTML=
    '<img src="'+series.cover+'" alt=""/>'
    +'<div><div class="modal-series-title">'+series.title+'</div>'
    +'<div class="modal-series-meta">'+series.seasonList.length+' seasons · '+series.chapters+' chapters</div></div>';
  document.getElementById('modalBodyTextarea').style.display='none';
  document.getElementById('modalBodyReorder').style.display='';
  var list=document.getElementById('reorderList');
  list.innerHTML=series.seasonList.map(function(s,i){
    return '<div class="reorder-item" data-idx="'+i+'">'
      +'<i class="fas fa-grip-vertical reorder-handle"></i>'
      +'<span class="reorder-name">'+s.name+'</span>'
      +'<span class="reorder-chapters">'+s.chapters+' ch</span></div>';
  }).join('');
  document.getElementById('requestModal').classList.add('open');
  document.getElementById('requestModal')._sid=sid;
  document.getElementById('requestModal')._change='Reorder Seasons';
  initDrag(list);
}

function initDrag(list){
  var dragEl=null;
  list.querySelectorAll('.reorder-item').forEach(function(item){
    item.querySelector('.reorder-handle').addEventListener('mousedown',function(){dragEl=item;item.classList.add('dragging');});
    item.addEventListener('mouseover',function(){
      if(!dragEl||dragEl===item)return;
      var items=Array.from(list.children);
      var fromIdx=items.indexOf(dragEl);
      var toIdx=items.indexOf(item);
      if(fromIdx<toIdx){list.insertBefore(dragEl,item.nextSibling);}
      else{list.insertBefore(dragEl,item);}
    });
  });
  document.addEventListener('mouseup',function(){if(dragEl){dragEl.classList.remove('dragging');dragEl=null;}});
}

window.closeModal=function(){
  document.getElementById('requestModal').classList.remove('open');
};
document.getElementById('modalClose').onclick=window.closeModal;
document.getElementById('requestModal').onclick=function(e){if(e.target===this)window.closeModal();};

window.submitRequest=function(){
  var modal=document.getElementById('requestModal');
  var sid=modal._sid;
  var changes=modal._changes;
  var series=SERIES.find(function(s){return s.id===sid;});
  var details=document.getElementById('requestDetails').value.trim();
  if(!details){document.getElementById('requestDetails').style.borderColor='var(--red)';return;}
  document.getElementById('requestDetails').style.borderColor='';
  var btn=document.querySelector('.modal-btn.send');
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Submitting…';
  setTimeout(function(){
    modal.classList.remove('open');
    btn.innerHTML='<i class="fas fa-paper-plane"></i> Submit';
    document.querySelectorAll('.change-opt.selected[data-sid="'+sid+'"]').forEach(function(o){o.classList.remove('selected');});
    updateSubmitBtn(sid);
    toast(series.title+' — '+changes.length+' change'+(changes.length>1?'s':'')+' submitted!');
  },1200);
};

document.getElementById('backBtn').addEventListener('click',function(){if(window.history.length>1)window.history.back();else window.location.href='author-center.html';});

var MENU_SECTIONS=[
  {title:'Author Center',items:[{label:'Dashboard',icon:'fa-gauge',href:'author-center.html'}]},
  {title:'Applications',items:[
    {label:'Contracts',icon:'fa-file-signature',href:'apply-contract.html'},
    {label:'Completion',icon:'fa-flag-checkered',href:'apply-completion.html'},
    {label:'Chapter Review',icon:'fa-pen-to-square',href:'request-chapter-review.html'},
    {label:'Series Changes',icon:'fa-book-open',href:'request-series-change.html'},
    {label:'VIP Application',icon:'fa-crown',href:'apply-vip.html'}
  ]},
  {title:'Finance',items:[
    {label:'Earnings',icon:'fa-sack-dollar',href:'earnings.html'},
    {label:'Transactions',icon:'fa-receipt',href:'transaction-history.html'},
    {label:'Payment Details',icon:'fa-credit-card',href:'payment-details.html'}
  ]},
  {title:'Communication',items:[
{label:'Messages',icon:'fa-comment-dots',href:'../Pages/chat.html'},
{label:'Notifications',icon:'fa-bell',href:'../Pages/notifications.html'}
  ]},
  {title:'Settings',items:[{label:'Settings',icon:'fa-gear',href:'#'}]}
];

function renderDrawer(){
  document.getElementById('drawerBody').innerHTML=MENU_SECTIONS.map(function(sec){
    return '<div class="drawer-section"><div class="drawer-section-title">'+sec.title+'</div>'+sec.items.map(function(it){
      var active=location.pathname.indexOf(it.href.replace('.html',''))!==-1?' active':'';
      return '<a class="drawer-item'+active+'" href="'+it.href+'"><i class="fas '+it.icon+'"></i>'+it.label+'</a>';
    }).join('')+'</div>';
  }).join('');
}

document.getElementById('menuBtn').addEventListener('click',function(){
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
});
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
