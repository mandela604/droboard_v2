<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Author Center · DroBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f7f7f8;--card:#ffffff;--pink:#ff2d55;
  --text:#1a1a1a;--muted:#8e8e93;--border:#ebebed;
  --success:#22c55e;--success-soft:#e9fbf0;
  --warning:#f59e0b;--warning-soft:#fef3e2;
  --blue:#3b82f6;--blue-soft:#e7f0fe;
  --purple:#9333ea;--purple-soft:#f3e8ff;
  --danger:#ef4444;--danger-soft:#fdeaea;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,12px);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif}
body{padding-bottom:calc(var(--nav-h) + var(--safe-b))}
img{display:block;object-fit:cover}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(247,247,248,.95);backdrop-filter:blur(12px);
  padding:10px 16px 8px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.tb-title-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.tb-logo{
  width:32px;height:32px;border-radius:9px;background:rgba(255,45,85,.08);color:var(--pink);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
}
.tb-title{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#555;position:relative;flex-shrink:0;
}
.icon-btn .dot{
  position:absolute;top:8px;right:8px;width:7px;height:7px;
  background:var(--pink);border-radius:50%;border:1.5px solid #fff;
}
.avatar-btn{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
.avatar-btn img{width:100%;height:100%}

.content{padding:14px 16px 20px}

/* ── WELCOME ── */
.welcome{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);padding:18px 16px;margin-bottom:20px;
}
.welcome-greet{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.3;margin-bottom:4px}
.welcome-sub{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ── SECTION HEAD ── */
.section{margin-bottom:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px}
.sec-title{font-size:16px;font-weight:700}
.view-all{font-size:12px;font-weight:600;color:var(--muted)}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{
  background:var(--card);border-radius:14px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid var(--border);
}
.stat-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:10px}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.stat-num{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-bottom:5px}
.stat-growth{font-size:10.5px;font-weight:700;color:var(--success);display:flex;align-items:center;gap:3px}
.stat-growth .dim{color:var(--muted);font-weight:500}

/* ── BOOK CARDS ── */
.book-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.book-card{
  display:flex;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);padding:12px;cursor:pointer;
}
.book-card:active{opacity:.85}
.book-cover{width:64px;height:88px;border-radius:9px;overflow:hidden;flex-shrink:0;background:#e8e8ed}
.book-cover img{width:100%;height:100%}
.book-info{flex:1;min-width:0;display:flex;flex-direction:column}
.book-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.book-title{font-size:14.5px;font-weight:700;line-height:1.3}
.book-chev{color:var(--muted);font-size:12px;margin-top:3px;flex-shrink:0}
.book-genre{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px;margin-bottom:8px}
.book-stats{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:auto}
.book-stat{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted)}
.book-stat i{font-size:9.5px}
.book-foot{display:flex;align-items:center;margin-top:9px}
.status-badge{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.02em;text-transform:uppercase}
.status-badge.published{background:var(--success-soft);color:#158a48}
.status-badge.ongoing{background:var(--warning-soft);color:#b7690a}
.status-badge.draft{background:var(--blue-soft);color:#1d5fd6}
.status-badge.scheduled{background:var(--warning-soft);color:#b7690a}
.status-badge.paused{background:#f1f1f4;color:#5c5c66}
.status-badge.rejected{background:var(--danger-soft);color:#c92a2a}

/* ── NEW BOOK CARD ── */
.new-book-card{
  border:1.5px dashed #ffb8c8;background:rgba(255,45,85,.05);border-radius:14px;
  padding:20px 16px;text-align:center;cursor:pointer;
}
.new-book-card:active{opacity:.85}
.new-book-plus{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:16px;margin:0 auto 8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.new-book-title{font-size:13.5px;font-weight:800;color:var(--pink);margin-bottom:3px}
.new-book-sub{font-size:11.5px;color:#c23a63;font-weight:500}

/* ── HAMBURGER DRAWER ── */
.drawer-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:201;width:82%;max-width:320px;
  background:var(--card);box-shadow:2px 0 24px rgba(0,0,0,.12);
  transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;align-items:center;gap:10px;padding:16px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.drawer-head .tb-logo{width:34px;height:34px;font-size:14px}
.drawer-head-title{font-size:15px;font-weight:800;flex:1}
.drawer-close{width:32px;height:32px;border-radius:50%;background:#f1f1f4;color:#555;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:10px 8px 24px}
.drawer-section{margin-bottom:6px}
.drawer-section-title{
  font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:14px 12px 6px;
}
.drawer-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--text);
}
.drawer-item i{width:18px;text-align:center;font-size:14px;color:var(--muted);flex-shrink:0}
.drawer-item:active{background:#f5f5f7}
.drawer-item.active{background:rgba(255,45,85,.08);color:var(--pink)}
.drawer-item.active i{color:var(--pink)}
.drawer-item-badge{
  margin-left:auto;font-size:8.5px;font-weight:800;color:var(--pink);
  background:rgba(255,45,85,.1);padding:2px 6px;border-radius:20px;text-transform:uppercase;
}

/* ── RESPONSIVE ── */
@media (max-width:359px){
  .stat-num{font-size:17px}
  .book-cover{width:56px;height:78px}
  .book-title{font-size:13.5px}
}
@media (min-width:600px){
  .content{max-width:560px;margin:0 auto;padding:20px 20px 28px}
  .topbar{max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px}
}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="topbar">
  <div class="icon-btn" id="menuBtn"><i class="fas fa-bars"></i></div>
  <div class="tb-title-wrap">
    <div class="tb-logo"><i class="fas fa-feather-alt"></i></div>
    <div class="tb-title">Author Center</div>
  </div>
  <div class="icon-btn" onclick="location.href='../Pages/notifications.html'"><i class="far fa-bell"></i><span class="dot"></span></div>
  <div class="icon-btn" onclick="location.href='../Pages/chat.html'"><i class="fas fa-comment-dots"></i></div>
  <div class="avatar-btn"><img src="https://i.pravatar.cc/100?img=47" alt="Luna Vale"/></div>
</div>

<div class="content">

  <div class="welcome">
    <div class="welcome-greet">Welcome back, Luna Vale 👋</div>
    <div class="welcome-sub">Here's what's happening with your stories today.</div>
  </div>

  <section class="section">
    <div class="sec-head"><h2 class="sec-title">Overview</h2></div>
    <div class="stat-grid" id="statGrid"></div>
  </section>

  <section class="section" style="margin-bottom:6px">
    <div class="sec-head"><h2 class="sec-title">My Books</h2><span class="view-all">View All ›</span></div>
    <div class="book-list" id="bookList"></div>
    <div class="new-book-card" id="newBookBtn">
      <div class="new-book-plus"><i class="fas fa-plus"></i></div>
      <div class="new-book-title">New Book</div>
      <div class="new-book-sub">Start writing your next great story.</div>
    </div>
  </section>

</div>

<!-- Hamburger drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="tb-logo"><i class="fas fa-feather-alt"></i></div>
    <div class="drawer-head-title">DroBoard</div>
    <div class="drawer-close" id="drawerClose"><i class="fas fa-xmark"></i></div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- Platform bottom nav -->
<script src="component/bottom-nav.js"></script>

<script src="services/api-config.js"></script>
<script src="services/drawer-service.js"></script>
<script src="services/author-center-service.js"></script>
<script>AuthorCenterService.init();</script>
</body>
</html>
