<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Transaction History · DroBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f7f7f8;--card:#fff;--pink:#ff2d55;--text:#1a1a1a;--muted:#8e8e93;--border:#ebebed;--success:#22c55e;--success-soft:#e9fbf0;--blue:#3b82f6;--blue-soft:#e7f0fe;--purple:#9333ea;--purple-soft:#f3e8ff;--danger:#ef4444;--danger-soft:#fdeaea;--warning:#f59e0b;--warning-soft:#fef3e2}
[data-theme="dark"]{--bg:#000;--card:#0e0c14;--text:#e8e0f0;--muted:#6b6580;--border:rgba(255,255,255,.08)}
[data-theme="dark"] html,[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] .phone{background:var(--card)}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif}
img{display:block;object-fit:cover}button{font-family:inherit;cursor:pointer;border:none;background:none}a{color:inherit;text-decoration:none}
::-webkit-scrollbar{display:none}

.topbar{position:sticky;top:0;z-index:50;background:rgba(247,247,248,.95);backdrop-filter:blur(12px);padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.tb-title-wrap{flex:1;display:flex;align-items:center;gap:8px}
.tb-logo{width:32px;height:32px;border-radius:9px;background:rgba(255,45,85,.08);color:var(--pink);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tb-title{font-size:15.5px;font-weight:800}
.avatar-btn{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
.avatar-btn img{width:100%;height:100%}
.menu-btn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;flex-shrink:0;cursor:pointer}

/* ── HAMBURGER DRAWER ── */
.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .22s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:201;width:82%;max-width:320px;background:var(--card);box-shadow:2px 0 24px rgba(0,0,0,.12);transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.drawer-head .tb-logo{width:34px;height:34px;font-size:14px}
.drawer-head-title{font-size:15px;font-weight:800;flex:1}
.drawer-close{width:32px;height:32px;border-radius:50%;background:#f1f1f4;color:#555;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:10px 8px 24px}
.drawer-section{margin-bottom:6px}
.drawer-section-title{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 12px 6px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text)}
.drawer-item i{width:18px;text-align:center;font-size:14px;color:var(--muted);flex-shrink:0}
.drawer-item:active{background:#f5f5f7}
.drawer-item.active{background:rgba(255,45,85,.08);color:var(--pink)}
.drawer-item.active i{color:var(--pink)}

.content{padding:16px}

/* ── KPIs ── */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.kpi-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.kpi-val{font-size:18px;font-weight:800}
.kpi-val.green{color:var(--success)}
.kpi-val.blue{color:var(--blue)}
.kpi-val.purple{color:var(--purple)}
.kpi-val.red{color:var(--danger)}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:8px 4px;border-radius:9px;font-size:12px;font-weight:700;text-align:center;color:var(--muted);white-space:nowrap;cursor:pointer;transition:.15s}
.tab.active{background:var(--pink);color:#fff}

/* ── Search ── */
.search-bar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.search-bar input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}
.search-bar input::placeholder{color:var(--muted)}
.search-bar i{color:var(--muted);font-size:13px}

/* ── Transaction Item ── */
.txn-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);cursor:pointer;transition:.1s}
.txn-card:active{opacity:.85}
.txn-top{display:flex;align-items:center;gap:12px}
.txn-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.txn-icon.royalty{background:var(--success-soft);color:var(--success)}
.txn-icon.tip{background:var(--purple-soft);color:var(--purple)}
.txn-icon.bonus{background:var(--warning-soft);color:var(--warning)}
.txn-icon.withdrawal{background:var(--blue-soft);color:var(--blue)}
.txn-icon.adjustment{background:var(--danger-soft);color:var(--danger)}
.txn-info{flex:1;min-width:0}
.txn-desc{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{display:flex;gap:8px;margin-top:3px}
.txn-meta span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.txn-right{text-align:right;flex-shrink:0}
.txn-amount{font-size:15px;font-weight:800}
.txn-amount.pos{color:var(--success)}
.txn-amount.neg{color:var(--danger)}
.txn-status{font-size:10px;font-weight:700;margin-top:2px;padding:2px 6px;border-radius:10px;display:inline-block}
.txn-status.completed{background:var(--success-soft);color:var(--success)}
.txn-status.pending{background:var(--warning-soft);color:var(--warning)}

/* ── Empty ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty i{font-size:36px;margin-bottom:12px;color:var(--border)}
.empty p{font-size:13px;line-height:1.5}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px 0}
.page-btn{
  min-width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
}
.page-btn:active{transform:scale(.95)}
.page-btn.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.page-btn:disabled{opacity:.3;cursor:default;transform:none}
.page-btn.nav{font-size:13px}
.page-info{font-size:11px;color:var(--muted);margin:0 6px}

/* ── Detail Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:24px 20px;transform:scale(.9);transition:.25s}
.modal-overlay.show .modal{transform:scale(1)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-hdr h3{font-size:16px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-row .lbl{color:var(--muted);font-weight:600}
.detail-row .val{font-weight:700;text-align:right;max-width:60%}
.dispute-btn{width:100%;padding:12px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.dispute-btn:active{opacity:.7}

/* ── Dispute Form ── */
.dispute-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.dispute-overlay.show{opacity:1;pointer-events:auto}
.dispute-panel{width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 30px;transform:translateY(100%);transition:.3s;max-height:80vh;overflow-y:auto}
.dispute-overlay.show .dispute-panel{transform:translateY(0)}
.dispute-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dispute-hdr h3{font-size:16px;font-weight:800}
.dispute-txn{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:14px}
.dispute-txn .lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.dispute-txn .val{font-size:13px;font-weight:700;margin-top:2px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.form-textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:vertical;min-height:100px;transition:.15s}
.form-textarea:focus{border-color:var(--pink)}
.form-submit{width:100%;padding:13px;border-radius:12px;background:var(--danger);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit;margin-top:14px}
.form-submit:active{opacity:.85}

/* ── Toast ── */
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(26,26,46,.95);color:#fff;padding:9px 18px;border-radius:999px;font-size:12px;font-weight:600;z-index:900;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:600px){.content{max-width:520px;margin:0 auto;padding:20px}.topbar{max-width:520px;margin:0 auto}}
</style>
<script>(function(){var t;try{t=localStorage.getItem('droboardTheme')||'light';}catch(e){t='light';}document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="topbar">
  <div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>
  <div class="tb-title-wrap">
    <div class="tb-logo"><i class="fas fa-receipt"></i></div>
    <div class="tb-title">Transactions</div>
  </div>
  <div class="avatar-btn"><img src="https://i.pravatar.cc/100?img=47" alt="Luna Vale"/></div>
</div>

<div class="content">
  <div class="kpi-row" id="kpis"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-filter="withdrawal">Withdrawals</div>
  </div>

  <div class="search-bar">
    <i class="fas fa-magnifying-glass"></i>
    <input id="searchInput" placeholder="Search transactions..."/>
  </div>

  <div id="txnList"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-hdr"><h3>Transaction Details</h3><div class="modal-close" onclick="closeDetail()"><i class="fas fa-xmark"></i></div></div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- Dispute Form -->
<div class="dispute-overlay" id="disputeForm">
  <div class="dispute-panel">
    <div class="dispute-hdr"><h3>File a Dispute</h3><div class="form-close" onclick="closeDispute()" style="width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer"><i class="fas fa-xmark"></i></div></div>
    <div class="dispute-txn" id="disputeTxnInfo"></div>
    <label class="form-label">Reason for Dispute</label>
    <textarea class="form-textarea" id="disputeReason" placeholder="Describe the issue with this transaction..."></textarea>
    <button class="form-submit" onclick="submitDispute()"><i class="fas fa-flag"></i> Submit Dispute</button>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="tb-logo"><i class="fas fa-feather-alt"></i></div>
    <div class="drawer-head-title">DroBoard</div>
    <div class="drawer-close" id="drawerClose"><i class="fas fa-xmark"></i></div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script src="../data/central-demo-data.js"></script>
<script src="../services/author-earnings-service.js"></script>
<script src="services/api-config.js"></script>
<script src="services/drawer-service.js"></script>
<script src="services/transaction-history-service.js"></script>
<script>AuthorTransactionsService.init();</script>
</body>
</html>
