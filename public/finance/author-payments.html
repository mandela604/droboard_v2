<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Author Payments — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--table-head);padding:5px;border-radius:12px;width:fit-content}
.tab-btn{font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;border:none;background:none;color:var(--text-muted);cursor:pointer;font-family:inherit}
.tab-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:11px;padding:10px 14px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:13px}
.select-box{border:1px solid var(--input-border);background:var(--input-bg);border-radius:11px;padding:10px 14px;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer}

.au-list{display:flex;flex-direction:column;gap:10px}
.au-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.au-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.au-body{flex:1;min-width:200px}
.au-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.au-name{font-size:13.5px;font-weight:700}
.status-pill{font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.status-pill.active{background:var(--green-bg);color:var(--green)}
.status-pill.on-hold{background:var(--red-bg);color:var(--red)}
.method-chip{font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--blue-bg);color:var(--blue);white-space:nowrap}
.au-meta{font-size:11px;color:var(--text-faint);display:flex;gap:14px;flex-wrap:wrap}
.au-meta span{display:flex;align-items:center;gap:4px}
.au-figures{display:flex;gap:22px;flex-shrink:0}
.au-fig{text-align:right}
.au-fig b{font-size:14px;font-weight:800;display:block}
.au-fig span{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase}
.au-actions{display:flex;gap:7px;flex-shrink:0}
.mini-btn{font-size:11px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn:disabled{opacity:.45;cursor:not-allowed}
.mini-btn:disabled:hover{border-color:var(--input-border);color:var(--text)}
.hold-note{width:100%;font-size:11px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:7px 10px;margin-top:2px}

.hist-table{width:100%;border-collapse:collapse}
.hist-table th{text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);padding:0 12px 10px;border-bottom:1px solid var(--border)}
.hist-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:12.5px}
.hist-table tr:last-child td{border-bottom:none}
.hist-author{display:flex;align-items:center;gap:9px}
.hist-author img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.hist-amt{font-weight:800}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint)}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}

.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px}

.list-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;flex-wrap:wrap;gap:10px}
.list-footer-info{font-size:11.5px;color:var(--text-faint)}
.pager{display:flex;align-items:center;gap:5px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button.active{background:var(--accent);border-color:transparent;color:#fff}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager-gap{color:var(--text-faint);font-size:11px;padding:0 2px}

/* ── Modal (centered) ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{width:90%;max-width:440px;background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalPop .2s ease}
@keyframes modalPop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.modal-hdr h3{font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px}
.modal-hdr h3 i{color:var(--accent);font-size:14px}
.modal-close{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.05);border:none;color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:0 16px 16px}
.modal-author{display:flex;align-items:center;gap:10px;padding:12px;background:var(--input-bg);border-radius:12px;margin-bottom:16px}
.modal-author img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.modal-author-name{font-size:13px;font-weight:700;color:var(--text)}
.modal-author-meta{font-size:11px;color:var(--text-faint)}
.modal-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.modal-input{width:100%;padding:11px 13px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:14px}
.modal-input:focus{border-color:var(--accent)}
.modal-hint{font-size:10.5px;color:var(--text-faint);margin-top:-10px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:.15s}
.modal-btn.cancel{background:var(--input-bg);border:1px solid var(--input-border);color:var(--text)}
.modal-btn.submit{background:var(--accent);color:#fff}
.modal-btn.submit:active{filter:brightness(.95)}
.modal-btn:disabled{opacity:.45;cursor:not-allowed}

.pay-info{padding:16px;background:var(--input-bg);border-radius:12px;margin-bottom:16px;text-align:center}
.pay-info .pay-amt{font-size:28px;font-weight:800;color:var(--accent);margin-bottom:4px}
.pay-info .pay-label{font-size:12px;color:var(--text-faint)}
.pay-info .pay-method{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 22px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:999;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){.hist-table{display:block;overflow-x:auto;white-space:nowrap}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.au-figures{width:100%;justify-content:space-between}.au-actions{width:100%}.au-actions .mini-btn{flex:1;justify-content:center}}
</style>
</head>
<body>
<div id="pageRoot">
  <div class="grid-4" id="statCards"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview">Author Overview</button>
    <button class="tab-btn" data-tab="history">Payment History</button>
  </div>

  <div id="overviewTab">
    <div class="toolbar">
      <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search authors…"/></div>
      <select class="select-box" id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="on-hold">On Hold</option>
      </select>
      <select class="select-box" id="sortSelect">
        <option value="pending-desc">Highest pending payout</option>
        <option value="earned-desc">Highest total earned</option>
        <option value="az">Name A–Z</option>
      </select>
    </div>
    <div id="authorList"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
    <div class="list-footer" id="authorFooter"></div>
  </div>

  <div id="historyTab" style="display:none">
    <div class="stat-card" style="margin-bottom:16px;box-shadow:none">
      <div style="width:100%;overflow-x:auto">
        <table class="hist-table" id="historyTable"></table>
      </div>
    </div>
    <div class="list-footer" id="historyFooter"></div>
  </div>
</div>

<!-- Schedule Modal (outside pageRoot for proper centering) -->
<div class="modal-overlay" id="scheduleOverlay">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <h3><i class="fas fa-calendar-plus"></i> Schedule Payout</h3>
      <button class="modal-close" id="scheduleClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-author" id="scheduleAuthorInfo"></div>
      <div class="modal-label">Payout Amount (USD)</div>
      <input class="modal-input" id="scheduleAmount" type="number" min="0" step="0.01" placeholder="0.00"/>
      <div class="modal-label">Payout Date</div>
      <input class="modal-input" id="scheduleDate" type="date"/>
      <div class="modal-hint">Author will be notified when the payout is processed.</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="scheduleCancelBtn">Cancel</button>
        <button class="modal-btn submit" id="scheduleSubmitBtn">Schedule Payout</button>
      </div>
    </div>
  </div>
</div>

<!-- Pay Confirm Modal (outside pageRoot for proper centering) -->
<div class="modal-overlay" id="payOverlay">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <h3><i class="fas fa-paper-plane"></i> Confirm Payment</h3>
      <button class="modal-close" id="payClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-author" id="payAuthorInfo"></div>
      <div class="pay-info">
        <div class="pay-amt" id="payAmountDisplay"></div>
        <div class="pay-label">Amount to be paid</div>
        <div class="pay-method" id="payMethodDisplay"></div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="payCancelBtn">Cancel</button>
        <button class="modal-btn submit" id="payConfirmBtn">Confirm & Pay</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shared/finance-sidebar.js"></script>
<script src="shared/finance-data.js"></script>
<script>
FinanceSidebar.attach('#pageRoot',{
  activeItem:'author-payments', title:'Author Payments', subtitle:'',
  user:{name:'Ngozi Falade',role:'Finance Lead',avatar:'https://i.pravatar.cc/100?img=47'}, notifCount:4,
  searchPlaceholder:'Search anything…',
});
</script>
<script src="services/author-payments-service.js"></script>
</body>
</html>
