<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Payment Disputes — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.page-head{margin-bottom:18px}
.page-head h1{font-size:19px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-muted);margin-top:2px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:11px;padding:10px 14px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:13px}
.select-box{border:1px solid var(--input-border);background:var(--input-bg);border-radius:11px;padding:10px 14px;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer}

.filter-pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.f-pill{font-size:12px;font-weight:700;padding:8px 15px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:6px}
.f-pill:hover{border-color:var(--accent);color:var(--accent)}
.f-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.f-pill .cnt{font-size:10px;font-weight:800;background:rgba(0,0,0,.12);padding:1px 7px;border-radius:20px}
.f-pill.active .cnt{background:rgba(255,255,255,.25)}

.pd-list{display:flex;flex-direction:column;gap:10px}
.pd-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;cursor:pointer;transition:.14s}
.pd-card:hover{border-color:var(--accent)}
.pd-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.pd-body{flex:1;min-width:220px}
.pd-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.pd-name{font-size:13.5px;font-weight:700}
.pd-amt{font-size:13px;font-weight:800;color:var(--text)}
.status-pill{font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.status-pill.open{background:var(--amber-bg);color:var(--amber)}
.status-pill.investigating{background:var(--blue-bg);color:var(--blue)}
.status-pill.resolved{background:var(--green-bg);color:var(--green)}
.status-pill.rejected{background:var(--red-bg);color:var(--red)}
.pd-reason{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pd-meta{font-size:11px;color:var(--text-faint);display:flex;gap:14px;flex-wrap:wrap}
.pd-meta span{display:flex;align-items:center;gap:4px}
.pd-actions{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap}
.mini-btn{font-size:11px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn.green-variant{background:var(--green-bg);border-color:transparent;color:var(--green)}
.mini-btn.green-variant:hover{background:var(--green);color:#fff}
.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.mini-btn.danger:hover{background:var(--red);color:#fff}
.mini-btn.blue-variant{background:var(--blue-bg);border-color:transparent;color:var(--blue)}
.mini-btn.blue-variant:hover{background:var(--blue);color:#fff}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint)}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px}
.page-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.page-btn:hover{border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px}

/* ── Detail modal (centered, matching coin-transactions.html) ── */
.dt-overlay{position:fixed;inset:0;background:rgba(10,6,25,.6);z-index:2000;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.dt-overlay.open{opacity:1;pointer-events:auto}
.dt-modal{background:var(--card);width:100%;max-width:480px;border-radius:18px;max-height:calc(90vh - 40px);overflow-y:auto;transform:translateY(14px) scale(.98);opacity:0;transition:.2s;margin:auto}
.dt-overlay.open .dt-modal{transform:translateY(0) scale(1);opacity:1}
.dt-head{padding:20px 22px 0;position:sticky;top:0;background:var(--card);z-index:2}
.dt-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dt-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.dt-author{display:flex;align-items:center;gap:12px}
.dt-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover}
.dt-author-name{font-size:15px;font-weight:800}
.dt-author-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.dt-body{padding:18px 22px}
.dt-amt-card{background:var(--table-head);border-radius:12px;padding:16px;text-align:center;margin-bottom:16px}
.dt-amt-num{font-size:26px;font-weight:800}
.dt-amt-lbl{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;margin-top:2px}
.dt-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.dt-meta-item{background:var(--table-head);border-radius:10px;padding:11px 12px}
.dt-meta-item.full{grid-column:1/-1}
.dt-meta-lbl{font-size:9.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em}
.dt-meta-val{font-size:13px;font-weight:700;margin-top:3px}
.dt-reason-box{background:var(--table-head);border-radius:10px;padding:13px 14px;font-size:12.5px;line-height:1.6;color:var(--text);margin-bottom:16px}
.dt-note-box{border-radius:10px;padding:13px 14px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
.dt-note-box.resolved{background:var(--green-bg);color:var(--green)}
.dt-note-box.rejected{background:var(--red-bg);color:var(--red)}
.dt-note-box i{margin-right:6px}
.dt-action-box{margin-top:4px}
.dt-action-box label{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px}
.dt-action-box textarea{width:100%;border:1px solid var(--input-border);background:var(--input-bg);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:inherit;color:var(--text);min-height:70px;resize:vertical}
.dt-foot{padding:14px 22px 20px;display:flex;gap:8px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.dt-foot .mini-btn{flex:1;justify-content:center;padding:11px;min-width:110px}

@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.pd-actions{width:100%}.pd-actions .mini-btn{flex:1;justify-content:center}.dt-meta-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="pageRoot">
  <div class="page-head">
    <h1>Payment Disputes</h1>
    <p>Investigate and resolve author payment disputes.</p>
  </div>

  <div class="grid-4" id="statCards"></div>

  <div class="toolbar">
    <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by author or reason…"/></div>
    <select class="select-box" id="sortSelect">
      <option value="recent">Most recent</option>
      <option value="amount-desc">Highest amount</option>
      <option value="amount-asc">Lowest amount</option>
    </select>
  </div>

  <div class="filter-pills" id="filterPills"></div>

  <div id="pdList"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading disputes…</div></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Detail modal -->
<div class="dt-overlay" id="dtOverlay">
  <div class="dt-modal" id="dtModal"></div>
</div>

<script src="shared/finance-sidebar.js"></script>
<script src="shared/finance-data.js"></script>
<script>
'use strict';
const shell = FinanceSidebar.attach('#pageRoot',{
  activeItem:'payment-disputes', title:'Payment Disputes', subtitle:'Investigate & resolve author payment disputes',
  user:{name:'Ngozi Falade',role:'Finance Lead',avatar:'https://i.pravatar.cc/100?img=47'}, notifCount:4,
  searchPlaceholder:'Search anything…',
  onSearch:(v)=>{ document.getElementById('searchInput').value = v; page=1; render(); }
});

const ICO_MAP = { red:'var(--red)', amber:'var(--amber)', blue:'var(--blue)', purple:'var(--purple)', green:'var(--green)', accent:'var(--accent)' };
const BG_MAP  = { red:'var(--red-bg)', amber:'var(--amber-bg)', blue:'var(--blue-bg)', purple:'var(--purple-bg)', green:'var(--green-bg)', accent:'rgba(255,0,80,.1)' };
const PER_PAGE = 6;

let ALL = [];
let activeStatus = 'all';
let searchTerm = '';
let sortMode = 'recent';
let page = 1;

function money(n){ return '$' + Number(n||0).toLocaleString('en-US'); }
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diff/3600000);
  if(h < 1) return 'Just now';
  if(h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function statusLabel(s){
  return { open:'Open', investigating:'Investigating', resolved:'Resolved', rejected:'Rejected' }[s] || s;
}

async function init(){
  ALL = await FinanceData.getPaymentDisputes();
  renderStatCards();
  renderFilterPills();
  render();
}

function renderStatCards(){
  const open = ALL.filter(d=>d.status==='open').length;
  const investigating = ALL.filter(d=>d.status==='investigating').length;
  const resolved = ALL.filter(d=>d.status==='resolved').length;
  const disputedAmount = ALL.filter(d=>d.status==='open' || d.status==='investigating').reduce((s,d)=>s+d.amount,0);
  const stats = [
    { n:open, l:'Open Cases', ico:'fa-triangle-exclamation', cls:'amber' },
    { n:investigating, l:'Under Investigation', ico:'fa-magnifying-glass', cls:'blue' },
    { n:resolved, l:'Resolved', ico:'fa-circle-check', cls:'green' },
    { n:money(disputedAmount), l:'Amount In Dispute', ico:'fa-scale-balanced', cls:'red' },
  ];
  document.getElementById('statCards').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="stat-ico" style="background:${BG_MAP[s.cls]};color:${ICO_MAP[s.cls]}"><i class="fas ${s.ico}"></i></div>
      <div><div class="stat-num">${s.n}</div><div class="stat-lbl">${s.l}</div></div>
    </div>`).join('');
}

function renderFilterPills(){
  const counts = { all:ALL.length, open:0, investigating:0, resolved:0, rejected:0 };
  ALL.forEach(d=>{ if(counts[d.status]!=null) counts[d.status]++; });
  const pills = [
    { key:'all', label:'All' },
    { key:'open', label:'Open' },
    { key:'investigating', label:'Investigating' },
    { key:'resolved', label:'Resolved' },
    { key:'rejected', label:'Rejected' },
  ];
  document.getElementById('filterPills').innerHTML = pills.map(p=>`
    <button class="f-pill${activeStatus===p.key?' active':''}" data-status="${p.key}">${p.label} <span class="cnt">${counts[p.key]}</span></button>`).join('');
  document.querySelectorAll('.f-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeStatus = btn.dataset.status; page=1; renderFilterPills(); render(); });
  });
}

function getFiltered(){
  let list = ALL.slice();
  if(activeStatus!=='all') list = list.filter(d=>d.status===activeStatus);
  if(searchTerm){
    const q = searchTerm.toLowerCase();
    list = list.filter(d=>d.author.toLowerCase().includes(q) || d.reason.toLowerCase().includes(q));
  }
  if(sortMode==='amount-desc') list.sort((a,b)=>b.amount-a.amount);
  else if(sortMode==='amount-asc') list.sort((a,b)=>a.amount-b.amount);
  else list.sort((a,b)=> new Date(b.filed) - new Date(a.filed));
  return list;
}

function render(){
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length/PER_PAGE));
  if(page>totalPages) page = totalPages;
  const pageItems = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

  const box = document.getElementById('pdList');
  if(!pageItems.length){
    box.innerHTML = `<div class="empty-state"><i class="fas fa-scale-balanced"></i><p>No disputes match your filters.</p></div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  box.innerHTML = `<div class="pd-list">${pageItems.map(d=>`
    <div class="pd-card" data-id="${d.id}">
      <img class="pd-avatar" src="${d.avatar}" alt="${d.author}"/>
      <div class="pd-body">
        <div class="pd-top">
          <span class="pd-name">${d.author}</span>
          <span class="pd-amt">${money(d.amount)}</span>
          <span class="status-pill ${d.status}">${statusLabel(d.status)}</span>
        </div>
        <div class="pd-reason">${d.reason}</div>
        <div class="pd-meta">
          <span><i class="fas fa-clock"></i> Filed ${timeAgo(d.filed)}</span>
          <span><i class="fas fa-hashtag"></i> ${d.id}</span>
        </div>
      </div>
      ${d.status==='open' || d.status==='investigating' ? `
      <div class="pd-actions">
        ${d.status==='open' ? `<button class="mini-btn blue-variant" data-action="investigate" data-id="${d.id}"><i class="fas fa-magnifying-glass"></i> Investigate</button>` : ''}
        <button class="mini-btn danger" data-action="reject-quick" data-id="${d.id}"><i class="fas fa-xmark"></i> Reject</button>
        <button class="mini-btn green-variant" data-action="resolve-quick" data-id="${d.id}"><i class="fas fa-check"></i> Resolve</button>
      </div>` : ''}
    </div>`).join('')}</div>`;

  document.querySelectorAll('.pd-card').forEach(card=>{
    card.addEventListener('click', (e)=>{ if(e.target.closest('[data-action]')) return; openDetail(card.dataset.id); });
  });

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const box = document.getElementById('pagination');
  if(totalPages <= 1){ box.innerHTML=''; return; }
  let html = `<button class="page-btn" ${page===1?'disabled':''} data-p="${page-1}"><i class="fas fa-chevron-left"></i></button>`;
  for(let i=1;i<=totalPages;i++) html += `<button class="page-btn${i===page?' active':''}" data-p="${i}">${i}</button>`;
  html += `<button class="page-btn" ${page===totalPages?'disabled':''} data-p="${page+1}"><i class="fas fa-chevron-right"></i></button>`;
  box.innerHTML = html;
  box.querySelectorAll('.page-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ page = parseInt(btn.dataset.p,10); render(); window.scrollTo({top:0,behavior:'smooth'}); });
  });
}

document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm=e.target.value; page=1; render(); });
document.getElementById('sortSelect').addEventListener('change', e=>{ sortMode=e.target.value; render(); });

/* ── Detail modal ── */
const dtOverlay = document.getElementById('dtOverlay');
const dtModal = document.getElementById('dtModal');
let dtNoteMode = null; // 'resolve' | 'reject' | null — which action's note box is currently showing

function openDetail(id){
  const d = ALL.find(x=>x.id===id);
  if(!d) return;
  dtNoteMode = null;
  renderDetailModal(d);
  dtOverlay.classList.add('open');
}
function closeDetail(){ dtOverlay.classList.remove('open'); dtNoteMode = null; }

function renderDetailModal(d){
  const canAct = d.status==='open' || d.status==='investigating';

  let noteSectionHtml = '';
  if(d.status==='resolved' && d.resolutionNote){
    noteSectionHtml = `<div class="dt-note-box resolved"><i class="fas fa-circle-check"></i>${d.resolutionNote}</div>`;
  } else if(d.status==='rejected' && d.resolutionNote){
    noteSectionHtml = `<div class="dt-note-box rejected"><i class="fas fa-circle-xmark"></i>${d.resolutionNote}</div>`;
  }

  let actionNoteHtml = '';
  if(canAct && dtNoteMode){
    actionNoteHtml = `
      <div class="dt-action-box">
        <label>${dtNoteMode==='resolve' ? 'Resolution note (shown to the author)' : 'Reason for rejection (shown to the author)'}</label>
        <textarea id="dtNoteInput" placeholder="${dtNoteMode==='resolve' ? 'Explain how this was resolved…' : 'Explain why this dispute is being rejected…'}"></textarea>
      </div>`;
  }

  dtModal.innerHTML = `
    <div class="dt-head">
      <div class="dt-head-top">
        <div class="dt-author">
          <img class="dt-avatar" src="${d.avatar}" alt="${d.author}"/>
          <div><div class="dt-author-name">${d.author}</div><div class="dt-author-sub">${d.id} · <span class="status-pill ${d.status}" style="margin-left:2px">${statusLabel(d.status)}</span></div></div>
        </div>
        <button class="dt-close" id="dtClose"><i class="fas fa-xmark"></i></button>
      </div>
    </div>
    <div class="dt-body">
      <div class="dt-amt-card"><div class="dt-amt-num">${money(d.amount)}</div><div class="dt-amt-lbl">Disputed Amount</div></div>
      <div class="dt-meta-grid">
        <div class="dt-meta-item"><div class="dt-meta-lbl">Filed</div><div class="dt-meta-val" style="font-size:12px">${fmtDateTime(d.filed)}</div></div>
        <div class="dt-meta-item"><div class="dt-meta-lbl">Status</div><div class="dt-meta-val" style="font-size:12px">${statusLabel(d.status)}</div></div>
        <div class="dt-meta-item full"><div class="dt-meta-lbl">Reason for Dispute</div></div>
      </div>
      <div class="dt-reason-box">${d.reason}</div>
      ${noteSectionHtml}
      ${actionNoteHtml}
    </div>
    ${canAct ? `
    <div class="dt-foot">
      ${d.status==='open' ? `<button class="mini-btn blue-variant" id="dtInvestigateBtn"><i class="fas fa-magnifying-glass"></i> Investigate</button>` : ''}
      <button class="mini-btn danger" id="dtRejectBtn"><i class="fas fa-xmark"></i> ${dtNoteMode==='reject' ? 'Confirm Reject' : 'Reject'}</button>
      <button class="mini-btn green-variant" id="dtResolveBtn"><i class="fas fa-check"></i> ${dtNoteMode==='resolve' ? 'Confirm Resolve' : 'Resolve'}</button>
    </div>` : ''}
  `;

  document.getElementById('dtClose').addEventListener('click', closeDetail);

  if(canAct){
    const investigateBtn = document.getElementById('dtInvestigateBtn');
    if(investigateBtn) investigateBtn.addEventListener('click', ()=>doInvestigate(d.id));

    document.getElementById('dtResolveBtn').addEventListener('click', ()=>{
      if(dtNoteMode!=='resolve'){ dtNoteMode='resolve'; renderDetailModal(d); document.getElementById('dtNoteInput')?.focus(); }
      else{
        const note = document.getElementById('dtNoteInput').value.trim();
        doResolve(d.id, note);
      }
    });
    document.getElementById('dtRejectBtn').addEventListener('click', ()=>{
      if(dtNoteMode!=='reject'){ dtNoteMode='reject'; renderDetailModal(d); document.getElementById('dtNoteInput')?.focus(); }
      else{
        const note = document.getElementById('dtNoteInput').value.trim();
        doReject(d.id, note);
      }
    });
  }
}

dtOverlay.addEventListener('click', e=>{ if(e.target===dtOverlay) closeDetail(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

/* ── Actions ── */
function doInvestigate(id){
  const d = ALL.find(x=>x.id===id); if(!d) return;
  d.status = 'investigating';
  toast(`🔎 Marked "${d.id}" as under investigation`);
  closeDetail(); renderStatCards(); renderFilterPills(); render();
}
async function doResolve(id, note){
  const d = ALL.find(x=>x.id===id); if(!d) return;
  await FinanceData.resolveDispute(id, note);
  d.status = 'resolved'; d.resolutionNote = note || 'Resolved by Finance.';
  toast(`✅ Resolved dispute for ${d.author}`);
  closeDetail(); renderStatCards(); renderFilterPills(); render();
}
async function doReject(id, note){
  const d = ALL.find(x=>x.id===id); if(!d) return;
  await FinanceData.rejectDispute(id, note);
  d.status = 'rejected'; d.resolutionNote = note || 'Rejected by Finance.';
  toast(`↩️ Rejected dispute for ${d.author}`);
  closeDetail(); renderStatCards(); renderFilterPills(); render();
}

/* ── Quick-action buttons on cards (bypass opening detail) ── */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el || !el.closest('.pd-card')) return;
  e.stopPropagation();
  const id = el.dataset.id;
  const action = el.dataset.action;

  if(action==='investigate') doInvestigate(id);
  else if(action==='resolve-quick'){
    const note = prompt('Resolution note (shown to the author):', '');
    if(note===null) return;
    doResolve(id, note.trim());
  }
  else if(action==='reject-quick'){
    const note = prompt('Reason for rejecting this dispute (shown to the author):', '');
    if(note===null) return;
    doReject(id, note.trim());
  }
});

init();
</script>
</body>
</html>
