<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Withdrawals — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:11px;padding:10px 14px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:13px}
.select-box{border:1px solid var(--input-border);background:var(--input-bg);border-radius:11px;padding:10px 14px;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer}

.filter-pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.f-pill{font-size:12px;font-weight:700;padding:8px 15px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:6px}
.f-pill:hover{border-color:var(--accent);color:var(--accent)}
.f-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.f-pill .cnt{font-size:10px;font-weight:800;background:rgba(0,0,0,.12);padding:1px 7px;border-radius:20px}
.f-pill.active .cnt{background:rgba(255,255,255,.25)}

.wd-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.wd-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;transition:.14s}
.wd-card:hover{border-color:var(--accent)}
.wd-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0}
.wd-body{flex:1;min-width:180px}
.wd-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.wd-name{font-size:13.5px;font-weight:700}
.wd-amt{font-size:14px;font-weight:800}
.wd-meta{font-size:11px;color:var(--text-faint);display:flex;gap:12px;flex-wrap:wrap}
.wd-meta span{display:flex;align-items:center;gap:4px}
.method-chip{font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--blue-bg);color:var(--blue);white-space:nowrap}
.status-pill{font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.status-pill.pending{background:var(--amber-bg);color:var(--amber)}
.status-pill.approved{background:var(--green-bg);color:var(--green)}
.status-pill.declined{background:var(--red-bg);color:var(--red)}
.wd-actions{display:flex;gap:7px;flex-shrink:0}
.mini-btn{font-size:11px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.mini-btn.danger:hover{background:var(--red);color:#fff}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint)}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 22px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:999;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px}
.page-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.page-btn:hover{border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

.dt-overlay{position:fixed;inset:0;background:rgba(10,6,25,.6);z-index:2000;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.dt-overlay.open{opacity:1;pointer-events:auto}
.dt-modal{background:var(--card);width:90%;max-width:440px;border-radius:18px;max-height:90vh;overflow-y:auto;transform:scale(.95);opacity:0;transition:.25s;padding-bottom:6px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dt-overlay.open .dt-modal{transform:scale(1);opacity:1}
.dt-head{padding:20px 22px 0;position:sticky;top:0;background:var(--card);z-index:2}
.dt-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dt-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.dt-author{display:flex;align-items:center;gap:12px}
.dt-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover}
.dt-author-name{font-size:15px;font-weight:800}
.dt-author-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px}
.dt-body{padding:18px 22px}
.dt-amt-card{background:var(--table-head);border-radius:12px;padding:16px;text-align:center;margin-bottom:16px}
.dt-amt-num{font-size:26px;font-weight:800}
.dt-amt-lbl{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;margin-top:2px}
.dt-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.dt-meta-item{background:var(--table-head);border-radius:10px;padding:11px 12px}
.dt-meta-lbl{font-size:9.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em}
.dt-meta-val{font-size:13px;font-weight:700;margin-top:3px}
.dt-note{background:var(--red-bg);color:var(--red);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.5;margin-bottom:16px}
.dt-foot{padding:14px 22px 20px;display:flex;gap:8px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.dt-foot .mini-btn{flex:1;justify-content:center;padding:11px}

/* ── Action modals ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{width:90%;max-width:440px;background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalPop .2s ease}
@keyframes modalPop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.modal-hdr h3{font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px}
.modal-hdr h3 i{color:var(--accent);font-size:14px}
.modal-close{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.05);border:none;color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{padding:0 18px 18px}
.modal-author{display:flex;align-items:center;gap:10px;padding:12px;background:var(--input-bg);border-radius:12px;margin-bottom:16px}
.modal-author img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.modal-author-name{font-size:13px;font-weight:700;color:var(--text)}
.modal-author-meta{font-size:11px;color:var(--text-faint)}
.modal-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.modal-input{width:100%;padding:11px 13px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;margin-bottom:14px}
.modal-input:focus{border-color:var(--accent)}
.modal-hint{font-size:10.5px;color:var(--text-faint);margin-top:-10px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:.15s}
.modal-btn.cancel{background:var(--input-bg);border:1px solid var(--input-border);color:var(--text)}
.modal-btn.submit{background:var(--accent);color:#fff}
.modal-btn.submit:active{filter:brightness(.95)}
.modal-btn:disabled{opacity:.45;cursor:not-allowed}
.modal-btn.danger{background:var(--red);color:#fff}

.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px}

@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.wd-actions{width:100%}.wd-actions .mini-btn{flex:1;justify-content:center}.dt-meta-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="pageRoot">
  <div class="grid-4" id="statCards"></div>

  <div class="toolbar">
    <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by author name…"/></div>
    <select class="select-box" id="methodFilter">
      <option value="">All methods</option>
      <option value="Bank Transfer">Bank Transfer</option>
      <option value="PayPal">PayPal</option>
      <option value="Wire Transfer">Wire Transfer</option>
    </select>
    <select class="select-box" id="sortSelect">
      <option value="recent">Most recent</option>
      <option value="amount-desc">Highest amount</option>
      <option value="amount-asc">Lowest amount</option>
    </select>
  </div>

  <div class="filter-pills" id="filterPills"></div>

  <div id="wdList"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading withdrawals…</div></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Detail modal -->
<div class="dt-overlay" id="dtOverlay">
  <div class="dt-modal" id="dtModal"></div>
</div>

<!-- Approve modal -->
<div class="modal-overlay" id="approveOverlay">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <h3><i class="fas fa-circle-check" style="color:var(--green)"></i> Approve Payout</h3>
      <button class="modal-close" id="approveClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-author" id="approveAuthorInfo"></div>
      <div style="text-align:center;padding:16px 0">
        <div style="font-size:28px;font-weight:800;color:var(--green)" id="approveAmount"></div>
        <div style="font-size:11px;color:var(--text-faint);margin-top:4px;text-transform:uppercase;font-weight:700">Payout Amount</div>
      </div>
      <div class="modal-hint" style="text-align:center">This will approve the withdrawal and mark it as processed.</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="approveCancelBtn">Cancel</button>
        <button class="modal-btn submit" id="approveConfirmBtn" style="background:var(--green)">Confirm Approval</button>
      </div>
    </div>
  </div>
</div>

<!-- Decline modal -->
<div class="modal-overlay" id="declineOverlay">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <h3><i class="fas fa-circle-xmark" style="color:var(--red)"></i> Decline Payout</h3>
      <button class="modal-close" id="declineClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-author" id="declineAuthorInfo"></div>
      <div class="modal-label">Reason for decline</div>
      <textarea class="modal-input" id="declineReason" style="min-height:80px;resize:vertical" placeholder="Let the author know why this was declined…"></textarea>
      <div class="modal-hint">This reason will be shown to the author.</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="declineCancelBtn">Cancel</button>
        <button class="modal-btn danger" id="declineConfirmBtn">Decline Payout</button>
      </div>
    </div>
  </div>
</div>

<script src="shared/finance-sidebar.js"></script>
<script src="shared/finance-data.js"></script>
<script>
FinanceSidebar.attach('#pageRoot',{
  activeItem:'withdrawals', title:'Withdrawals', subtitle:'',
  user:{name:'Ngozi Falade',role:'Finance Lead',avatar:'https://i.pravatar.cc/100?img=47'}, notifCount:4,
  searchPlaceholder:'Search anything…',
});
function toast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove('show');},2500);
}
</script>
<script src="services/withdrawals-service.js"></script>
<div class="toast" id="toast"></div>
</body>
</html>
