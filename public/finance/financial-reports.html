<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Financial Reports — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:19px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.export-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0}
.export-btn:hover{filter:brightness(1.05)}

.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.filter-bar label{font-size:12px;font-weight:700;color:var(--text-muted)}

.date-range-picker{position:relative;display:inline-flex;align-items:center}
.date-range-display{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border);border-radius:10px;font-size:12.5px;font-weight:600;color:var(--text);background:var(--card);cursor:pointer;transition:border .2s;white-space:nowrap;user-select:none}
.date-range-display:hover,.date-range-display.open{border-color:var(--accent)}
.date-range-display i{color:var(--accent);font-size:13px}
.date-range-display .dr-placeholder{color:var(--text-faint);font-weight:500}

.date-range-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:16px;z-index:100;display:none;min-width:280px}
.date-range-dropdown.show{display:block}
.dr-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dr-row:last-child{margin-bottom:0}
.dr-row label{font-size:11.5px;font-weight:700;color:var(--text-muted);width:34px;flex-shrink:0}
.dr-row input[type="date"]{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--text);outline:none;transition:border .2s}
.dr-row input[type="date"]:focus{border-color:var(--accent)}
.dr-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.dr-apply{flex:1;padding:9px 0;border:none;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:filter .2s}
.dr-apply:hover{filter:brightness(1.05)}
.dr-reset{padding:9px 14px;border:none;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--table-head);color:var(--text-muted);transition:background .2s}
.dr-reset:hover{background:var(--border)}

.filter-btn{padding:8px 16px;border:none;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:filter .2s}
.filter-btn.primary{background:var(--accent);color:#fff}
.filter-btn.primary:hover{filter:brightness(1.05)}
.filter-btn.secondary{background:var(--table-head);color:var(--text-muted)}
.filter-btn.secondary:hover{background:var(--border)}
.filter-sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
.date-range-label{font-size:11.5px;font-weight:600;color:var(--text-muted);margin-left:auto}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.report-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.panel-head h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}

.chart-bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.chart-val{font-size:10px;font-weight:700;color:var(--text-faint);margin-bottom:6px;white-space:nowrap}
.chart-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart-bar{width:70%;max-width:48px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--accent),#7a0030);transition:height .6s ease;min-height:4px;position:relative}
.chart-bar:hover{filter:brightness(1.15)}
.chart-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:8px}

.exp-row{margin-bottom:14px}
.exp-row:last-child{margin-bottom:0}
.exp-info{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.exp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.exp-label{font-size:12px;font-weight:600;color:var(--text);flex:1}
.exp-amount{font-size:12px;font-weight:800;color:var(--text)}
.exp-bar-wrap{height:8px;background:var(--table-head);border-radius:6px;overflow:hidden}
.exp-bar{height:100%;border-radius:6px;transition:width .6s ease}
.exp-pct{font-size:10px;font-weight:700;color:var(--text-faint);text-align:right;margin-top:4px}
.exp-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:14px;border-top:1px solid var(--border)}
.exp-total-lbl{font-size:12px;font-weight:700;color:var(--text-muted)}
.exp-total-val{font-size:15px;font-weight:800}

.cat-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-rank{width:28px;text-align:center;font-size:14px;flex-shrink:0}
.cat-body{flex:1;min-width:0}
.cat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cat-name{font-size:12.5px;font-weight:700;color:var(--text)}
.cat-rev{font-size:12.5px;font-weight:800;color:var(--text)}
.cat-bar-wrap{height:8px;background:var(--table-head);border-radius:6px;overflow:hidden}
.cat-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .6s ease}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-faint)}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}
.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 22px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:999;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}.report-grid{grid-template-columns:1fr}.filter-bar{flex-direction:column;align-items:stretch}.date-range-label{margin-left:0;text-align:center}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.page-head{align-items:stretch}.export-btn{width:100%;justify-content:center}.chart-bars{height:160px}}
</style>
</head>
<body>
<div id="pageRoot">
  <div class="page-head">
    <div><h1>Financial Reports</h1><p>Revenue, expenses, and category performance at a glance.</p></div>
    <button class="export-btn" id="exportBtn"><i class="fas fa-download"></i> Export CSV</button>
  </div>

  <div class="filter-bar">
    <div class="date-range-picker" id="dateRangePicker">
      <div class="date-range-display" id="dateRangeDisplay">
        <i class="fas fa-calendar-days"></i>
        <span id="dateRangeText"><span class="dr-placeholder">Select date range</span></span>
        <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text-faint)"></i>
      </div>
      <div class="date-range-dropdown" id="dateRangeDropdown">
        <div class="dr-row">
          <label>From</label>
          <input type="date" id="dateFrom"/>
        </div>
        <div class="dr-row">
          <label>To</label>
          <input type="date" id="dateTo"/>
        </div>
        <div class="dr-actions">
          <button class="dr-apply" id="applyFilter">Apply</button>
          <button class="dr-reset" id="resetFilter">Reset</button>
        </div>
      </div>
    </div>
    <span class="date-range-label" id="dateRangeLabel">Showing all data</span>
  </div>

  <div class="grid-4" id="statCards"></div>

  <div class="report-grid">
    <div>
      <div class="panel">
        <div class="panel-head">
          <h2><i class="fas fa-ranking-star" style="color:var(--amber)"></i> Top Categories</h2>
        </div>
        <div id="topCategories"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="panel-head">
          <h2><i class="fas fa-chart-pie" style="color:var(--purple)"></i> Expense Breakdown</h2>
        </div>
        <div id="expenseBreakdown"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
        <div class="exp-total-row">
          <span class="exp-total-lbl">Total Expenses</span>
          <span class="exp-total-val" id="expenseTotal">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="data/finance-demo-data.js"></script>
<script src="shared/finance-sidebar.js"></script>
<script src="shared/finance-data.js"></script>
<script>
FinanceSidebar.attach('#pageRoot',{
  activeItem:'financial-reports', title:'Financial Reports', subtitle:'Revenue, expenses & performance',
  user:{name:'Ngozi Falade',role:'Finance Lead',avatar:'https://i.pravatar.cc/100?img=47'}, notifCount:4,
  searchPlaceholder:'Search anything…',
});
function toast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove('show');},2500);
}
</script>
<script src="services/financial-reports-service.js"></script>
<div class="toast" id="toast"></div>
</body>
</html>
