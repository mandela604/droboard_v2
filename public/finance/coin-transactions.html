<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coin Transactions — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:19px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.new-btn{background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;flex-shrink:0}
.new-btn:hover{filter:brightness(1.05)}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--table-head);padding:5px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.tab-btn{font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;border:none;background:none;color:var(--text-muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.tab-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.tab-count{font-size:9.5px;font-weight:800;background:var(--table-head);color:var(--text-faint);padding:1px 7px;border-radius:20px}
.tab-btn.active .tab-count{background:var(--accent-soft,rgba(255,0,80,.12));color:var(--accent)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:11px;padding:10px 14px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;font-family:inherit}
.search-box i{color:var(--text-faint);font-size:13px}
.select-box{border:1px solid var(--input-border);background:var(--input-bg);border-radius:11px;padding:10px 14px;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer}

.filter-pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.f-pill{font-size:12px;font-weight:700;padding:8px 15px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:6px}
.f-pill:hover{border-color:var(--accent);color:var(--accent)}
.f-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.f-pill .cnt{font-size:10px;font-weight:800;background:rgba(0,0,0,.12);padding:1px 7px;border-radius:20px}
.f-pill.active .cnt{background:rgba(255,255,255,.25)}

.tx-list{display:flex;flex-direction:column;gap:9px}
.tx-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;flex-wrap:wrap;cursor:pointer;transition:.14s}
.tx-card:hover{border-color:var(--accent)}
.tx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tx-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-left:-4px;border:2px solid var(--card)}
.tx-body{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.tx-user{font-size:13px;font-weight:700}
.tx-meta{font-size:10.5px;color:var(--text-faint);margin-top:2px}
.type-chip{font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;text-transform:capitalize}
.type-chip.purchase{background:var(--green-bg);color:var(--green)}
.type-chip.gift{background:var(--purple-bg);color:var(--purple)}
.type-chip.subscription{background:var(--amber-bg);color:var(--amber)}
.status-pill{font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.status-pill.completed{background:var(--green-bg);color:var(--green)}
.status-pill.refunded{background:var(--red-bg);color:var(--red)}
.status-pill.active{background:var(--green-bg);color:var(--green)}
.status-pill.inactive{background:var(--table-head);color:var(--text-faint)}
.tx-figures{text-align:right;flex-shrink:0}
.tx-coins{font-size:14px;font-weight:800}
.tx-coins.pos{color:var(--green)}
.tx-coins.neg{color:var(--text)}
.tx-usd{font-size:10.5px;color:var(--text-faint);margin-top:1px}

/* ── Pricing (packages, gifts, subscriptions) ── */
.pricing-section{margin-bottom:22px}
.pricing-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pricing-section-head h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.mini-btn{font-size:11px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.mini-btn.primary:hover{color:#fff;filter:brightness(1.05)}
.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.mini-btn.danger:hover{background:var(--red);color:#fff}

.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pkg-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;box-shadow:var(--shadow);transition:.14s}
.pkg-card:hover{border-color:var(--accent)}
.pkg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.pkg-name{font-size:13.5px;font-weight:800}
.pkg-coins{font-size:20px;font-weight:800;color:var(--amber);display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pkg-price{font-size:12.5px;color:var(--text-muted);font-weight:600}
.pkg-bonus{font-size:10px;font-weight:700;color:var(--green);margin-top:4px}
.pkg-gift-cost{font-size:20px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:6px}
.pkg-meta{font-size:10px;color:var(--text-faint);margin-top:8px}
.pkg-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pkg-actions .mini-btn{flex:1;justify-content:center;padding:7px 10px;font-size:10.5px}
.gift-icon-badge{width:40px;height:40px;border-radius:11px;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}

/* ── History ── */
.hist-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card)}
.hist-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.hist-body{flex:1;min-width:0}
.hist-text{font-size:12.5px;color:var(--text)}
.hist-text b{font-weight:700}
.hist-detail{font-size:10.5px;color:var(--text-faint);margin-top:2px}
.hist-time{font-size:10.5px;color:var(--text-faint);white-space:nowrap;flex-shrink:0}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint)}
.empty-state i{font-size:32px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13px}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px}
.page-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.page-btn:hover{border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Transaction detail modal ── */
.ct-overlay{position:fixed;inset:0;background:rgba(10,6,25,.6);z-index:2000;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.ct-overlay.open{opacity:1;pointer-events:auto}
.ct-modal{background:var(--card);width:100%;max-width:420px;border-radius:18px;max-height:calc(90vh - 40px);overflow-y:auto;transform:translateY(14px) scale(.98);opacity:0;transition:.2s;margin:auto}
.ct-overlay.open .ct-modal{transform:translateY(0) scale(1);opacity:1}
.ct-head{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ct-head h3{font-size:15px;font-weight:800}
.ct-close{width:28px;height:28px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ct-body{padding:16px 22px 22px}
.ct-amt-card{background:var(--table-head);border-radius:12px;padding:18px;text-align:center;margin-bottom:16px}
.ct-amt-num{font-size:24px;font-weight:800}
.ct-amt-usd{font-size:12px;color:var(--text-faint);margin-top:2px}
.ct-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct-meta-item{background:var(--table-head);border-radius:10px;padding:11px 12px}
.ct-meta-lbl{font-size:9.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em}
.ct-meta-val{font-size:12.5px;font-weight:700;margin-top:3px}
.ct-note{margin-top:12px;font-size:12px;color:var(--text-muted);background:var(--table-head);border-radius:10px;padding:11px 13px;line-height:1.5}

/* ── Form / confirm modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,6,25,.55);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--card);border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 70px rgba(0,0,0,.3);transform:translateY(12px) scale(.98);opacity:0;transition:.2s;max-height:88vh;overflow-y:auto}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1);opacity:1}
.modal-box-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 4px;gap:12px}
.modal-box-head h3{font-size:15px;font-weight:800}
.modal-box-head p{font-size:11.5px;color:var(--text-faint);margin-top:4px}
.modal-close-x{width:28px;height:28px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex-shrink:0}
.modal-box-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px}
.field-group label{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px}
.field-group input,.field-group select{width:100%;border:1px solid var(--input-border);background:var(--input-bg);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--text)}
.field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-opt{flex:1;min-width:110px;border:1px solid var(--input-border);border-radius:9px;padding:9px 11px;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.radio-opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft,rgba(255,0,80,.06))}
.radio-opt.disabled{opacity:.5;pointer-events:none}
.radio-opt input{accent-color:var(--accent)}
.modal-error{font-size:11.5px;color:var(--red);background:var(--red-bg);border-radius:8px;padding:8px 10px;display:none}
.modal-error.show{display:block}
.modal-box-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.modal-box-actions button{padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--input-border)}
.modal-box-actions .cancel-btn{background:var(--input-bg);color:var(--text-muted)}
.modal-box-actions .confirm-btn{background:var(--accent);border-color:transparent;color:#fff}
.modal-box-actions .confirm-btn.danger-variant{background:var(--red)}
.modal-box-actions .confirm-btn:disabled{opacity:.6;cursor:not-allowed}

.skeleton{padding:40px;text-align:center;color:var(--text-faint);font-size:12.5px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 22px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:999;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media (max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid-4{grid-template-columns:1fr}.tx-figures{width:100%;text-align:left}.ct-meta-grid{grid-template-columns:1fr}.field-row-2{grid-template-columns:1fr}.page-head{align-items:stretch}.new-btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<div id="pageRoot">
  <div class="page-head">
    <div><h1>Coin Transactions</h1><p>Monitor coin purchases, usage, and balances across the platform.</p></div>
    <button class="new-btn" id="newItemBtn"><i class="fas fa-plus"></i> New Coin Price / Gift</button>
  </div>

  <div class="grid-4" id="statCards"></div>

  <div class="tabs" id="tabBar">
    <button class="tab-btn active" data-tab="transactions">Transactions</button>
    <button class="tab-btn" data-tab="pricing">Coin Pricing & Gifts <span class="tab-count" id="pricingCount">0</span></button>
    <button class="tab-btn" data-tab="history">Create / Gift History <span class="tab-count" id="historyCount">0</span></button>
  </div>

  <!-- Transactions tab -->
  <div id="tab-transactions">
    <div class="toolbar">
      <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by user…"/></div>
      <select class="select-box" id="statusFilter">
        <option value="">All statuses</option>
        <option value="completed">Completed</option>
        <option value="refunded">Refunded</option>
      </select>
      <select class="select-box" id="sortSelect">
        <option value="recent">Most recent</option>
        <option value="coins-desc">Highest coin amount</option>
        <option value="usd-desc">Highest USD value</option>
      </select>
    </div>
    <div class="filter-pills" id="filterPills"></div>
    <div id="txList"><div class="skeleton"><i class="fas fa-spinner fa-spin"></i> Loading transactions…</div></div>
    <div class="pagination" id="txPagination"></div>
  </div>

  <!-- Coin Pricing & Gifts tab -->
  <div id="tab-pricing" style="display:none">
    <div class="pricing-section">
      <div class="pricing-section-head">
        <h3><i class="fas fa-coins" style="color:var(--amber)"></i> Coin Packages</h3>
        <button class="mini-btn primary" id="addPackageBtn"><i class="fas fa-plus"></i> Add Package</button>
      </div>
      <div class="pkg-grid" id="pkgList"></div>
      <div class="pagination" id="pkgPagination"></div>
    </div>

    <div class="pricing-section">
      <div class="pricing-section-head">
        <h3><i class="fas fa-gift" style="color:var(--purple)"></i> Gift Items</h3>
        <button class="mini-btn primary" id="addGiftBtn"><i class="fas fa-plus"></i> Add Gift</button>
      </div>
      <div class="pkg-grid" id="giftList"></div>
      <div class="pagination" id="giftPagination"></div>
    </div>

    <div class="pricing-section">
      <div class="pricing-section-head">
        <h3><i class="fas fa-star" style="color:var(--amber)"></i> Subscriptions</h3>
        <button class="mini-btn primary" id="addSubBtn"><i class="fas fa-plus"></i> Add Subscription</button>
      </div>
      <div class="pkg-grid" id="subList"></div>
      <div class="pagination" id="subPagination"></div>
    </div>
  </div>

  <!-- History tab -->
  <div id="tab-history" style="display:none">
    <div class="filter-pills" id="histFilterPills"></div>
    <div id="histList"></div>
    <div class="pagination" id="histPagination"></div>
  </div>
</div>

<!-- Transaction detail modal -->
<div class="ct-overlay" id="ctOverlay">
  <div class="ct-modal" id="ctModal"></div>
</div>

<!-- Package / Gift / Subscription form modal -->
<div class="modal-overlay" id="formModalOv">
  <div class="modal-box">
    <div class="modal-box-head">
      <div>
        <h3 id="formModalTitle">New Coin Item</h3>
        <p id="formModalSub">Set up a coin package, giftable item, or reader subscription.</p>
      </div>
      <button class="modal-close-x" data-action="close-form-modal"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-box-body">
      <div class="field-group">
        <label>Type</label>
        <div class="radio-row" id="kindRow">
          <label class="radio-opt active" data-kind="package"><input type="radio" name="kindOpt" value="package" checked/> <i class="fas fa-coins"></i> Coin Package</label>
          <label class="radio-opt" data-kind="gift"><input type="radio" name="kindOpt" value="gift"/> <i class="fas fa-gift"></i> Gift Item</label>
          <label class="radio-opt" data-kind="subscription"><input type="radio" name="kindOpt" value="subscription"/> <i class="fas fa-star"></i> Subscription</label>
        </div>
      </div>

      <div class="field-group">
        <label id="nameLabel">Package Name</label>
        <input type="text" id="itemName" placeholder="e.g. Reader Bundle"/>
      </div>

      <!-- Package fields -->
      <div id="packageFields">
        <div class="field-row-2">
          <div class="field-group"><label>Coins</label><input type="number" id="pkgCoins" min="1" placeholder="e.g. 5000"/></div>
          <div class="field-group"><label>Price (USD)</label><input type="number" id="pkgPrice" min="0.01" step="0.01" placeholder="e.g. 49.99"/></div>
        </div>
        <div class="field-group"><label>Bonus % (optional)</label><input type="number" id="pkgBonus" min="0" max="100" placeholder="e.g. 5"/></div>
      </div>

      <!-- Gift fields -->
      <div id="giftFields" style="display:none">
        <div class="field-row-2">
          <div class="field-group"><label>Emoji / Icon</label><input type="text" id="giftIcon" maxlength="4" placeholder="e.g. 🌹"/></div>
          <div class="field-group"><label>Cost (coins)</label><input type="number" id="giftCost" min="1" placeholder="e.g. 100"/></div>
        </div>
      </div>

      <!-- Subscription fields -->
      <div id="subFields" style="display:none">
        <div class="field-row-2">
          <div class="field-group"><label>Price (USD)</label><input type="number" id="subPrice" min="0.01" step="0.01" placeholder="e.g. 9.99"/></div>
          <div class="field-group"><label>Duration (days)</label><input type="number" id="subDuration" min="1" placeholder="e.g. 30"/></div>
        </div>
        <div class="field-row-2">
          <div class="field-group"><label>Coins per day</label><input type="number" id="subCoinsPerDay" min="1" placeholder="e.g. 150"/></div>
          <div class="field-group"><label>Bonus % (optional)</label><input type="number" id="subBonus" min="0" max="100" placeholder="e.g. 10"/></div>
        </div>
      </div>

      <div class="field-group">
        <label>Status</label>
        <select id="itemStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select>
      </div>

      <div class="modal-error" id="formModalError"></div>
      <div class="modal-box-actions">
        <button class="cancel-btn" data-action="close-form-modal">Cancel</button>
        <button class="confirm-btn" id="formConfirmBtn" data-action="submit-form"><i class="fas fa-floppy-disk"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="delModalOv">
  <div class="modal-box">
    <div class="modal-box-head">
      <div><h3>Delete item</h3><p id="delModalSub">This can't be undone.</p></div>
      <button class="modal-close-x" data-action="close-del-modal"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-box-body">
      <div class="modal-box-actions">
        <button class="cancel-btn" data-action="close-del-modal">Cancel</button>
        <button class="confirm-btn danger-variant" id="delConfirmBtn" data-action="submit-del"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="shared/finance-sidebar.js"></script>

function toast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove('show');},2500);
}
