<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Story Management — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.welcome-banner{background:linear-gradient(135deg,var(--accent),#7a0030);border-radius:18px;padding:24px 26px;margin-bottom:20px;color:#fff;box-shadow:0 10px 32px -10px rgba(255,0,80,.5)}
.welcome-eyebrow{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:5px}
.welcome-title{font-size:19px;font-weight:800}
.welcome-sub{font-size:12.5px;opacity:.82;margin-top:5px;line-height:1.5}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.stat-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.stat-num{font-size:19px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.panel-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}

.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-box{display:flex;align-items:center;gap:7px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:8px 12px;flex:1;min-width:160px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box input::placeholder{color:var(--text-faint)}
.search-box i{color:var(--text-faint);font-size:11px}
.toolbar select{background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer}

.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-pill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);cursor:pointer;transition:.14s;display:flex;align-items:center;gap:4px}
.filter-pill:hover{border-color:var(--accent)}
.filter-pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill-count{font-size:9px;padding:1px 5px;border-radius:10px;background:var(--table-head);color:var(--text-faint)}
.filter-pill.on .pill-count{background:rgba(255,255,255,.25);color:#fff}

/* Story card */
.story-card{border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:9px;cursor:pointer;transition:.14s;display:flex;gap:14px;align-items:flex-start}
.story-card:hover{border-color:var(--accent);box-shadow:0 3px 16px rgba(255,0,80,.07)}
.sc-cover-wrap{flex-shrink:0;position:relative}
.sc-cover{width:58px;height:80px;border-radius:9px;object-fit:cover;display:block;box-shadow:0 3px 12px rgba(20,10,50,.2);background:var(--table-head)}
.sc-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800}
.sc-badge.ongoing{background:var(--blue);color:#fff}
.sc-badge.completed{background:var(--green);color:#fff}
.sc-badge.hiatus{background:var(--amber);color:#fff}
.sc-info{flex:1;min-width:0}
.sc-title{font-size:13px;font-weight:800;line-height:1.3;margin-bottom:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sc-author-row{font-size:11px;color:var(--text-muted);margin-bottom:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sc-author-row img{width:16px;height:16px;border-radius:50%;object-fit:cover;flex-shrink:0}
.genre-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--table-head);color:var(--text-muted);white-space:nowrap}
.sc-stats{display:flex;gap:12px;flex-wrap:wrap}
.sc-stat{font-size:10px;color:var(--text-muted);font-weight:600;display:flex;align-items:center;gap:3px;white-space:nowrap}
.sc-stat i{color:var(--text-faint);font-size:9px}
.sc-progress{margin-top:7px}
.sc-prog-label{display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);margin-bottom:3px;font-weight:600}
.sc-prog-bar{height:3px;background:var(--table-head);border-radius:3px;overflow:hidden}
.sc-prog-fill{height:100%;border-radius:3px;background:var(--accent)}
.sc-actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.sc-btn{font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px;transition:.13s;white-space:nowrap}
.sc-btn:hover{border-color:var(--accent);color:var(--accent)}
.sc-btn.danger:hover{border-color:var(--red);color:var(--red)}

.status-pill{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.status-pill.ongoing{background:var(--blue-bg);color:var(--blue)}
.status-pill.completed{background:var(--green-bg);color:var(--green)}
.status-pill.hiatus{background:var(--amber-bg);color:var(--amber)}
.status-pill.draft{background:var(--table-head);color:var(--text-muted)}

/* Pagination */
.pgn{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:8px}
.pgn-info{font-size:11px;color:var(--text-faint);font-weight:600}
.pgn-btns{display:flex;gap:4px}
.pgn-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:.13s}
.pgn-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pgn-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pgn-btn:disabled{opacity:.3;cursor:default}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,6,25,.55);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-slide{position:fixed;bottom:0;left:0;right:0;max-height:86vh;background:var(--card);z-index:1001;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .33s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:0 -12px 50px rgba(0,0,0,.26)}
.modal-slide.open{transform:translateY(0)}
.modal-handle{width:36px;height:4px;border-radius:3px;background:var(--text-faint);margin:10px auto 0;opacity:.35}
.modal-close{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}

.modal-hero{display:flex;gap:16px;padding:16px 20px 14px;border-bottom:1px solid var(--border);align-items:flex-start}
.modal-cover{width:72px;height:100px;border-radius:11px;object-fit:cover;display:block;box-shadow:0 5px 18px rgba(20,10,50,.25);flex-shrink:0}
.modal-hero-info{flex:1;min-width:0}
.modal-hero-info h3{font-size:16px;font-weight:800;line-height:1.3;margin-bottom:3px}
.modal-author-line{font-size:11.5px;color:var(--text-muted);margin-bottom:7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.modal-author-line img{width:18px;height:18px;border-radius:50%}
.modal-rating{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.stars{color:#ffd166}
.reads-lbl{font-size:11px;color:var(--text-faint);font-weight:400}

.modal-body{padding:16px 20px 28px}
.section-lbl{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin-bottom:9px;margin-top:16px;display:flex;align-items:center;gap:5px}
.section-lbl:first-child{margin-top:0}

.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.meta-item{background:var(--table-head);border-radius:9px;padding:10px 12px}
.meta-lbl{font-size:9px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em}
.meta-val{font-size:14px;font-weight:800;margin-top:2px;line-height:1.2}

.synopsis-box{background:var(--table-head);border-radius:9px;padding:11px 13px;font-size:12px;color:var(--text-muted);line-height:1.55}

.ch-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;margin-bottom:5px;font-size:11.5px}
.ch-num{width:24px;height:24px;border-radius:6px;background:var(--table-head);font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0}
.ch-title{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-meta{font-size:9.5px;color:var(--text-faint);text-align:right;flex-shrink:0}
.ch-status{font-size:8px;font-weight:800;padding:2px 6px;border-radius:8px}
.ch-status.published{background:var(--green-bg);color:var(--green)}
.ch-status.draft{background:var(--table-head);color:var(--text-faint)}

.modal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.modal-actions button{flex:1;min-width:100px;padding:9px 12px;border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);display:flex;align-items:center;justify-content:center;gap:5px;transition:.13s}
.modal-actions button:hover{border-color:var(--accent);color:var(--accent)}
.modal-actions button.primary{background:var(--accent);border-color:transparent;color:#fff}
.modal-actions button.primary:hover{opacity:.88}
.modal-actions button.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}
.modal-actions button.danger:hover{background:var(--red);color:#fff}

.empty-msg{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:12.5px}
.empty-msg i{font-size:28px;margin-bottom:8px;display:block;opacity:.35}

/* Responsive */
@media(max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  .stat-row{grid-template-columns:1fr 1fr}
  .stat-num{font-size:16px}
  .toolbar{gap:6px}
  .toolbar select{font-size:11px;padding:7px 9px}
  .story-card{flex-direction:row;gap:12px}
  .sc-cover{width:52px;height:72px}
  .sc-actions{display:none}
  .meta-grid{grid-template-columns:1fr 1fr}
  .modal-actions button{min-width:80px;font-size:10.5px;padding:8px 10px}
  .modal-hero{gap:12px}
  .modal-cover{width:60px;height:84px}
}
@media(max-width:380px){
  .stat-row{grid-template-columns:1fr 1fr}
  .sc-title{font-size:12px}
  .welcome-title{font-size:17px}
}
</style>
</head>
<body>
<div id="smRoot">
  <div class="welcome-banner">
    <div class="welcome-eyebrow">Senior Editor · Story Management</div>
    <div class="welcome-title">Story Management 📚</div>
    <div class="welcome-sub">Assigned stories, chapter status, publishing schedules, metadata and publication history.</div>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="panel">
    <div class="panel-head">
      <h2><i class="fas fa-book" style="color:var(--accent)"></i> Assigned Stories</h2>
      <span id="storyCount" style="font-size:11.5px;color:var(--text-faint);font-weight:600"></span>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="fas fa-magnifying-glass"></i>
        <input id="searchInput" placeholder="Search title, author, genre…"/>
      </div>
      <select id="sortSel">
        <option value="recent">Recently Updated</option>
        <option value="rating">Highest Rated</option>
        <option value="chapters">Most Chapters</option>
        <option value="words">Most Words</option>
        <option value="alpha">A → Z</option>
      </select>
      <select id="genreSel"><option value="">All Genres</option></select>
    </div>

    <div class="filter-row" id="filterRow"></div>
    <div id="storyList"></div>
    <div class="pgn" id="pgn"></div>
  </div>
</div>

<!-- modal -->
<div class="modal-overlay" id="modalOv"></div>
<div class="modal-slide" id="modalSlide">
  <div class="modal-handle"></div>
  <button class="modal-close" id="modalClose"><i class="fas fa-xmark"></i></button>
  <div class="modal-hero">
    <img class="modal-cover" id="modalCover" src="" alt=""/>
    <div class="modal-hero-info">
      <h3 id="modalName"></h3>
      <div class="modal-author-line" id="modalAuthor"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="modalTags"></div>
      <div class="modal-rating">
        <span class="stars" id="modalStars"></span>
        <span id="modalRating"></span>
        <span class="reads-lbl" id="modalReads"></span>
      </div>
    </div>
  </div>
  <div class="modal-body">
    <div class="section-lbl"><i class="fas fa-info-circle"></i> Story Details</div>
    <div class="meta-grid" id="metaGrid"></div>
    <div class="section-lbl" style="margin-top:14px"><i class="fas fa-align-left"></i> Synopsis</div>
    <div class="synopsis-box" id="synopsisBox"></div>
    <div class="section-lbl" style="margin-top:14px"><i class="fas fa-list-ol"></i> Recent Chapters</div>
    <div id="chapterList"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="shared/senior-editor-sidebar.js"></script>
<script src="shared/senior-editor-data.js"></script>
<script src="services/story-management-service.js"></script>
<script>StoryManagementService.init();</script>
</body>
</html>
