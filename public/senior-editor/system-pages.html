<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>System Pages — Platform Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}
.pages-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}.page-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.page-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.page-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}.page-icon.green{background:var(--green-bg);color:var(--green)}.page-icon.blue{background:var(--blue-bg);color:var(--blue)}.page-icon.amber{background:var(--amber-bg);color:var(--amber)}.page-icon.purple{background:#ece9fb;color:#5b4bcf}.page-icon.pink{background:#ffe1eb;color:var(--accent)}.page-title{font-weight:700;font-size:13px}.page-url{font-size:11px;color:var(--text-faint);margin-top:2px;font-family:monospace}.page-status{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px}.status-dot{width:8px;height:8px;border-radius:50%}.status-dot.active{background:var(--green)}.status-dot.draft{background:var(--amber)}.status-dot.hidden{background:var(--text-faint)}.page-actions{display:flex;gap:8px}.page-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}.page-actions button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:800px){.pages-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr-row"><div></div><button class="btn-add" onclick="SystemPagesService.createPage()"><i class="fas fa-plus"></i> New Page</button></div>
<div class="pages-grid" id="pagesGrid">
</div>
</div>
<script src="shared/api.js"></script>
<script src="shared/story-modal.js"></script>
<script src="shared/senior-editor-sidebar.js"></script>
<script src="services/system-pages-service.js"></script>
<script>SystemPagesService.init();</script></body></html>
