<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contracts — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.page-hdr h1{font-size:19px;font-weight:800}
.page-hdr p{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.btn-primary{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}
.btn-primary:hover{filter:brightness(1.05)}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-num{font-size:20px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:1px}

.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 20px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:10px;font-weight:800;background:var(--table-head);color:var(--text-faint);padding:2px 7px;border-radius:20px}
.tab.active .cnt{background:var(--accent-soft);color:var(--accent)}

.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.search-box input::placeholder{color:var(--text-faint)}
.search-box i{color:var(--text-faint);font-size:12px}
.filter-select{appearance:none;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 30px 9px 14px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}

.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;background:var(--table-head);padding:12px 18px;white-space:nowrap}
tbody td{padding:13px 18px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--hover)}
.contract-cell{display:flex;align-items:center;gap:10px}
.contract-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.contract-id{font-weight:700;font-size:12.5px}
.contract-type{font-size:11px;color:var(--text-muted);margin-top:1px}
.author-cell{display:flex;align-items:center;gap:8px}
.author-cell img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.author-name{font-weight:600;font-size:12.5px}
.book-title{font-weight:600;font-size:12.5px;line-height:1.3}
.date-cell{font-size:12px;color:var(--text-muted)}

.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.status-pill .dot{width:6px;height:6px;border-radius:50%}
.status-pill.awaiting{background:var(--amber-bg);color:var(--amber)}.status-pill.awaiting .dot{background:var(--amber)}
.status-pill.signed{background:var(--green-bg);color:var(--green)}.status-pill.signed .dot{background:var(--green)}
.status-pill.active{background:var(--blue-bg);color:var(--blue)}.status-pill.active .dot{background:var(--blue)}
.status-pill.rejected{background:var(--red-bg);color:var(--red)}.status-pill.rejected .dot{background:var(--red)}
.status-pill.expired{background:var(--table-head);color:var(--text-faint)}.status-pill.expired .dot{background:var(--text-faint)}

.actions-cell{display:flex;align-items:center;gap:5px}
.act-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:.12s;font-family:inherit}
.act-btn:hover{color:var(--accent);border-color:var(--accent)}
.act-btn.approve:hover{color:var(--green);border-color:var(--green)}
.act-btn.reject:hover{color:var(--red);border-color:var(--red)}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px}
.page-info{font-size:12px;color:var(--text-muted)}.page-info b{color:var(--text);font-weight:700}
.page-btns{display:flex;gap:5px}
.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pg-btn:disabled{opacity:.4;cursor:default}

/* ── Templates Tab ── */
.tpl-grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.tpl-detail{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:sticky;top:86px}
.tpl-dp-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.tpl-dp-icn{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tpl-dp-title{font-size:14px;font-weight:800}
.tpl-dp-meta{font-size:11px;color:var(--text-muted);margin-top:3px}
.tpl-dp-tabs{display:flex;gap:14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tpl-dp-tab{padding:0 1px 8px;font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tpl-dp-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tpl-dp-preview{background:var(--table-head);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:11.5px;line-height:1.7;color:var(--text);max-height:260px;overflow-y:auto;margin-bottom:14px}
.tpl-dp-preview h3{font-size:12px;font-weight:800;text-align:center;margin-bottom:8px}
.tpl-dp-preview p{margin-bottom:8px;color:var(--text-muted)}
.tpl-dp-preview b{color:var(--text)}
.tpl-dp-detail-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:12px}
.tpl-dp-detail-row:first-child{border-top:none}
.tpl-dp-detail-row span{color:var(--text-muted)}
.tpl-dp-detail-row b{font-weight:700}
.tpl-dp-clause{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:12px}
.tpl-dp-clause:first-child{border-top:none}
.tpl-dp-clause i{color:var(--accent);font-size:11px;width:16px;text-align:center}
.tpl-dp-actions{display:flex;gap:8px;margin-top:14px}
.tpl-dp-btn{flex:1;padding:9px;border-radius:9px;font-size:11.5px;font-weight:700;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit}
.tpl-dp-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── Signed Tab ── */
.signed-grid{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.signed-detail{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:sticky;top:86px}
.signed-hero{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.signed-cover{width:70px;height:100px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.signed-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.signed-meta{background:var(--table-head);border-radius:9px;padding:10px 12px}
.signed-meta-lbl{font-size:9.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em}
.signed-meta-val{font-size:12.5px;font-weight:700;margin-top:2px}
.signed-clause{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:12px}
.signed-clause:first-child{border-top:none}
.signed-clause i{color:var(--green);font-size:11px;width:16px;text-align:center}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(10,6,25,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);transform:scale(.92);transition:transform .25s;overflow:hidden;max-height:85vh;overflow-y:auto}
.modal-overlay.open .modal{transform:scale(1)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-hdr h3{font-size:15px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:8px;background:var(--input-bg);border:1px solid var(--input-border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);cursor:pointer}
.modal-close:hover{color:var(--accent);border-color:var(--accent)}
.modal-body{padding:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
.modal-actions button{flex:1;padding:10px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:.12s}
.btn-send{background:var(--accent);color:#fff}.btn-send:hover{filter:brightness(1.05)}
.btn-cancel{background:var(--input-bg);color:var(--text);border:1px solid var(--input-border)}

.view-detail{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.view-detail:last-child{border-bottom:none}
.view-label{font-size:10.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.view-value{font-size:13px;font-weight:600;margin-top:2px}

.reply-box{background:var(--blue-bg);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.reply-box .r-from{font-size:11px;font-weight:700;color:var(--blue)}
.reply-box .r-msg{font-size:12.5px;color:var(--text);line-height:1.5;margin-top:3px}
.reply-box .r-time{font-size:10px;color:var(--text-faint);margin-top:3px}

/* ── Chat Interface ── */
.chat-section{margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
.chat-section-title{font-size:10.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.chat-section-title .settled-badge{background:var(--green-bg);color:var(--green);font-size:10px;padding:2px 8px;border-radius:20px}
.chat-area{background:var(--table-head);border:1px solid var(--border);border-radius:12px;padding:14px;max-height:280px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.chat-empty{text-align:center;color:var(--text-faint);font-size:12px;padding:20px 0}
.chat-empty i{font-size:22px;margin-bottom:6px;opacity:.4;display:block}
.chat-msg{display:flex;gap:8px;max-width:85%}
.chat-msg.sent{align-self:flex-end;flex-direction:row-reverse}
.chat-msg.received{align-self:flex-start}
.chat-av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:2px}
.chat-bubble{border-radius:14px;padding:9px 13px;font-size:12.5px;line-height:1.55;position:relative}
.chat-msg.sent .chat-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-msg.received .chat-bubble{background:var(--card);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg .chat-name{font-size:10px;font-weight:700;margin-bottom:2px}
.chat-msg.sent .chat-name{color:rgba(255,255,255,.7)}
.chat-msg.received .chat-name{color:var(--accent)}
.chat-msg .chat-time{font-size:9.5px;margin-top:3px;text-align:right}
.chat-msg.sent .chat-time{color:rgba(255,255,255,.55)}
.chat-msg.received .chat-time{color:var(--text-faint)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-wrap{flex:1;position:relative}
.chat-input-wrap textarea{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 13px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none;resize:none;min-height:40px;max-height:100px}
.chat-input-wrap textarea:focus{border-color:var(--accent)}
.chat-input-wrap textarea:disabled{opacity:.5;cursor:not-allowed}
.chat-send-btn{width:40px;height:40px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;transition:.12s}
.chat-send-btn.send{background:var(--accent);color:#fff}.chat-send-btn.send:hover{filter:brightness(1.05)}
.chat-send-btn.settle{background:var(--green);color:#fff}.chat-send-btn.settle:hover{filter:brightness(1.05)}
.chat-send-btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-faint)}
.empty-state i{font-size:28px;margin-bottom:10px;opacity:.5}
.empty-state p{font-size:13px}

@media (max-width:1180px){.stats-grid{grid-template-columns:repeat(2,1fr)}.tpl-grid,.signed-grid{grid-template-columns:1fr}.tpl-detail,.signed-detail{position:static}}
@media (max-width:680px){.stats-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.page-hdr{flex-direction:column;align-items:stretch}.btn-primary{justify-content:center}}
</style>
</head>
<body>
<div id="pageRoot">
  <div class="page-hdr">
    <div><h1>Contracts</h1><p>Manage contracts, templates, and signed agreements.</p></div>
    <button class="btn-primary" id="btnSend"><i class="fas fa-paper-plane"></i> Send Contract</button>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="tabs" id="mainTabs">
    <div class="tab active" data-tab="contracts">All Contracts <span class="cnt" id="cntContracts">0</span></div>
    <div class="tab" data-tab="templates">Templates <span class="cnt" id="cntTemplates">0</span></div>
    <div class="tab" data-tab="signed">Signed <span class="cnt" id="cntSigned">0</span></div>
  </div>

  <!-- Contracts Tab -->
  <div id="tabContracts">
    <div class="filters">
      <div class="search-box"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by ID, author, or book…"/></div>
      <select class="filter-select" id="statusFilter">
        <option value="">All Status</option><option value="awaiting">Awaiting</option><option value="signed">Signed</option><option value="active">Active</option><option value="rejected">Rejected</option><option value="expired">Expired</option>
      </select>
      <select class="filter-select" id="typeFilter">
        <option value="">All Types</option><option>Exclusive Publishing</option><option>Revenue Share</option><option>License Agreement</option>
      </select>
    </div>
    <div class="table-card">
      <div class="table-wrap"><table><thead><tr><th>Contract</th><th>Author</th><th>Book</th><th>Status</th><th>Date Sent</th><th>Signed</th><th>Actions</th></tr></thead><tbody id="contractBody"></tbody></table></div>
      <div class="pagination"><div class="page-info" id="pageInfo"></div><div class="page-btns" id="pageBtns"></div></div>
    </div>
  </div>

  <!-- Templates Tab -->
  <div id="tabTemplates" style="display:none">
    <div class="tpl-grid">
      <div class="table-card">
        <div class="table-wrap"><table><thead><tr><th>Template</th><th>Type</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="templateBody"></tbody></table></div>
      </div>
      <div class="tpl-detail" id="tplDetail"></div>
    </div>
  </div>

  <!-- Signed Tab -->
  <div id="tabSigned" style="display:none">
    <div class="signed-grid">
      <div class="table-card">
        <div class="table-wrap"><table><thead><tr><th>Contract</th><th>Author</th><th>Book</th><th>Duration</th><th>Signed</th><th>Actions</th></tr></thead><tbody id="signedBody"></tbody></table></div>
      </div>
      <div class="signed-detail" id="signedDetail"></div>
    </div>
  </div>
</div>

<!-- Send Contract Modal -->
<div class="modal-overlay" id="sendModal">
  <div class="modal">
    <div class="modal-hdr"><h3>Send New Contract</h3><div class="modal-close" id="closeSendModal"><i class="fas fa-xmark"></i></div></div>
    <div class="modal-body">
      <div class="form-group"><label>Author</label><select id="sendAuthor"><option value="">Select author…</option><option>Sofia Lindqvist</option><option>Daniel Reyes</option><option>Amara Okafor</option><option>Julien Moreau</option><option>Nadia Petrov</option><option>Kenji Watanabe</option><option>Priya Nair</option><option>Layla Haddad</option><option>Isabella Rossi</option></select></div>
      <div class="form-group"><label>Book Title</label><input id="sendBook" placeholder="e.g. The Runaway Bride"/></div>
      <div class="form-row">
        <div class="form-group"><label>Contract Type</label><select id="sendType"><option>Exclusive Publishing</option><option>Revenue Share</option><option>License Agreement</option></select></div>
        <div class="form-group"><label>Duration</label><select id="sendDuration"><option>1 Year</option><option>2 Years</option><option>3 Years</option><option>5 Years</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Revenue Split (%)</label><input id="sendRevenue" type="number" placeholder="e.g. 70" min="0" max="100"/></div>
        <div class="form-group"><label>Advance ($)</label><input id="sendAdvance" type="number" placeholder="e.g. 500"/></div>
      </div>
      <div class="form-group"><label>Template</label><select id="sendTemplate"><option value="">Select template…</option></select></div>
      <div class="form-group"><label>Notes</label><textarea id="sendNotes" placeholder="Any additional terms or notes…"></textarea></div>
    </div>
    <div class="modal-actions"><button class="btn-cancel" id="cancelSend">Cancel</button><button class="btn-send" id="confirmSend"><i class="fas fa-paper-plane"></i> Send Contract</button></div>
  </div>
</div>

<!-- View Contract Modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <div class="modal-hdr"><h3>Contract Details</h3><div class="modal-close" id="closeViewModal"><i class="fas fa-xmark"></i></div></div>
    <div class="modal-body" id="viewModalBody"></div>
    <div class="modal-actions" id="viewModalActions"></div>
  </div>
</div>

<script src="data/contracts-demo-data.js"></script>
<script src="shared/senior-editor-sidebar.js"></script>
<script src="services/contracts-service.js"></script>
<script src="services/contracts-page-service.js"></script>
<script>ContractsPageService.init();</script>
</body>
</html>
