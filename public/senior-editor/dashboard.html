<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}

.page{padding:24px 28px 60px;max-width:1500px}

.grid-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.stat-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.stat-num{font-size:20px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.panel-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-sub{font-size:11px;color:var(--text-faint);margin-top:-8px;margin-bottom:12px}
.panel-link{font-size:11px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px}
.panel-link:hover{text-decoration:underline}

/* Review queue cards */
.rq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rq-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;background:var(--card)}
.rq-card:hover{border-color:var(--accent);background:var(--hover)}
.rq-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rq-body{flex:1;min-width:0}
.rq-title{font-size:12.5px;font-weight:700;line-height:1.3}
.rq-desc{font-size:10px;color:var(--text-faint);font-weight:500;margin-top:2px;line-height:1.4}
.rq-count{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
.rq-count.urgent{background:var(--red-bg);color:var(--red)}
.rq-count.normal{background:var(--amber-bg);color:var(--amber)}
.rq-count.zero{background:var(--green-bg);color:var(--green)}

/* Recent items list */
.ri-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.ri-row:last-child{border-bottom:none}
.ri-ico{width:34px;height:34px;border-radius:9px;background:var(--table-head);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ri-body{flex:1;min-width:0}
.ri-title{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-meta{font-size:10px;color:var(--text-faint);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.status-pill{font-size:9px;font-weight:800;padding:2px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.status-pill.pending{background:var(--amber-bg);color:var(--amber)}
.status-pill.approved{background:var(--green-bg);color:var(--green)}
.status-pill.rejected{background:var(--red-bg);color:var(--red)}

/* Activity feed */
.act-row{display:flex;gap:10px;padding:9px 2px}
.act-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.act-body{flex:1;min-width:0}
.act-text{font-size:11.5px;line-height:1.5;color:var(--text)}
.act-text b{font-weight:700}
.act-time{font-size:9.5px;color:var(--text-faint);font-weight:600;margin-top:1px}

.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}

@media(max-width:1180px){.grid-stats{grid-template-columns:repeat(3,1fr)}.rq-grid{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}}
@media(max-width:640px){.grid-stats{grid-template-columns:repeat(2,1fr)}.rq-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="dashRoot">
<div class="page">

  <div class="grid-stats" id="statCards"></div>

  <div class="panel" style="margin-bottom:16px">
    <div class="panel-head">
      <h2><i class="fas fa-layer-group" style="color:var(--accent)"></i> Review Queues</h2>
    </div>
    <div class="panel-sub">Tap any queue to open its full review page.</div>
    <div class="rq-grid" id="rqGrid"></div>
  </div>

  <div class="dash-grid">
    <div>
      <div class="panel">
        <div class="panel-head">
          <h2><i class="fas fa-inbox" style="color:var(--accent)"></i> Recent Submissions</h2>
          <a class="panel-link" href="review-queue.html">View all <i class="fas fa-arrow-right"></i></a>
        </div>
        <div id="subList"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="panel-head">
          <h2><i class="fas fa-clock-rotate-left" style="color:var(--text-faint)"></i> Recent Activity</h2>
        </div>
        <div id="activityList"></div>
      </div>
    </div>
  </div>

</div>
</div>

<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9999"></div>
<style>#toast.show{opacity:1}</style>

<script src="shared/senior-editor-sidebar.js"></script>
<script>
'strict';
const shell = SeniorEditorSidebar.attach('#dashRoot',{
  activeItem:'dashboard', title:'Dashboard', subtitle:'Your editorial overview',
  user:{name:'Chioma Reddy',role:'Senior Editor',avatar:'https://i.pravatar.cc/100?img=5'}, notifCount:4,
  searchPlaceholder:'Search anything…',
});

const ICO={red:'var(--red)',amber:'var(--amber)',blue:'var(--blue)',purple:'var(--purple)',green:'var(--green)',accent:'var(--accent)'};
const BG={red:'var(--red-bg)',amber:'var(--amber-bg)',blue:'var(--blue-bg)',purple:'var(--purple-bg)',green:'var(--green-bg)',accent:'rgba(255,0,80,.1)'};

/* ── Demo data ── */
const QUEUES = [
  { key:'contracts',    label:'Contract Review',       icon:'fa-file-signature', desc:'Authors sign first, then contract returns to SE for final platform signature & stamp.', count:5, cls:'amber', href:'contract-review.html' },
  { key:'completion',   label:'Completion Application', icon:'fa-flag-checkered', desc:'Authors apply for book completion. SE approves or rejects.', count:2, cls:'green', href:'completion-application.html' },
  { key:'chapters',     label:'Chapter Edit Review',    icon:'fa-pen-to-square',  desc:'Authors request chapter edits. SE reviews to protect exclusive contracts.', count:8, cls:'red', href:'chapter-edit-review.html' },
  { key:'book-series',  label:'Book Series Review',     icon:'fa-book-open',      desc:'Authors request edits to book details (title, series, etc.).', count:4, cls:'blue', href:'book-series-review.html' },
  { key:'book-lock',    label:'Book Lock Review',        icon:'fa-lock',           desc:'Authors request to lock or unlock their entire book. SE approves.', count:3, cls:'purple', href:'vip-registration-review.html' },
];

const RECENT_SUBS = [
  { title:'Chapter Edit — The CEO\'s Hidden Son Ch.24', author:'Luna Skye', meta:'Billionaire & CEO · 3,450 words', time:'2h ago', status:'pending' },
  { title:'Contract Return — Wolf King\'s Vow', author:'Elena Vasquez', meta:'Werewolf & Fantasy · Full contract', time:'4h ago', status:'pending' },
  { title:'VIP Application — His Hidden Luna', author:'Lyra Night', meta:'Werewolf · Chapter lock request', time:'5h ago', status:'pending' },
  { title:'Completion Request — Betrayed by the Mafia Prince', author:'Marcus Webb Jr.', meta:'Mafia & Urban · 7 chapters done', time:'8h ago', status:'approved' },
  { title:'Book Edit — The Duke\'s Secret (title change)', author:'Isabelle Moreau', meta:'Historical & Regency · Metadata', time:'12h ago', status:'approved' },
  { title:'Editor Bill — Wren Okonkwo withdrawal', author:'Wren Okonkwo', meta:'Campus & Revenge · $1,200', time:'1d ago', status:'pending' },
];

const ACTIVITY = [
  { icon:'fa-check-circle', color:'green', text:'Approved <b>Chapter Edit</b> for Wolf King\'s Vow Ch.11', time:'1h ago' },
  { icon:'fa-file-signature', color:'amber', text:'Contract returned by <b>Isabelle Moreau</b> — pending stamp', time:'3h ago' },
  { icon:'fa-crown', color:'purple', text:'VIP registration approved for <b>Luna Skye</b>', time:'5h ago' },
  { icon:'fa-xmark-circle', color:'red', text:'Rejected <b>Chapter Edit</b> — Mafia Prince Ch.6 (policy violation)', time:'8h ago' },
  { icon:'fa-sack-dollar', color:'accent', text:'Editor bill pending — <b>Wren Okonkwo</b> $1,200', time:'1d ago' },
];

/* ── Render ── */
function renderStats(){
  const total = QUEUES.reduce((s,q)=>s+q.count,0);
  const urgent = QUEUES.filter(q=>q.cls==='red').reduce((s,q)=>s+q.count,0);
  document.getElementById('statCards').innerHTML=[
    {n:total,l:'Pending Reviews',ico:'fa-inbox',cls:'amber'},
    {n:urgent,l:'Urgent (Chapter Edits)',ico:'fa-triangle-exclamation',cls:'red'},
    {n:QUEUES.find(q=>q.key==='contracts').count,l:'Contracts',ico:'fa-file-signature',cls:'blue'},
    {n:QUEUES.find(q=>q.key==='book-lock').count,l:'Book Locks',ico:'fa-lock',cls:'purple'},
    {n:87,l:'Approval Rate',ico:'fa-circle-check',cls:'green'},
    {n:'3.4h',l:'Avg Turnaround',ico:'fa-clock',cls:'purple'},
  ].map(s=>`<div class="stat-card"><div class="stat-ico" style="background:${BG[s.cls]};color:${ICO[s.cls]}"><i class="fas ${s.ico}"></i></div><div><div class="stat-num">${s.n}</div><div class="stat-lbl">${s.l}</div></div></div>`).join('');
}

function renderQueues(){
  document.getElementById('rqGrid').innerHTML=QUEUES.map(q=>{
    const cls=q.count===0?'zero':q.count>=5?'urgent':'normal';
    return `<div class="rq-card" data-href="${q.href}">
      <div class="rq-ico" style="background:${BG[q.cls]};color:${ICO[q.cls]}"><i class="fas ${q.icon}"></i></div>
      <div class="rq-body"><div class="rq-title">${q.label}</div><div class="rq-desc">${q.desc}</div></div>
      <span class="rq-count ${cls}">${q.count}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('.rq-card').forEach(c=>{
    c.addEventListener('click',()=>{ const h=c.dataset.href; if(h&&h!=='#') location.href=h; else toast('Opening queue…'); });
  });
}

function renderSubs(){
  document.getElementById('subList').innerHTML=RECENT_SUBS.map(s=>`
    <div class="ri-row">
      <div class="ri-ico"><i class="fas fa-file-lines"></i></div>
      <div class="ri-body"><div class="ri-title">${s.title}</div><div class="ri-meta"><span>✍️ ${s.author}</span><span>${s.meta}</span><span>${s.time}</span></div></div>
      <span class="status-pill ${s.status}">${s.status}</span>
    </div>`).join('');
}

function renderActivity(){
  document.getElementById('activityList').innerHTML=ACTIVITY.map(a=>`
    <div class="act-row">
      <div class="act-dot" style="background:${BG[a.color]||'var(--table-head)'};color:${ICO[a.color]||'var(--text-faint)'}"><i class="fas ${a.icon}"></i></div>
      <div class="act-body"><div class="act-text">${a.text}</div><div class="act-time">${a.time}</div></div>
    </div>`).join('');
}

function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

renderStats();
renderQueues();
renderSubs();
renderActivity();
</script>
</body>
</html>
