<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Author Messages — Droboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.top-tabs{display:flex;gap:22px;border-bottom:2px solid var(--border)}
.top-tab{padding:0 2px 10px;font-size:13.5px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:6px}
.top-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.top-tab .tab-count{font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--text-muted)}
.top-tab.active .tab-count{background:var(--accent-soft);color:var(--accent)}
.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}
.btn-add:hover{background:#000}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}
.stat-ico.pink{background:#ffe1eb;color:var(--accent)}
.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}
.stat-ico.green{background:var(--green-bg);color:var(--green)}
.stat-ico.red{background:var(--red-bg);color:var(--red)}
.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}
.stat-delta{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:20px}
.stat-num{font-size:24px;font-weight:800;line-height:1}
.stat-lbl{font-size:12.5px;color:var(--text-muted);font-weight:600}
.inbox-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:320px 1fr;height:620px}
.inbox-list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.inbox-list-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.inbox-search{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:9px 12px}
.inbox-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.inbox-search input::placeholder{color:var(--text-faint)}
.inbox-search i{color:var(--text-faint);font-size:12px}
.inbox-scroll{flex:1;overflow-y:auto}
.conv-item{display:flex;gap:11px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--border);position:relative;transition:.12s}
.conv-item:hover{background:var(--hover)}
.conv-item.active{background:var(--accent-soft)}
.conv-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.conv-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0}
.conv-body{flex:1;min-width:0}
.conv-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.conv-name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.conv-name i.fa-flag{color:var(--red);font-size:9px}
.conv-time{font-size:10px;color:var(--text-faint);flex-shrink:0}
.conv-preview{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.unread .conv-preview{color:var(--text);font-weight:600}
.conv-item.unread .conv-name{font-weight:800}
.unread-badge{background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0}
.inbox-thread{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.compose-row{display:flex;align-items:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--card)}
.compose-inputs{flex:1;display:flex;flex-direction:column;gap:0;min-width:0}
.thread-head{display:flex;align-items:center;gap:11px;padding:14px 20px;border-bottom:1px solid var(--border)}
.thread-head img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.thread-head-name{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.thread-head-sub{font-size:11px;color:var(--text-muted)}
.thread-head-right{margin-left:auto;display:flex;gap:8px}
.th-act-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.th-act-btn:hover{color:var(--accent);border-color:var(--accent)}
.thread-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg-row{display:flex;gap:9px;max-width:70%}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-row>img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0}
.msg-bubble{background:var(--card);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:12.5px;line-height:1.5;color:var(--text)}
.msg-row.out .msg-bubble{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:14px 14px 4px 14px}
.msg-time{font-size:9.5px;color:var(--text-faint);margin-top:4px;display:block}
.msg-row.out .msg-time{text-align:right}

.inbox-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-muted)}
.inbox-empty i{font-size:30px;color:var(--text-faint)}
.thread-back{display:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0}
.ctx-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
.ctx-overlay.open{display:flex}
.ctx-menu{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.2);overflow:hidden;width:200px}
.ctx-preview{padding:14px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted);max-height:60px;overflow:hidden;line-height:1.4}
.ctx-btn{width:100%;padding:13px 16px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px;cursor:pointer;transition:.1s}
.ctx-btn:active{background:var(--hover)}
.ctx-btn i{width:18px;text-align:center;font-size:13px;color:var(--text-muted)}
.ctx-btn.delete{color:var(--text-muted)}
.ctx-btn+.ctx-btn{border-top:1px solid var(--border)}
.msg-row.editing .msg-bubble{outline:2px solid var(--accent);outline-offset:2px}
.edit-banner{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:4px 12px;border-radius:8px 8px 0 0;display:inline-flex;align-items:center;gap:6px}
.edit-input{width:100%;background:transparent;border:none;outline:none;color:inherit;font-size:13px;font-family:inherit;line-height:1.5;resize:none;min-height:20px}
.msg-edited{font-size:9.5px;color:var(--text-faint);font-style:italic;margin-top:1px;display:block}
.thread-head{flex-shrink:0}
.thread-body{min-height:0}
.msg-bubble img.msg-img{display:block;border-radius:10px;max-width:220px;max-height:280px;object-fit:cover;margin-bottom:6px;width:100%}
.img-preview-bar{display:none;align-items:center;gap:10px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;padding:8px;margin-top:8px}
.img-preview-bar.show{display:flex}
.img-preview-bar img{width:60px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0}
.img-preview-info{flex:1;min-width:0;font-size:11px;color:var(--text-muted)}
.img-preview-info b{display:block;color:var(--text);font-size:12px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-remove{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);cursor:pointer;flex-shrink:0}
.reply-preview{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:8px;font-size:11px;color:var(--text-muted);display:none;position:relative}
.reply-preview.show{display:block}
.reply-preview .rp-name{font-weight:700;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.reply-preview .rp-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.reply-preview .rp-close{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px}
.reply-preview .rp-close:hover{color:var(--red)}
.compose-bar{display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:22px;padding:6px 6px 6px 16px;transition:.2s}
.compose-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,0,80,.08)}
.compose-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:12.5px;font-family:inherit}
.compose-bar input::placeholder{color:var(--text-faint)}
.compose-icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:.15s;flex-shrink:0}
.compose-icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;flex-shrink:0;transition:.15s;box-shadow:0 2px 8px rgba(255,0,80,.25)}
.send-btn:hover{filter:brightness(1.1)}
.file-badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--text);margin-top:6px}
.file-badge i{color:var(--accent);font-size:13px}
.file-badge .file-name{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-badge .file-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:11px;padding:2px;margin-left:4px}
.file-badge .file-remove:hover{color:var(--red)}
.msg-file{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 12px;font-size:11.5px;font-weight:600;color:inherit;margin-top:6px;cursor:pointer;text-decoration:none}
.msg-file:hover{background:rgba(255,255,255,.25)}
.msg-row:not(.out) .msg-file{background:var(--input-bg);border-color:var(--border);color:var(--text)}
.msg-row:not(.out) .msg-file:hover{border-color:var(--accent)}
.reply-ref{background:var(--hover);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:6px 10px;margin-bottom:6px;font-size:10.5px;color:var(--text-muted);cursor:pointer}
.reply-ref:hover{background:var(--accent-soft)}
.reply-ref .rr-name{font-weight:700;color:var(--accent);display:block;margin-bottom:1px}
.reply-ref .rr-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px;display:block}
.ctx-btn i.fa-reply{color:var(--blue)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row{animation:slideUp .2s ease}
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.inbox-card{grid-template-columns:1fr;height:auto}.inbox-list{border-right:none;border-bottom:1px solid var(--border)}.inbox-list,.inbox-thread{min-height:460px}.inbox-card.thread-open .inbox-list{display:none}.inbox-card:not(.thread-open) .inbox-thread{display:none}.thread-back{display:flex !important}}
@media(max-width:680px){.page-hdr-row{flex-direction:column;align-items:stretch}.btn-add{justify-content:center}.top-tabs{overflow-x:auto}}
@media(max-width:420px){.stats-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="dashRoot">
  <div class="page-hdr-row">
    <div class="top-tabs">
      <div class="top-tab active" data-view="all">All Messages <span class="tab-count" id="countAll">0</span></div>
      <div class="top-tab" data-view="unread">Unread <span class="tab-count" id="countUnread">0</span></div>
      <div class="top-tab" data-view="flagged">Flagged <span class="tab-count" id="countFlagged">0</span></div>
    </div>
    <button class="btn-add" id="markAllBtn"><i class="fas fa-check-double"></i> Mark All as Read</button>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-top"><div class="stat-ico pink"><i class="fas fa-comments"></i></div><span class="stat-delta">+18 this week</span></div><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total Conversations</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-ico blue"><i class="fas fa-envelope"></i></div><span class="stat-delta">+5 today</span></div><div class="stat-num" id="statUnread">0</div><div class="stat-lbl">Unread Messages</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-ico green"><i class="fas fa-clock"></i></div><span class="stat-delta">-12% faster</span></div><div class="stat-num">4.2h</div><div class="stat-lbl">Avg Response Time</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-ico red"><i class="fas fa-flag"></i></div><span class="stat-delta">+2 this week</span></div><div class="stat-num" id="statFlagged">0</div><div class="stat-lbl">Flagged Conversations</div></div>
    <div class="stat-card"><div class="stat-top"><div class="stat-ico amber"><i class="fas fa-user-clock"></i></div><span class="stat-delta">+9 this week</span></div><div class="stat-num">189</div><div class="stat-lbl">Active Authors</div></div>
  </div>
  <div class="inbox-card" id="inboxCard">
    <div class="inbox-list">
      <div class="inbox-list-head"><div class="inbox-search"><i class="fas fa-magnifying-glass"></i><input id="convSearch" placeholder="Search conversations..."/></div></div>
      <div class="inbox-scroll" id="convList"></div>
    </div>
    <div class="inbox-thread" id="threadPane"></div>
  </div>
</div>
<div class="ctx-overlay" id="ctxOverlay"><div class="ctx-menu"><div class="ctx-preview" id="ctxPreview"></div><button class="ctx-btn" id="ctxReply"><i class="fas fa-reply"></i> Reply</button><button class="ctx-btn" id="ctxEdit"><i class="fas fa-pen"></i> Edit message</button><button class="ctx-btn delete" id="ctxDelete"><i class="fas fa-trash"></i> Delete message</button></div></div>
<div id="toast" style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:11px 24px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.3)}"></div>
<style>#toast.show{opacity:1}</style>
<script src="shared/senior-editor-sidebar.js"></script>
<script src="services/author-messages-service.js"></script><script>AuthorMessagesService.init();</script>
</body>
</html>
