<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contract Details — Platform Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',system-ui,sans-serif}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
  .crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-faint);font-weight:600;margin-bottom:14px}
  .contract-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;display:flex;gap:18px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
  .cover-thumb{width:74px;height:104px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap;background:var(--green-bg);color:var(--green)}
  .layout-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
</style>
</head>
<body>
<div id="dashboardRoot">
  <div class="crumb"><a>Contracts</a> <span>CNTR-2026-00125</span></div>
  <div class="contract-hero"><img class="cover-thumb" src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=200&q=80"/><div class="hero-main"><h1>Exclusive Publishing Agreement</h1><span class="status-pill">Active</span></div></div>
  <div class="layout-grid"><div class="doc-card"><h2>Contract Document</h2><div class="doc-preview"><div class="doc-page">EXCLUSIVE PUBLISHING AGREEMENT - Content placeholder for signed contract</div></div></div><div class="side-panel"><h2>Contract Summary</h2><div>CNTR-2026-00125 - Bound by the Ruthless Alpha - Luna Skye</div></div></div>
</div>
<script src="shared/api.js"></script>
<script src="shared/senior-editor-sidebar.js"></script>
<script>
SeniorEditorSidebar.attach('#dashboardRoot', { activeItem: 'signed-contracts', title: 'Contract Details', user: { name: 'Reina Morgan', role: 'General Editor', avatar: 'https://i.pravatar.cc/100?img=47' }, notifCount: 8, hideSearch: true, });
</script>
</body>
</html>
