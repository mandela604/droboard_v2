<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Featured & Banners — Platform Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}.btn-add{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px}.stat-ico.purple{background:#ece9fb;color:#5b4bcf}.stat-ico.green{background:var(--green-bg);color:var(--green)}.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}html[data-theme="dark"] .stat-ico.purple{background:rgba(124,92,252,.18)}html[data-theme="dark"] .stat-ico.green{background:rgba(22,163,74,.18)}html[data-theme="dark"] .stat-ico.amber{background:rgba(217,119,6,.18)}html[data-theme="dark"] .stat-ico.blue{background:rgba(37,99,235,.18)}.stat-num{font-size:24px;font-weight:800;line-height:1}.stat-lbl{font-size:12.5px;color:var(--text-muted);font-weight:600}.stat-delta{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 8px;border-radius:20px}
.banners-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}.banner-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.banner-preview{height:140px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;position:relative}.banner-overlay{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.6))}.banner-overlay .title{font-size:13px;font-weight:800;color:#fff}.banner-overlay .sub{font-size:10px;color:rgba(255,255,255,.7);margin-top:2px}.banner-body{padding:16px}.banner-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px}.banner-meta .position{font-weight:700;color:var(--accent)}.banner-meta .date{color:var(--text-muted)}.banner-stats{display:flex;gap:16px;margin-bottom:12px}.banner-stats div{text-align:center}.banner-stats b{display:block;font-size:15px;font-weight:800}.banner-stats span{font-size:10px;color:var(--text-muted);font-weight:600}.banner-actions{display:flex;gap:8px}.banner-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}.banner-actions button:hover{border-color:var(--accent);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-head h2{font-size:14px;font-weight:800}.kv-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}.kv-row:last-child{border-bottom:none}.kv-row .k{color:var(--text-muted);font-weight:600}.kv-row .v{font-weight:700}
@media (max-width:900px){.banners-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:480px){.stats-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr-row"><div></div><button class="btn-add" onclick="FeaturedBannersService.createBanner()"><i class="fas fa-plus"></i> Add New Banner</button></div>
<div class="stats-grid" id="statsGrid"></div>
</div>
<div class="banners-grid" id="bannersGrid">
</div>
</div>
<script src="shared/api.js"></script>
<script src="shared/story-modal.js"></script>
<script src="shared/senior-editor-sidebar.js"></script>
<script src="remaining-pages-enhanced.js"></script>
<script src="services/featured-banners-service.js"></script>
<script>window.FeaturedBannersService.init();</script></body></html>
