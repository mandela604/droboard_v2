<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VIP Registration Review — Droboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page{padding:14px 16px 50px;max-width:1500px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-head h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filt-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:8px 12px}
.filt-search input{border:none;background:none;outline:none;color:var(--text);font-size:12.5px;flex:1;font-family:inherit}
.filt-search i{color:var(--text-faint);font-size:12px}
.filt-sel{background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer}
.tbl-head{display:grid;grid-template-columns:24px 2fr 1fr 90px 110px 100px 90px;gap:8px;padding:0 14px 8px}.tbl-head span{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint)}
.tbl-body{display:flex;flex-direction:column;gap:8px;padding:0 14px}
.item-row{display:grid;grid-template-columns:24px 2fr 1fr 90px 110px 100px 90px;gap:8px;align-items:center;background:var(--table-head,#eef0f3);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;transition:.15s;cursor:pointer}.item-row:hover{border-color:var(--accent)}.item-row.is-open{border-color:var(--accent);border-radius:10px 10px 0 0}
.expand-ico{font-size:11px;color:var(--text-faint);transition:.15s;width:20px;text-align:center}.item-row.is-open .expand-ico{transform:rotate(90deg);color:var(--accent)}
.author-cell{display:flex;align-items:center;gap:8px}.author-cell img{width:26px;height:26px;border-radius:50%;object-fit:cover}.author-name{font-size:12px;font-weight:600}
.col-txt{font-size:12px;font-weight:600}.col-meta{font-size:11px;color:var(--text-muted)}
.status-pill{display:inline-flex;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}.status-pill.pending{background:var(--amber-bg);color:var(--amber)}.status-pill.approved{background:var(--green-bg);color:var(--green)}.status-pill.rejected{background:var(--red-bg);color:var(--red)}
.actions-cell{display:flex;gap:5px}
.mini-btn{font-size:10.5px;font-weight:700;padding:6px 12px;border-radius:7px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:.12s}.mini-btn:hover{border-color:var(--accent);color:var(--accent)}.mini-btn.primary{background:var(--accent);border-color:transparent;color:#fff}.mini-btn.danger{background:var(--red-bg);border-color:transparent;color:var(--red)}.mini-btn.danger:hover{background:var(--red);color:#fff}.mini-btn.green{background:var(--green-bg);border-color:transparent;color:var(--green)}.mini-btn.green:hover{background:var(--green);color:#fff}
.item-detail{display:none;background:linear-gradient(180deg,var(--table-head) 0%,var(--card) 90px);border:1.5px solid var(--accent);border-top:none;border-radius:0 0 12px 12px;padding:0;margin-top:-8px;overflow:hidden}.item-detail.show{display:block}
.detail-inner{padding:14px 16px 16px}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.detail-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}.detail-item span{font-size:8.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;display:block;margin-bottom:2px}.detail-item b{font-size:12px;font-weight:800;display:block}
.detail-notes{font-size:11.5px;color:var(--text-muted);line-height:1.6;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:12px}
.detail-foot{display:flex;gap:7px;flex-wrap:wrap}
.empty-msg{text-align:center;padding:36px 20px;color:var(--text-faint);font-size:12.5px}
@media(max-width:1180px){.tbl-head{display:none}.item-row{grid-template-columns:24px 1fr 90px 90px}.item-row .col-author,.item-row .col-genre{display:none}.detail-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="dashRoot">
<div class="page">
  <div class="panel">
    <div class="panel-head"><h2><i class="fas fa-crown" style="color:var(--accent)"></i> VIP Registration Review</h2></div>
    <div class="filters">
      <div class="filt-search"><i class="fas fa-magnifying-glass"></i><input id="searchInput" placeholder="Search by author or book…"/></div>
      <select class="filt-sel" id="statusFilter"><option value="">All Status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
    </div>
    <div class="tbl-head"><span></span><span>Author</span><span>Book</span><span>Action</span><span>Reason</span><span>Status</span><span>Actions</span></div>
    <div class="tbl-body" id="tableBody"></div>
  </div>
</div>
</div>
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1730;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9999"></div>
<style>#toast.show{opacity:1}</style>
<script src="shared/senior-editor-sidebar.js"></script>
<script src="services/vip-registration-review-service.js"></script><script>VipRegistrationReviewService.init();</script></body></html>
