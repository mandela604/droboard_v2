<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Platform Settings — Droboard Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:'Inter',system-ui,sans-serif;background:#f4f4fb;color:#1a1730}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,0,80,.25);border-radius:6px}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}.page-hdr .title{font-size:15px;font-weight:800;color:var(--text)}.btn-save{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(255,0,80,.32);white-space:nowrap;cursor:pointer;font-family:inherit}
.settings-grid{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.side-nav{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:2px}.sn-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:.15s}.sn-item:hover{background:var(--hover);color:var(--text)}.sn-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.sn-item i{width:16px;text-align:center;font-size:13px}
.content-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;min-height:500px}.ca-head{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}.ca-head h2{font-size:15px;font-weight:800;margin-bottom:4px}.ca-head p{font-size:12px;color:var(--text-muted)}
.form-group{margin-bottom:18px}.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px}.form-group .desc{font-size:11px;color:var(--text-muted);margin-bottom:8px}.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;padding:10px 13px;font-size:13px;color:var(--text);font-family:inherit;outline:none}.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}.form-group textarea{resize:vertical;min-height:80px}.form-group select{appearance:none;cursor:pointer}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.toggle-row:last-child{border-bottom:none}.toggle-info{flex:1}.toggle-info b{font-size:13px;font-weight:700}.toggle-info span{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px}.toggle-switch{width:44px;height:24px;border-radius:12px;background:var(--input-border);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}.toggle-switch.active{background:var(--accent)}.toggle-switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.toggle-switch.active .knob{transform:translateX(20px)}
@media (max-width:800px){.settings-grid{grid-template-columns:1fr}.side-nav{display:grid;grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div id="dashboardRoot">
<div class="page-hdr"><div class="title">Configure your platform settings, branding, and preferences</div><button class="btn-save" id="saveAllBtn"><i class="fas fa-check"></i> Save Changes</button></div>
<div class="settings-grid">
<div class="side-nav">
<div class="sn-item active" data-section="general"><i class="fas fa-globe"></i> General</div>
<div class="sn-item" data-section="branding"><i class="fas fa-palette"></i> Branding</div>
<div class="sn-item" data-section="email"><i class="fas fa-envelope"></i> Email</div>
<div class="sn-item" data-section="security"><i class="fas fa-lock"></i> Security</div>
<div class="sn-item" data-section="payments"><i class="fas fa-credit-card"></i> Payments</div>
<div class="sn-item" data-section="notifications"><i class="fas fa-bell"></i> Notifications</div>
<div class="sn-item" data-section="content"><i class="fas fa-shield-halved"></i> Content</div>
<div class="sn-item" data-section="integrations"><i class="fas fa-code"></i> API & Integrations</div>
</div>
<div class="content-area" id="settingsContent"></div>
</div></div>
<script src="shared/api.js"></script>
<script src="shared/senior-editor-sidebar.js"></script>
<script src="remaining-pages-enhanced.js"></script>
<script src="services/platform-settings-service.js"></script><script>PlatformSettingsService.init();</script></body></html>
