name: Build debug APK

# Builds Droboard for Android in the cloud — no local RAM needed.
# Run manually (Actions tab → Run workflow) or push to main touching
# the app inputs below. The APK downloads from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main, cloud-apk]
    paths:
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools "platforms;android-36" "build-tools;35.0.0"'

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Sync web assets into Android shell
        run: npx cap sync android

      - name: Stamp versionCode from run number
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Make gradlew executable (Windows checkouts lose +x)
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -q

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
